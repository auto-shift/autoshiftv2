name: Release AutoShift Charts

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs exercise this workflow without cutting a release: the same container, the same
  # toolchain, the same make target, with the registry push skipped. Select the branch to test a
  # workflow change before it reaches main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (for example 0.1.0)'
        required: true
      dry_run:
        description: 'Skip pushing charts to the registry'
        type: boolean
        default: true

env:
  REGISTRY: quay.io
  REGISTRY_NAMESPACE: autoshift

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    permissions:
      contents: write
      packages: write
    env:
      PULL_SECRET: ${{ secrets.PULL_SECRET }}
      # Gated on the event, not just on the input being empty: a tag push can never be dry, so a
      # mistake in the dry-run plumbing cannot turn a real release into a silent no-op.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      # actions/checkout needs git in the container, and fetch-depth: 0 falls back to an API
      # tarball without it, so this one package cannot come from the shared script below.
      - name: Install git
        run: dnf -y install git

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Shared with the release-dry-run job in ci.yaml, so a PR exercises the same container this
      # job does and a tool added for a new release step cannot be missing here.
      - name: Install release toolchain
        run: ./scripts/install-release-toolchain.sh

      # make release renders the PolicyGenerator policy directories into Helm charts, which needs
      # kustomize and the PolicyGenerator plugin, and both are installed with `go install`. The
      # version tracks tools/go.mod rather than being pinned here, so it cannot drift from CI.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true
          cache-dependency-path: tools/go.sum

      - name: Setup Red Hat registry pull secret
        if: ${{ env.PULL_SECRET != '' }}
        run: |
          mkdir -p ~/.docker
          echo "$PULL_SECRET" > ~/.docker/config.json
          chmod 600 ~/.docker/config.json

      - name: Extract version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Quay.io
        if: env.DRY_RUN != 'true'
        env:
          QUAY_USER: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASS: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASS" | helm registry login ${{ env.REGISTRY }} -u "$QUAY_USER" --password-stdin

      - name: Run release
        run: |
          make release VERSION=${{ steps.version.outputs.version }} DRY_RUN=${{ env.DRY_RUN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            release-artifacts/*
            .helm-charts/autoshift-*.tgz

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Released AutoShift version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Charts:" >> $GITHUB_STEP_SUMMARY
          find .helm-charts -name "*.tgz" -exec basename {} \; | sort >> $GITHUB_STEP_SUMMARY

  create-release:
    needs: release
    # Only a tag push publishes a GitHub release; a manual run stops after the build.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## AutoShift ${{ steps.version.outputs.version }}

            ### Installation

            Install from OCI registry:
            ```bash
            # Download and run the install scripts from the release artifacts
            bash install-bootstrap.sh
            bash install-autoshift.sh
            ```

            See INSTALL.md in release artifacts for detailed installation instructions.

            ### Charts Published

            - Main chart: `oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/autoshift:${{ steps.version.outputs.version }}`
            - Bootstrap charts: `oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/bootstrap/<name>:${{ steps.version.outputs.version }}`
            - Policy charts: `oci://${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/policies/<name>:${{ steps.version.outputs.version }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
