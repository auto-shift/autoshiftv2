name: Docs

# Builds the site with Zensical and publishes it to the gh-pages branch on every push to main.
#
# The site is single-version and served from the Pages root. Material for MkDocs is in maintenance
# mode with end of life on 2026-11-05, and Zensical is its successor from the same team; it reads
# mkdocs.yaml natively, so the cutover needed no config translation. Zensical has no versioning
# yet, so mike and the dev/latest split are gone. Publishing from main rather than from tags keeps
# the site current: under the tag-only deploy, main sat months ahead of what was published.

on:
  push:
    branches: [main]
    # The site is README.md, which is the home page, plus docs/. docs_dir stays the repository
    # root so that README's links resolve the same way here and on the site, and the build prunes
    # everything else back out.
    paths:
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yaml'
      # The build script decides what is published and what is pruned, so a change to it changes
      # the site even when no page changed.
      - 'scripts/build-docs.sh'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only one publish may write gh-pages at a time. Queued rather than cancelled so a docs commit
    # is never dropped.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Version lives in the manifest so Dependabot can raise a pull request against it.
      - run: pip install -r docs/requirements.txt

      # Builds, prunes what must not be published, and verifies the result. Shared with
      # ci.yaml so the check on a pull request runs exactly what the publish runs.
      - name: Build the site
        run: ./scripts/build-docs.sh

      # Published by force-pushing a single-commit orphan branch rather than by committing into the
      # existing history: the output is generated, and a replaced tree drops pages that no longer
      # exist instead of leaving them stranded on the site.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tells Pages to serve the directory as it is; without it Jekyll drops files whose names
          # begin with an underscore.
          touch site/.nojekyll
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} to gh-pages"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
