name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # Dependabot bumps the action (azure/setup-helm@v5) but never a `with:` input, so this
          # pin is Renovate's. Keep it identical to the Containerfile and GitLab CI pins.
          # renovate: datasource=github-releases depName=helm/helm
          version: v3.19.4

      - name: Dry-run packaging
        run: |
          echo "=== Dry-run chart packaging ==="
          make package-only VERSION=0.0.0-ci
          echo ""
          echo "Packaged charts:"
          find .helm-charts -name "*.tgz" | sort

      - name: Verify dynamic chart discovery
        run: |
          echo "=== Verifying Makefile dynamic discovery ==="

          # Count bootstrap charts (root-level Chart.yaml excluding policies/ and autoshift/)
          # This matches the Makefile's BOOTSTRAP_CHARTS discovery
          BOOTSTRAP_DIRS=$(find . -maxdepth 2 -name Chart.yaml -not -path "./policies/*" -not -path "./autoshift/*" | wc -l | tr -d ' ')
          # Policy charts live at policies/<category>/<chart>/Chart.yaml (depth 3)
          POLICY_DIRS=$(find policies -maxdepth 3 -name Chart.yaml | wc -l | tr -d ' ')

          BOOTSTRAP_CHARTS=$(ls .helm-charts/bootstrap/*.tgz 2>/dev/null | wc -l | tr -d ' ')
          POLICY_CHARTS=$(ls .helm-charts/policies/*.tgz 2>/dev/null | wc -l | tr -d ' ')

          echo "Bootstrap: $BOOTSTRAP_DIRS source charts -> $BOOTSTRAP_CHARTS packaged"
          echo "Policies: $POLICY_DIRS source charts -> $POLICY_CHARTS packaged"

          # Verify all charts were packaged
          if [ "$BOOTSTRAP_DIRS" != "$BOOTSTRAP_CHARTS" ]; then
            echo "::error::Bootstrap chart count mismatch! Expected $BOOTSTRAP_DIRS, got $BOOTSTRAP_CHARTS"
            echo "Source charts:"
            find . -maxdepth 2 -name Chart.yaml -not -path "./policies/*" -not -path "./autoshift/*"
            echo "Packaged charts:"
            ls .helm-charts/bootstrap/*.tgz 2>/dev/null || echo "(none)"
            exit 1
          fi

          if [ "$POLICY_DIRS" != "$POLICY_CHARTS" ]; then
            echo "::error::Policy chart count mismatch! Expected $POLICY_DIRS, got $POLICY_CHARTS"
            exit 1
          fi

          echo "All charts discovered and packaged correctly"

      - name: Verify policy-list.txt generation
        run: |
          echo "=== Verifying policy-list.txt ==="

          if [ ! -f autoshift/files/policy-list.txt ]; then
            echo "::error::policy-list.txt not generated!"
            exit 1
          fi

          POLICY_COUNT=$(wc -l < autoshift/files/policy-list.txt | tr -d ' ')
          # A policy ships either as a PolicyGenerator dir (policy-generator-config.yaml) or a
          # Helm holdout (Chart.yaml). cluster-labels and cluster-config-maps are deployed as
          # dedicated Applications (full label/config data), not via the ApplicationSet list, so
          # they are excluded from policy-list.txt. Keep in sync with DEDICATED_APP_NAMES in the Makefile.
          PG_COUNT=$(find policies -maxdepth 3 -name policy-generator-config.yaml | wc -l | tr -d ' ')
          CHART_COUNT=$(find policies -maxdepth 3 -name Chart.yaml \
            -not -path 'policies/*/cluster-labels/*' \
            -not -path 'policies/*/cluster-config-maps/*' | wc -l | tr -d ' ')
          EXPECTED=$((PG_COUNT + CHART_COUNT))

          echo "policy-list.txt contains $POLICY_COUNT entries"
          echo "Expected $EXPECTED policies"

          if [ "$POLICY_COUNT" != "$EXPECTED" ]; then
            echo "::error::policy-list.txt count mismatch!"
            echo "Contents:"
            cat autoshift/files/policy-list.txt
            exit 1
          fi

          echo "policy-list.txt generated correctly"
          echo "Policies:"
          cat autoshift/files/policy-list.txt

  validate-policies:
    name: Validate policy rendering and config (ACM resolver)
    runs-on: ubuntu-latest
    env:
      # PolicyGenerator toolchain for rendering kustomize/PolicyGenerator policies.
      # Populated by `make install-policy-generator` (repo-local .tools/).
      KUSTOMIZE_BIN: ${{ github.workspace }}/.tools/kustomize
      KUSTOMIZE_PLUGIN_HOME: ${{ github.workspace }}/.tools/kustomize-plugin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache: true
          cache-dependency-path: tools/go.sum

      - name: Install kustomize + PolicyGenerator plugin
        run: make install-policy-generator

      - name: Validate policy name lengths
        run: |
          echo "=== Validating policy name lengths (max 40 chars) ==="
          FAILED=0
          check() {  # $1=name $2=file
            local len=${#1}
            if [ "$len" -gt 40 ]; then
              echo "::error file=$2::Policy name '$1' is $len chars (max 40). Combined with a 20-char namespace this exceeds ACM's 62-char limit."
              FAILED=1
            fi
          }
          # PolicyGenerator policies: `- name:` entries directly under `policies:` (2-space indent)
          # in each policy-generator-config.yaml.
          while IFS= read -r file; do
            while IFS= read -r name; do
              check "$name" "$file"
            done < <(grep -oP '^  - name: \K.*' "$file" 2>/dev/null || true)
          done < <(find policies -name "policy-generator-config.yaml")
          # Helm holdouts still author the name via `$policyName := "..."`.
          while IFS= read -r file; do
            while IFS= read -r name; do
              check "$name" "$file"
            done < <(grep -oP '(?<=\$policyName := ")[^"]+' "$file" 2>/dev/null || true)
          done < <(find policies -name "*.yaml")
          [ "$FAILED" -eq 0 ] && echo "All policy names within limit" || exit 1

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          # Dependabot bumps the action (azure/setup-helm@v5) but never a `with:` input, so this
          # pin is Renovate's. Keep it identical to the Containerfile and GitLab CI pins.
          # renovate: datasource=github-releases depName=helm/helm
          version: v3.19.4

      - name: Run govulncheck
        working-directory: tools
        run: |
          # Pinned to v1.3.0 (x/tools v0.44.0). v1.4.0 pulls x/tools v0.46.0,
          # which panics ("ForEachElement called on type containing
          # *types.TypeParam") building the SSA call graph under Go 1.25+.
          # TODO: revert to @latest once a release ships x/tools >= v0.47.0.
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: Validate policies (render, hub/spoke resolution, config coverage, label contract)
        working-directory: tools
        run: go test -tags integration ./... -v -count=1
        env:
          LABEL_REPORT_OUTPUT: ${{ github.workspace }}/label-contract-report.md

      - name: Validate CI detection mechanisms (mutation sweep)
        working-directory: tools
        run: go test -tags integration,mutation ./... -v -count=1 -run TestPipeline_MutationSweep

      - name: Upload label contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: label-contract-report
          path: label-contract-report.md
          if-no-files-found: warn

  docs:
    name: Documentation (build and prose lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The same manifest docs.yaml publishes with, so CI cannot pass on a build the deploy
      # would then fail.
      - name: Install documentation toolchain
        run: pip install -r docs/requirements.txt

      # mkdocs.yaml sets strict: true, so a warning fails the build. This is what catches a broken
      # link — nothing else does, and the site is only otherwise built at deploy time, so a bad
      # link would merge and surface in production. Zensical also validates heading anchors, which
      # MkDocs never did.
      # Builds, prunes what must not be published, and verifies the result. The same script
      # docs.yaml publishes with, so this check cannot pass on a build the deploy would fail.
      - name: Build and verify the site
        run: ./scripts/build-docs.sh

      - name: Install Vale
        run: |
          # pipefail matters: `curl -sfL ... | sh` swallows a failed download, because the
          # pipeline exits with sh's status. That is how a 404 previously left Vale
          # uninstalled while this step still reported success, failing the next step with
          # an unexplained "vale: command not found".
          set -euo pipefail
          # renovate: datasource=github-releases depName=errata-ai/vale extractVersion=^v(?<version>.+)$
          VALE_VERSION=3.17.1
          mkdir -p "$HOME/.local/bin"
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" --version

      - name: Fetch the Red Hat style
        run: vale sync

      # Gates on error-level findings only. Which rules are set to error, and why the rest are
      # left reporting, is recorded in .vale.ini next to each rule.
      - name: Prose lint
        run: vale --minAlertLevel=error README.md docs/

      # Not a gate: prints the backlog so progress is visible on every run.
      - name: Report remaining style findings
        if: always()
        run: |
          {
            echo "### Documentation style backlog"
            echo ""
            echo "Not enforced. See \`.vale.ini\` for which rules gate CI."
            echo ""
            echo '```'
            vale --output=line README.md docs/ 2>/dev/null \
              | grep -oE 'RedHat\.[A-Za-z]+' | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
