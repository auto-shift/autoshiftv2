name: Update Operator Channels

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-operators:
    runs-on: ubuntu-latest
    steps:
      # App token lets this workflow open PRs (like Dependabot) without enabling
      # the org-wide "Actions can create and approve PRs" setting. The app is only
      # granted contents:write + pull-requests:write, so it can create but not approve.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTOSHIFT_BOT_APP_ID }}
          private-key: ${{ secrets.AUTOSHIFT_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install oc CLI
        run: |
          curl -fsSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar xz -C /tmp
          sudo mv /tmp/oc /usr/local/bin/oc
          oc version --client

      - name: Write pull secret
        run: echo '${{ secrets.PULL_SECRET }}' > /tmp/pull-secret.json

      - name: Run update script
        id: update
        run: |
          scripts/update-operator-channels.sh \
            --pull-secret /tmp/pull-secret.json \
            --update-all
          rm -f /tmp/pull-secret.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "=== Changed files ==="
            git diff --name-only
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="automation/update-operators-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -B resets the branch if a same-day run already created it; force-push overwrites
          # a stale remote branch left by an earlier run so re-runs don't collide.
          git checkout -B "$BRANCH"
          # The script edits both autoshift/values/ and policies/*/values.yaml — stage all tracked changes.
          git add -u
          git commit -m "chore: update operator channels and versions"
          git push --force origin "$BRANCH"
          # gh pr create hard-fails if the label is missing; ensure it exists first.
          gh label create dependencies --color 0366D6 --description "Automated dependency updates" --force >/dev/null 2>&1 || true
          # Idempotent: update the existing PR's branch (force-push above) instead of failing.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            echo "PR already open for $BRANCH; branch updated."
          else
            gh pr create \
              --title "chore: update operator channels and versions" \
              --body "$(cat <<'EOF'
          Automated operator channel update.

          Run by: ${{ github.workflow }}
          Triggered: ${{ github.event_name }}

          ## Changes
          Review the diff to confirm channel/version bumps look reasonable before merging.
          EOF
          )" \
              --reviewer bcarr-rh \
              --label dependencies
          fi
