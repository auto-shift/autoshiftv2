# Config key naming conventions.
#
# A policy that owns configuration reads one top-level key from the cluster's
# rendered-config ConfigMap, named after its directory under policies/ in
# lowerCamelCase: workload-partitioning owns workloadPartitioning.
#
# Every key that deviates is recorded here so the deviation is visible in
# review. The check is enforced by TestConfigKeyConventions in
# tools/internal/configkeys.

# Keys that carry fleet-wide facts read by several policies, rather than being
# owned by one. Prefer a shared key over repeating the same data per component.
shared:
  - aws
  - clusterSet
  - disconnected
  - hosts
  - networking
  - versionTag
  - vsphere

# Keys that own a policy but use a shorter, well-known name than the directory.
# Add an entry only when the short form is the name people actually use.
aliases:
  acm: advanced-cluster-management
  acs: advanced-cluster-security
  gitops: openshift-gitops
  uwm: user-workload-monitoring
