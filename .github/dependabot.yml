version: 2
updates:
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies
    ignore:
      # Compatibility pin, not a currency pin. go-template-utils is the hub and spoke template
      # resolver, so the suite must resolve with the same version the fleet runs: Red Hat
      # Advanced Cluster Management 2.17 vendors v7.2.0. Patches inside 7.2.x are welcome; a
      # minor or major bump belongs with an Advanced Cluster Management channel move. See
      # versions.yaml.
      - dependency-name: "github.com/stolostron/go-template-utils/v7"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies

  # Pins the site generator. Zensical is before 1.0, so read the release note before merging.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies
