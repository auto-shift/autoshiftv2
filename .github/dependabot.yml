version: 2
updates:
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies

  # Pins the site generator. Zensical is before 1.0, so read the release note before merging.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies
