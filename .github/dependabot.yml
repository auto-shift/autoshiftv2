version: 2
updates:
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies

  # docs/requirements.txt pins the site generator. Zensical is before version 1.0, so this is the
  # dependency most likely to need a deliberate look at a release note before merging.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    reviewers:
      - bcarr-rh
    labels:
      - dependencies
