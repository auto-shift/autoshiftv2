apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: infra-gitops
  namespace: openshift-gitops
spec:
  networkPolicy: {}
  server:
    autoscale:
      enabled: true
      hpa:
        maxReplicas: 5
        scaleTargetRef:
          apiVersion: apps/v1
          kind: deployment
          name: infra-gitops-server
        targetCPUUtilizationPercentage: 50
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi
    route:
      enabled: true
    service:
      type: ''
  grafana:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  resourceTrackingMethod: annotation+label
  disableAdmin: false
  monitoring:
    enabled: false
  notifications:
    enabled: false
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  initialSSHKnownHosts: {}
  imageUpdater:
    enabled: false
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    provider: dex
  sourceHydrator: {}
  applicationInstanceLabelKey: argocd.argoproj.io/instance
  applicationSet:
    resources:
      limits:
        cpu: 2
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  rbac:
    defaultPolicy: ''
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, openshift-systems, role:admin
    scopes: '[groups]'
  repo:
    env:
      - name: POLICY_GEN_ENABLE_HELM
        value: 'true'
      - name: KUSTOMIZE_PLUGIN_HOME
        value: /etc/kustomize/plugin
    extraRepoCommandArgs:
      - '--plugin-tar-exclude'
      - .git/*
      - '--plugin-use-manifest-generate-paths'
    initContainers:
      - args:
          - |
            set -e
            # /acm-cli holds one tarball per architecture, plus a Red Hat Enterprise Linux 9
            # build for x86_64, which is preferred there because it is the FIPS-capable one.
            case "$(uname -m)" in
              x86_64)  tarballs="PolicyGenerator-rhel9.tar.gz linux-amd64-PolicyGenerator.tar.gz" ;;
              aarch64) tarballs="linux-arm64-PolicyGenerator.tar.gz" ;;
              ppc64le) tarballs="linux-ppc64le-PolicyGenerator.tar.gz" ;;
              s390x)   tarballs="linux-s390x-PolicyGenerator.tar.gz" ;;
              *)       tarballs="" ;;
            esac
            for tarball in $tarballs; do
              if [ -f "/acm-cli/$tarball" ]; then
                tar -xzf "/acm-cli/$tarball" -C /policy-generator-tmp
                chmod +x /policy-generator-tmp/PolicyGenerator
                exit 0
              fi
            done
            echo "no PolicyGenerator tarball for $(uname -m) in /acm-cli, which holds:" >&2
            ls /acm-cli >&2
            exit 1
        command:
          - /bin/sh
          - '-c'
        image: 'registry.redhat.io/rhacm2/acm-cli-rhel9@sha256:33499cff6d1919b8128151a0d8e853a1decb4f2902608cbb82e6423edb35b6ab'
        name: policy-generator-install
        resources: {}
        volumeMounts:
          - mountPath: /policy-generator-tmp
            name: policy-generator
    replicas: 1
    resources:
      limits:
        cpu: 2000m
        memory: 2048Mi
      requests:
        cpu: 500m
        memory: 512Mi
    sidecarContainers:
      - command:
          - /var/run/argocd/argocd-cmp-server
        env:
          - name: KUSTOMIZE_PLUGIN_HOME
            value: /etc/kustomize/plugin
        image: 'registry.redhat.io/openshift-gitops-1/argocd-rhel9@sha256:f63aa7526ebd6f6413a44dc43b111b5b77c2e27d9c1813a1655f1c9e999076ca'
        name: policy-generator
        resources:
          limits:
            cpu: 2000m
            memory: 2048Mi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config/plugin.yaml
            name: policy-generator-cmp-config
            subPath: plugin.yaml
          - mountPath: /tmp
            name: cmp-tmp
          - mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
            name: policy-generator
    volumeMounts:
      - mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
        name: policy-generator
      - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        name: user-ca-bundle
        subPath: ca-bundle.crt
    volumes:
      - emptyDir: {}
        name: policy-generator
      - configMap:
          name: policy-generator-cmp-plugin
        name: policy-generator-cmp-config
      - emptyDir: {}
        name: cmp-tmp
      - configMap:
          name: user-ca-bundle
        name: user-ca-bundle
  resourceExclusions: |
    - apiGroups:
        - ''
      kinds:
        - Event
    - apiGroups:
        - packages.operators.coreos.com
      kinds:
        - PackageManifest
    - apiGroups:
        - compliance.openshift.io
      kinds:
        - ComplianceCheckResult
        - ComplianceRemediation
  resourceHealthChecks:
    - check: |
        hs = {}
        if obj.metadata.labels ~= nil and obj.metadata.labels["policy.open-cluster-management.io/root-policy"] ~= nil then
          hs.status = "Healthy"
          hs.message = "Replicated policy managed by ACM"
          return hs
        end
        if obj.status == nil or obj.status.compliant == nil then
          hs.status = "Healthy"
          hs.message = "No clusters matched by placement"
          return hs
        end
        if obj.status.compliant == "Compliant" then
          hs.status = "Healthy"
        elseif obj.status.compliant == "Pending" then
          hs.status = "Progressing"
        else
          hs.status = "Degraded"
        end
        hs.message = obj.status.compliant
        return hs
      group: policy.open-cluster-management.io
      kind: Policy
  ha:
    enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  commitServer: {}
  kustomizeBuildOptions: '--enable-helm --helm-command /usr/local/bin/helm --enable-alpha-plugins --load-restrictor LoadRestrictionsNone'
  tls:
    ca: {}
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  controller:
    env:
      - name: GOMEMLIMIT
        value: 6963MiB
    processors:
      operation: 10
      status: 20
    resources:
      limits:
        cpu: 2000m
        memory: 8Gi
      requests:
        cpu: 250m
        memory: 1Gi
    respectRBAC: normal
    sharding: {}
