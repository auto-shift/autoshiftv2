{{- include "openshift-gitops.validate-gitops" . }}
---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: {{ .Values.gitops.argoName }}
  namespace: {{ .Values.gitops.argoNamespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "25"
spec:
  server:
    resources:
      limits:
        cpu: {{ ((.Values.gitops.server).limits).cpu | default "500m" }}
        memory: {{ ((.Values.gitops.server).limits).memory | default "256Mi" }}
      requests:
        cpu: {{ ((.Values.gitops.server).requests).cpu | default "125m" }}
        memory: {{ ((.Values.gitops.server).requests).memory | default "128Mi" }}
    route:
      enabled: true
  monitoring:
    enabled: false
  # PolicyGenerator kustomize plugin support (values proven on feature/policy-generator).
  kustomizeBuildOptions: --enable-helm --helm-command /usr/local/bin/helm --enable-alpha-plugins --load-restrictor LoadRestrictionsNone
  # Avoid app.kubernetes.io/instance label conflicts between ArgoCD and ACM/PolicyGenerator policies.
  applicationInstanceLabelKey: argocd.argoproj.io/instance
  resourceTrackingMethod: annotation+label
  sso:
    dex:
      resources:
        limits:
          cpu: {{ ((.Values.gitops.dex).limits).cpu | default "500m" }}
          memory: {{ ((.Values.gitops.dex).limits).memory | default "256Mi" }}
        requests:
          cpu: {{ ((.Values.gitops.dex).requests).cpu | default "125m" }}
          memory: {{ ((.Values.gitops.dex).requests).memory | default "128Mi" }}
      openShiftOAuth: true
    provider: dex
  rbac:
    defaultPolicy: ''
    # Every line comes from gitops.rbac_policies. Nothing is granted implicitly: defaultPolicy is
    # empty, so an empty list means no access apart from the built-in admin account.
    policy: |
    {{- range .Values.gitops.rbac_policies }}
      {{ . }}
    {{- end }}
    scopes: '[groups]'
  repo:
    {{- $caBundle := .Values.gitops.repo.cluster_ca_bundle }}
    {{- $pg := (.Values.gitops.policyGenerator | default dict) }}
    {{- /* Install the policy-generator CMP sidecar only when enabled (git/source bootstrap); OCI-only
           bootstrap sets false. Default true for backwards compatibility. */}}
    {{- $pgEnabled := ternary ($pg.enabled) true (hasKey $pg "enabled") }}
    replicas: {{ ((.Values.gitops.repo).replicas) | default 1 }}
    {{- if $pgEnabled }}
    extraRepoCommandArgs:
      {{- range ($pg.tarExclusions | default list) }}
      - --plugin-tar-exclude
      - {{ . | quote }}
      {{- end }}
      {{- if $pg.useManifestGeneratePaths }}
      - --plugin-use-manifest-generate-paths
      {{- end }}
    {{- end }}
    {{- /* Declared at repo scope so they're visible in the initContainers/sidecar blocks below. */}}
    {{- $pgImage := "" }}
    {{- $argoImage := ($pg).sidecarImage }}
    {{- /* Reuse the ACM CLI + repo-server images already cached on the cluster; fall back to values.
           Red Hat Advanced Cluster Management ships the PolicyGenerator binary in the image behind
           acm-cli-downloads, and has since 2.15. The copy still present in the subscription image is
           frozen at release-2.15, whose embedded kustomize probes `helm version -c --short`; Helm 4
           removed that shorthand, so it cannot render against Red Hat OpenShift GitOps 1.22.
           acm-cli-downloads belongs to the MultiClusterHub console component, so it appears later in
           a bootstrap than the subscription deployment did: install this chart after it exists. */}}
    {{- $acmCliDep := (lookup "apps/v1" "Deployment" "open-cluster-management" "acm-cli-downloads") }}
    {{- if $acmCliDep }}{{- $pgImage = (index $acmCliDep.spec.template.spec.containers 0).image }}{{- end }}
    {{- /* An explicit acmCliImage wins: it is the escape hatch where acm-cli-downloads is absent. */}}
    {{- with ($pg).acmCliImage }}{{- $pgImage = . }}{{- end }}
    {{- $argoDep := (lookup "apps/v1" "Deployment" .Values.gitops.argoNamespace (printf "%s-repo-server" .Values.gitops.argoName)) }}
    {{- if $argoDep }}{{- $argoImage = (index $argoDep.spec.template.spec.containers 0).image }}{{- end }}
    {{- if or $pgEnabled $caBundle }}
    volumeMounts:
      {{- if $caBundle }}
      - name: user-ca-bundle
        mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        subPath: ca-bundle.crt
      {{- end }}
      {{- if $pgEnabled }}
      # PG binary (staged by the init container) at the kustomize plugin home.
      - name: policy-generator
        mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
      {{- end }}
    volumes:
      {{- if $caBundle }}
      - name: user-ca-bundle
        configMap:
          name: user-ca-bundle
      {{- end }}
      {{- if $pgEnabled }}
      - name: policy-generator
        emptyDir: {}
      - name: policy-generator-cmp-config
        configMap:
          name: policy-generator-cmp-plugin
      - name: cmp-tmp
        emptyDir: {}
      {{- end }}
    {{- end }}
    {{- if $pgEnabled }}
    env:
      # Let PolicyGenerator inflate Helm charts referenced as manifest input.
      - name: POLICY_GEN_ENABLE_HELM
        value: "true"
      - name: KUSTOMIZE_PLUGIN_HOME
        value: /etc/kustomize/plugin
    initContainers:
      # Stage the PolicyGenerator binary out of the ACM CLI downloads image into the shared volume
      # the CMP sidecar reads. The output volume is mounted at /policy-generator-tmp to avoid
      # shadowing any source path. Kept identical to the init container that
      # policies/stable/openshift-gitops reconciles onto this same ArgoCD custom resource, so the
      # day-2 policy is not a change in behaviour.
      - name: policy-generator-install
        image: {{ $pgImage }}
        command: [/bin/sh, -c]
        args:
          - |
            set -e
            # /acm-cli holds one tarball per architecture, plus a Red Hat Enterprise Linux 9
            # build for x86_64, which is preferred there because it is the FIPS-capable one.
            case "$(uname -m)" in
              x86_64)  tarballs="PolicyGenerator-rhel9.tar.gz linux-amd64-PolicyGenerator.tar.gz" ;;
              aarch64) tarballs="linux-arm64-PolicyGenerator.tar.gz" ;;
              ppc64le) tarballs="linux-ppc64le-PolicyGenerator.tar.gz" ;;
              s390x)   tarballs="linux-s390x-PolicyGenerator.tar.gz" ;;
              *)       tarballs="" ;;
            esac
            for tarball in $tarballs; do
              if [ -f "/acm-cli/$tarball" ]; then
                tar -xzf "/acm-cli/$tarball" -C /policy-generator-tmp
                chmod +x /policy-generator-tmp/PolicyGenerator
                exit 0
              fi
            done
            echo "no PolicyGenerator tarball for $(uname -m) in /acm-cli, which holds:" >&2
            ls /acm-cli >&2
            exit 1
        volumeMounts:
          - name: policy-generator
            mountPath: /policy-generator-tmp
    sidecarContainers:
      # CMP sidecar that renders kustomize/PolicyGenerator policy dirs (config in the
      # policy-generator-cmp-plugin ConfigMap). var-files and plugins are the repo-server's
      # operator-provided shared volumes (confirmed against the proven feature/policy-generator branch).
      - name: policy-generator
        command: [/var/run/argocd/argocd-cmp-server]
        {{- /* On a first install the repo-server Deployment does not exist yet, so the lookup above
               finds nothing. Emitting `image: null` is rejected by the ArgoCD CRD on some versions;
               omitting the key lets the operator default it to the repo-server image, which is what
               this sidecar wants anyway. */}}
        {{- if $argoImage }}
        image: {{ $argoImage }}
        {{- end }}
        securityContext:
          runAsNonRoot: true
        env:
          # kustomize (run by the CMP) finds the PolicyGenerator plugin here — mounted directly,
          # so no runtime copy into a (non-writable) $HOME is needed.
          - name: KUSTOMIZE_PLUGIN_HOME
            value: /etc/kustomize/plugin
        volumeMounts:
          - name: var-files
            mountPath: /var/run/argocd
          - name: plugins
            mountPath: /home/argocd/cmp-server/plugins
          - name: policy-generator-cmp-config
            mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: plugin.yaml
          - name: cmp-tmp
            mountPath: /tmp
          # PolicyGenerator binary from ACM (staged by the init container) at the plugin home.
          - name: policy-generator
            mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
        # The CMP sidecar runs the actual kustomize/PolicyGenerator/Helm render, so it needs real CPU.
        # Without resources it competes unbounded and renders time out under fan-out load.
        resources:
          limits:
            cpu: {{ ((.Values.gitops.policyGenerator).limits).cpu | default "2000m" }}
            memory: {{ ((.Values.gitops.policyGenerator).limits).memory | default "2048Mi" }}
          requests:
            cpu: {{ ((.Values.gitops.policyGenerator).requests).cpu | default "500m" }}
            memory: {{ ((.Values.gitops.policyGenerator).requests).memory | default "512Mi" }}
    {{- end }}
    resources:
      limits:
        cpu: {{ ((.Values.gitops.repo).limits).cpu | default "2000m" }}
        memory: {{ ((.Values.gitops.repo).limits).memory | default "2048Mi" }}
      requests:
        cpu: {{ ((.Values.gitops.repo).requests).cpu | default "500m" }}
        memory: {{ ((.Values.gitops.repo).requests).memory | default "512Mi" }}
  ha:
    resources:
      limits:
        cpu: {{ ((.Values.gitops.ha).limits).cpu | default "500m" }}
        memory: {{ ((.Values.gitops.ha).limits).memory | default "256Mi" }}
      requests:
        cpu: {{ ((.Values.gitops.ha).requests).cpu | default "125m" }}
        memory: {{ ((.Values.gitops.ha).requests).memory | default "128Mi" }}
    enabled: {{ (.Values.gitops.ha).enabled | default "false" }}
  redis:
    resources:
      limits:
        cpu: {{ ((.Values.gitops.redis).limits).cpu | default "500m" }}
        memory: {{ ((.Values.gitops.redis).limits).memory | default "256Mi" }}
      requests:
        cpu: {{ ((.Values.gitops.redis).requests).cpu | default "125m" }}
        memory: {{ ((.Values.gitops.redis).requests).memory | default "128Mi" }}
  controller:
    resources:
      limits:
        cpu: {{ ((.Values.gitops.controller).limits).cpu | default "2000m" }}
        # 4Gi: the controller OOMKills at 2Gi once the ApplicationSet has fanned out to all policies/*.
        memory: {{ ((.Values.gitops.controller).limits).memory | default "4096Mi" }}
      requests:
        cpu: {{ ((.Values.gitops.controller).requests).cpu | default "250m" }}
        memory: {{ ((.Values.gitops.controller).requests).memory | default "1024Mi" }}
  applicationSet:
    resources:
      limits:
        cpu: {{ ((.Values.gitops.applicationSet).limits).cpu | default "2" }}
        memory: {{ ((.Values.gitops.applicationSet).limits).memory | default "1Gi" }}
      requests:
        cpu: {{ ((.Values.gitops.applicationSet).requests).cpu | default "250m" }}
        memory: {{ ((.Values.gitops.applicationSet).requests).memory | default "512Mi" }}