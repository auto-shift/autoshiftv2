# Namespaces for the allNamespaces mode in manual-remediations. One scored namespace and two the
# default excludeRegex must filter out, so the regex itself is exercised rather than just the walk.
apiVersion: v1
kind: Namespace
metadata:
  name: example-app
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-monitoring
---
# Its UID also seeds the RHDH backend signing secret (developer-hub backend-secret.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  uid: 00000000-0000-0000-0000-00000000kube
