# Stubs for the ztwim policy's runtime lookups. Low-entropy fake values only: this directory is
# deliberately NOT allowlisted in .gitleaks.toml.
#
# The SPIRE trust bundle is public CA material by design, so the placeholder below is a plain
# marker rather than anything resembling a real certificate.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: zero-trust-workload-identity-manager
data:
  bundle.crt: |
    -----BEGIN CERTIFICATE-----
    RkFLRS1URVNUREFUQS1OT1QtQS1SRUFMLUNFUlRJRklDQVRF
    -----END CERTIFICATE-----
---
# The operator Deployment is the source of truth for operand images: the nested-spoke manifests read
# RELATED_IMAGE_* from here at runtime rather than hardcoding references. Registry paths match the
# productized shape so the templates exercise a realistic value; the digests are fake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-workload-identity-manager-controller-manager
  namespace: zero-trust-workload-identity-manager
spec:
  selector:
    matchLabels:
      app: ztwim
  template:
    metadata:
      labels:
        app: ztwim
    spec:
      containers:
        - name: manager
          image: registry.redhat.io/zero-trust-workload-identity-manager/zero-trust-workload-identity-manager-rhel9:test
          env:
            - name: RELATED_IMAGE_SPIRE_AGENT
              value: registry.redhat.io/zero-trust-workload-identity-manager/spiffe-spire-agent-rhel9:test
            - name: RELATED_IMAGE_SPIFFE_CSI_DRIVER
              value: registry.redhat.io/zero-trust-workload-identity-manager/spiffe-csi-driver-rhel9:test
            - name: RELATED_IMAGE_NODE_DRIVER_REGISTRAR
              value: registry.redhat.io/openshift4/ose-csi-node-driver-registrar-rhel9:test
            - name: RELATED_IMAGE_SPIFFE_CSI_INIT_CONTAINER
              value: registry.redhat.io/ubi9:test
# Ready, so the operand-reconcile guard on the operator being available passes.
status:
  readyReplicas: 1
---
# Registers the CSIDriver GVK and gates the upstream-authority patch: that manifest only emits once
# upstream.csi.spiffe.io exists, so without this stub the branch would never render in CI.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: upstream.csi.spiffe.io
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
---
# Registers the ServiceAccount GVK for the msa-rbac guard. Namespaced, so metadata.namespace is set
# deliberately: the harness infers scope from the FIRST object of a GVK it sees, and a namespaced
# stub written without a namespace would register the type as cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztwim-tokenreview
  namespace: open-cluster-management-agent-addon
---
# Registers the spire-server ConfigMap so the read-modify-write templates on both ends resolve. The
# JSON mirrors the operator's generated shape: NodeAttestor clusters is a LIST OF SINGLE-KEY MAPS
# keyed by cluster name, which is what the idempotency guard scans with hasKey. It runs on postgres
# with a federation block, the healthy state for the postgres profile and the federation mesh, so
# the datastore and mesh checks pass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: zero-trust-workload-identity-manager
data:
  server.conf: '{"health_checks":{"bind_address":"0.0.0.0","bind_port":"8080"},"plugins":{"DataStore":[{"sql":{"plugin_data":{"connection_string":"host=spire-db-rw port=5432 dbname=spire user=spire","database_type":"postgres"}}}],"KeyManager":[{"disk":{"plugin_data":{"keys_path":"/run/spire/data/keys.json"}}}],"NodeAttestor":[{"k8s_psat":{"plugin_data":{"clusters":[{"lint-cluster":{"allowed_node_label_keys":[],"allowed_pod_label_keys":[],"audience":["spire-server"],"service_account_allow_list":["zero-trust-workload-identity-manager:spire-agent"]}}]}}}],"Notifier":[{"k8sbundle":{"plugin_data":{"config_map":"spire-bundle","namespace":"zero-trust-workload-identity-manager"}}}]},"server":{"bind_address":"0.0.0.0","bind_port":"8081","federation":{"bundle_endpoint":{"address":"0.0.0.0","port":8443}},"trust_domain":"test-cluster.test.example.com"}}'
---
# Registers the ManagedServiceAccount GVK used by the hub-side spoke-kubeconfigs manifest.
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: ztwim-tokenreview
  namespace: lint-cluster
spec:
  rotation:
    enabled: true
---
# Registers the ZeroTrustWorkloadIdentityManager GVK. The nested manifests look this CR up to DERIVE
# the shared trust domain -- the spoke reads the HUB's copy through a hub template, so a nested pair
# cannot drift apart. An unregistered GVK in lookup is a hard failure in the harness, not an empty
# result, so this stub has to exist even though the value is only a placeholder.
apiVersion: operator.openshift.io/v1alpha1
kind: ZeroTrustWorkloadIdentityManager
metadata:
  name: cluster
spec:
  trustDomain: test-cluster.test.example.com
  clusterName: lint-cluster
  bundleConfigMap: spire-bundle
---
# Registers the PersistentVolumeClaim GVK for the opt-in reset templates. Deliberately NOT named
# spire-data-spire-server-0: a known GVK with a missing object returns nil cleanly, which is the
# branch we want exercised, whereas an UNREGISTERED GVK is a hard harness failure. Namespaced, so
# metadata.namespace is set -- scope is inferred from the first object of a GVK the harness sees.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ztwim-testdata-placeholder
  namespace: zero-trust-workload-identity-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Registers the SpireServer GVK for test/datastore-effective.yaml, which compares the REQUESTED
# datastore type against the one the resource actually carries. An unregistered GVK in lookup is a
# hard harness failure rather than an empty result, so the stub must exist even though the value
# below is only a placeholder. Cluster-scoped, so no metadata.namespace.
apiVersion: operator.openshift.io/v1alpha1
kind: SpireServer
metadata:
  name: cluster
spec:
  datastore:
    databaseType: sqlite3
    connectionString: /run/spire/data/datastore.sqlite3
---
# Registers the ManagedClusterView GVK for the federation mesh manifests, which read a peer's bundle,
# trust domain and federation endpoint from views the hub publishes. An unregistered GVK in lookup is
# a hard harness failure rather than an empty result. Namespaced, so metadata.namespace is set.
apiVersion: view.open-cluster-management.io/v1beta1
kind: ManagedClusterView
metadata:
  name: ztwim-fed-bundle
  namespace: lint-cluster
spec:
  scope:
    kind: ConfigMap
    version: v1
    name: spire-bundle
    namespace: zero-trust-workload-identity-manager
---
# The ClusterFederatedTrustDomain manifests/federation-mesh/mesh-trust-domains.yaml writes for the
# ztwim-mesh-peer stub below, so test/federation-mesh-effective.yaml finds every peer federated.
# Cluster-scoped, so no metadata.namespace.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterFederatedTrustDomain
metadata:
  name: ztwim-mesh-peer.test.example.com
spec:
  className: zero-trust-workload-identity-manager-spire
  trustDomain: peer.test.example.com
  bundleEndpointURL: https://federation.peer.test.example.com
  bundleEndpointProfile:
    type: https_web
---
# The CloudNativePG password Secret for the postgres profile (_example-cluster-install-baremetal.yaml).
# policy-ztwim-datastore-creds holds SPIRE back until it exists.
apiVersion: v1
kind: Secret
metadata:
  name: spire-db-app
  namespace: zero-trust-workload-identity-manager
type: Opaque
data:
  password: dGVzdA==
---
# The CloudNativePG cluster manifests/cnpg creates, so test/datastore-effective.yaml finds it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spire-db
  namespace: zero-trust-workload-identity-manager
spec:
  instances: 2
---
# SPIRE operands at the operator's declared images. Lets operand-reconcile and nested-auto-reset
# render their no-drift branch, and keeps test/operand-image-drift.yaml passing.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: zero-trust-workload-identity-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      containers:
        - name: spire-server
          image: registry.redhat.io/zero-trust-workload-identity-manager/spiffe-spire-server-rhel9:test
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: zero-trust-workload-identity-manager
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      containers:
        - name: spire-agent
          image: registry.redhat.io/zero-trust-workload-identity-manager/spiffe-spire-agent-rhel9:test
---
# The hub's nested gRPC endpoint, which the spoke-side nested manifests derive hubEndpoint from.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spire-server-grpc
  namespace: zero-trust-workload-identity-manager
spec:
  host: spire-server-grpc.apps.test.example.com
  to:
    kind: Service
    name: spire-server
---
# A federation mesh peer. Shares the ztwim-federation-mesh value that autoshift/values/clusters/
# _example.yaml declares, so every profile has one peer to federate with.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: ztwim-mesh-peer
  labels:
    autoshift.io/ztwim-federation-mesh: mesh-a
spec:
  hubAcceptsClient: true
---
# The four views manifests/federation-mesh/bundle-views.yaml publishes for that peer, as reported.
apiVersion: view.open-cluster-management.io/v1beta1
kind: ManagedClusterView
metadata:
  name: ztwim-fed-bundle
  namespace: ztwim-mesh-peer
spec:
  scope:
    kind: ConfigMap
    version: v1
    name: spire-bundle
    namespace: zero-trust-workload-identity-manager
status:
  result:
    data:
      bundle.crt: FAKE-TESTDATA-BUNDLE
---
apiVersion: view.open-cluster-management.io/v1beta1
kind: ManagedClusterView
metadata:
  name: ztwim-fed-jwks
  namespace: ztwim-mesh-peer
spec:
  scope:
    kind: ConfigMap
    version: v1
    name: ztwim-bundle-jwks
    namespace: zero-trust-workload-identity-manager
status:
  result:
    data:
      bundle.jwks: '{"keys":[]}'
---
apiVersion: view.open-cluster-management.io/v1beta1
kind: ManagedClusterView
metadata:
  name: ztwim-fed-domain
  namespace: ztwim-mesh-peer
spec:
  scope:
    apiGroup: operator.openshift.io
    kind: ZeroTrustWorkloadIdentityManager
    version: v1alpha1
    name: cluster
status:
  result:
    spec:
      trustDomain: peer.test.example.com
---
apiVersion: view.open-cluster-management.io/v1beta1
kind: ManagedClusterView
metadata:
  name: ztwim-fed-endpoint
  namespace: ztwim-mesh-peer
spec:
  scope:
    apiGroup: route.openshift.io
    kind: Route
    version: v1
    name: spire-server-federation-public
    namespace: zero-trust-workload-identity-manager
status:
  result:
    spec:
      host: spire-federation.apps.peer.test.example.com
---
# A nested SPIRE spoke, so the hub-side nested manifests have a spoke to build entries, a
# kubeconfig and a k8s_psat cluster for.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: ztwim-nested-spoke
  labels:
    autoshift.io/ztwim-nested-role: spoke
spec:
  hubAcceptsClient: true
  managedClusterClientConfigs:
    - url: https://api.ztwim-nested-spoke.test.example.com:6443
      caBundle: ZmFrZS1jYQ==
---
# The token the spoke's ManagedServiceAccount reports. Low entropy, see the header.
apiVersion: v1
kind: Secret
metadata:
  name: ztwim-tokenreview
  namespace: ztwim-nested-spoke
type: Opaque
data:
  token: dGVzdC10b2tlbg==
---
# The kubeconfig Secret manifests/nested-hub/spoke-kubeconfigs.yaml writes, keyed by spoke name.
apiVersion: v1
kind: Secret
metadata:
  name: spoke-kubeconfigs
  namespace: zero-trust-workload-identity-manager
type: Opaque
data:
  ztwim-nested-spoke: c3R1Yg==
