# ComplianceRemediation stubs so policy-auto-remediate resolves in CI.
# The reject-list template lookups these; without the CRD registered in the fake client the
# lookup fails with "API resources are not installed" and the whole policy goes untested.
# Captured from a real OCP 4.22 STIG V2R3 scan: one excluded by the example config, one not.
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceRemediation
metadata:
  name: ocp4-stig-v2r3-project-config-and-template-network-policy
  namespace: openshift-compliance
  labels:
    compliance.openshift.io/suite: stig-v2r3
spec:
  apply: false
---
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceRemediation
metadata:
  name: ocp4-stig-v2r3-audit-profile-set
  namespace: openshift-compliance
  labels:
    compliance.openshift.io/suite: stig-v2r3
spec:
  apply: false
