---
# Hub-side key pair for config.oadp.storage.sourceSecretRef. The policy reads access_key_id and
# access_key_secret from it and builds the Velero credentials file. bucketnames and endpoint are
# optional and override storage.bucket and storage.endpoint.
#
# base64 data, not stringData: the policy tests `index $src "data"`, and a stub written as
# stringData has no data key, so the policy fails loudly on input it should have found.
#
# Low-entropy fake values: tools/testdata is not allowlisted in .gitleaks.toml.
apiVersion: v1
kind: Secret
metadata:
  name: oadp-s3
  namespace: policies-autoshift
type: Opaque
data:
  access_key_id: QUFBQUFBQUFBQUFBQUFBQUFBQUE=
  access_key_secret: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQg==
  bucketnames: Y2x1c3Rlci1iYWNrdXBz
  endpoint: aHR0cHM6Ly9zMy5leGFtcGxlLmNvbQ==
