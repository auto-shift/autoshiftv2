# Stub for the per-cluster autoshift-ca CA secret (created by policy-cert-manager-ca in the hub's
# cert-manager namespace). Vault's transit-token-sync reads its PUBLIC ca.crt to give transit spokes the
# hub CA cert. Low-entropy fake value (public cert only here).
apiVersion: v1
kind: Secret
metadata:
  name: autoshift-ca
  namespace: cert-manager
type: kubernetes.io/tls
data:
  # fake: base64 of "test-ca-cert"
  ca.crt: dGVzdC1jYS1jZXJ0
  tls.crt: dGVzdC1jYS1jZXJ0
  tls.key: dGVzdC1jYS1rZXk=
