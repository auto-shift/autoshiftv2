---
# A cluster whose infra agent is the Red Hat Advanced Cluster Management add-on's. Without it
# policy-gitops-addon enrolls nobody and never renders the principal's sourceNamespaces list. The
# name matches no synthetic cluster profile, so no other policy resolves AS this cluster.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: lint-addon-spoke
  labels:
    autoshift.io/cluster-type: spoke
    autoshift.io/gitops-infra: addon
spec:
  hubAcceptsClient: true
