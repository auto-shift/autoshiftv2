# ClusterManagementAddOn stub so policy-acm-custom-metrics-addon resolves in CI.
# Its read-modify-write patch lookups this object; without a stub the block resolves
# empty and the whole policy goes untested.
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: ClusterManagementAddOn
metadata:
  name: multicluster-observability-addon
spec:
  addOnMeta:
    description: multicluster-observability-addon is the addon to configure spoke
      clusters to collect and forward logs/traces to a given set of outputs
    displayName: Multicluster Observability Addon
  installStrategy:
    placements:
    - configs:
      - group: monitoring.rhobs
        name: mcoa-default-platform-metrics-collector-global
        namespace: open-cluster-management-observability
        resource: prometheusagents
      - group: monitoring.rhobs
        name: platform-metrics-right-sizing
        namespace: open-cluster-management-observability
        resource: scrapeconfigs
      - group: monitoring.rhobs
        name: platform-metrics
        namespace: open-cluster-management-observability
        resource: scrapeconfigs
      - group: monitoring.rhobs
        name: platform-metrics-alerts
        namespace: open-cluster-management-observability
        resource: scrapeconfigs
      - group: monitoring.rhobs
        name: platform-metrics-hcp
        namespace: open-cluster-management-observability
        resource: scrapeconfigs
      - group: monitoring.rhobs
        name: platform-metrics-kubevirt
        namespace: open-cluster-management-observability
        resource: scrapeconfigs
      - group: monitoring.rhobs
        name: mcoa-default-user-workload-metrics-collector-global
        namespace: open-cluster-management-observability
        resource: prometheusagents
      - group: monitoring.coreos.com
        name: platform-rules-default
        namespace: open-cluster-management-observability
        resource: prometheusrules
      name: global
      namespace: open-cluster-management-global-set
      rolloutStrategy:
        type: All
    type: Placements
