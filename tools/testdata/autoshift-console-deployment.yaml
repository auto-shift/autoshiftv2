# The console plugin Deployment, reported as available.
#
# policy-autoshift-console-enable is a readiness gate: it reads status.availableReplicas and
# emits nothing until a replica is up, because enabling a plugin whose Service has no endpoints
# degrades every console page. Without this stub that gate never opens and the policy is never
# exercised.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoshift-console
  namespace: autoshift-console
spec:
  replicas: 2
status:
  replicas: 2
  readyReplicas: 2
  availableReplicas: 2
  conditions:
    - type: Available
      status: 'True'
      reason: MinimumReplicasAvailable
