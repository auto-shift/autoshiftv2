---
# MCO-created objects on the global hub; inputs for policy-global-observability-secrets
# (builds the coalesced rollup secret from these).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: observatorium-api
  namespace: open-cluster-management-observability
spec:
  host: observatorium-api-open-cluster-management-observability.apps.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: observability-controller-open-cluster-management.io-observability-signer-client-cert
  namespace: open-cluster-management-observability
type: kubernetes.io/tls
data:
  tls.crt: dGVzdC1jZXJ0
  tls.key: dGVzdC1rZXk=
---
apiVersion: v1
kind: Secret
metadata:
  name: observability-managed-cluster-certs
  namespace: open-cluster-management-observability
type: Opaque
data:
  ca.crt: dGVzdC1jYQ==
---
# Coalesced rollup secret created by policy-global-observability-secrets on the
# global hub; read by policy-global-observability-prometheus via lookup/copySecretData.
apiVersion: v1
kind: Secret
metadata:
  name: global-observability-secrets
  namespace: policies-autoshift
type: Opaque
data:
  ca.crt: dGVzdC1jYQ==
  tls.crt: dGVzdC1jZXJ0
  tls.key: dGVzdC1rZXk=
  observatorium.url: aHR0cHM6Ly9vYnNlcnZhdG9yaXVtLmV4YW1wbGUuY29tL2FwaS92MS9yZWNlaXZl
---
# Same secret after replication into the observability namespace on an
# intermediate hub; spoke templates read observatorium.url via fromSecret.
apiVersion: v1
kind: Secret
metadata:
  name: global-observability-secrets
  namespace: open-cluster-management-observability
type: Opaque
data:
  ca.crt: dGVzdC1jYQ==
  tls.crt: dGVzdC1jZXJ0
  tls.key: dGVzdC1rZXk=
  observatorium.url: aHR0cHM6Ly9vYnNlcnZhdG9yaXVtLmV4YW1wbGUuY29tL2FwaS92MS9yZWNlaXZl
