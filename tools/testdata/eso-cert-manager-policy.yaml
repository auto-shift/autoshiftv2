# Stub of the cert-manager operator-install Policy, on the hub, in the policy namespace.
#
# The ESO hub readiness gate (policy-eso-boot-readiness-hub) looks this Policy up and walks
# status.status[] for the entry matching the cluster it is resolving for, requiring
# compliant=Compliant before the selfSigned mint path may run. Registering the
# policy.open-cluster-management.io/v1 Policy kind is half the point; the Compliant status for
# lint-cluster is the other half, so the e2e renders the mint body instead of the error report.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-cert-manager-operator-install
  namespace: policies-autoshift
spec:
  disabled: false
  remediationAction: enforce
status:
  compliant: Compliant
  status:
    - clustername: lint-cluster
      clusternamespace: lint-cluster
      compliant: Compliant
