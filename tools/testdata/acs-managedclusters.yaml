---
# ManagedCluster stubs for the e2e cluster profiles. The CRS mint Job walks every
# rendered-config ConfigMap and only mints for a cluster whose ManagedCluster carries
# autoshift.io/acs: 'true' and is owned by this deployment's namespace. Without these the
# whole Job body renders to an empty string and the policy is never validated.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: lint-cluster
  labels:
    autoshift.io/acs: 'true'
    autoshift.io/owning-namespace: policies-autoshift
spec:
  hubAcceptsClient: true
---
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: lint-cluster-aws
  labels:
    autoshift.io/acs: 'true'
    autoshift.io/owning-namespace: policies-autoshift
spec:
  hubAcceptsClient: true
---
