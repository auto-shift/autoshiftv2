# ComplianceCheckResult stubs for policy-stig-manual-review's spoke lookup. Without the kind
# registered in the fake client the lookup fails with "API resources are not installed" and the
# policy goes untested. One of each status the policy branches on, from a real STIG V2R3 scan.
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceCheckResult
metadata:
  name: ocp4-stig-v2r3-audit-profile-set
  namespace: openshift-compliance
severity: medium
status: FAIL
---
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceCheckResult
metadata:
  name: ocp4-stig-v2r3-fips-mode-enabled-on-all-nodes
  namespace: openshift-compliance
severity: high
status: FAIL
---
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceCheckResult
metadata:
  name: ocp4-stig-v2r3-rbac-least-privilege
  namespace: openshift-compliance
severity: high
status: MANUAL
---
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceCheckResult
metadata:
  name: ocp4-stig-v2r3-api-server-anonymous-auth
  namespace: openshift-compliance
severity: medium
status: PASS
---
# INCONSISTENT where every source is NOT-APPLICABLE: benign, must NOT be reported.
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceCheckResult
metadata:
  name: ocp4-moderate-rev-4-worker-directory-access-var-log-kube-audit
  namespace: openshift-compliance
  annotations:
    compliance.openshift.io/inconsistent-source: 'node-a:NOT-APPLICABLE,node-b:NOT-APPLICABLE'
severity: medium
status: INCONSISTENT
---
# INCONSISTENT with a FAIL among the sources: must be reported.
apiVersion: compliance.openshift.io/v1alpha1
kind: ComplianceCheckResult
metadata:
  name: ocp4-moderate-rev-4-worker-audit-rules-privileged-commands
  namespace: openshift-compliance
  annotations:
    compliance.openshift.io/inconsistent-source: 'node-a:FAIL,node-b:PASS'
severity: medium
status: INCONSISTENT
