---
# Registers FenceAgentsRemediation as a namespaced GVK for policy-far-active-remediations.
# That inform policy list-lookups the kind in openshift-workload-availability; an unregistered
# GVK is a hard harness failure rather than an empty list. Deliberately NOT placed in
# openshift-workload-availability so the assertion-only policy resolves empty (Compliant path).
apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediation
metadata:
  name: far-testdata-gvk-placeholder
  namespace: far-testdata-unused
