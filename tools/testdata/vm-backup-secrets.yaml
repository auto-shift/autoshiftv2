---
# Hub-side object store credentials for vm-backup, copied to every selected managed cluster by
# config.vm-backup.storage.credentialsFrom. Exists so the copySecretData path resolves.
#
# Low-entropy fake values: tools/testdata is not allowlisted in .gitleaks.toml.
apiVersion: v1
kind: Secret
metadata:
  name: vm-backup-cloud-credentials
  namespace: policies-autoshift
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id=AAAAAAAAAAAAAAAAAAAA
    aws_secret_access_key=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
