# Secrets the Artifactory instance policy waits for before it emits the Artifactory CR. It requires
# the database port and name, the master and join keys, and the admin password, and emits nothing
# until all of them are present.
#
# artifactory-db-app is generated by the CloudNativePG cluster; the keys, licence and admin password
# are created out of band because they must stay stable across restarts and upgrades.
#
# Low-entropy fake values: tools/testdata is not allowlisted in .gitleaks.toml.
apiVersion: v1
kind: Secret
metadata:
  name: artifactory-db-app
  namespace: jfrog-system
type: Opaque
data:
  host: YXJ0aWZhY3RvcnktZGItcncuamZyb2ctc3lzdGVtLnN2Yw==
  port: NTQzMg==
  dbname: YXJ0aWZhY3Rvcnk=
  username: YXJ0aWZhY3Rvcnk=
  password: dGVzdC1kYi1wYXNzd29yZA==
---
apiVersion: v1
kind: Secret
metadata:
  name: artifactory-keys
  namespace: jfrog-system
type: Opaque
data:
  master-key: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA==
  join-key: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMQ==
---
apiVersion: v1
kind: Secret
metadata:
  name: artifactory-license
  namespace: jfrog-system
type: Opaque
data:
  artifactory.lic: VEVTVC1MSUNFTkNFLU5PVC1SRUFM
---
apiVersion: v1
kind: Secret
metadata:
  name: artifactory-admin
  namespace: jfrog-system
type: Opaque
data:
  password: dGVzdC1hZG1pbi1wYXNzd29yZA==
