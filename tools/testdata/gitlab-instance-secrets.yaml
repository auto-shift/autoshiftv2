# Secrets the GitLab instance policy waits for before it emits the GitLab CR.
#
# gitlab-db-app is generated by the CloudNativePG cluster, and the Redis password already exists in testdata. The instance policy checks all three of database, Redis and object storage are ready and
# fails until they are, so without these it never renders. gitlab-backup-s3cfg turns on the toolbox
# backup job, so without it that branch never renders.
#
# Low-entropy fake values: tools/testdata is not allowlisted in .gitleaks.toml.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-db-app
  namespace: gitlab-system
type: Opaque
data:
  host: Z2l0bGFiLWRiLXJ3LmdpdGxhYi1zeXN0ZW0uc3Zj
  port: NTQzMg==
  dbname: Z2l0bGFiaHFfcHJvZHVjdGlvbg==
  username: Z2l0bGFi
  password: dGVzdC1kYi1wYXNzd29yZA==
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-backup-s3cfg
  namespace: gitlab-system
type: Opaque
data:
  config: W2RlZmF1bHRdCmFjY2Vzc19rZXkgPSB0ZXN0dGVzdApzZWNyZXRfa2V5ID0gdGVzdHRlc3QKaG9zdF9iYXNlID0gczMub3BlbnNoaWZ0LXN0b3JhZ2Uuc3ZjOjQ0Mwpob3N0X2J1Y2tldCA9IHMzLm9wZW5zaGlmdC1zdG9yYWdlLnN2Yzo0NDMKYnVja2V0X2xvY2F0aW9uID0gdXMtZWFzdC0xCnVzZV9odHRwcyA9IFRydWUKc2lnbmF0dXJlX3YyID0gRmFsc2UK
