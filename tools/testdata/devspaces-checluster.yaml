# A running Dev Spaces CheCluster, as the operator leaves it: the policy's base plus defaults the
# operator fills in, including a list (tolerations). Registers the CheCluster type for the harness
# and exercises policy-devspaces-instance's read-modify-write path, where config is merged over the
# live spec and lists from config replace the live ones.
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
  devEnvironments:
    startTimeoutSeconds: 300
    secondsOfRunBeforeIdling: -1
    tolerations:
      - key: example
        operator: Exists
        effect: NoSchedule
