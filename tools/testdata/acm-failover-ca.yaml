---
# Trust bundle for a private S3 endpoint, referenced by config.acm-failover.storage.caRef.
#
# Keep this value MULTI-LINE. It is what exercises the caRef branch against realistic input; an
# empty or single-line bundle passes the branch without testing it.
#
# Low-entropy repeated text, not a real certificate: tools/testdata is not allowlisted in
# .gitleaks.toml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: acm-failover-ca
  namespace: open-cluster-management-backup
data:
  ca-bundle.crt: |
    -----BEGIN CERTIFICATE-----
    AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    -----END CERTIFICATE-----
