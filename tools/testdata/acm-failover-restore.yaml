---
# The passive sync Restore as the cluster-backup controller leaves it: it adds spec.hooks, which
# the policy does not set. policy-acm-failover-restore reads the live object back so it can carry
# that field over under mustonlyhave. Stubbed so the lookup resolves and the carry-over renders.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Restore
metadata:
  name: acm-failover-restore-passive-sync
  namespace: open-cluster-management-backup
spec:
  cleanupBeforeRestore: CleanupRestored
  hooks: {}
  restoreSyncInterval: 30m
  syncRestoreWithNewBackups: true
  veleroCredentialsBackupName: latest
  veleroManagedClustersBackupName: skip
  veleroResourcesBackupName: latest
