---
# Objects other RHADS policies create on the cluster, read by policy-tssc-app-namespaces and
# policy-dh-env. The suite cannot model policy dependencies, so each one is stubbed here. Fake
# values, testing only.
# Created by policy-gitops-systems-argocd (the infra Argo CD admin password).
apiVersion: v1
kind: Secret
metadata:
  name: infra-gitops-cluster
  namespace: openshift-gitops
type: Opaque
data:
  # admin.password: fake-argocd-admin
  admin.password: ZmFrZS1hcmdvY2QtYWRtaW4=
---
# Created by the Pipelines operator (TektonConfig generateSigningSecret).
apiVersion: v1
