# Stub cert-manager Certificates so (a) the cert-manager.io/v1 group is registered for the readiness-gate
# lookup in the API/Ingress cert policies, and (b) they report Ready — which opens the gate so the e2e also
# renders the gated APIServer/IngressController patches (not just the Certificates).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-api-cert
  namespace: openshift-config
spec:
  secretName: cert-manager-api-cert
status:
  conditions:
    - type: Ready
      status: 'True'
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-ingress-cert
  namespace: openshift-ingress
spec:
  secretName: cert-manager-ingress-cert
status:
  conditions:
    - type: Ready
      status: 'True'
