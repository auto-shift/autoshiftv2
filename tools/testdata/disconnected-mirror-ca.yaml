# Trust bundle for the mirror registry, named by config.disconnected.mirrorRegistry.caRef.
# policy-disconnected-registry-ca reads it and writes the certificate into the cluster's
# additionalTrustedCA ConfigMap, so without this stub that policy renders nothing.
#
# A certificate is public material, and this one is an obvious placeholder.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-ca-bundle
  namespace: cluster-install-secrets
data:
  ca-bundle.crt: |
    -----BEGIN CERTIFICATE-----
    TUlJRkFLRS1NSVJST1ItUkVHSVNUUlktQ0EtRk9SLVRFU1RJTkctT05MWQ==
    -----END CERTIFICATE-----
