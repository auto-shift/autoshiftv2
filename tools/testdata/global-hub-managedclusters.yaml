# A managed hub opted in to Multicluster Global Hub. policy-global-hub-managed-hubs lists the
# ManagedClusters carrying autoshift.io/global-hub-deploy-mode and copies the value to the
# operator's own deploy-mode label. With no such cluster it renders an empty list, so without this
# stub the import path never renders in the suite.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: lint-global-hub-member
  labels:
    autoshift.io/global-hub-deploy-mode: 'default'
spec:
  hubAcceptsClient: true
