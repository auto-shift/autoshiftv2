---
# BareMetalHost stubs for FAR autoNodeIPsFromBMH mode (metal3.io/v1alpha1 only).
# Hub path: BMHs in the managed-cluster namespace (SiteConfig / Assisted Installer).
# Spoke path: BMHs in openshift-machine-api (self-managed Metal3).
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker-0
  namespace: lint-cluster
  annotations:
    bmac.agent-install.openshift.io/hostname: worker-0.example.com
spec:
  bmc:
    address: redfish-virtualmedia://10.0.0.11/redfish/v1/Systems/1
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker-1
  namespace: lint-cluster
  annotations:
    bmac.agent-install.openshift.io/hostname: worker-1.example.com
spec:
  bmc:
    address: idrac-virtualmedia://10.0.0.12/redfish/v1/Systems/System.Embedded.1
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker-0
  namespace: openshift-machine-api
spec:
  bmc:
    address: redfish-virtualmedia://10.0.0.11/redfish/v1/Systems/1
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker-1
  namespace: openshift-machine-api
spec:
  bmc:
    address: idrac-virtualmedia://10.0.0.12/redfish/v1/Systems/System.Embedded.1
