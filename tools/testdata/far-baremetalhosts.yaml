---
# BareMetalHost stubs for FAR autoNodeIPsFromBMH mode.
# These register the metal3 API kinds in fake discovery and provide representative
# spec.bmc.address values so the resolver can exercise BMC host extraction.
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker-0
  namespace: openshift-machine-api
spec:
  bmc:
    address: redfish-virtualmedia://10.0.0.11/redfish/v1/Systems/1
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker-1
  namespace: openshift-machine-api
spec:
  bmc:
    address: idrac-virtualmedia://10.0.0.12/redfish/v1/Systems/System.Embedded.1
---
# Also register v1beta1 so fallback lookup paths resolve in tests.
apiVersion: metal3.io/v1beta1
kind: BareMetalHost
metadata:
  name: worker-2
  namespace: openshift-machine-api
spec:
  bmc:
    address: redfish://10.0.0.13/redfish/v1/Systems/1
