---
# The CRS Job derives the roxctl image tag from the installed ACS operator when the
# acs-version label is unset. Stub the Subscription so that lookup resolves and also
# registers operators.coreos.com/v1alpha1 with the fake API server.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
spec:
  channel: stable
  name: rhacs-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
status:
  currentCSV: rhacs-operator.v4.11.2
