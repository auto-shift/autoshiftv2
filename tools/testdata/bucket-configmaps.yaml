---
# ObjectBucketClaim-generated bucket config for quay-db-backup. The claim creates a ConfigMap and a
# Secret under the same name, and the backup and object-storage policies stay quiet until both
# exist, so without this pair they render nothing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quay-db-backup
  namespace: quay-enterprise
data:
  BUCKET_HOST: s3.openshift-storage.svc
  BUCKET_NAME: quay-db-backup-fake-0001
  BUCKET_PORT: "443"
  BUCKET_REGION: noobaa

