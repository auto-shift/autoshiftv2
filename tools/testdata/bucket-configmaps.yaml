metadata:
  name: loki-bucket-odf
  namespace: openshift-logging
data:
  BUCKET_HOST: s3.us-east-2.amazonaws.com
  BUCKET_NAME: loki-bucket-fake-0001
  BUCKET_PORT: "443"
  BUCKET_REGION: us-east-2
