# The Route the OpenShift Update Service operator creates for UpdateService autoshift. The
# openshift-upgrade channel policy reads it on the hub to build a disconnected cluster's update graph
# URL when config.openshift-upgrade.upgradeGraphUrl is unset.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: autoshift-route
  namespace: openshift-update-service
spec:
  host: autoshift-route-openshift-update-service.apps.hub.example.com
  to:
    kind: Service
    name: autoshift-policy-engine
