---
# CertManager/cluster, which the cert-manager Operator creates on install. policy-cert-manager-issuers
# rebuilds its spec to set controllerConfig.overrideArgs, so the stub carries a stale argument that
# must be replaced and other spec fields that must be carried over.
apiVersion: operator.openshift.io/v1alpha1
kind: CertManager
metadata:
  name: cluster
spec:
  logLevel: Normal
  managementState: Managed
  operatorLogLevel: Normal
  controllerConfig:
    overrideArgs:
      - '--dns01-recursive-nameservers=10.0.0.53:53'
