# Stubs for project-onboarding: the AdminNetworkPolicy CRD (policy.networking.k8s.io/v1alpha1), which
# gates the policy's AdminNetworkPolicy lookups, and an owned AdminNetworkPolicy of a removed project
# from an earlier run, which is pruned. Tests drop this file to model a cluster without the CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: adminnetworkpolicies.policy.networking.k8s.io
spec:
  group: policy.networking.k8s.io
  names:
    kind: AdminNetworkPolicy
    plural: adminnetworkpolicies
  scope: Cluster
---
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: autoshift-project-removed-project
  labels:
    autoshift.io/project: removed-project
    autoshift.io/managed-by: project-onboarding
spec:
  priority: 50
  subject:
    namespaces:
      matchLabels:
        autoshift.io/project: removed-project
  ingress:
    - name: deny-web
      action: Deny
      from:
        - namespaces:
            matchLabels:
              example.com/team: web
