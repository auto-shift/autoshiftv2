# Client TLS material for an entry in config.globalObservability.additionalRemoteWrites. The policy
# copies this hub Secret to each selected cluster and fails loudly if it is absent or lacks a key
# for a caFile, certFile or keyFile mounted from it, so without it that branch cannot be exercised.
#
# Low-entropy fake values: tools/testdata is not allowlisted in .gitleaks.toml.
apiVersion: v1
kind: Secret
metadata:
  name: global-observability-remote-write
  namespace: open-cluster-management-observability
type: Opaque
data:
  ca.crt: ZmFrZS1jYQ==
  tls.crt: ZmFrZS1jZXJ0
  tls.key: ZmFrZS1rZXk=
