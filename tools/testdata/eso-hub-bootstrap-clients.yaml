# Per-managed-cluster hub-minted client certs, one per cluster-install example variant.
#
# policy-eso-boot-store copies the hub-minted client cert into the spoke with copySecretData,
# which deliberately has no existence guard: erroring until the hub mints the Secret IS the
# retry mechanism on a live cluster (see the comment at the call site). In the e2e that means
# the Secret must exist, or hub resolution aborts and the leftover {{hub- markers then fail to
# parse on the spoke pass ("bad character U+002D").
#
# The e2e resolves managed clustersets once per _example-cluster-install-<platform>.yaml, as
# cluster lint-cluster-<platform>. Adding a new platform example therefore needs a matching
# Secret here. lint-cluster itself is covered by eso-hub-bootstrap.yaml.
#
# Note the vmware-static entry is hub-bootstrap-client-lint-cluster-vmware-st, not -vmware-static:
# the name carries the cluster segment truncated to the client-cert CN budget, so a long cluster
# name is cut. Both the minting policy and this copy derive that segment independently.
---
apiVersion: v1
kind: Secret
metadata:
  name: hub-bootstrap-client-lint-cluster-aws
  namespace: policies-autoshift
type: kubernetes.io/tls
data:
  # tls.crt: fake-hub-bootstrap-client-cert-not-real
  tls.crt: ZmFrZS1odWItYm9vdHN0cmFwLWNsaWVudC1jZXJ0LW5vdC1yZWFs
  # tls.key: fake-hub-bootstrap-client-key-not-real
  tls.key: ZmFrZS1odWItYm9vdHN0cmFwLWNsaWVudC1rZXktbm90LXJlYWw=
  # ca.crt: fake-hub-bootstrap-ca-not-real
  ca.crt: ZmFrZS1odWItYm9vdHN0cmFwLWNhLW5vdC1yZWFs
---
