# Stubs for the spoke-side lookups in the AAP Hub S3 Secret check (test/aap-hub-s3-secret.yaml).
# The instance uses S3 so the check reads the Secret; the Secret carries every required key.
#
# Values are deliberately low-entropy placeholders — tools/testdata/ is intentionally NOT allowlisted
# in .gitleaks.toml.
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
spec:
  hub:
    storage_type: S3
    object_storage_s3_secret: aap-s3-external
---
apiVersion: v1
kind: Secret
metadata:
  name: aap-s3-external
  namespace: ansible-automation-platform
type: Opaque
data:
  s3-access-key-id: dGVzdA==
  s3-secret-access-key: dGVzdA==
  s3-bucket-name: dGVzdA==
  s3-region: dGVzdA==
