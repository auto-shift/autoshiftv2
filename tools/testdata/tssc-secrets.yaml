# Fake ArgoCD Keycloak client secret (realm-secrets generates argocd-realm-clients in keycloak-system
# when config.keycloak.argocdSso is true). Read by realm-import and the gitops charts to gate and wire
# ArgoCD Dex SSO. Fake value, testing only.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-realm-clients
  namespace: keycloak-system
type: Opaque
data:
  # argocd: fake-argocd-secret
  argocd: ZmFrZS1hcmdvY2Qtc2VjcmV0
---
# Fake generated Keycloak client secret (realm-secrets creates trusted-artifact-signer-clients in keycloak-system).
apiVersion: v1
kind: Secret
metadata:
  name: trusted-artifact-signer-clients
  namespace: keycloak-system
type: Opaque
data:
  # trustedArtifactSigner: fake-tas-secret
  trustedArtifactSigner: ZmFrZS10YXMtc2VjcmV0
---
# Fake generated Keycloak client secret (realm-secrets creates quay-realm-clients in keycloak-system).
apiVersion: v1
kind: Secret
metadata:
  name: quay-realm-clients
  namespace: keycloak-system
type: Opaque
data:
  # quay: fake-quay-secret
  quay: ZmFrZS1xdWF5LXNlY3JldA==
---
# Fake generated GitLab Keycloak client secret (realm-secrets creates gitlab-realm-clients in
# keycloak-system). Read on the cluster by policy-gitlab-instance for the OmniAuth provider.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-realm-clients
  namespace: keycloak-system
type: Opaque
data:
  # gitlab: fake-gitlab-secret
  gitlab: ZmFrZS1naXRsYWItc2VjcmV0
---
# Fake generated RHDH Keycloak client secret (realm-secrets creates rhdh-realm-clients in keycloak-system).
# Read spoke-side by the gitlab keycloak-group-sync CronJob (rhdh service account). Fake value, testing only.
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-realm-clients
  namespace: keycloak-system
type: Opaque
data:
  # rhdh: fake-rhdh-secret
  rhdh: ZmFrZS1yaGRoLXNlY3JldA==
---
# Fake in-cluster API CA (kube-root-ca.crt exists in every namespace) — read spoke-side by developer-hub
# backstage.yaml and appended to the RHDH trusted-ca bundle so the Kubernetes plugin trusts
# kubernetes.default.svc. ConfigMap data is plaintext PEM (not base64). Fake cert, testing only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-root-ca.crt
  namespace: tssc-dh
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    MIIBFakeKubeRootCAForTestingOnly1234567890AbCdEfGhIjKlMnOpQrStUvWx
    YzFakeFakeFakeFakeFakeFakeFakeFakeFakeFakeFakeFakeFakeFakeFakeFake
    -----END CERTIFICATE-----
---
# Fake pre-created ACS API token (admin bootstraps this on the hub; propagated to tssc-acs-integration
# on managed clusters by advanced-cluster-security tssc-integration.yaml). ACS can't mint tokens declaratively.
apiVersion: v1
kind: Secret
metadata:
  name: tssc-acs-integration
  namespace: policies-autoshift
type: Opaque
data:
  # token: fake-acs-token
  token: ZmFrZS1hY3MtdG9rZW4=
---
# Fake generated Keycloak client secret (realm-secrets creates autoshift-ci-realm-clients in
# keycloak-system while tas and autoshift-cicd are on).
apiVersion: v1
kind: Secret
metadata:
  name: autoshift-ci-realm-clients
  namespace: keycloak-system
type: Opaque
data:
  # autoshiftCi: fake-ci-secret
  autoshiftCi: ZmFrZS1jaS1zZWNyZXQ=
---
# Fake generated Keycloak client secrets for Trusted Profile Analyzer (realm-secrets creates
# tpa-realm-clients in keycloak-system while trusted-profile-analyzer is on).
apiVersion: v1
kind: Secret
metadata:
  name: tpa-realm-clients
  namespace: keycloak-system
type: Opaque
data:
  # cli: fake-cli
  cli: ZmFrZS1jbGk=
  # frontend: fake-fe
  frontend: ZmFrZS1mZQ==
