---
# OAuth/cluster for the htpasswd policy, which rebuilds spec.identityProviders from the live object.
# Carries a non-HTPasswd provider that must survive, a stale HTPasswd provider that must be dropped,
# and a templates field that must be carried over.
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: corp-ldap
      mappingMethod: claim
      type: LDAP
      ldap:
        url: ldap://ldap.example.com/ou=users,dc=example,dc=com?uid
        insecure: false
        attributes:
          id: [dn]
          preferredUsername: [uid]
    - name: old-htpasswd
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: old-htpass
  templates:
    login:
      name: login-template
---
# The htpasswd Secret named in _example.yaml. Existence is all the policy checks, so it carries no
# data, and no credential-shaped value for the secret scan to find.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-admins-htpass
  namespace: openshift-config
type: Opaque
