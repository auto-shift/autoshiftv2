# A deployment-shaped project set for the project-onboarding tests: existing namespaces adopted and
# enforced, each with admin, write and read group RoleBindings and nothing else. It is NOT a values
# file and nothing deploys it. The tests read it in place of a clusterset config.
#
# golden.json in this directory is the reference render of exactly these projects, from the
# template before it was split into shard Policies.
projects:
  customer-portal:
    adopt: true
    mode: enforce
    groups:
      admin: portal-admins
      write: portal-editors
      read: portal-viewers
  ops-console:
    adopt: true
    mode: enforce
    groups:
      admin: portal-admins
      write: portal-editors
      read: portal-viewers
  task-sync:
    adopt: true
    mode: enforce
    groups:
      admin: tasks-admins
      write: tasks-editors
      read: tasks-viewers
  skills-hub:
    adopt: true
    mode: enforce
    groups:
      admin: skills-admins
      write: skills-editors
      read: skills-viewers
  skills-ingest:
    adopt: true
    mode: enforce
    groups:
      admin: ingest-admins
      write: ingest-editors
      read: ingest-viewers
  inventory:
    adopt: true
    mode: enforce
    groups:
      admin: inventory-admins
      write: inventory-editors
      read: inventory-viewers
  policies-autoshift:
    adopt: true
    mode: enforce
    groups:
      admin: platform-admins
      write: platform-editors
      read: platform-viewers
  orders:
    adopt: true
    mode: enforce
    groups:
      admin: platform-admins
