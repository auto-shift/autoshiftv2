# Stub ClusterIssuer so the cert-manager.io/v1 ClusterIssuer kind is registered for the issuer-exists
# gate in the Quay serving-certificate template. Registering the kind is the point — the gate opens on
# existence, so this also makes the e2e render the gated Certificate rather than skipping it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: autoshift-ca
spec:
  ca:
    secretName: autoshift-ca
