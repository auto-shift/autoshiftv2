# AddOnDeploymentConfig stubs so policy-acm-addon-tuning resolves in CI. Its read-modify-write
# lookups read these objects; the registered kind is what lets the lookup succeed. The limits
# differ from the policy defaults, the drift the read-modify-write replaces.
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnDeploymentConfig
metadata:
  name: config-policy-controller-tuning
  namespace: open-cluster-management
spec:
  agentInstallNamespace: open-cluster-management-agent-addon
  resourceRequirements:
    - containerID: deployments:config-policy-controller:config-policy-controller
      resources:
        limits:
          memory: 2Gi
---
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnDeploymentConfig
metadata:
  name: governance-policy-framework-tuning
  namespace: open-cluster-management
spec:
  agentInstallNamespace: open-cluster-management-agent-addon
  resourceRequirements:
    - containerID: deployments:governance-policy-framework:governance-policy-framework-addon
      resources:
        limits:
          memory: 2Gi
