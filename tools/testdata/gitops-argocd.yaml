---
# Registers the argoproj.io ArgoCD kind, so the gitops-agent policies' lookups of a team's agent
# principal resolve to "not found yet" instead of failing on a missing API. The hub's infra
# instance, which the agent attaches to when gitops-infra is an agent mode. policy-infra-gitops and
# policy-remove-infra-gitops also read it: one infra and one unrelated toleration exercise the
# remove path's filtering.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: infra-gitops
  namespace: openshift-gitops
spec:
  nodePlacement:
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        operator: Exists
      - effect: NoSchedule
        key: example.com/dedicated
        operator: Exists
