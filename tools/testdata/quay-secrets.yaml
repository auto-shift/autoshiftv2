# Stubs for the spoke-side lookups in the Quay registry template.
#
# quay-tls opens the TLS gate so the e2e renders the unmanaged-tls + secretRef form of the
# QuayRegistry rather than the managed-tls default.
#
# quay-db-app / clair-db-app are the application Secrets CloudNativePG generates for each Cluster.
# They register the shape the template reads (uri for Quay's DB_URI, discrete fields for Clair's
# libpq connstring). Only consumed when quay-db-mode is not 'bundled'.
#
# Values are deliberately low-entropy placeholders — tools/testdata/ is intentionally NOT allowlisted
# in .gitleaks.toml.
apiVersion: v1
kind: Secret
metadata:
  name: quay-config-extra
  namespace: quay-enterprise
type: Opaque
data:
  # config.yaml fragment holding the keys that must never live in git — here the object-storage
  # credentials that pair with config.quay.components.objectstorage: false. Merged into the config
  # bundle last, so it wins over config.quay.config.
  config.yaml: 
---
apiVersion: v1
kind: Secret
metadata:
  name: quay-tls
  namespace: quay-enterprise
type: kubernetes.io/tls
data:
  tls.crt: dGVzdA==
  tls.key: dGVzdA==
---
apiVersion: v1
kind: Secret
metadata:
  name: quay-db-app
  namespace: quay-enterprise
type: Opaque
data:
  # postgresql://quay:testtest@quay-db-rw:5432/quay
  uri: cG9zdGdyZXNxbDovL3F1YXk6dGVzdHRlc3RAcXVheS1kYi1ydzo1NDMyL3F1YXk=
  username: cXVheQ==
  password: dGVzdHRlc3Q=
  dbname: cXVheQ==
  host: cXVheS1kYi1ydw==
  port: NTQzMg==
---
apiVersion: v1
kind: Secret
metadata:
  name: clair-db-app
  namespace: quay-enterprise
type: Opaque
data:
  # postgresql://clair:testtest@clair-db-rw:5432/clair
  uri: cG9zdGdyZXNxbDovL2NsYWlyOnRlc3R0ZXN0QGNsYWlyLWRiLXJ3OjU0MzIvY2xhaXI=
  username: Y2xhaXI=
  password: dGVzdHRlc3Q=
  dbname: Y2xhaXI=
  host: Y2xhaXItZGItcnc=
  port: NTQzMg==
