# A per-cluster override, shaped exactly like autoshift/values/clusters/<cluster>.yaml and layered
# on autoshift/values/clustersets/_example.yaml.
#
# Red Hat Quay on two CloudNativePG clusters that AutoShift provisions. The connections come from
# the application Secrets CloudNativePG generates, stubbed in tools/testdata/quay-secrets.yaml. The
# configSecretRef Secret in cluster/ still holds a DB_URI and clair-config.yaml from an earlier
# external setup, and both databases must still come from CloudNativePG.
clusters:
  quay-managed-db:
    labels:
      quay: 'true'
      cloudnative-pg: 'true'
      quay-db-mode: 'managed'
      quay-db-instances: '3'
      quay-clair-db-instances: '3'
