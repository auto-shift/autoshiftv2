# A per-cluster override, shaped exactly like autoshift/values/clusters/<cluster>.yaml and layered
# on autoshift/values/clustersets/_example.yaml.
#
# Red Hat Quay on two CloudNativePG clusters that AutoShift provisions.
clusters:
  quay-managed-db:
    labels:
      quay: 'true'
      cloudnative-pg: 'true'
      quay-db-mode: 'managed'
      quay-db-instances: '3'
      quay-clair-db-instances: '3'
