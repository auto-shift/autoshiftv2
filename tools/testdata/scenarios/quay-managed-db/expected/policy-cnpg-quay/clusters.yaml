# Three instances each, and a short smart shutdown: Quay and Clair never close their pooled
# connections, so the 180s default refuses new connections for that long before failover starts.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: quay-db
  namespace: quay-enterprise
spec:
  instances: 3
  smartShutdownTimeout: 15
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: clair-db
  namespace: quay-enterprise
spec:
  instances: 3
  smartShutdownTimeout: 15
