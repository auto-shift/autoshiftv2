# A per-cluster override, shaped exactly like autoshift/values/clusters/<cluster>.yaml and layered
# on autoshift/values/clustersets/_example.yaml.
#
# AutoShift CI/CD set up for evaluation, entirely on the hub: the hub polls upstream and mirrors it
# into its GitLab autoshift project, site-config is its GitLab site-config project, and charts
# publish to its Quay through the bootstrap-quay robot. Nothing outside the hub calls in.
clusters:
  cicd-poll:
    labels:
      autoshift-cicd: 'true'
      quay: 'true'
      gitlab: 'true'
    config:
      autoshift-cicd:
        source:
          provider: gitlab
          repo: ''
          secret: ''
          pollSchedule: '*/5 * * * *'
          pollRefs: main feature/my-change
        siteConfig:
          provider: gitlab
          repo: ''
          secret: ''
        registry:
          host: ''
          namespace: ''
          pushSecret: ''
