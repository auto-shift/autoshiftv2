# A per-cluster override, shaped exactly like autoshift/values/clusters/<cluster>.yaml and layered
# on autoshift/values/clustersets/_example.yaml.
#
# AutoShift CI/CD set up for evaluation, entirely on the hub: the hub polls upstream and mirrors it
# into its GitLab project autoshift/autoshift, site-config is its GitLab project
# autoshift/site-config, and charts publish to its Quay through the bootstrap-quay robot. Nothing
# outside the hub calls in.
clusters:
  cicd-poll:
    labels:
      autoshift-cicd: 'true'
      quay: 'true'
      gitlab: 'true'
      trusted-profile-analyzer: 'true'
    config:
      autoshift-cicd:
        source:
          provider: gitlab
          repo: autoshift/autoshift
          secret: ''
          pollSchedule: '*/5 * * * *'
          pollRefs: main feature/my-change
        deployments:
          pruneSchedule: '*/30 * * * *'
        siteConfig:
          provider: gitlab
          repo: autoshift/site-config
          secret: ''
        registry:
          host: ''
          namespace: ''
          pushSecret: ''
