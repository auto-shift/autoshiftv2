description: >-
  AutoShift CI/CD set up for evaluation on the hub alone. The example is the production shape, a
  customer's own GitHub repository with a webhook, a GitHub site-config and an external registry,
  so this covers the other side of each: the GitLab mirror fed by the poll CronJob, site-config on
  the hub's GitLab, and publishing to the hub's Quay with the bootstrap-quay robot.

policies:
  - stable/autoshift-cicd

expect:
  - policy: policy-autoshift-cicd-source
    kind: Repository
    namespace: autoshift-ci
    name: autoshift
    fields:
      - path: spec.url
        equals: https://gitlab.example.com/autoshift/autoshift
      - path: spec.git_provider.type
        equals: gitlab
      - path: spec.git_provider.url
        equals: https://gitlab.example.com
      - path: spec.git_provider.secret.name
        equals: autoshift-pac-webhook
      - path: spec.settings.pipelinerun_provenance
        equals: default_branch

  - policy: policy-autoshift-cicd-endpoints
    kind: ConfigMap
    namespace: autoshift-ci
    name: autoshift-ci-endpoints
    fields:
      - path: data.siteConfigUrl
        equals: https://gitlab.example.com/autoshift/site-config.git
      - path: data.siteConfigSecret
        equals: gitlab-autoshift-token
      - path: data.siteConfigUser
        equals: oauth2
      - path: data.registryHost
        equals: registry-quay.apps.example.com
      - path: data.registryNamespace
        equals: autoshift
      - path: data.registryPushSecret
        equals: quay-autoshift-ci

  # Both repositories are on this GitLab: both projects, the webhook, and the upstream mirror.
  - policy: policy-autoshift-cicd-bootstrap
    kind: Pipeline
    namespace: autoshift-ci
    name: bootstrap-gitlab
    fields:
      - path: spec.params[name=projects].default[0]
        equals: autoshift/autoshift
      - path: spec.params[name=projects].default[1]
        equals: autoshift/site-config
      - path: spec.params[name=webhookProject].default
        equals: autoshift/autoshift
      - path: spec.params[name=syncUpstream].default
        equals: 'true'

  - policy: policy-autoshift-cicd-bootstrap
    kind: CronJob
    namespace: autoshift-ci
    name: poll-upstream
    fields:
      - path: spec.schedule
        equals: '*/5 * * * *'
      - path: spec.jobTemplate.spec.template.spec.containers[name=poll].env[name=REFS].value
        equals: main feature/my-change
      - path: spec.jobTemplate.spec.template.spec.containers[name=poll].env[name=PROJECT].value
        equals: autoshift/autoshift

  # The registry credential comes out of the push Secret's dockerconfigjson. The ApplicationSet is
  # not asserted here: its own Go templates stay in the resolved object-templates-raw, which the
  # matcher reads as unresolved.
  - policy: policy-autoshift-cicd-deployments
    kind: Secret
    namespace: openshift-gitops
    name: autoshift-registry
    fields:
      - path: data.username
        equals: Y2k=
      - path: data.url
        equals: b2NpOi8vcmVnaXN0cnkuZXhhbXBsZS5jb20vYXV0b3NoaWZ0
      - path: data.type
        equals: b2Np
