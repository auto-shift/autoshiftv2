# A per-cluster override, shaped exactly like autoshift/values/clusters/<cluster>.yaml and layered
# on autoshift/values/clustersets/_example.yaml.
#
# AutoShift CI/CD entirely on the GitLab on the hub: no repository URLs, so the Repository points at
# the autoshift project bootstrap-gitlab creates, through the hub's GitLab API, and site-config is
# the site-config project, pushed with the GitLab token.
clusters:
  cicd-gitlab:
    labels:
      autoshift-cicd: 'true'
    config:
      autoshift-cicd:
        source:
          provider: gitlab
          repo: ''
        siteConfig:
          provider: gitlab
          repo: ''
          secret: ''
