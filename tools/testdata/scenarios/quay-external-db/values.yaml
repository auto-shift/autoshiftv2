# A per-cluster override, shaped exactly like autoshift/values/clusters/<cluster>.yaml and layered
# on autoshift/values/clustersets/_example.yaml.
#
# Red Hat Quay on databases run outside the cluster: the production path for a highly available
# registry. Credentials are not here, as in any values file. They come from the quay-config-extra
# Secret in stubs/.
clusters:
  quay-external-db:
    labels:
      quay: 'true'
      quay-db-mode: 'external'
    config:
      quay:
        configSecretRef:
          name: quay-config-extra
          namespace: quay-enterprise
          key: config.yaml
