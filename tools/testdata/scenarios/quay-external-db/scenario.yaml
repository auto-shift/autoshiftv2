description: >-
  Red Hat Quay with quay-db-mode external: both databases run outside the cluster and the
  administrator supplies DB_URI and clair-config.yaml through configSecretRef. Guards the bundle
  carrying clair-config.yaml, which the Quay Operator requires with an unmanaged clairpostgres.
  Without it Clair is blocked while every enforcing policy reports Compliant.

policies:
  - stable/quay

# The CloudNativePG application Secrets stay in place, as on a cluster that ran managed mode
# before: external mode must ignore them, not move Quay back onto CloudNativePG.

expect:
  - policy: policy-quay-deploy
    kind: Secret
    namespace: quay-enterprise
    name: quay-registry-config-bundle
    fields:
      - path: stringData["config.yaml"]
        contains: 'DB_URI: postgresql://quay:testtest@external-quay-pg:5432/quay'
      - path: stringData["clair-config.yaml"]
        contains: host=external-clair-pg
      - path: stringData["clair-config.yaml"]
        notContains: clair-db-rw
      - path: stringData["extra_ca_cert_db-ca.pem"]
        contains: '-----BEGIN CERTIFICATE-----'
      - path: stringData["ssl.cert"]
        absent: true

  # Selectors must match exactly one entry, so these also fail on a duplicated component, which the
  # Quay Operator resolves by taking the last.
  - policy: policy-quay-deploy
    kind: QuayRegistry
    name: registry
    fields:
      - path: spec.components[kind=postgres].managed
        equals: false
      - path: spec.components[kind=clairpostgres].managed
        equals: false
      - path: spec.components[kind=clair].managed
        equals: true

  # zoneSpread: the Operator replaces its whole affinity with an override, so the generated one must
  # carry the zone term and repeat the hostname term, and must not drop the component's other
  # overrides. An explicit affinity (clair here) wins, and redis is never given one.
  - policy: policy-quay-deploy
    kind: QuayRegistry
    name: registry
    fields:
      - path: spec.components[kind=quay].overrides.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
        equals: topology.kubernetes.io/zone
      - path: spec.components[kind=quay].overrides.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[1].podAffinityTerm.topologyKey
        equals: kubernetes.io/hostname
      - path: spec.components[kind=quay].overrides.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchExpressions[0].values[0]
        equals: quay-app
      - path: spec.components[kind=quay].overrides.replicas
        equals: 3
      - path: spec.components[kind=mirror].overrides.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchExpressions[0].values[0]
        equals: quay-mirror
      - path: spec.components[kind=clair].overrides.affinity.podAntiAffinity
        absent: true
      - path: spec.components[kind=clair].overrides.affinity.nodeAffinity
        present: true
      - path: spec.components[kind=clair].overrides.volumeSize
        equals: 50Gi
      - path: spec.components[kind=redis].overrides.affinity
        absent: true

  # The input check asserts the Secret and passes, because it holds DB_URI and clair-config.yaml.
  - policy: policy-quay-external-db
    kind: Secret
    namespace: quay-enterprise
    name: quay-config-extra
    count: 1
