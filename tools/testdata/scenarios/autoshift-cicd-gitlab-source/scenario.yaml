description: >-
  AutoShift CI/CD with the source on the hub's GitLab. The example builds from GitHub, so this
  covers the gitlab provider: the repository and API URL derive from the GitLab host in
  tssc-gitlab-credentials and the group, rather than from config.

policies:
  - stable/autoshift-cicd

expect:
  - policy: policy-autoshift-cicd-source
    kind: Repository
    namespace: autoshift-ci
    name: autoshift
    fields:
      - path: spec.url
        equals: https://gitlab.example.com/autoshift/autoshift
      - path: spec.git_provider.type
        equals: gitlab
      - path: spec.git_provider.url
        equals: https://gitlab.example.com
      - path: spec.git_provider.secret.name
        equals: autoshift-pac-webhook
      - path: spec.settings.pipelinerun_provenance
        equals: source
