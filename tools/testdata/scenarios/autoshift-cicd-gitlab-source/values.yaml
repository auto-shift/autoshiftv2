# A per-cluster override, shaped exactly like autoshift/values/clusters/<cluster>.yaml and layered
# on autoshift/values/clustersets/_example.yaml.
#
# AutoShift CI/CD built from the GitLab on the hub: no repository URL, so the Repository points at
# the autoshift project bootstrap-gitlab creates, through the hub's GitLab API.
clusters:
  cicd-gitlab:
    labels:
      autoshift-cicd: 'true'
    config:
      autoshift-cicd:
        source:
          provider: gitlab
          repo: ''
