# Stubs for project-onboarding: the managed cluster's Network config, read for the cluster and
# service network CIDRs that autoshift-default-deny-egress excepts from its cluster-external
# allowance, and the CRD that gates the lookup. Tests drop this file to model a cluster whose CIDRs
# are unknown.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networks.config.openshift.io
spec:
  group: config.openshift.io
  names:
    kind: Network
    plural: networks
  scope: Cluster
---
apiVersion: config.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  networkType: OVNKubernetes
  serviceNetwork:
    - 172.30.0.0/16
