# The cluster Image config, read by policy-image-registries for its read-modify-write merge.
# additionalTrustedCA is present because disconnected-mirror also writes this CR; the stub proves
# the merge preserves it rather than replacing the spec.
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
spec:
  additionalTrustedCA:
    name: autoshift-registry-ca
