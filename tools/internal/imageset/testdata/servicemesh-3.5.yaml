# OpenShift Service Mesh 3 enabled through its own labels, pinned on the stable-3.5 channel.
hubClusterSets:
  mesh:
    labels:
      servicemesh3operator: 'true'
      servicemesh3operator-subscription-name: servicemeshoperator3
      servicemesh3operator-channel: stable-3.5
      servicemesh3operator-source: redhat-operators
      servicemesh3operator-source-namespace: openshift-marketplace
      servicemesh3operator-version: 'servicemeshoperator3.v3.5.0'
