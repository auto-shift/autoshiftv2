# A clusterset that pins both a quay-operator release and its rebuild in one channel. By
# semantic-version precedence the rebuild sorts before the release it rebuilds, so it is the
# lowest pin and minVersion must name it.
hubClusterSets:
  hub:
    config:
      quay:
        versions:
          - 'quay-operator.v3.18.2'
          - 'quay-operator.v3.18.2-202611031655'
    labels:
      quay: 'true'
      quay-subscription-name: quay-operator
      quay-channel: stable-3.18
      quay-source: redhat-operators
      quay-source-namespace: openshift-marketplace
