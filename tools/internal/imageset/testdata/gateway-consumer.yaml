# Connectivity Link needs the Gateway API, which the ingress operator provides with the istiod
# images of one OpenShift Service Mesh 3 CSV. Nothing here asks for servicemeshoperator3 itself.
hubClusterSets:
  hub:
    labels:
      connectivity-link: 'true'
      connectivity-link-subscription-name: rhcl-operator
      connectivity-link-channel: stable
      connectivity-link-source: redhat-operators
      connectivity-link-source-namespace: openshift-marketplace
