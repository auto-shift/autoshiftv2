# A clusterset that pins quay-operator through config (which wins over the quay-version label)
# and nfd through its version label.
hubClusterSets:
  hub:
    config:
      quay:
        versions:
          - 'quay-operator.v3.18.0'
          - 'quay-operator.v3.18.1'
        startingCSV: 'quay-operator.v3.18.0'
    labels:
      quay: 'true'
      quay-subscription-name: quay-operator
      quay-channel: stable-3.18
      quay-source: redhat-operators
      quay-source-namespace: openshift-marketplace
      quay-version: 'quay-operator.v3.18.2'
      nfd: 'true'
      nfd-subscription-name: nfd
      nfd-channel: stable
      nfd-source: redhat-operators
      nfd-source-namespace: openshift-marketplace
      nfd-version: 'nfd.4.22.0-202610010000'
