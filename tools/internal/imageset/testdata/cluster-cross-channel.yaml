# A second values file for the same package on a different channel, with a pin that
# channel does not carry: the pin must be validated on the channel of the file that
# requested it, not on every channel any file requests.
hubClusterSets:
  hub:
    labels:
      quay: 'true'
      quay-subscription-name: quay-operator
      quay-channel: stable-3.17
      quay-source: redhat-operators
      quay-source-namespace: openshift-marketplace
      quay-version: 'quay-operator.v3.18.0'
