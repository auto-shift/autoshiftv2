          # The sources are a name that does not resolve, so a pull through it succeeds only if
          # the mirror set redirects it. A registry.redhat.io -> registry.redhat.io entry would
          # pull fine with or without the IDMS and prove nothing. mirror is a path on host.
          mirrors:                             # IDMS, digest pulls
            - source: 'mirror-test.autoshift.invalid/ubi9'
              mirror: 'ubi9'
          tagMirrors:                          # ITMS, tag pulls
            - source: 'mirror-test.autoshift.invalid/ubi9'
              mirror: 'ubi9'
        catalogs:
          - source: redhat-operators
            imagePath: redhat/redhat-operator-index
            tag: v4.22
            publisher: Red Hat
          - source: certified-operators
            imagePath: redhat/certified-operator-index
            tag: v4.22
            publisher: Red Hat
        useIDMS: true
        disableDefaultCatalogs: true
