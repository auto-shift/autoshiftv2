# ==============================================================================
# Disconnected-flow test for a CONNECTED hub
# ==============================================================================
# Exercises the disconnected path (mirrored CatalogSources, default catalogs off,
# operator source switch, IDMS, ITMS, registry CA) without a mirror registry: the
# "mirror" is registry.redhat.io itself, which a connected hub can already pull from
# with its existing global pull secret.
#
# Layer it on the hub profile:
#   valueFiles:
#     - values/global.yaml
#     - values/clustersets/hub.yaml
#     - values/clusters/local-cluster-disconnected-test.yaml
#
# The catalog tag must match the hub's OpenShift minor version.
# ==============================================================================

clusters:
  local-cluster:
    labels:
      disconnected-mirror: 'true'            # places disconnected-mirror and switches every operator source
      mirror-catalog-suffix: 'mirror'        # redhat-operators -> redhat-operators-mirror
    config:
      disconnected:
        mirrorRegistry:
          host: 'registry.redhat.io'
          # Amazon Root CA 1, the public root that registry.redhat.io chains to. The hub already
          # trusts it; it is here because ca or caRef is required once mirrors are defined, and so
          # the registry CA policy renders and is exercised.
