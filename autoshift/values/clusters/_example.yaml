# ==============================================================================
# Per-Cluster Override Example - ALL Available Options
# ==============================================================================
# Copy this file and rename it after your cluster (e.g., my-cluster.yaml).
# Labels defined here override clusterset labels for the named cluster.
# Precedence: cluster > clusterset > helm defaults
#
# Usage in ArgoCD Application:
#   valueFiles:
#     - values/global.yaml
#     - values/clustersets/hub.yaml
#     - values/clustersets/managed.yaml
#     - values/clusters/my-cluster.yaml    # <-- this file
#
# Notes:
#   - Only include labels you want to CHANGE from the clusterset defaults
#   - Create one file per cluster for clarity
#   - The most common per-cluster overrides are NMState network configuration
#     and cluster sizing (infra/worker/storage nodes)
# ==============================================================================

clusters:
  my-cluster-name:    # <-- Must match the cluster name in ACM
    config:
      # =====================================================================
      # Cluster ownership / clusterset assignment (declarative, optional)
      # =====================================================================
      # Assigns this cluster to a ManagedClusterSet by stamping the
      # cluster.open-cluster-management.io/clusterset label (via the
      # cluster-set-assignment policy). Omit both to manage the clusterset
      # manually. The policy only affects clusters this deployment may own
      # (unowned, or already owned by it) — it hands off, never steals.
      clusterSet:        'managed'     # base clusterset name (omit to manage the clusterset manually)
      # versionTag:      '0.0.2'       # release that should own this cluster -> clusterset
      #                                # 'managed-0-0-2'. OCI version, or branch/tag in git
      #                                # mode. Bump this (in a values file BOTH releases
      #                                # read) to roll the cluster over. Omit to use this
      #                                # deployment's own suffix.
    labels:
      # =======================================================================
      # Any label from hub or managed clusterset can be overridden here.
      # Only include labels you want to CHANGE from the clusterset defaults.
      # =======================================================================

      # =======================================================================
      # Kubernetes NMState Operator - Per-Cluster Network Configuration
      # =======================================================================
      # NMState is the most common per-cluster override. Each cluster typically
      # has unique network configuration (bonds, VLANs, static IPs, routes).
      nmstate: 'true'
      #
      #
      # =======================================================================
      # Infrastructure Node Sizing
      # =======================================================================
      infra-nodes: '6'
      infra-nodes-numcpu: '8'
      infra-nodes-memory-mib: '24576'
      infra-nodes-numcores-per-socket: '4'
      infra-nodes-provider: aws
      infra-nodes-instance-type: 'm5.2xlarge'
      infra-nodes-zone-1: 'us-east-2a'

      # =======================================================================
      # Worker Node Sizing
      # =======================================================================
      worker-nodes: '3'
      worker-nodes-numcpu: '8'
      worker-nodes-memory-mib: '32768'
      worker-nodes-numcores-per-socket: '4'
      worker-nodes-zone-1: 'us-east-2a'

      # =======================================================================
      # Storage Node Sizing
      # =======================================================================
      storage-nodes: '3'
      storage-nodes-numcpu: '16'
      storage-nodes-memory-mib: '65536'
      storage-nodes-numcores-per-socket: '8'
      storage-nodes-provider: aws
      storage-nodes-instance-type: 'm6in.8xlarge'

      # =======================================================================
      # Master Nodes (SNO / Compact clusters)
      # =======================================================================
      master-nodes: 'true'
      master-max-pods: '500'

      # =======================================================================
      # Core Configuration
      # =======================================================================
      openshift-version: '4.22.8'

      # =======================================================================
      # Operator Toggles
      # =======================================================================
      gitops: 'true'
      tempo: 'true'
      kiali: 'true'
      servicemesh3operator: 'true'
      metallb: 'true'
      aap: 'true'
      lvm: 'true'
      local-storage: 'true'
      odf: 'true'
      imageregistry: 'true'
      acs: 'true'
      dev-spaces: 'true'
      dev-hub: 'true'
      pipelines: 'true'
      tas: 'true'
      quay: 'true'
      gitops-dev: 'true'
      loki: 'true'
      logging: 'true'
      coo: 'true'
      compliance: 'true'
      virt: 'true'
      mtv: 'true'
      node-feature-discovery: 'true'
      sriov: 'true'

      # =======================================================================
      # Version Pinning (overrides clusterset channel-based updates)
      # =======================================================================
      gitops-version: 'openshift-gitops-operator.v1.21.3'
      tempo-version: 'tempo-operator.v0.21.0-3'
      kiali-version: 'kiali-operator.v2.27.2'
      servicemesh3operator-version: 'servicemeshoperator3.v3.4.1'
      metallb-version: 'metallb-operator.v4.22.0-202608122145'
      aap-version: 'aap-operator.v2.7.0-0.1785438985'
      lvm-version: 'lvms-operator.v4.22.0'
      local-storage-version: 'local-storage-operator.v4.22.0-202608122145'
      odf-version: 'odf-operator.v4.22.2-rhodf'
      nmstate-version: 'kubernetes-nmstate-operator.4.22.0-202608130510'
      acs-version: 'rhacs-operator.v4.11.2'
      dev-spaces-version: 'devspacesoperator.v3.29.1'
      dev-hub-version: 'rhdh-operator.v1.10.3'
      pipelines-version: 'openshift-pipelines-operator-rh.v1.23.1'
      tas-version: 'rhtas-operator.v1.4.3'
      quay-version: 'quay-operator.v3.18.0'
      loki-version: 'loki-operator.v6.6.0'
      logging-version: 'cluster-logging.v6.6.0'
      coo-version: 'cluster-observability-operator.v1.5.1'
      compliance-version: 'compliance-operator.v1.9.2'
      virt-version: 'kubevirt-hyperconverged-operator.v4.22.6'
      mtv-version: 'mtv-operator.v2.12.6'
      node-feature-discovery-version: 'nfd.4.22.0-202608122145'

      # =======================================================================
      # Channel Overrides
      # =======================================================================
      gitops-channel: gitops-1.21
      acs-channel: stable
      odf-channel: stable-4.22
      pipelines-channel: pipelines-1.23
      acm-channel: release-2.17

      # =======================================================================
      # ACM Config (hub clusters only)
      # =======================================================================
      acm-availability-config: 'High'
      acm-observability: 'true'

      # =======================================================================
      # ODF Sizing
      # =======================================================================
      odf-multi-cloud-gateway: standard
      odf-ocs-storage-class-name: 'gp3-csi'
      odf-ocs-storage-size: '2Ti'
      odf-ocs-storage-count: '2'
      odf-ocs-storage-replicas: '3'
      odf-ocs-flexible-scaling: 'true'
      odf-resource-profile: balanced
      odf-default-storageclass: 'ocs-storagecluster-ceph-rbd'
      odf-csi-all-nodes: 'false'            # 'true' to run CSI plugins on all nodes (masters, infra, storage)

      # =======================================================================
      # Compliance Config
      # =======================================================================
      compliance-auto-remediate: 'true'
      compliance-storage-class: 'gp3-csi'   # StorageClass for compliance scan results

      # =======================================================================
      # Loki Sizing
      # =======================================================================
      loki-size: 1x.extra-small
      loki-storageclass: gp3-csi

      # =======================================================================
      # GitLab Per-Cluster Overrides
      # =======================================================================
      # gitlab-db-mode: 'external'              # Override to BYO database for this cluster
      # gitlab-db-host: 'my-rds.example.com'    # Custom DB host (external mode)
      # gitlab-redis-mode: 'external'
      # gitlab-redis-host: 'my-elasticache.example.com'
      # gitlab-object-storage-mode: 'external'

      # =======================================================================
      # Disconnected Mirror
      # =======================================================================
      disconnected-mirror: 'true'
      mirror-catalog-suffix: 'mirror'

      # =======================================================================
      # Node Maintenance
      # =======================================================================
      node-maintenance: 'false'
      node-maintenance-subscription-name: node-maintenance-operator
      node-maintenance-channel: stable
      node-maintenance-source: redhat-operators
      node-maintenance-source-namespace: openshift-marketplace
      node-maintenance-version: 'node-maintenance-operator.v5.7.1'

      # =======================================================================
      # External Secrets Operator
      # =======================================================================
      external-secrets-operator: 'false'
      external-secrets-operator-subscription-name: openshift-external-secrets-operator
      external-secrets-operator-channel: stable-v1
      external-secrets-operator-source: redhat-operators
      external-secrets-operator-source-namespace: openshift-marketplace
      # Opentelemetry
      # =======================================================================
      opentelemetry: 'false'
      opentelemetry-subscription-name: opentelemetry-product
      opentelemetry-channel: stable
      opentelemetry-source: redhat-operators
      opentelemetry-source-namespace: openshift-marketplace
