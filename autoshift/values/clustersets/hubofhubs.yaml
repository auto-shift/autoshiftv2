# Hub of Hubs Configuration
# This is the self-managed hub-of-hubs cluster that manages other hub clusters

# Hub Cluster Sets with Feature Flags. Blank will remove
hubClusterSets:
  hubofhubs:
    config:
      eso:
        hubBootstrap:
          # Prefix for the bootstrap store and every secret derived from it.
          # Uncommenting renames the ClusterSecretStore and the per-cluster
          # client-cert Secrets; the chart default is hub-bootstrap.
          # storePrefix: eso-client
          deriveHubUrl: true
          clientIdentity:
            baseDomain: autoshift.io
          externalCertAuthority:
            autoshiftProvisioned: false
        # ===================================================================
        # ExternalSecretsConfig passthrough.
        # The operator applies a deny-all egress NetworkPolicy to the operand: only
        # :6443 and DNS are permitted. The Vault store below is reached over its
        # passthrough Route on :443, which the chart default already allows, so no
        # override is needed here.
        # It WOULD be needed to reach Vault on its native :8200 (the in-cluster
        # Service, say). In that case restate the :443 rule too: an overriding
        # networkPolicies list REPLACES the chart default wholesale, and dropping
        # :443 costs the core controller its HTTPS egress. Symptom of a missing
        # rule is InvalidProviderConfig + context deadline exceeded.
        # externalSecretsConfig:
        #   controllerConfig:
        #     networkPolicies:
        #       - name: allow-https-egress
        #         componentName: ExternalSecretsCoreController
        #         egress:
        #           - ports:
        #               - protocol: TCP
        #                 port: 443
        #       - name: allow-vault-8200-egress
        #         componentName: ExternalSecretsCoreController
        #         egress:
        #           - ports:
        #               - protocol: TCP
        #                 port: 8200
        # ===================================================================
        # Vault store on this hub. Vault runs here (labels below) and is the source of
        # truth; spoke hubs do NOT talk to Vault directly — they read the Secrets this
        # hub materialises, through their hub-bootstrap ClusterSecretStore.
        #
        # PREREQUISITE, created by hand on the cluster (never in git — it is a
        # credential): a Secret holding a Vault token scoped to a read-only policy.
        #   oc create secret generic vault-eso-token -n <policy-namespace> \
        #     --from-literal=token=<vault token with a read-only policy>
        # Generate it with: vault token create -policy=eso-reader -period=720h
        #
        # TLS: caProvider reads ca.crt from the cert-manager-issued vault-tls Secret in
        # the vault namespace, so no CA material is carried in values either.
        # ===================================================================
        secretStores:
          - clusterSecretStore:
              name: hub-vault
              spec:
                provider:
                  vault:
                    # Vault's passthrough Route, NOT the in-cluster Service: this is the
                    # path a consumer outside the cluster takes. Replace the host with this
                    # cluster's Route (oc get route -n vault vault).
                    # It MUST also be set in vault-external-hostname below, which adds it to
                    # the Vault serving cert SANs. Passthrough means the client validates
                    # Vault's own cert, so a host missing from the SANs fails with
                    # "x509: certificate is valid for ..., not <route host>".
                    server: 'https://vault-vault.apps.example.com:443'
                    path: 'secret'
                    version: 'v2'
                    caProvider:
                      type: Secret
                      name: vault-tls
                      namespace: vault
                      key: ca.crt
                    auth:
                      tokenSecretRef:
                        name: vault-eso-token
                        namespace: policies-autoshift
                        key: token

    labels:
      ### Vault (source of truth for this deployment's secrets)
      # Requires cert-manager + a ClusterIssuer (autoshift-ca, below) for the serving cert.
      # NOTE: the upstream chart pulls docker.io/hashicorp/* — a cluster running the
      # manual-remediations policy restricts registries and must allow docker.io first,
      # or the pods sit in ImagePullBackOff and Vault's PDB then blocks node drains.
      vault: 'true'
      vault-seal-type: 'shamir'          # manual unseal ceremony; see policies/community/vault
      vault-tls-issuer: 'autoshift-ca'
      # Adds the Route host to the Vault serving cert SANs; must match the store server above.
      # NOTE: Vault does not hot-reload TLS. SIGHUP does not pick up a reissued cert, so the
      # pods must be restarted after this changes — and with the shamir seal, unsealed again.
      vault-external-hostname: 'vault-vault.apps.example.com'
      vault-storage-size: '5Gi'
      cert-manager: 'true'
      cert-manager-subscription-name: openshift-cert-manager-operator
      cert-manager-channel: stable-v1
      cert-manager-version: 'cert-manager-operator.v1.19.0'
      cert-manager-source: redhat-operators
      cert-manager-source-namespace: openshift-marketplace
      # OpenShift version for cluster deployment and image mirroring
      openshift-version: '4.22.8'
      self-managed: 'true'
      ### OpenShift Gitops
      gitops: 'true' # is expected to be installed on all hub clusters
      gitops-subscription-name: openshift-gitops-operator
      gitops-disable-default-argocd: 'true'
      gitops-channel: gitops-1.21
      gitops-source: redhat-operators
      gitops-source-namespace: openshift-marketplace
      # gitops-namespace: 'openshift-gitops'  # Override ArgoCD namespace per-cluster
      ### Advanced Cluster Management
      acm-subscription-name: advanced-cluster-management
      acm-channel: release-2.17
      acm-source: redhat-operators
      acm-source-namespace: openshift-marketplace
      acm-availability-config: 'High'
      acm-observability: 'true'
      acm-enable-provisioning: 'true'
      acm-search-storage: 'true'
      # acm-search-storage-class: 'ocs-storagecluster-ceph-rbd'
      # acm-search-storage-size: '100Gi'
      ### Cluster Install (Hive — provisions hub1 and other spoke hubs)
      cluster-install: 'true'
      ### infra-nodes
      infra-nodes: ''
      infra-nodes-numcpu: ''
      infra-nodes-memory-mib: ''
      infra-nodes-numcores-per-socket: ''
      infra-nodes-zones: ''
      ### worker-nodes
      worker-nodes: ''
      worker-nodes-numcpu: ''
      worker-nodes-memory-mib: ''
      worker-nodes-numcores-per-socket: ''
      worker-nodes-zones: ''
      ### storage-nodes
      storage-nodes: ''
      storage-nodes-numcpu: ''
      storage-nodes-memory-mib: ''
      storage-nodes-numcores-per-socket: ''
      storage-nodes-zones: ''
      ### OpenShift Data Foundation
      odf: 'true'
      odf-subscription-name: odf-operator
      odf-multi-cloud-gateway: standalone
      odf-noobaa-pvpool: ''
      odf-noobaa-store-size: ''
      odf-noobaa-store-num-volumes: ''
      odf-ocs-storage-class-name: gp3-csi
      odf-ocs-storage-size: ''
      odf-ocs-storage-count: ''
      odf-ocs-storage-replicas: ''
      odf-resource-profile: balanced
      odf-channel: stable-4.22
      odf-source: redhat-operators
      odf-source-namespace: openshift-marketplace
      ### OpenShift Internal Registry
      imageregistry: 'false'
      imageregistry-management-state: Managed
      imageregistry-replicas: '3'
      imageregistry-storage-type: s3 # pvc
      imageregistry-s3-region: us-east-2
      imageregistry-pvc-access-mode: ReadWriteMany
      imageregistry-pvc-size: 100Gi
      imageregistry-pvc-storage-class: ocs-storagecluster-ceph-rbd
      imageregistry-pvc-volume-mode: Block
      imageregistry-rollout-strategy: RollingUpdate
      ### Kubernetes NMState Operator
      nmstate: 'false'
      nmstate-subscription-name: kubernetes-nmstate-operator
      # Example nmstate-nncp labels. Label must start with nmstate-nncp
      # also the value must be the name of the config file you want to apply
      # nmstate-nncp-example-bond1: example-bond
      # nmstate-nncp-example-vlan10: example-vlan10
      ### Advanced Cluster Security
      acs: 'false'
      acs-subscription-name: rhacs-operator
      acs-channel: stable
      acs-source: redhat-operators
      acs-source-namespace: openshift-marketplace
      ### Developer Spaces
      dev-spaces: 'false'
      dev-spaces-subscription-name: devspaces
      dev-spaces-channel: stable
      dev-spaces-source: redhat-operators
      dev-spaces-source-namespace: openshift-marketplace
      ### Developer Hub
      dev-hub: 'false'
      dev-hub-subscription-name: rhdh
      dev-hub-channel: fast-1.10
      dev-hub-source: redhat-operators
      dev-hub-source-namespace: openshift-marketplace
      ### OpenShift Pipelines
      pipelines: 'true'
      pipelines-subscription-name: openshift-pipelines-operator-rh
      pipelines-channel: pipelines-1.23
      pipelines-source: redhat-operators
      pipelines-source-namespace: openshift-marketplace
      ### Trusted Artifact Signer
      tas: 'false'
      tas-subscription-name: rhtas-operator
      tas-channel:  stable
      tas-source: redhat-operators
      tas-source-namespace: openshift-marketplace
      ### Quay
      quay: 'false'
      quay-subscription-name: quay-operator
      quay-channel: stable-3.18
      quay-source: redhat-operators
      quay-source-namespace: openshift-marketplace
      ### Developer OpenShift Gitops
      gitops-dev: 'false'
      ### Loki
      loki: 'true'
      loki-subscription-name: loki-operator
      loki-channel: stable-6.6
      loki-source: redhat-operators
      loki-source-namespace: openshift-marketplace
      loki-size: 1x.extra-small
      loki-storageclass: gp3-csi
      loki-lokistack-name: logging-lokistack
      ### OpenShift Logging
      logging: 'true'
      logging-subscription-name: cluster-logging
      logging-channel: stable-6.6
      logging-source: redhat-operators
      logging-source-namespace: openshift-marketplace
      ### Cluster Observability Operator
      coo: 'true'
      global-observability: 'true'
      autoshift-console: 'true'
      coo-subscription-name: cluster-observability-operator
      coo-channel: stable
      coo-source: redhat-operators
      coo-source-namespace: openshift-marketplace
      ### Compliance Operator Stig Apply
      compliance: 'true'
      compliance-auto-remediate: 'true'
      compliance-subscription-name: compliance-operator
      compliance-source: redhat-operators
      compliance-source-namespace: openshift-marketplace
      compliance-channel: stable
      ### node-maintenance
      node-maintenance: 'true'
      node-maintenance-subscription-name: node-maintenance-operator
      node-maintenance-channel: stable
      node-maintenance-source: redhat-operators
      node-maintenance-source-namespace: openshift-marketplace
      node-maintenance-version: 'node-maintenance-operator.v5.7.1'
      ### external-secrets-operator
      external-secrets-operator: 'true'
      external-secrets-operator-subscription-name: openshift-external-secrets-operator
      external-secrets-operator-channel: stable-v1
      external-secrets-operator-source: redhat-operators
      external-secrets-operator-source-namespace: openshift-marketplace
