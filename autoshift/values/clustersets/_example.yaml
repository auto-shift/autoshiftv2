      #   versions:
      #     - 'kubevirt-hyperconverged.vX.Y.Z'
      #   startingCSV: 'kubevirt-hyperconverged.vX.Y.Z'
      # =======================================================================
      # Local Storage (config-driven)
      # Named volume sets under localVolumeSets.<id>; each field has a sensible
      # default so you only need to set what you want to override:
      #   storageClassName  → nvme-storageclass
      #   volumeMode        → Block
      #   deviceInclusionSpec → {deviceTypes: [disk], minSize: 200G}
      #   nodeSelector      → cluster.ocs.openshift.io/openshift-storage: Exists
      #   tolerations       → node.ocs.openshift.io/storage: NoSchedule
      # When absent, a single default nvme-localvolumeset is created.
      # =======================================================================
      # localStorage:
      #   localVolumeDiscovery:
      #     nodeSelector:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: cluster.ocs.openshift.io/openshift-storage
      #               operator: Exists
      #   localVolumeSets:
      #     nvme:
      #       storageClassName: local-nvme
      #       volumeMode: Block
      #       deviceInclusionSpec:
      #         deviceTypes: [disk]
      #         deviceMechanicalProperties: [NonRotational]
      # =======================================================================
      # Workload Partitioning (CPU isolation via PerformanceProfile)
      # =======================================================================
      workloadPartitioning:
        reservedCpus: '0-3'
        isolatedCpus: '4-31'
        nodeSelector:
          node-role.kubernetes.io/worker: ''
        numaTopology: 'restricted'
        hugepages:
          defaultSize: '1G'
          pages:
            - size: '1G'
              count: 4
      # =======================================================================
      # NMState Networking (clusterset defaults for network interfaces)
      # Example: bond with two ports, VLAN on top, static route, DNS
      # Per-cluster overrides go in clusters/<name>.yaml config section
      # =======================================================================
      networking:
        interfaces:
          eno1:
            type: ethernet
            name: eno1
            state: up
            ipv4: disabled
            ipv6: disabled
          eno2:
            type: ethernet
            name: eno2
            state: up
            ipv4: disabled
            ipv6: disabled
          mgmt:
            type: bond
            name: bond0
            state: up
            mode: 802.3ad
            mtu: 9000
            miimon: 100
            ports:
              - eno1
              - eno2
            ipv4: dhcp
            ipv6: disabled
        routes:
          datacenter:
            destination: '10.0.0.0/8'
            gateway: '192.168.1.1'
            interface: bond0
            metric: '100'
        ovsBridges:
          br-ex:
            name: br-ex
            ports:
              - bond0
        ovnMappings:
          physnet1:
            localnet: physnet1
            bridge: br-ex
        dns:
          servers:
            - '10.0.0.1'
            - '10.0.0.2'
          search:
            - 'example.com'
      trident:
        # Pin to specific CSV(s). Omit to track the channel.
        # versions:
        #   - 'trident-operator.vX.Y.Z'
        # startingCSV: 'trident-operator.vX.Y.Z'
        storage:
          - backendName: "trident-backend-name"
            secretName: "openshift-secret"
            secretNamespace: "secrets-namespace"
            svmLif: "svm123.example.com"
            storageClassName: "sc-example"
            defaultStorageClass: "true"
            useREST: "true"
            authMethod: "password"
            sanType: "nvme"
      # =======================================================================
      # Developer OpenShift GitOps (team ArgoCD instances)
      # Per-team ArgoCD spec (RBAC + resource sizing). Which teams deploy, and
      # in which mode, is driven by the cluster labels gitops-dev /
      # gitops-dev-team-<team>: 'hub' | 'standalone' (see labels below). The keys
      # under teams.<name> must match the team name in the gitops-dev-team-<name>
      # label. All fields are optional; omitted values fall back to defaults.
      # =======================================================================
      gitops:
        # Pin to specific CSV(s). Omit to track the channel.
        # versions:
        #   - 'openshift-gitops-operator.vX.Y.Z'
        # startingCSV: 'openshift-gitops-operator.vX.Y.Z'
        # Does THIS hub render policies via the policy-generator CMP? Overrides the fleet-wide
        # policyGenerator in global.yaml for this hub's Argo CD. GIT/source hubs MUST set true (it
        # installs the CMP sidecar in the infra ArgoCD repo-server, without which PolicyGenerator
        # dirs never render); OCI-only hubs should set false, though it is only a recommendation —
        # true merely configures a sidecar nothing calls. Read only from the self-managed hub
        # clusterset (self-managed: 'true').
        # policyGenerator: true
        #
        # Gitops namespace for the WHOLE deployment (default openshift-gitops). Overrides gitopsNamespace.
        # namespace: openshift-gitops
        #
        # Whether the operator's default ArgoCD instance exists (default false — AutoShift runs its own
        # infra-gitops instance). Drives gitops-disable-default-argocd (disable = not defaultInstance).
        # defaultInstance: false
        #
        # Argo CD agent (the Red Hat Advanced Cluster Management GitOps add-on). DATA only; the
        # enable flags are the gitops-agent and gitops-agent-ca labels below. Technology Preview in
        # Red Hat Advanced Cluster Management 2.17 with OpenShift GitOps 1.21, so it is off unless
        # both the label and this block are set.
        # Infra GitOps. Two mutually exclusive ways to run an infra agent live under here: agent,
        # which AutoShift builds itself and is the default, and addon, the Red Hat Advanced
        # Cluster Management GitOps add-on. A cluster runs one or the other, never both.
        infra:
          # THE ADD-ON. Opt-in: it brings its own GitOps installer and allows a single agent for
          # each cluster. Turn it on for a cluster with no cert-manager, where the self-signed
          # authority it generates is the point.
          addon:
            # Namespace for the DEDICATED principal Argo CD instance. Deliberately not the main Argo
            # CD namespace: the Red Hat Advanced Cluster Management side of this is Technology
            # Preview, and in autonomous mode the principal mirrors every spoke Application into a hub
            # namespace named after its cluster, so the hosting instance grows a namespace and a cache
            # per managed cluster. The agent certificate authority and the certificates derived from
            # it all live here.
            namespace: 'openshift-gitops-agent'
            logLevel: 'info'
            # Whether the add-on ships the agent trust bundle to each spoke itself. Turn it off only
            # where the organization distributes that trust by its own means.
            propagateHubCA: true
            # Where agents dial the principal. Empty lets the add-on derive it from the principal
            # Route. Set them when the principal is reached through something else, such as an
            # internal load balancer or a private ingress controller.
            serverAddress: ''
            serverPort: ''
            # Agent mode. 'autonomous' (the default here) leaves the spoke owning its Application
            # resources and mirrors them to the hub for visibility and for sync or terminate.
            # 'managed' makes the hub the source of truth, which puts the agent in competition with
            # the policies AutoShift already uses to deliver configuration, so it is not the default.
            mode: 'autonomous'
            # How the principal maps an Application to an agent. false maps by NAMESPACE, which is the
            # hub namespace named after the cluster; true maps by the Application's destination.
            #
            # Keep it false unless you have a reason. The setting is not symmetric, and it only shows
            # in MANAGED mode: with true the principal leaves an incoming status update's namespace
            # alone, so the update names the SPOKE's namespace and is looked up under that name on the
            # hub, where nothing of that name exists. Applications reach the spoke and the hub then
            # shows sync and health empty forever. Autonomous mode is unaffected either way, because
            # the agent mirrors into the hub namespace that already matches its agent name.
            destinationBasedMapping: false
            # The signing certificate authority the add-on derives the ENTIRE agent public key
            # infrastructure from: principal serving certificate, resource proxy certificate, the
            # trust bundle pushed to every spoke, and each agent client certificate.
            #
            # Leave the gitops-agent-ca label off and the add-on generates a self-signed authority per
            # hub. That is turnkey, and it is also a fleet of unrelated roots chaining to nothing the
            # organization already trusts. Turn the label on and cert-manager issues it instead.
            ca:
              # The signer. Defaults to the built-in autoshift-ca, which makes the agent authority an
              # intermediate under the same root that signs the API server, Ingress and component
              # certificates. Point it at your own issuer to chain the agent mesh to an existing
              # public key infrastructure: a `ca` issuer over your root, Vault, Venafi, step-ca.
              # The signer must be able to issue a CA certificate, so public ACME cannot serve here.
              issuer:
                name: 'autoshift-ca'
                kind: 'ClusterIssuer'
                group: 'cert-manager.io'
              # renewBefore MUST stay above duration / 5. The add-on overwrites this secret with a
              # self-signed authority of its own once the certificate passes 80% of its lifetime, and
              # the customer chain is then gone with no error raised anywhere. These defaults renew at
              # 25%, comfortably ahead of that. Change one and you must change the other.
              duration: '8760h0m0s'
              renewBefore: '2160h0m0s'
              # Defaults to RSA.
              privateKey:
                algorithm: 'RSA'
                size: 4096
        #
        # Infra (main) ArgoCD instance config: the same knobs as teams.<team> below, plus the
        # infra-only fields server.autoscale, controller.statusProcessors,
        # controller.operationProcessors, repo.replicas and repo.cluster_ca_bundle. The
        # openshift-gitops policy reads these from this cluster's rendered-config at enforcement
        # time, so one policy serves per-cluster values.
        #
        # Every field is optional. Omit one and it falls back to the chart default in
        # policies/stable/openshift-gitops/values.yaml, the same file the bootstrap chart reads, so
        # bootstrap and day 2 agree. The block below is those defaults, so uncommenting it as is
        # changes nothing.
        #
        # rbac_policies is the COMPLETE Argo CD RBAC policy and replaces the chart default rather
        # than appending to it, so carry the cluster-admin lines over unless you mean to drop them.
        # A `g` line takes a user or a group, but with OpenShift login the user identity is an
        # opaque Dex sub rather than a username, so name OpenShift Groups here.
        # repo.replicas defaults to 1; raise it for availability or a much larger policy set.
        # Controller memory is 8Gi limit / 1Gi request. The limit covers a full hard-refresh storm
        # rather than steady state: a hub with 58 Applications and 299 Policies sat comfortably for
        # an hour and was OOMKilled the moment every Application synced at once.
        # controller.statusProcessors is the main lever on how fast the fleet converges, and also on
        # peak memory, since each in-flight comparison holds an Application's rendered and live state
        # at once. It sits at the Argo CD default of 20; raise it and raise controller.limits.memory
        # with it. The controller also builds a FULL CLUSTER CACHE per registered cluster, which is
        # the larger half of its footprint and is charged before any Application is compared.
        # controller.goMemLimitPercent sets a soft ceiling for the Go runtime, which does not read
        # the container limit and would otherwise be killed before it collected. It is DERIVED from
        # controller.limits.memory, so the two cannot drift. Argo CD recommends 80-90%. Only Gi and
        # Mi limits are parsed; for any other form set controller.goMemLimit explicitly, which
        # overrides the derivation. When neither yields a value the variable is omitted, not guessed.
        # controller.respectRBAC stops the controller watching kinds it cannot list.
        # resourceExclusions REPLACES the built-in list of kinds kept out of the cluster cache, so
        # carry the defaults over unless you mean to drop them. A kind listed there cannot be
        # deployed by this instance at all, so keep it to generated, never-authored resources.
        # The gitops-cluster-ca-bundle label overrides repo.cluster_ca_bundle. policyGenerator sizes the CMP sidecar that performs the render,
        # so raise it when manifest generation times out, and its tarExclusions trim the repository
        # tarball streamed to that sidecar. tarExclusions is repo-server WIDE, so keep it to .git;
        # per-Application scoping comes from useManifestGeneratePaths. All apply only where the
        # plugin is on.
        #
        # Full table: docs/values-reference.md, "OpenShift GitOps".
        # infra:
        #   # Where the infra instance and its agent principal live. Both default to today's
        #   # values, so the keys exist for the agent modes rather than for ordinary use.
        #   namespace: 'openshift-gitops'
        #   agentNamespace: 'openshift-gitops-agent'
        #   # Infra's agent, selected per cluster by the gitops-infra label. The project values are
        #   # what make infra different from a team: infra configures whole clusters, so it needs
        #   # every destination and cluster-scoped resources, where a team gets neither.
        #   agent:
        #     enabled: false
        #     caIssuer: 'autoshift-ca'
        #     destinationNamespaces:
        #       - '*'
        #     clusterResources:
        #       - group: '*'
        #         kind: '*'
        #   rbac_policies:
        #     - 'g, system:cluster-admins, role:admin'
        #     - 'g, cluster-admins, role:admin'
        #     - 'g, my-admins, role:admin'
        #   disableAdmin: false
        #   server:
        #     limits:
        #       cpu: '500m'
        #       memory: '256Mi'
        #     requests:
        #       cpu: '125m'
        #       memory: '128Mi'
        #     autoscale:
        #       enabled: true
        #       maxReplicas: 5
        #       targetCPUUtilizationPercentage: 50
        #   repo:
        #     replicas: 1
        #     cluster_ca_bundle: false
        #     limits:
        #       cpu: '2000m'
        #       memory: '2048Mi'
        #     requests:
        #       cpu: '500m'
        #       memory: '512Mi'
        #   resourceExclusions: |
        #     - apiGroups:
        #         - ''
        #       kinds:
        #         - Event
        #   controller:
        #     statusProcessors: 20
        #     operationProcessors: 10
        #     goMemLimitPercent: 85
        #     goMemLimit: ''
        #     respectRBAC: 'normal'
        #     limits:
        #       cpu: '2000m'
        #       memory: '8Gi'
        #     requests:
        #       cpu: '250m'
        #       memory: '1Gi'
        #   ha:
        #     enabled: false
        #     limits:
        #       cpu: '500m'
        #       memory: '256Mi'
        #     requests:
        #       cpu: '250m'
        #       memory: '128Mi'
        #   redis:
        #     limits:
        #       cpu: '500m'
        #       memory: '256Mi'
        #     requests:
        #       cpu: '250m'
        #       memory: '128Mi'
        #   dex:
        #     limits:
        #       cpu: '500m'
        #       memory: '256Mi'
        #     requests:
        #       cpu: '250m'
        #       memory: '128Mi'
        #   applicationSet:
        #     limits:
        #       cpu: '2'
        #       memory: '1Gi'
        #     requests:
        #       cpu: '250m'
        #       memory: '512Mi'
        #   policyGenerator:
        #     limits:
        #       cpu: '2000m'
        #       memory: '2048Mi'
        #     requests:
        #       cpu: '500m'
        #       memory: '512Mi'
        #     tarExclusions:
        #       - '.git/*'
        #     useManifestGeneratePaths: true
        teams:
          dev:
            # Argo CD agent for THIS team. Enabling it stands up a per-team agent principal on the
            # hub, in its own namespace openshift-gitops-<team>-agent, with a per-team certificate
            # authority intermediate under the shared autoshift-ca root. Clusters opt in per team
            # with the gitops-dev-team-<team> label set to 'agent', and because that label is
            # per-team a single cluster can run an agent for several teams at once, which the Red
            # Hat Advanced Cluster Management add-on cannot do.
            agent:
              enabled: false
              # The team-wide DEFAULT mode, used by any cluster whose label is a bare 'agent'.
              # A cluster overrides it per team with gitops-dev-team-<team>: 'agent-managed' or
              # 'agent-autonomous', because mode is genuinely a per-cluster choice and one team may
              # run some clusters managed and others autonomous.
              #   autonomous  the spoke owns its Application resources and they are mirrored to
              #               this team's principal on the hub for visibility and sync or terminate
              #   managed     the hub becomes the source of truth and pushes Application specs down
              # Only autonomous has been exercised.
              mode: 'autonomous'
              # Namespaces this team may deploy INTO, as the AppProject destinations. Defaults to
              # '<team>-*', so a team is confined to namespaces carrying its own name. Widen it
              # deliberately; the project grants no cluster-scoped resources either way.
              # destinationNamespaces:
              #   - 'dev-*'
              #   - 'shared-tooling'
              # Port of the principal's resource proxy service, used in the agent-to-cluster
              # mapping secret. The hub reaches workload clusters through that proxy.
              # resourceProxyPort: '9090'
              # Port the agent dials the principal on. Defaults to the Route's 443.
              # principalServerPort: '443'
              # Lifetime of every leaf this team issues: principal, resource proxy, agent client
              # and hub proxy client. renewBefore must stay comfortably inside duration.
              # leafDuration: '720h0m0s'
              # leafRenewBefore: '240h0m0s'
              # The agent certificate authority for this team. Same keys as config.gitops.agent.ca,
              # so a team can set its own lifetime or key algorithm independently of the fleet.
              # ca:
              #   duration: '8760h0m0s'
              #   renewBefore: '2160h0m0s'      # MUST stay above duration / 5
              #   privateKey:
              #     algorithm: 'RSA'
              #     size: 4096
              # Identity pattern the principal accepts. Any common name by default; isolation
              # between teams rests on each having its own certificate authority, so tighten this
              # only when you want the pattern to constrain identity too.
              # auth: 'mtls:CN=([^,]+-dev)'
              # Namespaces the PRINCIPAL may manage on the hub. Wildcard by default because it
              # mirrors into a namespace per connected cluster.
              # principalNamespaces:
              #   - '*'
              # Namespaces the AGENT may manage on its own cluster.
              # agentNamespaces:
              #   - '*'
              # Whether the principal may CREATE per-cluster namespaces. Turning this off also lets
              # the create verb be dropped from its ClusterRole.
              # enableNamespaceCreate: true
              # As on the infra agent: false maps by namespace and is the default, true maps by
              # destination and loses status back-propagation in managed mode.
              # destinationBasedMapping: false
              # Lifetime of the JWT signing key this team's principal uses. The key itself is
              # stable across renewals (rotationPolicy Never reuses it), so this governs the
              # certificate wrapped around it rather than the key.
              # jwtDuration IS the cryptoperiod of the signing key when rotation is on: the key
              # changes at renewal. Rotating invalidates outstanding agent tokens and the agents
              # re-authenticate, which is cheap and has been observed working unattended.
              # jwtDuration: '8760h0m0s'
              # jwtRenewBefore: '2160h0m0s'
              # Always (default) rotates the signing key at each renewal, matching Red Hat's advice
              # to rotate periodically. Never pins the key forever, which avoids re-authentication
              # but leaves a signing key with no cryptoperiod at all.
              # jwtRotationPolicy: 'Always'
              # Repositories the team may deploy FROM. Defaults to any.
              # sourceRepos:
              #   - 'https://github.com/acme/dev-apps.git'
              # Namespaces the team's Application resources live IN. Follows the mode by default
              # and rarely needs setting: autonomous uses the team's own GitOps namespace on the
              # spoke, managed uses the per-cluster namespaces on the hub, because that is where
              # the Applications are authored in each case. Setting this wrongly does not error;
              # the principal skips propagating the project and the applications never appear.
              # sourceNamespaces:
              #   - 'openshift-gitops-dev'
              # Cluster-scoped resources the team may manage. EMPTY by default, which denies them
              # all. Widen only where a team genuinely needs to create its own namespaces.
              # clusterResources:
              #   - group: ''
              #     kind: 'Namespace'
              # Signer for this team's agent certificate authority. Defaults to the built-in
              # autoshift-ca, so every team chains to one fleet root while staying a separate
              # intermediate. A separate intermediate per team is what stops one team's client
              # certificate from authenticating against another team's principal.
              caIssuer: 'autoshift-ca'
              logLevel: 'info'
            gitops_rbac_policies:
              - 'g, openshift-systems, role:admin'
              - 'g, openshift-dev-leads, role:admin'
              - 'g, openshift-developers, role:readonly'
            disableAdmin: 'true'
            server:
              limits:
                cpu: '500m'
                memory: '256Mi'
              requests:
                cpu: '125m'
                memory: '128Mi'
            dex:
              limits:
                cpu: '500m'
                memory: '256Mi'
              requests:
                cpu: '250m'
                memory: '128Mi'
            ha:
              enabled: 'false'
              limits:
                cpu: '500m'
                memory: '256Mi'
              requests:
                cpu: '250m'
                memory: '128Mi'
            redis:
              limits:
                cpu: '500m'
                memory: '256Mi'
              requests:
                cpu: '250m'
                memory: '128Mi'
            repo:
              limits:
                cpu: '1000m'
                memory: '1024Mi'
              requests:
                cpu: '250m'
                memory: '256Mi'
            controller:
              limits:
                cpu: '2000m'
                memory: '2048Mi'
              requests:
                cpu: '250m'
                memory: '1024Mi'
            applicationSet:
              limits:
                cpu: '2'
                memory: '1Gi'
              requests:
                cpu: '250m'
                memory: '512Mi'
          test:
            gitops_rbac_policies:
              - 'g, openshift-systems, role:admin'
      # =======================================================================
      # Advanced Cluster Security (Day-2 settings; enable the stack with the acs label)
      # =======================================================================
      acs:
        # Pin to specific CSV(s). Omit to track the channel.
        # versions:
        #   - 'rhacs-operator.vX.Y.Z'
        # startingCSV: 'rhacs-operator.vX.Y.Z'
        egressConnectivity: Online          # Online | Offline (disconnected)
        scannerV4: Enabled                  # Enabled | Disabled | Default (SecuredCluster maps Enabled -> AutoSense)
        scanner: AutoSense                  # SecuredCluster Scanner v2: AutoSense | Disabled
        monitoring: true                    # OpenShift monitoring integration
        exposeMetrics: ''                   # Enabled | Disabled — Prometheus endpoint on Central/Scanner/ScannerV4
        networkPolicies: ''                 # Enabled | Disabled; blank omits the field and leaves the Operator default
        # Technology Preview. 4.11 still has no CRD field, so this sets the ROX_VIRTUAL_MACHINES
        # environment variable. It only enables the platform side: scanning also needs a VM agent
        # installed inside each guest, which is in-guest software AutoShift does not manage.
        vmScanning: false
        configAsCode: ''                    # Enabled | Disabled — Central Config-as-Code component
        telemetry: false                    # Central telemetry reporting
        notifierSecretsEncryption: false    # encrypt notifier secrets at rest
        registryOverride: ''                # override the image registry, for disconnected mirrors
        # Scheduling applied once at the CR level, which the operator propagates to every
        # Deployment-based component. The Collector DaemonSet is not affected.
        # Set EITHER pinToNodes OR the explicit pair: pinToNodes already sets nodeSelector and
        # tolerations for you, and the operator rejects the combination.
        pinToNodes: ''                      # None | InfraRole — shorthand for infra nodes
        nodeSelector: {}                    # custom placement; ignored when pinToNodes is set
        tolerations: []                     # custom taints; ignored when pinToNodes is set
        auditLogs: Auto                     # Auto | Enabled | Disabled — OpenShift audit log collection
        fileActivityMonitoring: Disabled    # Enabled | Disabled — per-node File Activity Monitoring
        additionalCAs: []                   # extra trusted root CAs: [{name: my-ca.pem, content: <PEM>}]
        db:
          size: ''                          # Central DB PVC size, e.g. 100Gi (blank = operator default)
          storageClassName: ''              # blank = cluster default storage class
          # Defaults to central-db, which is the Operator's own claim name, and the policy always
          # writes the field rather than leaving it unset. Only change this to adopt an existing
          # claim of a different name: the Operator manages exactly one PVC for central-db, so
          # naming a second one leaves Central Irreconcilable while still reporting Available, and
          # the only visible symptom is a failing readiness gate.
          claimName: 'central-db'
        collector:
          collection: CORE_BPF              # CORE_BPF (recommended); EBPF is deprecated
        processBaselines:
          autoLock: Disabled                # Enabled | Disabled — lock baselines when observation ends
        processIndicators:
          persistence: Enabled              # Enabled | Disabled
          excludeOpenshiftNs: Disabled      # Enabled drops indicators from openshift namespaces
          excludeNamespaceRegex: ''         # additional namespaces to exclude
        admissionControl:
          # listenOnCreates/listenOnUpdates/listenOnEvents and contactImageScanners are deprecated
          # in the 4.11 CRD; enforcement replaces them.
          enabled: false                    # true -> enforcement: Enabled; default is false
          bypass: BreakGlassAnnotation      # BreakGlassAnnotation | Disabled
          replicas: 3                       # admission control pod replicas
          failurePolicy: Ignore             # Ignore (fail-open, safe) | Fail (fail-closed, strict)
        # The provider itself is the acs-auth-provider label; these tune it.
        auth:
          minimumRole: None                 # minimum role for authenticated users
          adminGroup: cluster-admins        # group mapped to the Admin role
        # Where Central lives. Whether this cluster runs one is the acs-central LABEL,
        # because it decides which policies are placed; this is only its address.
        central:
          endpoint: ''                      # blank = discover Central's route on this hub
        # How secured clusters authenticate to Central for the first time.
        # Mode itself is the acs-registration LABEL, because it selects which policies are
        # placed. These are the settings for whichever mode is selected.
        # One registration secret is minted per secured cluster, so a leaked token registers
        # exactly one cluster and revoking it affects only that cluster.
        registration:
          validFor: 168h                    # only has to cover mint -> registration
          maxClusters: 1                    # registrations one token may perform; 0 = no limit
          # Blank builds registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9 at the tag
          # matching the installed operator version. That is a TAG on registry.redhat.io, not a
          # mirrored digest, so a disconnected deployment has to set this explicitly.
          roxctlImage: ''
      # =======================================================================
      # AutoShift Console Plugin (hub only; ENABLE flag is the autoshift-console label).
      # Read-only OpenShift console plugin that surfaces AutoShift clustersets, the resolution
      # chain behind each setting, and policy compliance. All keys are optional.
      # =======================================================================
      autoshiftConsole:
        # Built per OpenShift minor — the console supplies react and react-router as shared
        # singletons, so one bundle cannot span releases. The policy appends ':ocp<minor>' using
        # the cluster's ACTUAL running version, so a cluster always pulls its own build and a
        # minor with no published build fails the pull rather than rendering nothing. Which minors
        # are published is whatever is tagged in the repository:
        # https://quay.io/repository/autoshift/autoshift-console-plugin?tab=tags
        repository: 'quay.io/autoshift/autoshift-console-plugin'
        replicas: 2
        # Optional. Overrides repository and the derived tag outright — set it to pin a digest in
        # production. Pinning one tag across a fleet spanning minors deploys the wrong bundle to
        # all but one of them.
        image: ''
      # Global Observability (three-tier metrics rollup: global hub -> intermediate
      # hubs -> workload clusters). Enable with the global-observability label below;
      # placement is driven by that label + self-managed ('true' = global hub,
      # 'false' = intermediate hub). Base MCO config (retention, storage, thanos)
      # stays under acm.observability / policy-acm-observability. Do NOT set
      # acm.observability.enableMCOA when using these capability toggles.
      # Prereqs on every participating hub: acm-observability: 'true', coo: 'true'.
      # =======================================================================
      globalObservability:
        # MCOA capability toggles patched onto the MultiClusterObservability CR
        capabilities:
          platformAnalytics: 'true'         # incident detection + right-sizing
          platformLogs: 'true'
          platformMetrics: 'true'
          userWorkloadLogs: 'true'
          userWorkloadMetrics: 'true'
          userWorkloadTraces: 'true'
        scrapeInterval: '300s'              # PrometheusAgent scrape interval
        logLevel: 'warn'                    # PrometheusAgent log level
        # Optional extra remote-write targets alongside the built-in global rollup.
        # Keep secret names short and alphanumeric-terminated: MCOA truncates
        # secret-<name> volume names to 63 chars; a cut on a non-alphanumeric
        # character silently breaks the agent StatefulSet.
        # additionalRemoteWrites:
        #   - name: external-monitoring
        #     url: https://external.example.com/api/v1/receive
        #     remoteTimeout: 30s                # optional (default 30s)
        #     onSelfManagedHub: true            # true: every hub; false: intermediate hubs only (default)
        #     caFile: /etc/prometheus/secrets/external-certs/ca.crt
        #     certFile: /etc/prometheus/secrets/external-certs/tls.crt
        #     keyFile: /etc/prometheus/secrets/external-certs/tls.key
        #     secretRef:                        # hub secret replicated + mounted into the agent
        #       name: external-certs
        #       namespace: some-ns
    labels:
      # =======================================================================
      # Core Configuration
      # =======================================================================
      self-managed: 'true'                # hub only — registers hub as a self-managed cluster.
                                          # Declaring it under managedClusterSets fails the render.
      # Deploy a nested AutoShift from this hub to each MANAGED hub it governs. Requires the
      # target hub clusterset to carry self-managed: 'false'. That label marks the hub this
      # deployment runs on, which already has its own AutoShift.
      autoshift-enable-install: 'false'   # hub only — see policies/stable/managed-autoshift
      # DERIVED — do not set: cluster-type ('hub' for hubClusterSets entries, 'spoke' for
      # managedClusterSets entries). Injected by the top-level chart, so a value set here is
      # overwritten. A self-managed hub is cluster-type 'hub' plus self-managed 'true'.
      openshift-version: '4.22.8'       # desired OCP version: operator-catalog alignment (tooling) + upgrade target (openshift-upgrade policy)
      policy-namespace: ''               # hub only — overrides the ACM policy namespace

      # =======================================================================
      # OpenShift Upgrade (Day-2 platform upgrade — see docs/ocp-upgrade.md)
      # Target version = openshift-version (above). Enforced: a cluster upgrades when opted in AND its
      # clusterset's openshift-version is higher than the cluster's current version. Blast radius is
      # controlled by clusterset membership — roll out in waves; never enable on a populated clusterset.
      # =======================================================================
      openshift-upgrade: 'false'                    # opt cluster in to Day-2 platform upgrades
      openshift-upgrade-channel: 'stable-4.22'      # ClusterVersion channel
      openshift-upgrade-upstream: 'https://api.openshift.com/api/upgrades_info/v1/graph'  # OSUS graph (local URL when disconnected)

      # =======================================================================
      # OpenShift GitOps (REQUIRED for AutoShift)
      # =======================================================================
      gitops: 'true'
      gitops-subscription-name: openshift-gitops-operator
      gitops-disable-default-argocd: 'true'
      # Argo CD agent (GitOps add-on). Technology Preview in Red Hat Advanced Cluster
      # Management 2.17. Hub-only labels: cluster-type hub selects the self-managed hub AND every
      # managed hub, so setting these in a managed hub's clusterset values enables that hub alone
      # and nothing above it.
      # What shape of infra Argo CD this cluster runs. The same mode set the per-team
      # gitops-dev-team-<team> labels take, so infra and teams read alike.
      #   'hub'               infra-gitops runs here. Placed by clusterset membership, so a hub
      #                       gets this whether or not the label is set
      #   'push'              no local instance; the hub deploys in through the cluster secret
      #                       argo-acm-importer registers. The default for a spoke
      #   'standalone'        a local instance, owning its own Applications, reporting to nothing
      #   'agent'             a local agent instance, mode from config.gitops.agent.mode
      #   'agent-autonomous'  the spoke owns its Applications and mirrors them to the hub
      #   'agent-managed'     the hub owns them and the agent pulls them down
      #
      # The agent modes are aimed at a HUB, where infra-gitops already exists and the agent attaches
      # to it. On a managed hub that mirrors the AutoShift Applications it owns, which is the fleet
      # view. A plain spoke may opt in by setting an agent mode here, and gets an instance of its
      # own in openshift-gitops-infra, but it owns no Applications of its own, so that instance is
      # empty until something puts Applications in it.
      gitops-infra: 'push'
      gitops-agent: 'false'                  # run the agent principal on this hub
      # Deploy the ADD-ON agent on THIS cluster rather than the one AutoShift builds. Opt-in: the
      # add-on brings its own GitOps installer and allows one agent for each cluster, so the
      # gitops-infra agent modes are the default path. Turn this on for a cluster with no
      # cert-manager, where the add-on's self-signed authority is the whole point.
      gitops-agent-enroll: 'false'
      # Who issues the agent signing certificate authority, the one secret the add-on derives the
      # whole agent public key infrastructure from. Three states:
      #   'false'     the add-on generates a self-signed authority per hub. Turnkey, and a fleet of
      #               unrelated roots chaining to nothing the organization already trusts.
      #   'true'      cert-manager issues it, from config.gitops.agent.ca.issuer. That issuer
      #               defaults to autoshift-ca, which makes the agent authority an intermediate
      #               under the same root that signs the API server and Ingress certificates; point
      #               it at your own issuer to chain to an existing public key infrastructure.
      #   'external'  you deliver the secret yourself, by any means. AutoShift creates no
      #               Certificate but still places the monitoring, which matters more here than
      #               anywhere else because nothing renews it and the add-on silently overwrites a
      #               stale authority with a self-signed one of its own.
      gitops-agent-ca: 'false'
      gitops-channel: gitops-1.21
      gitops-version: 'openshift-gitops-operator.v1.21.4'
      gitops-source: redhat-operators
      gitops-source-namespace: openshift-marketplace
      # Always stamped, on every cluster. Set it here or per cluster to override; leave it out
      # and it is stamped from config.gitops.namespace, else the global gitopsNamespace. It is
      # the single source of truth for the namespace, because the Helm policies and the
      # PolicyGenerator ones cannot share a default any other way.
      gitops-namespace: 'openshift-gitops'
      gitops-cluster-ca-bundle: 'true'              # Inject cluster trusted CA bundle into ArgoCD repo server
      gitops-console-plugin: 'false'                  # GitOps console plugin (tech preview) — adds ArgoCD to OCP console

      # =======================================================================
      # AutoShift Console Plugin (hub only — reads hub-side AutoShift ConfigMaps)
      # Repository and replicas are set under config.autoshiftConsole.
      # =======================================================================
      autoshift-console: 'true'                     # AutoShift section in the Fleet management perspective

      # =======================================================================
      # Advanced Cluster Management (hub only — not installed on managed clusters)
      # =======================================================================
      acm-subscription-name: advanced-cluster-management
      acm-version: 'advanced-cluster-management.v2.17.1'
      acm-channel: release-2.17
      acm-source: redhat-operators
      acm-source-namespace: openshift-marketplace
      acm-availability-config: 'High'       # 'Basic' or 'High'
      acm-observability: 'true'              # Requires ODF for noobaa bucket
      # ACM Search v2 storage (PVC for the search-indexer PostgreSQL)
      acm-observability-custom-metrics: 'false'   # collect metrics beyond ACM's default allowlist; needs config.acm.observability.customMetrics
      acm-search-storage: 'false'
      acm-search-storage-class: ''           # unset -> the cluster's default StorageClass; set to pin a class
      acm-search-storage-size: '100Gi'
      # Cluster provisioning (hive-based cluster install flow)
      cluster-install: 'false'                     # hub only — enables the cluster-install policy set
      acm-enable-provisioning: 'false'            # hub only
      # DEPRECATED: superseded by config.acm.provisioning.*, which wins when set.
      # Still honoured so existing deployments keep working; move to config and remove these.
      acm-provisioning-storage-class: ''             # -> config.acm.provisioning.storageClass
      acm-provisioning-database-size: 10Gi           # -> config.acm.provisioning.databaseSize
      acm-provisioning-filesystem-storage-size: 100Gi # -> config.acm.provisioning.filesystemStorageSize
      acm-provisioning-image-storage-size: 100Gi     # -> config.acm.provisioning.imageStorageSize
      # ACM Addon Tuning (for scale)
      acm-addon-tuning: 'true'
      # config-policy-controller tuning (annotations on ManagedClusterAddOn)
      acm-addon-cpc-eval-concurrency: '5'    # Concurrent policy evaluations (default: 2)
      acm-addon-cpc-client-qps: '75'         # K8s API client QPS (default: 30)
      acm-addon-cpc-client-burst: '100'      # K8s API client burst (default: 45)
      # config-policy-controller resource limits (via AddOnDeploymentConfig)
      acm-addon-cpc-mem-request: '256Mi'
      acm-addon-cpc-cpu-request: '150m'
      acm-addon-cpc-mem-limit: '1Gi'
      # governance-policy-framework tuning (annotations on ManagedClusterAddOn)
      acm-addon-gpf-eval-concurrency: '5'    # Concurrent policy evaluations (default: 2)
      acm-addon-gpf-client-qps: '75'         # K8s API client QPS (default: 30)
      acm-addon-gpf-client-burst: '100'      # K8s API client burst (default: 45)
      # governance-policy-framework resource limits (via AddOnDeploymentConfig).
      # Keep at 1Gi or above: the addon OOMKills around 100 ConfigurationPolicies, and it
      # delivers its own tuning, so it cannot raise the limit once it does.
      acm-addon-gpf-mem-request: '256Mi'
      acm-addon-gpf-cpu-request: '100m'
      acm-addon-gpf-mem-limit: '1Gi'

      # =======================================================================
      # Tempo
      # =======================================================================
      tempo: 'false'
      tempo-subscription-name: tempo-product
      tempo-channel: stable
      tempo-source: redhat-operators
      tempo-source-namespace: openshift-marketplace
      tempo-version: 'tempo-operator.v0.21.0-3'

      # =======================================================================
      # Kiali
      # =======================================================================
      kiali: 'false'
      kiali-subscription-name: kiali-ossm
      kiali-channel: stable
      kiali-source: redhat-operators
      kiali-source-namespace: openshift-marketplace
      kiali-version: 'kiali-operator.v2.27.3'

      # =======================================================================
      # Service Mesh 3
      # =======================================================================
      servicemesh3operator: 'false'
      servicemesh3operator-subscription-name: servicemeshoperator3
      servicemesh3operator-channel: stable
      servicemesh3operator-version: 'servicemeshoperator3.v3.4.1'
      servicemesh3operator-istio-version: '1.24.3'  # Istio control plane version
      servicemesh3operator-tempo: 'false'            # Enable Tempo distributed tracing
      servicemesh3operator-source: redhat-operators
      servicemesh3operator-source-namespace: openshift-marketplace
      servicemesh3-ambient: 'false'                  # Enable Ambient mesh mode

      # =======================================================================
      # MetalLB
      # =======================================================================
      metallb: 'false'
      metallb-subscription-name: metallb-operator
      metallb-version: 'metallb-operator.v4.22.0-202608251608'
      metallb-source: redhat-operators
      metallb-source-namespace: openshift-marketplace
      metallb-channel: stable
      metallb-quota: 'false'
      metallb-quota-cpu: ''                  # Number of cpu for Resource Quota
      metallb-quota-memory: ''               # Memory for Resource Quota (e.g., 2Gi)
      metallb-ippool-1: ''                   # Name of IPPool config file (add -2, -3 for more)
      metallb-l2-1: ''                       # Name of L2 Advertisement config file
      metallb-bgp-1: ''                      # Name of BGP Advertisement config file
      metallb-peer-1: ''                     # Name of BGP Peer config file

      # =======================================================================
      # Ansible Automation Platform
      # =======================================================================
      aap: 'false'
      aap-subscription-name: ansible-automation-platform-operator
      aap-channel: stable-2.7
      aap-install-plan-approval: Automatic
      aap-source: redhat-operators
      aap-source-namespace: openshift-marketplace
      aap-version: 'aap-operator.v2.7.0-0.1787240540'
      aap-hub-disabled: 'false'              # 'true' omits Hub content storage
      aap-storage-type: 's3'                 # 's3', 'pvc', or 'none' (default: none)
      ### AAP Hub Content File Storage (select file OR s3, not both)
      aap-file-storage: 'false'
      aap-file_storage_storage_class: 'ocs-storagecluster-cephfs'  # Requires RWX storage
      aap-file_storage_size: 10G
      ### AAP NooBaa S3 Storage - autocreates bucket in AAP namespace
      aap-noobaa-s3-storage: 'false'
      aap-external-s3-secret-name: ''        # Name of secret for external S3
      aap-eda-disabled: 'false'              # 'true' omits Event-Driven Ansible
      aap-lightspeed-disabled: 'true'        # 'true' omits Ansible Lightspeed
      ### AAP Custom Cert Bundle Injection
      aap-custom-cabundle: 'false'           # 'true' injects cluster CA Bundle into AAP
      aap-cabundle-name: 'user-ca-bundle'    # Secret name for CA Bundle

      # =======================================================================
      # Master Node Kubelet Configuration (SNO / Compact clusters)
      # =======================================================================
      master-nodes: 'false'
      master-max-pods: '250'                 # Max pods per master node (up to 2500)
      master-system-reserved-memory: '3Gi'   # Memory reserved for OS/system processes including etcd
      master-system-reserved-cpu: '500m'     # CPU reserved for OS/system processes
      master-kube-reserved-memory: '1536Mi'  # Memory reserved for kubelet/CRI-O
      master-kube-reserved-cpu: '500m'       # CPU reserved for kubelet/CRI-O
      master-eviction-memory: '500Mi'        # Hard eviction threshold for memory.available

      # =======================================================================
      # Workload Partitioning (CPU isolation via PerformanceProfile)
      # =======================================================================
      workload-partitioning: 'false'         # Enable CPU workload partitioning

      # =======================================================================
      # Machine Health Checks
      # =======================================================================
      machine-health-checks: 'false'
      machine-health-checks-worker: 'true'   # Create MHC for the worker machine pool
      machine-health-checks-infra: 'false'   # Create MHC for the infra machine pool
      machine-health-checks-storage: 'false' # Create MHC for the storage machine pool

      # =======================================================================
      # Manual Remediations
      # =======================================================================
      manual-remediations: 'false'

      # =======================================================================
      # Infrastructure Nodes
      # =======================================================================
      infra-nodes: ''                        # Number of infra nodes (blank = not managed, 0 = delete)
      infra-nodes-provider: aws              # 'aws', 'vmware', or 'baremetal'
      infra-nodes-instance-type: ''          # AWS instance type
      infra-nodes-volume-size: '100'         # Root volume size in GiB
      infra-nodes-numcpu: ''
      infra-nodes-memory-mib: ''
      infra-nodes-numcores-per-socket: ''
      infra-nodes-zone-1: ''                 # Add -zone-2, -zone-3 for multiple zones
      # --- Infra MachineConfigPool ---
      infra-machineconfigpool: 'false'       # Create dedicated infra MCP (separates from worker pool)
      # --- Infra Node Kubelet Configuration ---
      infra-node-config: 'false'             # Enable infra node kubelet tuning (requires infra-machineconfigpool)
      infra-max-pods: '250'                  # Max pods per infra node
      infra-system-reserved-memory: '2Gi'    # Memory reserved for OS/system processes
      infra-system-reserved-cpu: '500m'      # CPU reserved for OS/system processes
      infra-kube-reserved-memory: '1Gi'      # Memory reserved for kubelet/CRI-O
      infra-kube-reserved-cpu: '500m'        # CPU reserved for kubelet/CRI-O
      infra-eviction-memory: '500Mi'         # Hard eviction threshold for memory.available

      # =======================================================================
      # Worker Nodes
      # =======================================================================
      worker-nodes: ''                       # Number of worker nodes (blank = not managed)
      worker-nodes-provider: aws              # 'aws', 'vmware', or 'baremetal'
      worker-nodes-instance-type: ''          # AWS instance type
      worker-nodes-numcpu: ''
      worker-nodes-memory-mib: ''
      worker-nodes-numcores-per-socket: ''
      worker-nodes-zone-1: ''                # Add -zone-2, -zone-3 for multiple zones
      # --- Worker Node Kubelet Configuration ---
      worker-node-config: 'false'            # Enable worker node kubelet tuning
      worker-max-pods: '250'                 # Max pods per worker node (up to 2500)
      worker-system-reserved-memory: '1Gi'   # Memory reserved for OS/system processes
      worker-system-reserved-cpu: '250m'     # CPU reserved for OS/system processes
      worker-kube-reserved-memory: '512Mi'   # Memory reserved for kubelet/CRI-O
      worker-kube-reserved-cpu: '250m'       # CPU reserved for kubelet/CRI-O
      worker-eviction-memory: '500Mi'        # Hard eviction threshold for memory.available

      # =======================================================================
      # Storage Nodes
      # =======================================================================
      storage-nodes: ''                      # Number of storage nodes (blank = not managed)
      storage-nodes-provider: aws            # 'aws', 'vmware', or 'baremetal'
      storage-nodes-instance-type: 'm6in.8xlarge'  # AWS instance type
      storage-nodes-numcpu: ''
      storage-nodes-memory-mib: ''
      storage-nodes-numcores-per-socket: ''
      storage-nodes-zone-1: 'us-east-2a'    # Add -zone-2, -zone-3 for multiple zones
      storage-nodes-region: 'us-east-2'
      storage-nodes-node-1: 'node-1'         # For baremetal: specify node names
      storage-nodes-node-2: 'node-2'

      # =======================================================================
      # LVM Operator
      # =======================================================================
      lvm: 'false'
      lvm-subscription-name: lvms-operator
      lvm-version: 'lvms-operator.v4.22.0'
      lvm-default: 'true'                   # Set as default StorageClass
      lvm-fstype: xfs                        # 'xfs' or 'ext4'
      lvm-size-percent: 90                   # Percentage of VG for thinpool
      lvm-overprovision-ratio: 10
      lvm-channel: stable-4.22
      lvm-source: redhat-operators
      lvm-source-namespace: openshift-marketplace

      # =======================================================================
      # Local Storage Operator
      # =======================================================================
      local-storage: 'false'
      local-storage-subscription-name: local-storage-operator
      local-storage-version: 'local-storage-operator.v4.22.0-202608251608'
      local-storage-channel: stable
      local-storage-source: redhat-operators
      local-storage-source-namespace: openshift-marketplace

      # =======================================================================
      # OpenShift Data Foundation
      # =======================================================================
      odf: 'false'
      odf-subscription-name: odf-operator
      odf-version: 'odf-operator.v4.22.2-rhodf'
      odf-multi-cloud-gateway: standalone    # 'standalone' (noobaa only) or 'standard' (full ODF)
      odf-noobaa-pvpool: ''                  # Use PV pool for noobaa backing store
      odf-noobaa-store-size: ''              # e.g., '500Gi' - size of noobaa backing store
      odf-noobaa-store-num-volumes: ''       # e.g., '1' - number of volumes
      odf-ocs-storage-class-name: 'gp3-csi'  # StorageClass for OCS (if not local-storage)
      odf-ocs-storage-size: ''               # Storage size per device (e.g., '2Ti')
      odf-ocs-storage-count: ''              # Number of replica sets of drives
      odf-ocs-storage-replicas: ''           # Replicas ('3' recommended; '1' for flexibleScaling)
      odf-ocs-flexible-scaling: 'false'      # Sets failure domain to host, spreads OSDs evenly
      odf-resource-profile: balanced         # 'lean', 'balanced', or 'performance'
      odf-default-storageclass: 'ocs-storagecluster-ceph-rbd'  # Sets as default StorageClass
      odf-csi-all-nodes: 'false'            # 'true' to run CSI plugins on all nodes (masters, infra, storage)
      odf-channel: stable-4.22
      odf-source: redhat-operators
      odf-source-namespace: openshift-marketplace

      # =======================================================================
      # OpenShift Internal Registry
      # =======================================================================
      imageregistry: 'false'
      imageregistry-management-state: Managed    # 'Managed' or 'Unmanaged'
      imageregistry-replicas: '3'                # Need 2+ for HA with RWX/S3
      imageregistry-storage-type: s3             # 's3' or 'pvc'
      imageregistry-s3-region: us-east-2         # Region if type is s3
      imageregistry-pvc-access-mode: ReadWriteMany
      imageregistry-pvc-size: 100Gi
      imageregistry-pvc-storage-class: ocs-storagecluster-ceph-rbd
      imageregistry-pvc-volume-mode: Block       # 'Block' or 'Filesystem'
      imageregistry-rollout-strategy: RollingUpdate  # 'RollingUpdate' (2+ replicas) or 'Recreate'

      # =======================================================================
      # Kubernetes NMState Operator
      # =======================================================================
      nmstate: 'false'
      nmstate-subscription-name: kubernetes-nmstate-operator
      nmstate-channel: stable
      nmstate-source: redhat-operators
      nmstate-source-namespace: openshift-marketplace
      nmstate-version: 'kubernetes-nmstate-operator.4.22.0-202608260901'
      #
      # =======================================================================
      # Advanced Cluster Security
      # =======================================================================
      acs: 'false'                           # enable toggle (placement gate)
      # crs (default, also when unset) | manual | initBundle (legacy). Selects which
      # registration policies are placed on the cluster.
      # Whether this cluster runs Central. 'false' means SecuredCluster only, registering
      # with an external Central named by config.acs.central.endpoint.
      acs-central: 'true'
      # Names the identity provider for Central. 'openshift' configures OpenShift auth, which
      # grants Admin to config.acs.auth.adminGroup. Omit the label to configure no auth.
      acs-auth-provider: 'openshift'
      # Deploy the baseline SecurityPolicy resources. Hub only, opt-in.
      acs-default-policies: 'false'
      acs-registration: 'crs'
      acs-subscription-name: rhacs-operator
      acs-version: 'rhacs-operator.v4.11.3'
      acs-channel: stable
      acs-source: redhat-operators
      acs-source-namespace: openshift-marketplace
      # Day-2 ACS settings (scanner, collector, admission control, auth, monitoring, network,
      # VM scanning, baseline policies) are configured under config.acs below — not via labels.

      # =======================================================================
      # Developer Spaces
      # =======================================================================
      dev-spaces: 'false'
      dev-spaces-subscription-name: devspaces
      dev-spaces-version: 'devspacesoperator.v3.30.0'
      dev-spaces-channel: stable
      dev-spaces-source: redhat-operators
      dev-spaces-source-namespace: openshift-marketplace

      # =======================================================================
      # Developer Hub
      # =======================================================================
      dev-hub: 'false'
      dev-hub-subscription-name: rhdh
      dev-hub-version: 'rhdh-operator.v1.10.4'
      dev-hub-channel: fast-1.10
      dev-hub-source: redhat-operators
      dev-hub-source-namespace: openshift-marketplace

      # =======================================================================
      # OpenShift Pipelines
      # =======================================================================
      pipelines: 'false'
      pipelines-subscription-name: openshift-pipelines-operator-rh
      pipelines-version: 'openshift-pipelines-operator-rh.v1.23.2'
      pipelines-channel: pipelines-1.23
      pipelines-source: redhat-operators
      pipelines-source-namespace: openshift-marketplace

      # =======================================================================
      # Trusted Artifact Signer
      # =======================================================================
      tas: 'false'
      tas-subscription-name: rhtas-operator
      tas-version: 'rhtas-operator.v1.4.3'
      tas-channel: stable
      tas-source: redhat-operators
      tas-source-namespace: openshift-marketplace

      # =======================================================================
      # Quay
      # =======================================================================
      quay: 'false'
      quay-subscription-name: quay-operator
      quay-version: 'quay-operator.v3.18.0'
      quay-channel: stable-3.18
      quay-source: redhat-operators
      quay-source-namespace: openshift-marketplace
      # Registry database backing. bundled = the Quay Operator's own PostgreSQL Deployment
      # (the shipped default, fine for PoC); managed = CNPG HA clusters provisioned by AutoShift
      # (requires cloudnative-pg: 'true'); external = bring your own, set DB_URI + the Clair
      # connstrings in config.quay.config. Quay and Clair each get their OWN database — Red Hat
      # does not support sharing one between them.
      quay-db-mode: 'bundled'                   # bundled | managed | external
      quay-db-instances: '2'                    # CNPG replicas for the Quay database
      quay-clair-db-instances: '2'              # CNPG replicas for the Clair database
      quay-db-backups: 'false'                  # CNPG scheduled backups (needs db-mode managed + odf)

      # =======================================================================
      # HashiCorp Vault (community: third-party Helm chart integrated via PolicyGenerator)
      # =======================================================================
      vault: 'false'
      vault-version: '1.17.2'                 # server.image.tag injected into the upstream chart
      vault-tls-issuer: 'autoshift-ca'        # cert-manager ClusterIssuer for the Vault TLS cert
      vault-storage-size: '10Gi'              # raft data PVC size per node (applied via a kustomize patch)
      # Auto-unseal: seal backend per cluster. shamir=manual (independent, default); awskms/gcpckms/
      # azurekeyvault=cloud KMS auto-unseal (independent); transit=auto-unseal via the hub Vault (two-tier).
      vault-seal-type: 'transit'              # shamir | awskms | gcpckms | azurekeyvault | transit
      vault-transit-provider: 'false'         # 'true' on the hub Vault: hosts the transit unseal engine + KV recovery sink
      vault-external-hostname: ''             # hub Vault Route hostname (provider only): Route host + TLS cert SAN
      # Spokes AUTO-DISCOVER the hub Vault Route via lookup (resolved on the hub) — normally leave blank.
      # Set only to override: an external LB/custom DNS, or a spoke unsealing against a non-local hub.
      vault-transit-address: ''               # optional override; default = https://<hub Vault Route host>
      vault-transit-key: 'autoshift-unseal'   # transit key name on the hub Vault
      vault-transit-mount: 'transit/'         # transit engine mount path on the hub Vault
      vault-seal-kms-region: 'us-east-1'      # awskms/gcpckms region
      vault-seal-kms-key-id: ''               # awskms kms_key_id / gcpckms crypto_key / azurekeyvault key_name
      vault-seal-kms-project: ''              # gcpckms project
      vault-seal-kms-key-ring: ''             # gcpckms key_ring
      vault-seal-kms-tenant-id: ''            # azurekeyvault tenant_id
      vault-seal-kms-vault-name: ''           # azurekeyvault vault_name

      # =======================================================================
      # Developer OpenShift GitOps (team ArgoCD instances)
      # =======================================================================
      gitops-dev: 'false'
      # Does this HUB run team Argo CD agent principals? A label rather than config because
      # placement cannot read config.gitops.teams.<team>.agent.enabled, and a config-only gate
      # would leave a hub with no team agents holding a policy that renders nothing and reports
      # Compliant. Which teams get a principal is still decided by that config; this only decides
      # whether the policy is placed at all.
      gitops-agent-teams: 'false'
      # Does this cluster run any team agents? The per-team gitops-dev-team-<team>: 'agent' labels
      # decide WHICH teams; this exists because a placement selector cannot match a label prefix.
      gitops-agent-enrolled: 'false'
      gitops-dev-team-dev: 'hub'             # 'hub' or 'standalone'
      gitops-dev-team-test: 'hub'            # 'hub' or 'standalone'

      # =======================================================================
      # Loki
      # =======================================================================
      loki: 'false'
      loki-subscription-name: loki-operator
      loki-version: 'loki-operator.v6.6.0'
      loki-channel: stable-6.6
      loki-source: redhat-operators
      loki-source-namespace: openshift-marketplace
      loki-size: 1x.extra-small             # LokiStack size
      loki-storageclass: gp3-csi             # StorageClass for Loki
      loki-lokistack-name: logging-lokistack

      # =======================================================================
      # OpenShift Logging
      # =======================================================================
      logging: 'false'
      logging-subscription-name: cluster-logging
      logging-version: 'cluster-logging.v6.6.0'
      logging-channel: stable-6.6
      logging-source: redhat-operators
      logging-source-namespace: openshift-marketplace

      # =======================================================================
      # Cluster Observability Operator
      # =======================================================================
      coo: 'false'
      coo-subscription-name: cluster-observability-operator
      coo-version: 'cluster-observability-operator.v1.5.2'
      coo-channel: stable
      coo-source: redhat-operators
      coo-source-namespace: openshift-marketplace

      # =======================================================================
      # Global Observability (hub only — settings in config.globalObservability above)
      # Enables MCOA capability patching + metrics rollup to the global hub.
      # Placement discriminator is the self-managed label: 'true' = global hub
      # (secrets policy), 'false' = intermediate hub (PrometheusAgent patching).
      # Requires acm-observability: 'true' and coo: 'true' on the same hub.
      # =======================================================================
      global-observability: 'false'

      # =======================================================================
      # User Workload Monitoring (settings in config section above)
      # =======================================================================
      uwm: 'false'                              # Enable UWM (placement label only)

      # =======================================================================
      # Compliance Operator STIG Apply
      # =======================================================================
      compliance: 'false'
      compliance-auto-remediate: 'true'
      compliance-storage-class: ''           # StorageClass for compliance scan results (optional)
      compliance-subscription-name: compliance-operator
      compliance-version: 'compliance-operator.v1.9.2'
      compliance-source: redhat-operators
      compliance-source-namespace: openshift-marketplace
      compliance-channel: stable

      # =======================================================================
      # OpenShift Virtualization
      # =======================================================================
      virt: 'false'
      virt-subscription-name: kubevirt-hyperconverged
      virt-channel: stable
      virt-version: 'kubevirt-hyperconverged-operator.v4.22.6'
      virt-source: redhat-operators
      virt-source-namespace: openshift-marketplace

      # =======================================================================
      # Migration Toolkit for Virtualization
      # =======================================================================
      mtv: 'false'
      mtv-subscription-name: mtv-operator
      mtv-channel: release-v2.12
      mtv-source: redhat-operators
      mtv-source-namespace: openshift-marketplace
      mtv-version: 'mtv-operator.v2.12.7'

      # =======================================================================
      # Node Feature Discovery
      # =======================================================================
      node-feature-discovery: 'false'
      node-feature-discovery-subscription-name: nfd
      node-feature-discovery-channel: stable
      node-feature-discovery-source: redhat-operators
      node-feature-discovery-source-namespace: openshift-marketplace
      node-feature-discovery-version: 'nfd.4.22.0-202608251608'

      # =======================================================================
      # SR-IOV Network Operator
      # =======================================================================
      sriov: 'false'
      sriov-subscription-name: sriov-network-operator
      sriov-channel: stable
      sriov-source: redhat-operators
      sriov-source-namespace: openshift-marketplace

      # =======================================================================
      # Cert Manager
      # =======================================================================
      cert-manager: 'false'
      cert-manager-subscription-name: openshift-cert-manager-operator
      cert-manager-channel: stable-v1
      cert-manager-version: 'cert-manager-operator.v1.20.0'
      cert-manager-source: redhat-operators
      cert-manager-source-namespace: openshift-marketplace
      # Enable flags (LABELS, drive placement). Issuer refs + SANs are DATA -> config.certManager (above).
      cert-manager-ca: 'true'          # 'false' skips the built-in autoshift-ca (bring fully-external issuers)
      # Opt-in cert-manager management of the cluster's serving certs (default OFF; safe — only applied once
      # the Certificate is Ready). API = additive namedCertificate (api.<domain>, SNI, low risk). Ingress =
      # replaces the *.apps wildcard (higher risk). Issuer/SANs per cert live in config.certManager.
      # NOTE: a self-signed Ingress cert also needs cluster-internal trust of its CA — see the cert-manager
      # policy README (trustedCA companion) or set config.certManager.ingressCert.issuer to a real issuer.
      cert-manager-api-cert: 'false'
      cert-manager-ingress-cert: 'false'

      # =======================================================================
      # CloudNativePG (HA PostgreSQL)
      # =======================================================================
      cloudnative-pg: 'false'
      cloudnative-pg-subscription-name: cloudnative-pg
      cloudnative-pg-channel: stable-v1
      cloudnative-pg-version: 'cloudnative-pg.v1.30.0'
      cloudnative-pg-source: certified-operators
      cloudnative-pg-source-namespace: openshift-marketplace

      # =======================================================================
      # GitLab
      # =======================================================================
      gitlab: 'false'
      gitlab-subscription-name: gitlab-operator-kubernetes
      gitlab-channel: stable
      gitlab-version: 'gitlab-operator-kubernetes.v3.3.1'
      gitlab-source: certified-operators
      gitlab-source-namespace: openshift-marketplace
      # Service modes: managed (default), external, or bundled
      gitlab-db-mode: 'managed'                 # managed: CNPG HA, external: BYO, bundled: built-in
      gitlab-redis-mode: 'managed'              # managed: Redis Sentinel, external: BYO, bundled: Bitnami
      gitlab-object-storage-mode: 'managed'     # managed: NooBaa, external: BYO S3, bundled: MinIO
      # External mode labels (only when mode is 'external'):
      gitlab-db-host: 'my-postgres.example.com'
      gitlab-redis-host: 'my-redis.example.com'
      gitlab-redis-port: '6379'
      gitlab-argocd-integration: 'true'         # Create ArgoCD credential template for all GitLab repos
      gitlab-gitaly-ha: 'true'                  # Enable Gitaly HA via Praefect (default: false)
      gitlab-praefect-replicas: '3'             # Praefect proxy replicas (default: 3)
      gitlab-gitaly-replicas: '3'               # Gitaly replicas per virtual storage (default: 3)
      gitlab-gitaly-storage-class: 'ocs-storagecluster-cephfs'  # StorageClass for Gitaly PVC (omit for cluster default; use RWX for multi-node)
      gitlab-redis-storage-class: 'ocs-storagecluster-cephfs'   # StorageClass for bundled Redis PVC (omit for cluster default)
      gitlab-db-instances: '2'                  # PostgreSQL replicas (default: 2)
      gitlab-db-pooler-instances: '2'           # PgBouncer replicas (default: 2)
      gitlab-db-backups: 'true'                 # Enable CNPG backups (requires managed db + odf)
      gitlab-webservice-min-replicas: '2'       # Webservice HPA min (default: 2)
      gitlab-webservice-max-replicas: '4'       # Webservice HPA max (default: 4)
      gitlab-sidekiq-min-replicas: '2'          # Sidekiq HPA min (default: 2)
      gitlab-sidekiq-max-replicas: '4'          # Sidekiq HPA max (default: 4)
      gitlab-shell-min-replicas: '2'            # gitlab-shell HPA min (default: 2)
      gitlab-shell-max-replicas: '4'            # gitlab-shell HPA max (default: 4)
      # --- Config values go in config.gitlab (see config section above) ---
      # dbBackupSchedule, dbBackupRetention

      # =======================================================================
      # GitLab Runner
      # =======================================================================
      gitlab-runner: 'false'
      gitlab-runner-subscription-name: gitlab-runner-operator
      gitlab-runner-channel: stable
      gitlab-runner-version: 'gitlab-runner-operator.v1.30.1'
      gitlab-runner-source: certified-operators
      gitlab-runner-source-namespace: openshift-marketplace

      # =======================================================================
      # JFrog Artifactory
      # =======================================================================
      jfrog: 'false'
      jfrog-subscription-name: openshiftartifactoryha-operator
      jfrog-channel: alpha
      jfrog-version: 'openshiftartifactoryha-operator.v107.98.14'
      jfrog-source: certified-operators
      jfrog-source-namespace: openshift-marketplace
      jfrog-node-replicas: '2'
      jfrog-db-instances: '2'                   # PostgreSQL replicas (default: 2)
      jfrog-db-pooler-instances: '2'            # PgBouncer replicas (default: 2)
      artifactory-db-backups: 'true'            # Enable CNPG backups (requires cloudnative-pg + odf)
      # --- Config values go in config.jfrog (see config section above) ---
      # dbBackupSchedule, dbBackupRetention

      # =======================================================================
      # Remove Kubeadmin
      # =======================================================================
      remove-kubeadmin: 'false'              # Remove kubeadmin secret (disables OAuth-based kubeadmin login)

      # =======================================================================
      # Disconnected Mirror Settings
      # =======================================================================
      disconnected-mirror: 'false'           # Enable mirrored catalog sources
      mirror-catalog-suffix: 'mirror'        # redhat-operators + -mirror = redhat-operators-mirror

      # =======================================================================
      # Node Maintenance
      # =======================================================================
      node-maintenance: 'false'
      node-maintenance-subscription-name: node-maintenance-operator
      node-maintenance-channel: stable
      node-maintenance-source: redhat-operators
      node-maintenance-source-namespace: openshift-marketplace
      node-maintenance-version: 'node-maintenance-operator.v5.7.1'

      # =======================================================================
      # External Secrets Operator
      # =======================================================================
      external-secrets-operator: 'false'
      external-secrets-operator-subscription-name: openshift-external-secrets-operator
      external-secrets-operator-channel: stable-v1
      external-secrets-operator-version: 'openshift-external-secrets-operator.v1.2.0'
      external-secrets-operator-source: redhat-operators
      external-secrets-operator-source-namespace: openshift-marketplace
      # Opentelemetry
      # =======================================================================
      opentelemetry: 'false'
      opentelemetry-subscription-name: opentelemetry-product
      opentelemetry-channel: stable
      opentelemetry-version: 'opentelemetry-operator.v0.152.0-3'
      opentelemetry-source: redhat-operators
      opentelemetry-source-namespace: openshift-marketplace

      # NetApp Trident
      # =======================================================================
      trident: 'true'
      trident-name: trident-operator
      trident-install-plan-approval: Automatic
      trident-source: certified-operators
      trident-source-namespace: openshift-marketplace
      trident-channel: stable
      trident-version: 'trident-operator.v25.06.0'   # optional CSV version pin
