      #   startingCSV: 'devspaces.vX.Y.Z'
      # external-secrets-operator:
      #   versions:
      #     - 'openshift-external-secrets-operator.vX.Y.Z'
      #   startingCSV: 'openshift-external-secrets-operator.vX.Y.Z'
      # gitlab:
      #   versions:
      #     - 'gitlab-operator-kubernetes.vX.Y.Z'
      #   startingCSV: 'gitlab-operator-kubernetes.vX.Y.Z'
      # gitlab-runner:
      #   versions:
