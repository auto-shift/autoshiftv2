# ==============================================================================
# ClusterSet Example - ALL Available Options (Hub and Managed)
# ==============================================================================
# This file is the single reference for all available labels and config.
# Copy it and make two changes to adapt it for your clusterset:
#
#   1. TOP-LEVEL KEY:
#        Hub:     hubClusterSets:
#        Managed: managedClusterSets:
#
#   2. CLUSTERSET NAME (the key under hubClusterSets/managedClusterSets):
#        Change "hub" to your clusterset name (e.g., managed, prod, sbx, dev)
#
# Labels marked "# hub only" are only meaningful on hub clusters (ACM,
# cluster provisioning, self-managed registration) — omit them from managed
# clusterset profiles.
#
# Usage in ArgoCD Application (hub):
#   valueFiles:
#     - values/global.yaml
#     - values/clustersets/my-hub.yaml
#     - values/clusters/my-cluster.yaml    # optional: per-cluster overrides
#
# Usage in ArgoCD Application (managed):
#   valueFiles:
#     - values/global.yaml
#     - values/clustersets/my-hub.yaml        # hub defines managed clustersets too
#     - values/clustersets/my-managed.yaml    # uses managedClusterSets key
#     - values/clusters/my-cluster.yaml       # optional: per-cluster overrides
#
# Notes:
#   - Set a label to 'true' to enable, 'false' to disable
#   - Blank ('') means the feature is not managed / uses defaults
#   - For each operator, you must define ALL required labels:
#       {operator}: 'true'
#       {operator}-subscription-name: '...'
#       {operator}-channel: '...'
#       {operator}-source: '...'
#       {operator}-source-namespace: '...'
#   - Specifying {operator}-version pins to that CSV and sets manual approval
# ==============================================================================

# --- Global Overrides (override values from global.yaml) ---
# Uncomment to override globals when this file is loaded after global.yaml
# excludePolicies:
#   - infra-nodes
#   - worker-nodes

# ← CHANGE 1: use managedClusterSets for managed clusterset profiles
hubClusterSets:
  hub:  # ← CHANGE 2: replace with your clusterset name
    config:
      # =======================================================================
      # cert-manager — issuer refs + SANs (DATA; the ENABLE flags are labels below:
      # cert-manager, cert-manager-ca, cert-manager-api-cert, cert-manager-ingress-cert).
      # =======================================================================
      certManager:
        # Built-in autoshift-ca signer ref. Default self-signed root; point at your own
        # Issuer/ClusterIssuer to make autoshift-ca an intermediate (must be CA-capable, not ACME).
        ca:
          issuer:
            name: 'autoshift-selfsigned'
            kind: 'ClusterIssuer'
            group: 'cert-manager.io'
        # Cluster API server serving cert (api.<domain>). Issuer default autoshift-ca; on a cluster with a
        # real ACME issuer set e.g. name: 'zerossl-production-aws'. extraSANs adds names beyond api.<domain>.
        apiCert:
          issuer:
            name: 'autoshift-ca'
            kind: 'ClusterIssuer'
            group: 'cert-manager.io'
          extraSANs: []
        # Default Ingress wildcard (*.apps.<domain>). extraSANs commonly includes the bare apps.<domain>.
        ingressCert:
          issuer:
            name: 'autoshift-ca'
            kind: 'ClusterIssuer'
            group: 'cert-manager.io'
          extraSANs: []
      # =======================================================================
      # User Workload Monitoring (config section - read via rendered-config)
      # =======================================================================
      uwm:
        storageClass: 'gp3-csi'
        prometheus:
          retention: '24h'
          storage: '50Gi'
          storageClass: 'gp3-csi'
          dedicatedServiceMonitors: true
          resources:
            requests:
              cpu: '200m'
              memory: '1Gi'
            limits:
              cpu: '1'
              memory: '4Gi'
        thanosRuler:
          retention: '24h'
          storage: '10Gi'
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
        alertmanager:
          enabled: true
          storage: '10Gi'
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
      # =======================================================================
      # Disconnected Mirror (read via rendered-config ConfigMap)
      # =======================================================================
      disconnected:
        mirrorRegistry:
          host: 'registry.example.com:5000'    # host:port — there is no separate port key
          path: 'openshift'
          # ca (inline bundle) or caRef (hub ConfigMap) is required once mirrors/tagMirrors or
          # catalogs are defined; the mirrored registry is not in the cluster's default trust.
          caRef:
            name: 'cluster-ca-bundle'
            key: 'ca-bundle.crt'
            namespace: 'cluster-install-secrets'
          mirrors:
            - source: 'registry.redhat.io'
              mirror: 'registry.example.com:5000/rhel'
            - source: 'quay.io'
              mirror: 'registry.example.com:5000/quay'
          # tagMirrors -> ImageTagMirrorSet, for images pulled by TAG (not digest). The Vault chart
          # images (docker.io/hashicorp/vault:1.17.2, vault-k8s:1.4.2) are tag-referenced, so mirror
          # them here. `oc mirror` copies them via the imageset (vault key in known-additional-images.json).
          tagMirrors:
            - source: 'docker.io/hashicorp'
              mirror: 'registry.example.com:5000/hashicorp'
        # imagePath and tag, not a single image string — the host comes from mirrorRegistry above.
        catalogs:
          - source: redhat-operators
            imagePath: redhat/redhat-operator-index
            tag: v4.22
            publisher: Red Hat
          - source: certified-operators
            imagePath: redhat/certified-operator-index
            tag: v4.22
            publisher: Red Hat
        useIDMS: true
        disableDefaultCatalogs: true
      # =======================================================================
      # GitLab (values with / or spaces that can't be labels)
      # =======================================================================
      gitlab:
        dbBackupSchedule: '0 2 * * *'
        dbBackupRetention: '30d'
      # =======================================================================
      # JFrog Artifactory
      # =======================================================================
      jfrog:
        dbBackupSchedule: '0 3 * * *'
        dbBackupRetention: '30d'
      # =======================================================================
      # Operator version allow-list — works for EVERY operator, keyed by its version-label base
      # (config.<key>.versions + optional .startingCSV). A list, so it lives in config, not a label.
      # When set, `versions` pins the permitted CSV(s) and `startingCSV` the initial install ('' = OLM
      # picks); when unset, the single autoshift.io/<key>-version label is used. Keys match the
      # <key>-version label: quay, odf, metallb, virt, acs, dev-spaces, dev-hub, tas, acm, gitops, etc.
      # Quay shown as the example.
      # =======================================================================
      quay:
        versions:                              # allowed CSV versions (compliance constraint)
          - 'quay-operator.v3.18.0'
        startingCSV: 'quay-operator.v3.18.0'   # explicit initial install pin (optional; '' = let OLM pick)
        # --- Registry production settings (everything below is optional) ----------------
        # Superusers. With OIDC these are the OIDC usernames and they get admin on FIRST LOGIN
        # with no bootstrap step — that is the supported zero-Job admin path. Changing this
        # after deployment requires a registry restart to take effect.
        superUsers:
          - quayadmin
        # Bootstrap/automation flags. The shipped defaults are the SECURE ones: the registry API
        # is browser-only and the unauthenticated /api/v1/user/initialize endpoint is off. For a
        # PoC with no OIDC, set userInitialize + xhrOnly to bootstrap a local quayadmin by hand,
        # then set them back.
        bootstrap:
          userInitialize: false                # FEATURE_USER_INITIALIZE
          xhrOnly: true                        # BROWSER_API_CALLS_XHR_ONLY
          userCreation: false                  # FEATURE_USER_CREATION (false = superusers only)
          # TECH PREVIEW (Quay 3.18) — not covered by Red Hat production SLAs, may be functionally
          # incomplete, and Red Hat does not recommend it in production. The ONLY Tech Preview
          # feature this chart can turn on, and it is off by default. Mints a high-privilege
          # automation OAuth token into a Secret; still requires a superuser to ALREADY exist
          # (BOOTSTRAP_TOKEN_OWNER must be in superUsers), so it does not remove the need for OIDC.
          programmatic: false                  # FEATURE_PROGRAMMATIC_BOOTSTRAP
        # Per-component managed flags. Omit a kind to leave it managed by the Quay Operator
        # (the shipped default). postgres/clairpostgres are driven by the quay-db-mode label —
        # do not set them here.
        components:
          objectstorage: false               # then supply DISTRIBUTED_STORAGE_CONFIG below
        # Per-component overrides, passed straight through to spec.components[].overrides.
        # Valid keys: affinity, annotations, env, labels, replicas, resources, securityContext,
        # storageClassName, tls, volumeSize.
        overrides:
          quay:
            replicas: 3
          clair:
            volumeSize: 50Gi                 # 3.18: Clair scratch space for layer extraction;
            storageClassName: fast-ssd       # the 20Gi default is exhaustible by large images
          redis:
            resources:                       # 3.18: redis resource overrides
              limits:
                cpu: 400m
                memory: 400Mi
        # Registry serving certificate. Provider-agnostic: point secretName at ANY
        # kubernetes.io/tls Secret (cert-manager with any issuer, Vault, or hand-made) and the
        # Quay Operator watches it and rolling-restarts on rotation. Optionally let AutoShift
        # create the cert-manager Certificate too. Without this, Quay keeps the Operator-managed
        # cert and clients need --tls-verify=false on clusters with no trusted wildcard.
        tls:
          secretName: quay-tls
          certificate:                       # omit to bring your own Secret
            issuerRef:
              name: autoshift-ca
              kind: ClusterIssuer            # or Issuer
            dnsNames: []                     # default: the registry route host
        # Free-form config.yaml keys, merged LAST so they win over everything above. This is
        # where OIDC (*_LOGIN_CONFIG, multi-issuer as of 3.18), DISTRIBUTED_STORAGE_CONFIG for
        # unmanaged objectstorage, and DB_URI for quay-db-mode: external belong.
        # NOTE: do not set SSL_PROTOCOLS/SSL_CIPHERS unless you mean to override — with
        # unmanaged TLS, 3.18 inherits the cluster TLS security profile only when NEITHER is set.
        # NEVER put credentials here — this file lives in git. Non-sensitive keys only.
        config:
          REGISTRY_TITLE: 'Red Hat Quay'
          FEATURE_REPO_MIRROR: true
          DEFAULT_TAG_EXPIRATION: '2w'
        # Sensitive config.yaml keys come from a Secret an administrator creates ON THE CLUSTER,
        # so they never enter git. Merged into the config bundle LAST, so it wins over `config`
        # above. This is where object-storage credentials (DISTRIBUTED_STORAGE_CONFIG), DB_URI for
        # quay-db-mode: external, and OIDC client secrets belong.
        #
        #   oc create secret generic quay-config-extra -n quay-enterprise \
        #     --from-file=config.yaml=./quay-secrets.yaml
        #
        # where quay-secrets.yaml is a config.yaml FRAGMENT, e.g.:
        #   DISTRIBUTED_STORAGE_CONFIG:
        #     default:
        #       - RadosGWStorage
        #       - access_key: '...'
        #         secret_key: '...'
        #         bucket_name: 'quay-registry'
        #         hostname: 's3.example.com'
        #         is_secure: true
        #         port: 443
        #         storage_path: /datastorage/registry
        #   DISTRIBUTED_STORAGE_PREFERENCE:
        #     - default
        configSecretRef:
          name: quay-config-extra
          namespace: quay-enterprise            # default: quay-enterprise
          key: config.yaml                      # default: config.yaml
      # Every other operator supports the SAME block — uncomment and set real CSV(s) to pin.
      # Config key = the operator's <key>-version label base (shown). CSV name usually
      # <package>.vX.Y.Z — confirm with `oc get packagemanifest <name> -o jsonpath='{.status.channels}'`.
      # aap:
      #   versions:
      #     - 'ansible-automation-platform-operator.vX.Y.Z'
      #   startingCSV: 'ansible-automation-platform-operator.vX.Y.Z'
      # acm:
      #   versions:
      #     - 'advanced-cluster-management.vX.Y.Z'
      #   startingCSV: 'advanced-cluster-management.vX.Y.Z'
      # acs:
      #   versions:
      #     - 'rhacs-operator.vX.Y.Z'
      #   startingCSV: 'rhacs-operator.vX.Y.Z'
      # cert-manager:
      #   versions:
      #     - 'openshift-cert-manager-operator.vX.Y.Z'
      #   startingCSV: 'openshift-cert-manager-operator.vX.Y.Z'
      # cloudnative-pg:
      #   versions:
      #     - 'cloudnative-pg.vX.Y.Z'
      #   startingCSV: 'cloudnative-pg.vX.Y.Z'
      # compliance:
      #   versions:
