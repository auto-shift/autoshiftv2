      #         deviceClass: nvme
      #         count: 1
      #         replica: 3
      #         dataPVCTemplate:
      #           spec:
      #             storageClassName: local-nvme
      #             accessModes: [ReadWriteOnce]
      #             volumeMode: Block
      #             resources:
      #               requests:
      #                 storage: 1
      # opentelemetry:
      #   versions:
      #     - 'opentelemetry-product.vX.Y.Z'
      #   startingCSV: 'opentelemetry-product.vX.Y.Z'
      # pipelines:
      #   versions:
      #     - 'openshift-pipelines-operator-rh.vX.Y.Z'
      #   startingCSV: 'openshift-pipelines-operator-rh.vX.Y.Z'
      # servicemesh3operator:
      #   versions:
      #     - 'servicemeshoperator3.vX.Y.Z'
      #   startingCSV: 'servicemeshoperator3.vX.Y.Z'
      # tas:
      #   versions:
      #     - 'rhtas-operator.vX.Y.Z'
      #   startingCSV: 'rhtas-operator.vX.Y.Z'
      # tempo:
      #   versions:
      #     - 'tempo-product.vX.Y.Z'
      #   startingCSV: 'tempo-product.vX.Y.Z'
