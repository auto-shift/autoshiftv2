{{ if not (has "cluster-config-maps" ((.Values).excludePolicies | default list)) }}
  {{- $clusterSetSuffix := include "autoshift.clusterSetSuffix" . }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Release.Name }}-cluster-config-maps"
  namespace: {{ include "autoshift.gitopsNamespace" . }}
  labels:
    app: "{{ .Release.Name }}-policies"
    velero.io/exclude-from-backup: "true"
spec:
  project: default
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 3 }}
  # Single source: the chart (git path or OCI) ships its own values.yaml; valuesObject layers the
  # cross-cutting autoshift config on top. No per-chart $values git ref — top-level autoshift is the
  # only chart that pulls external values files.
  sources:
    {{- if .Values.autoshiftOciRegistry }}
    - path: .
      repoURL: {{ .Values.autoshiftOciRepo }}/cluster-config-maps
      targetRevision: {{ .Values.autoshiftOciVersion | default "latest" }}
    {{- else }}
    - path: policies/stable/cluster-config-maps
      repoURL: {{ .Values.autoshiftGitRepo }}
      targetRevision: {{ .Values.autoshiftGitBranchTag }}
    {{- end }}
      helm:
        valuesObject:
          gitopsNamespace: {{ include "autoshift.gitopsNamespace" . }}
          policy_namespace: {{ printf "policies-%s" .Release.Name }}
          clusterSetSuffix: {{ $clusterSetSuffix }}
          autoshift:
            dryRun: {{ ((.Values.autoshift).dryRun) | default false }}
            evaluationInterval:
              compliant: {{ (((.Values.autoshift).evaluationInterval).compliant) | default "watch" }}
              noncompliant: {{ (((.Values.autoshift).evaluationInterval).noncompliant) | default "watch" }}
          {{- if .Values.hubClusterSets }}
          hubClusterSets:
          {{-  range $cluster, $clustervalue := .Values.hubClusterSets }}
            {{ $cluster }}{{ $clusterSetSuffix }}:
              labels:
                self-managed: '{{ index $clustervalue.labels "self-managed" | default "true" }}'
              {{- /* Stamp the effective policyGenerator flag into config.gitops so the openshift-gitops
                     policy reads it from the rendered-config (git installs the CMP sidecar, OCI does not):
                     the hub's config.gitops.policyGenerator if set, else the global default. */}}
              {{- $cfg := deepCopy (index $clustervalue "config" | default dict) }}
              {{- $gitops := (index $cfg "gitops" | default dict) }}
              {{- $effPg := $.Values.policyGenerator | default false }}
              {{- if hasKey $gitops "policyGenerator" }}{{- $effPg = index $gitops "policyGenerator" }}{{- end }}
              {{- $_ := set $gitops "policyGenerator" $effPg }}
              {{- $_ := set $cfg "gitops" $gitops }}
              config: {{ $cfg | toYaml | nindent 16 }}
          {{- end }}
          {{- end }}
          {{- if .Values.managedClusterSets }}
          managedClusterSets:
            {{-  range $cluster, $clustervalue := .Values.managedClusterSets }}
            {{ $cluster }}{{ $clusterSetSuffix }}:
              labels: {}
              config: {{ (index $clustervalue "config" | default (dict) | toYaml | nindent 16) }}
          {{- end }}
          {{- end }}
          {{- if .Values.clusters }}
          clusters:
            {{-  range $cluster, $clustervalue := .Values.clusters }}
            {{ $cluster }}:
              labels: {}
              config: {{ (index $clustervalue "config" | default (dict) | toYaml | nindent 16) }}
          {{- end }}
          {{- end }}
  ignoreDifferences:
  - group: "apps"
    kind: "Project"
    jsonPointers:
    - /metadata/annotations
    - /metadata/labels
  syncPolicy:
    automated:
      prune: {{ if ((.Values.autoshift).dryRun) }}false{{ else }}true{{ end }}
      selfHeal: {{ if ((.Values.autoshift).dryRun) }}false{{ else }}true{{ end }}
    syncOptions:
    - RespectIgnoreDifferences=true
    - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ printf "policies-%s" .Release.Name }}
{{ end }}
