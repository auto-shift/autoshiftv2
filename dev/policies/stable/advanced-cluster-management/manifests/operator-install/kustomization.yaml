apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renders the shared components/operator-install chart. ACM installs into open-cluster-management in
# single-namespace (OwnNamespace) mode — its OperatorGroup scopes targetNamespaces to its own namespace.
# It also creates the policy namespace (${POLICY_NAMESPACE}) as an extra namespace. The OperatorGroup name
# is left to the component default (reuse an existing group in the namespace, else the namespace name).
helmGlobals:
  chartHome: ../../../../../components/
helmCharts:
  - name: operator-install
    releaseName: acm
    valuesInline:
      name: acm
      namespace: open-cluster-management
      namespaces:
        - ${POLICY_NAMESPACE}
      targetNamespaces:
        - open-cluster-management
      remediation: ${REMEDIATION}
      policyNamespace: ${POLICY_NAMESPACE}
      subscription:
        name: '{{hub index .ManagedClusterLabels "autoshift.io/acm-subscription-name" | default "advanced-cluster-management" hub}}'
        channel: '{{hub index .ManagedClusterLabels "autoshift.io/acm-channel" | default "release-2.16" hub}}'
        source: '{{hub $base := (index .ManagedClusterLabels "autoshift.io/acm-source" | default "redhat-operators") hub}}{{hub ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") hub}}'
        sourceNamespace: '{{hub index .ManagedClusterLabels "autoshift.io/acm-source-namespace" | default "openshift-marketplace" hub}}'
        # Version resolution (config lives in the rendered-config ConfigMap on the hub):
        #   config mode (config.acm.versions set): versions = that list; startingCSV = config.acm.startingCSV
        #     (explicit — the list says what's ALLOWED, not where to START; default "" = let OLM pick).
        #   label mode (no config): versions = [acm-version label]; startingCSV = that same version.
        # $vers is computed here and reused by `versions` below.
        startingCSV: |-
          {{hub- $cfg := (index (index (index ((lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict) "data" | default dict) "config" | default "" | fromYaml | default dict) "acm" | default dict) hub}}
          {{hub- $cfgVers := (dig "versions" (list) $cfg) hub}}
          {{hub- $isCfg := (not (empty $cfgVers)) hub}}
          {{hub- $labelVer := (index .ManagedClusterLabels "autoshift.io/acm-version" | default "") hub}}
          {{hub- $vers := (ternary $cfgVers (ternary (list) (list $labelVer) (empty $labelVer)) $isCfg) hub}}
          {{hub- (ternary (dig "startingCSV" "" $cfg) $labelVer $isCfg) hub}}
      # versions reuses $vers set in startingCSV above (same policy, resolves after it).
      versions: '{{hub $vers | toRawJson | toLiteral hub}}'
