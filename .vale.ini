# Prose linting for the published documentation, using Red Hat's own Vale style.
#   https://github.com/redhat-documentation/vale-at-red-hat
#
# Only two things are configured here: which rules block CI, and which are genuinely wrong for an
# infrastructure repository. Everything else keeps the level the Red Hat style gives it and is
# simply reported.
#
# Disabling a rule is almost never right. CI gates on errors alone, so a rule left at its default
# level costs nothing and keeps the finding visible; a rule set to NO throws that information away.
#
#   error     CI fails. Only rules the repository is already clean against, so they cannot regress.
#   NO        Reserved for rules that are wrong here, with the reason stated.
#   (default) Everything else. Reported, does not block. Promote to error as each is cleared.
#
# Local:  vale sync && vale README.md docs/
# CI:     vale --minAlertLevel=error README.md docs/

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = RedHat

# .vale/styles/config/vocabularies/AutoShift/accept.txt holds terms Vale should not question:
# product names it does not know (NooBaa, MetalLB, VMware), Kubernetes kinds (ApplicationSet,
# NNCP), tools (yq, devcontainer), and the GitHub callout keywords NOTE/TIP/WARNING, which the
# `> [!TIP]` syntax otherwise trips Symbols and Definitions on. Every entry there was verified to
# suppress a real finding — anything Vale's own dictionary already knows has been removed.
#
# It deliberately does NOT contain "Advanced Cluster Management". Accepting the short form would
# silence 99 CaseSensitiveTerms findings in one line, which is hiding the rule rather than
# answering it. Red Hat style wants the full product name; where the short form is used, the rule
# now says so.
Vocab = AutoShift

[*.md]
BasedOnStyles = RedHat

# --- enforced: clean today, so a regression fails the build -----------------------------------
# Banned terminology with an unambiguous replacement. 21 fixed.
RedHat.TermsErrors = error
# No contractions. 32 removed.
RedHat.Contractions = error
# Cleared and held: repeated words, release-note phrasing, product-centric verbs, sentence-opening
# conjunctions, hyphenation, and "by using" after a noun.
RedHat.RepeatedWords = error
RedHat.ReleaseNotes = error
RedHat.ProductCentricWriting = error
RedHat.Conjunctions = error
RedHat.Hyphens = error
RedHat.Using = error

# --- off: wrong for this repository -----------------------------------------------------------
# `master` is OpenShift's own node role (node-role.kubernetes.io/master) and `blue/green` is the
# deployment strategy, not a colour description. Both are unavoidable technical vocabulary, and
# every finding this rule produces here is a false positive.
RedHat.ConsciousLanguage = NO

# --- everything else is reported at its own level ---------------------------------------------
# Current backlog, largest first. Promote each to error as it reaches zero:
#
#   Headings            sentence-style capitalization. Renaming a heading changes its anchor and
#                       breaks inbound links, so this wants a deliberate pass, not a sweep.
#   EmDash              README is clean; ~80 remain in docs/ prose. Paired dashes have to be
#                       rewritten as a unit, which is editorial work rather than a substitution.
#   PascalCamelCase     wrap Kubernetes kinds in backticks. Genuinely improves the rendered page.
#   PassiveVoice        read case by case; often correct when the actor is a controller.
#   Definitions         expand abbreviations on first use, per document.
#   CaseSensitiveTerms  1 finding, and it is a false positive: the rule matches the bare token
#                       `Lightspeed` inside `Red Hat Ansible Lightspeed`. Cannot reach zero.
#   Symbols             19 findings, 18 of them the `[!NOTE]` / `[!TIP]` callout syntax rather
#                       than prose. Cannot reach zero either.
#   NoGerundsInTitles   "Installing X" -> "Install X". Also moves anchors.
#   Slash               and/or constructions.
