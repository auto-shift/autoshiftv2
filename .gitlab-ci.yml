# GitLab CI/CD Configuration for AutoShift
# Equivalent to .github/workflows/ci.yaml and release.yaml

stages:
  - lint
  - test
  - validate
  - release

variables:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v3.19.4"
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
  GITLEAKS_VERSION: "8.24.3"
  # renovate: datasource=github-releases depName=errata-ai/vale extractVersion=^v(?<version>.+)$
  VALE_VERSION: "3.17.1"
  # ubi10's system Python is 3.12, which is what zensical needs. It requires 3.10 or newer, and
  # on ubi9 pip resolved the pin back to zensical 0.0.2 rather than failing, which is part of why
  # the whole pipeline is on ubi10.
  #
  # Override in a disconnected pipeline with an image that already carries the toolchain: the
  # devcontainer image builds exactly this set. pip reads PIP_INDEX_URL from the environment on
  # its own, so an internal Python mirror needs no change here.
  DOCS_IMAGE: "registry.access.redhat.com/ubi10/ubi:latest"
  # Where a prebuilt image keeps the Vale rule package, so `vale sync` never reaches the network.
  VALE_STYLES_DIR: "/opt/vale-styles"
  OCP_VERSION: "stable"
  REGISTRY: "quay.io"
  REGISTRY_NAMESPACE: "autoshift"

# Common setup for all jobs using Red Hat UBI
.setup-tools: &setup-tools
  image: registry.access.redhat.com/ubi10/ubi:latest
  before_script:
    - |
      # Install dependencies and yq from EPEL
      dnf -y install \
        jq \
        git \
        findutils \
        https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
      dnf -y install yq
    - |
      # Install Helm from official releases
      curl -fsSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz | tar xz -C /tmp
      mv /tmp/linux-amd64/helm /usr/local/bin/helm
      chmod +x /usr/local/bin/helm
      helm version

# =============================================================================
# CI Pipeline (runs on push to main/feature branches and merge requests)
# =============================================================================

secret-scan:
  stage: lint
  image: registry.access.redhat.com/ubi10/ubi:latest
  before_script:
    - |
      curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar xz -C /tmp
      mv /tmp/gitleaks /usr/local/bin/gitleaks
      chmod +x /usr/local/bin/gitleaks
  script:
    - |
      echo "=== Scanning for secrets and PII ==="
      gitleaks detect --source . --verbose --config .gitleaks.toml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

lint-helm-charts:
  stage: lint
  <<: *setup-tools
  script:
    - |
      echo "=== Linting main autoshift chart ==="
      helm lint autoshift
    - |
      echo ""
      echo "=== Linting bootstrap charts ==="
      for chart in $(find . -maxdepth 2 -name Chart.yaml -not -path "./policies/*" -not -path "./autoshift/*" -exec dirname {} \;); do
        echo "Linting $(basename $chart)..."
        helm lint "$chart"
      done
    - |
      echo ""
      echo "=== Linting policy charts ==="
      # Policy charts live at policies/<category>/<chart>/Chart.yaml
      while IFS= read -r chart_file; do
        [ -z "$chart_file" ] && continue
        chart=$(dirname "$chart_file")
        echo "Linting $(basename "$chart")..."
        helm lint "$chart"
      done < <(find policies -maxdepth 3 -name Chart.yaml)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

validate-yaml:
  stage: lint
  <<: *setup-tools
  script:
    - |
      echo "=== Validating values files ==="
      for f in autoshift/values/global.yaml autoshift/values/clustersets/*.yaml autoshift/values/clusters/*.yaml; do
        [ -f "$f" ] || continue
        echo "Checking $f..."
        yq eval '.' "$f" > /dev/null
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

template-rendering:
  stage: test
  <<: *setup-tools
  script:
    - |
      echo "=== Testing template rendering ==="
      helm template autoshift autoshift -f autoshift/values/global.yaml -f autoshift/values/clustersets/hub.yaml -f autoshift/values/clustersets/managed.yaml > /dev/null
      echo "Template rendering successful"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

dry-run-packaging:
  stage: test
  <<: *setup-tools
  script:
    - dnf -y install make
    - |
      echo "=== Dry-run chart packaging ==="
      make package-only VERSION=0.0.0-ci
      echo ""
      echo "Packaged charts:"
      find .helm-charts -name "*.tgz" | sort
  artifacts:
    paths:
      - .helm-charts/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify-chart-discovery:
  stage: validate
  image: registry.access.redhat.com/ubi10/ubi:latest
  needs:
    - dry-run-packaging
  script:
    - |
      echo "=== Verifying Makefile dynamic discovery ==="

      # Count bootstrap charts (root-level Chart.yaml excluding policies/ and autoshift/)
      BOOTSTRAP_DIRS=$(find . -maxdepth 2 -name Chart.yaml -not -path "./policies/*" -not -path "./autoshift/*" | wc -l | tr -d ' ')
      # Policy charts live at policies/<category>/<chart>/Chart.yaml (depth 3)
      POLICY_DIRS=$(find policies -maxdepth 3 -name Chart.yaml | wc -l | tr -d ' ')

      BOOTSTRAP_CHARTS=$(ls .helm-charts/bootstrap/*.tgz 2>/dev/null | wc -l | tr -d ' ')
      POLICY_CHARTS=$(ls .helm-charts/policies/*.tgz 2>/dev/null | wc -l | tr -d ' ')

      echo "Bootstrap: $BOOTSTRAP_DIRS source charts -> $BOOTSTRAP_CHARTS packaged"
      echo "Policies: $POLICY_DIRS source charts -> $POLICY_CHARTS packaged"

      # Verify all charts were packaged
      if [ "$BOOTSTRAP_DIRS" != "$BOOTSTRAP_CHARTS" ]; then
        echo "ERROR: Bootstrap chart count mismatch! Expected $BOOTSTRAP_DIRS, got $BOOTSTRAP_CHARTS"
        exit 1
      fi

      if [ "$POLICY_DIRS" != "$POLICY_CHARTS" ]; then
        echo "ERROR: Policy chart count mismatch! Expected $POLICY_DIRS, got $POLICY_CHARTS"
        exit 1
      fi

      echo "All charts discovered and packaged correctly"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify-policy-list:
  stage: validate
  image: registry.access.redhat.com/ubi10/ubi:latest
  needs:
    - dry-run-packaging
  script:
    - |
      echo "=== Verifying policy-list.txt ==="

      if [ ! -f autoshift/files/policy-list.txt ]; then
        echo "ERROR: policy-list.txt not generated!"
        exit 1
      fi

      POLICY_COUNT=$(wc -l < autoshift/files/policy-list.txt | tr -d ' ')
      # A policy ships either as a PolicyGenerator dir (policy-generator-config.yaml) or a
      # Helm holdout (Chart.yaml). cluster-labels and cluster-config-maps are deployed as
      # dedicated Applications (full label/config data), not via the ApplicationSet list, so
      # they are excluded from policy-list.txt. Keep in sync with DEDICATED_APP_NAMES in the Makefile.
      PG_COUNT=$(find policies -maxdepth 3 -name policy-generator-config.yaml | wc -l | tr -d ' ')
      CHART_COUNT=$(find policies -maxdepth 3 -name Chart.yaml \
        -not -path 'policies/*/cluster-labels/*' \
        -not -path 'policies/*/cluster-config-maps/*' | wc -l | tr -d ' ')
      EXPECTED=$((PG_COUNT + CHART_COUNT))

      echo "policy-list.txt contains $POLICY_COUNT entries"
      echo "Expected $EXPECTED policies"

      if [ "$POLICY_COUNT" != "$EXPECTED" ]; then
        echo "ERROR: policy-list.txt count mismatch!"
        echo "Contents:"
        cat autoshift/files/policy-list.txt
        exit 1
      fi

      echo "policy-list.txt generated correctly"
      echo "Policies:"
      cat autoshift/files/policy-list.txt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

validate-policy-templates:
  stage: validate
  <<: *setup-tools
  script:
    - |
      echo "=== Validating policy templates ==="
      # Policy charts live at policies/<category>/<chart>/Chart.yaml
      while IFS= read -r chart_file; do
        [ -z "$chart_file" ] && continue
        policy_dir=$(dirname "$chart_file")
        policy_name=$(basename "$policy_dir")
        echo "Rendering ${policy_name}..."
        helm template "$policy_name" "$policy_dir" > /dev/null || {
          echo "ERROR: Failed to render $policy_name"
          exit 1
        }
      done < <(find policies -maxdepth 3 -name Chart.yaml)
      echo "All policy templates rendered successfully"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Full policy validation: render every PolicyGenerator + Helm policy, resolve hub/spoke
# templates against synthetic ACM resources, and enforce the label contract. Mirrors the
# GitHub "Validate policy rendering and config (ACM resolver)" job. Uses the Go image so the
# PolicyGenerator CMP toolchain can be installed via `make install-policy-generator`.
validate-policies:
  stage: validate
  image: golang:1.25
  variables:
    KUSTOMIZE_BIN: ${CI_PROJECT_DIR}/.tools/kustomize
    KUSTOMIZE_PLUGIN_HOME: ${CI_PROJECT_DIR}/.tools/kustomize-plugin
  before_script:
    - apt-get update -qq && apt-get install -y -qq make
  script:
    - |
      echo "=== Installing kustomize + PolicyGenerator plugin ==="
      make install-policy-generator
    - |
      echo "=== Validating policies (render, hub/spoke resolution, config coverage, label contract) ==="
      cd tools && go test -tags integration ./... -count=1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

docs:
  stage: lint
  # Equivalent to the `docs` job in .github/workflows/ci.yaml. Builds the site, prunes what must
  # not be published, verifies the result, and lints the prose.
  #
  # Three things reach the network here in a connected pipeline: zensical from PyPI, the Vale
  # binary from GitHub releases, and the Vale rule package from `vale sync`. Each sits behind a
  # presence check, so a pipeline that supplies them another way fetches nothing. Nothing extra
  # is needed to run this connected, which is the point: one job, both environments.
  image: ${DOCS_IMAGE}
  before_script:
    - |
      # scripts/build-docs.sh derives what to prune from `git ls-files` and walks the output with
      # find. Neither is in the base image.
      dnf -y install git findutils python3-pip
    - |
      if ! command -v zensical >/dev/null 2>&1; then
        pip3 install --no-cache-dir -r docs/requirements.txt
      fi
      zensical --version
    - |
      if ! command -v vale >/dev/null 2>&1; then
        curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
          | tar xz -C /usr/local/bin vale
        chmod +x /usr/local/bin/vale
      fi
      vale --version
    - |
      # The rule package, in order of preference: already in the workspace, then a directory the
      # image carries, then the network. Only the last of those needs a connected pipeline.
      mkdir -p .vale/styles
      if [ ! -d .vale/styles/RedHat ]; then
        if [ -d "${VALE_STYLES_DIR}/RedHat" ]; then
          echo "Using the Vale rule package from ${VALE_STYLES_DIR}"
          cp -r "${VALE_STYLES_DIR}/RedHat" .vale/styles/
        else
          vale sync
        fi
      fi
  script:
    - |
      echo "=== Building the documentation site ==="
      ./scripts/build-docs.sh
    - |
      echo "=== Prose lint ==="
      vale --minAlertLevel=error README.md docs/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# Release Pipeline (runs on tag push)
# =============================================================================

pages:
  stage: release
  # Publishes the site to GitLab Pages, the equivalent of .github/workflows/docs.yaml. A fork that
  # lives in GitLab has no gh-pages to push to, so without this it would validate its documentation
  # on every merge request and then throw it away.
  #
  # scripts/build-docs.sh reads CI_PAGES_URL, which GitLab defines per job on gitlab.com and on
  # self-managed alike, so canonical URLs and the sitemap describe this instance rather than
  # upstream. Where Pages is not enabled, the job still produces a downloadable artifact.
  image: ${DOCS_IMAGE}
  before_script:
    - |
      dnf -y install git findutils python3-pip
      command -v zensical >/dev/null 2>&1 || pip3 install --no-cache-dir -r docs/requirements.txt
  script:
    - ./scripts/build-docs.sh
    # GitLab serves whatever the job leaves in public/. Removed first: mv into an existing
    # directory nests the build inside it instead of replacing it, and serves a stale site.
    - rm -rf public && mv site public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  image: registry.access.redhat.com/ubi10/ubi:latest
  before_script:
    - |
      # Install dependencies and yq from EPEL
      dnf -y install \
        make \
        jq \
        git \
        https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
      dnf -y install yq
    - |
      # Install Helm from official releases
      curl -fsSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz | tar xz -C /tmp
      mv /tmp/linux-amd64/helm /usr/local/bin/helm
      chmod +x /usr/local/bin/helm
      helm version
    - |
      # Install oras CLI for OCI tagging
      curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz | tar xz -C /tmp
      mv /tmp/oras /usr/local/bin/oras
      chmod +x /usr/local/bin/oras
    - |
      # Install OpenShift CLI from Red Hat mirror
      curl -fsSL https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${OCP_VERSION}/openshift-client-linux.tar.gz | tar xz
      mv oc kubectl /usr/local/bin/
      oc version --client
    - |
      # Setup Red Hat registry pull secret (if provided)
      if [ -n "$PULL_SECRET" ]; then
        mkdir -p ~/.docker
        echo "$PULL_SECRET" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json
      fi
    - |
      # Login to Quay.io
      echo "$QUAY_PASSWORD" | helm registry login $REGISTRY -u "$QUAY_USERNAME" --password-stdin
      echo "$QUAY_PASSWORD" | oras login $REGISTRY -u "$QUAY_USERNAME" --password-stdin
  script:
    - |
      # Extract version from tag
      VERSION=${CI_COMMIT_TAG#v}
      echo "Releasing version: $VERSION"
    - |
      # Run release
      make release VERSION=$VERSION
  artifacts:
    paths:
      - release-artifacts/
      - .helm-charts/autoshift-*.tgz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

# Create GitLab Release (requires release-cli)
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "AutoShift $CI_COMMIT_TAG"
    description: |
      ## AutoShift ${CI_COMMIT_TAG#v}

      ### Installation

      Download and run the install scripts from the release artifacts:
      ```bash
      bash install-bootstrap.sh
      bash install-autoshift.sh
      ```

      ### Charts Published

      - Main chart: `oci://$REGISTRY/$REGISTRY_NAMESPACE/autoshift:${CI_COMMIT_TAG#v}`
      - Bootstrap charts: `oci://$REGISTRY/$REGISTRY_NAMESPACE/bootstrap/<name>:${CI_COMMIT_TAG#v}`
      - Policy charts: `oci://$REGISTRY/$REGISTRY_NAMESPACE/policies/<name>:${CI_COMMIT_TAG#v}`
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
