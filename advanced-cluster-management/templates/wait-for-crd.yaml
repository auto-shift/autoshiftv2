{{- if not .Values.ignoreHelmHooks }}
---
apiVersion: v1
kind: Pod
metadata:
  name: crd-check
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  namespace: {{ .Values.acm.namespace }}
spec:
  containers:
  - name: crd-check
    image: {{ include "autoshift.cliImage" . }}
    imagePullPolicy: IfNotPresent
    # Waits for the multiclusterhubs CRD and then for the operator's validating webhook to have a
    # ready endpoint, so acm-mch.yaml (hook-weight 25) never hits "no endpoints available for
    # service multiclusterhub-operator-webhook". See files/wait-for-mch-ready.sh.
    command: ['sh', '-c', {{ .Files.Get "files/wait-for-mch-ready.sh" | quote }}]
    env:
    - name: NAMESPACE
      value: {{ .Values.acm.namespace | quote }}
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  serviceAccount: default
  serviceAccountName: default
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
{{- end }}