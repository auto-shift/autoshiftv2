# Read by Zensical, which builds the site. The filename and mkdocs.yml schema are what Zensical
# consumes natively, so it stays as it is; MkDocs also still builds this file unchanged, which is
# the fallback while Zensical is pre-1.0.
site_name: AutoShift Documentation
site_description: Infrastructure as Code for OpenShift using GitOps and ACM

# Required, not cosmetic: sitemap.xml is generated empty without it, and instant loading reads
# sitemap.xml to decide which links it can swap in place, so navigation.instant is inert until
# this is set. It also supplies the canonical URL on every page.
#
# The workflows derive SITE_URL from the repository they run in, so a fork publishes its own
# canonical URLs rather than pointing search engines at this repository. The fallback is the real
# address of this site, so a local build matches production. A fork on a custom domain sets
# SITE_URL itself.
site_url: !ENV [SITE_URL, 'https://auto-shift.github.io/autoshiftv2/']

repo_name: auto-shift/autoshiftv2
repo_url: https://github.com/auto-shift/autoshiftv2
# docs_dir is the repo root, so a page's source path already carries its directory (docs/,
# policies/...). Pointing this at docs/ produced edit/main/docs/docs/quickstart.md.
edit_uri: edit/main/

theme:
  name: material
  # Red Hat Text and Red Hat Mono are the brand fonts and are on Google Fonts under the SIL Open
  # Font License. Red Hat Display, the heading face, has no theme setting and is imported by
  # docs/assets/red-hat.css.
  font:
    text: Red Hat Text
    code: Red Hat Mono
  palette:
    # Light mode
    - scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

  icon:
    repo: fontawesome/brands/github

docs_dir: .

# Note for anyone reaching for exclude_docs: Zensical accepts the key and silently ignores it, so
# every file in the working tree is copied into the output. scripts/build-docs.sh prunes what must
# not be published, and fails if anything on that list survives.


# Warnings fail the build. This is the only gate on links: Zensical checks every internal link and
# every heading anchor on its own terms, and a `validation:` block is ignored the way exclude_docs
# and plugins are, so strict is what decides whether a finding aborts. Measured, not assumed: a
# broken link builds clean with strict false and exits 1 with strict true.
#
# It earns its place. A broken link is a 404 in the published site and nothing else catches it, and
# the anchor check found a link into a heading that a product-name rename had moved.
strict: true

# Zensical ignores this block: it handles docs_dir: '.' and search natively. It is kept so
# MkDocs still builds the same tree as a fallback while Zensical is pre-1.0.
plugins:
  - search
  - same-dir

extra_css:
  - docs/assets/red-hat.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  # Renders GitHub callout syntax (> [!NOTE]). Replaces the mkdocs-callouts plugin: identical
  # source syntax, but an extension rather than a plugin, so Zensical renders it too. Zensical
  # ignores unknown plugins without warning, so under the plugin every callout silently
  # degraded to a bare blockquote with a literal [!NOTE] line.
  - pymdownx.quotes:
      callouts: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/auto-shift/autoshiftv2

# Ordered by what a reader needs first, not by how the repo is laid out: install, then understand
# the shape, then configure, then run. Provisioning sits under Getting Started because standing a
# cluster up is a first-day task; hub-of-hubs is architecture, not an operation, and nobody finds
# it filed under Operations unless they already know it exists.
nav:
  - Home: README.md
  - Getting Started:
    - Quick Start: docs/quickstart.md
    - Provisioning Clusters: docs/cluster-install.md
  - Architecture:
    - Overview: docs/architecture.md
    - Hub-of-Hubs Topology: docs/hub-of-hubs.md
  - Configuration:
    - Config and Labels: docs/config-and-labels.md
    - Values Reference: docs/values-reference.md
    - External Values Repository: docs/external-values-repo.md
    - Workload Partitioning: docs/workload-partitioning.md
  - Operations:
    - Gradual Rollout: docs/gradual-rollout.md
    - ClusterSet Assignment: docs/cluster-set-assignment.md
    - OpenShift Fleet Upgrades: docs/ocp-upgrade.md
    - Releases & OCI: docs/releases.md
  - Development:
    - Developer Guide: docs/developer-guide.md
    - Repository Layout: docs/repository-layout.md
    - Policy Behavior: docs/policy-behavior.md
    - Documentation Style: docs/documentation-style.md
    - Diagram Style: docs/diagrams/README.md
