site_name: AutoShift Documentation
site_description: Infrastructure as Code for OpenShift using GitOps and ACM

repo_name: auto-shift/autoshiftv2
repo_url: https://github.com/auto-shift/autoshiftv2
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github

docs_dir: .

# Warnings fail the build. A broken relative link is a 404 in the published site and nothing else
# catches it — the policy READMEs carried 12 for months, written when policies lived at
# policies/<name>/ and never updated for policies/<tier>/<name>/.
strict: true

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn

plugins:
  - search
  - callouts
  - same-dir
  - mike:
      version_selector: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/auto-shift/autoshiftv2

# Ordered by what a reader needs first, not by how the repo is laid out: install, then understand
# the shape, then configure, then run. Provisioning sits under Getting Started because standing a
# cluster up is a first-day task; hub-of-hubs is architecture, not an operation, and nobody finds
# it filed under Operations unless they already know it exists.
nav:
  - Home: README.md
  - Getting Started:
    - Quick Start: docs/quickstart.md
    - Provisioning Clusters: docs/cluster-install.md
  - Architecture:
    - Hub-of-Hubs Topology: docs/hub-of-hubs.md
  - Configuration:
    - Values Reference: docs/values-reference.md
    - External Values Repository: docs/external-values-repo.md
    - Workload Partitioning: docs/workload-partitioning.md
  - Operations:
    - Gradual Rollout: docs/gradual-rollout.md
    - ClusterSet Assignment: docs/cluster-set-assignment.md
    - OpenShift Fleet Upgrades: docs/ocp-upgrade.md
    - Releases & OCI: docs/releases.md
  - Development:
    - Developer Guide: docs/developer-guide.md
