object-templates-raw: |
  {{- /* Spoke-side templates throughout, like cluster-install and cluster-labels. A hub
     template resolves on the ACM hub that OWNS the policy, so on a managed hub it would
     see the hub-of-hubs' clusters rather than the ones this hub manages. Resolving here
     means the loop sees whatever clusters the cluster it runs on manages. */ -}}
  {{- $subName := "rhacs-operator" }}
  {{- $sub := (lookup "operators.coreos.com/v1alpha1" "Subscription" "rhacs-operator" $subName) | default dict }}
  {{- $installedCSV := (dig "status" "currentCSV" "" $sub) }}
  {{- $roxctlTag := ($installedCSV | replace "rhacs-operator.v" "") }}
  {{- $defaultImage := (printf "registry.redhat.io/advanced-cluster-security/rhacs-roxctl-rhel9:%s" $roxctlTag) }}
  {{- $roxctlImage := "" }}
  {{- $specs := list }}
  {{- $names := list }}
  {{- $configMaps := (lookup "v1" "ConfigMap" "" "" "autoshift.io/rendered-config-map") | default dict }}
  {{- range $_, $cm := ($configMaps.items | default list) }}
  {{- $clusterName := (replace ".rendered-config" "" $cm.metadata.name) }}
  {{- $mc := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" $clusterName) | default dict }}
  {{- $mcOwningNs := dig "metadata" "labels" "autoshift.io/owning-namespace" "" $mc }}
  {{- $acsOn := dig "metadata" "labels" "autoshift.io/acs" "" $mc }}
  {{- $config := ($cm.data.config | fromYaml) | default dict }}
  {{- $reg := (index ($config.acs | default dict) "registration" | default dict) }}
  {{- /* Only clusters this deployment owns: with versionedClusterSets two deployments run
     against one hub and would otherwise mint for each other's clusters. */ -}}
  {{- if and (eq $acsOn "true") (or (empty $mc) (eq $mcOwningNs $cm.metadata.namespace)) }}
  {{- $validFor := (index $reg "validFor" | default "168h") }}
  {{- $maxClusters := (index $reg "maxClusters" | default 1) }}
  {{- $roxctlImage = (index $reg "roxctlImage" | default $defaultImage) }}
  {{- $names = append $names $clusterName }}
  {{- $specs = append $specs (printf "'%s %s %v'" $clusterName $validFor $maxClusters) }}
  {{- end }}
  {{- end }}
  {{- $specArgs := ($specs | join " ") }}
  {{- $jobName := (printf "acs-crs-generate-%s" (($names | join " ") | sha256sum | trunc 8)) }}
  {{- if $names }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        name: acs-crs-generate
        namespace: stackrox
  - complianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: acs-crs-generate
        namespace: stackrox
      rules:
      - apiGroups:
        - ''
        resources:
        - secrets
        verbs:
        - get
        - list
        - create
        - patch
        - update
  - complianceType: musthave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        name: acs-crs-generate
        namespace: stackrox
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: acs-crs-generate
      subjects:
      - kind: ServiceAccount
        name: acs-crs-generate
        namespace: stackrox
  - complianceType: musthave
    objectDefinition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        # Named after the set of secured clusters. musthave never updates an existing Job,
        # so a stable name would never pick up a newly joined cluster.
        name: '{{ $jobName }}'
        namespace: stackrox
        labels:
          app.kubernetes.io/name: acs-crs-generate
      spec:
        backoffLimit: 4
        # No ttlSecondsAfterFinished on purpose: expiring the Job would have the policy
        # recreate it forever. A failed Job stays failed and policy-acs-crs-test is the
        # alarm for it; delete the Job to retry.
        template:
          metadata:
            annotations:
              argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
            labels:
              app.kubernetes.io/name: acs-crs-generate
          spec:
            restartPolicy: Never
            serviceAccountName: acs-crs-generate
            volumes:
            - name: shared
              emptyDir: {}
            initContainers:
            # 1. Which clusters still need one. A CRS cannot be retrieved after generation,
            #    so only mint where none exists or the existing one has expired.
            - name: check
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              command: ["/bin/bash","-c"]
              args:
              - |
                set -eu
                # one "<cluster> <validFor> <maxClusters>" line per cluster this deployment owns
                printf '%s\n' {{ $specArgs }} > /shared/all
                : > /shared/needed
                now=$(date -u +%s)
                while read -r c validfor maxc; do
                  [ -n "$c" ] || continue
                  exp=$(oc get secret "crs-$c" -n stackrox -o jsonpath='{.metadata.annotations.crs\.platform\.stackrox\.io/expires-at}' 2>/dev/null || true)
                  if [ -z "$exp" ] || [ "$(date -u -d "$exp" +%s 2>/dev/null || echo 0)" -le "$now" ]; then
                    echo "$c $validfor $maxc" >> /shared/needed
                  fi
                done < /shared/all
                echo "clusters needing a CRS: $(wc -l < /shared/needed)"
              volumeMounts:
              - name: shared
                mountPath: /shared
            # 2. One CRS per cluster, so a leaked token registers exactly one cluster and
            #    revoking it affects only that cluster.
            - name: mint
              image: '{{ $roxctlImage }}'
              command: ["/bin/sh","-c"]
              args:
              - |
                set -eu
                while read -r c validfor maxc; do
                  [ -n "$c" ] || continue
                  roxctl -e central.stackrox.svc:443 --insecure-skip-tls-verify \
                    central crs generate "autoshift-$c-$(date -u +%Y%m%d%H%M%S)" \
                    --valid-for "$validfor" \
                    --max-clusters "$maxc" \
                    --output "/shared/crs-$c.yaml"
                done < /shared/needed
              env:
              - name: ROX_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: central-htpasswd
                    key: password
              volumeMounts:
              - name: shared
                mountPath: /shared
            containers:
            # 3. Store each as crs-<cluster>; sync-crs hands each cluster its own.
            - name: apply
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              command: ["/bin/bash","-c"]
              args:
              - |
                set -eu
                while read -r c validfor maxc; do
                  [ -n "$c" ] || continue
                  f="/shared/crs-$c.yaml"
                  [ -f "$f" ] || continue
                  sed "s|^  name: cluster-registration-secret$|  name: crs-$c|" "$f" | oc apply -n stackrox -f -
                  echo "stored crs-$c"
                done < /shared/needed
              volumeMounts:
              - name: shared
                mountPath: /shared
  {{- end }}
