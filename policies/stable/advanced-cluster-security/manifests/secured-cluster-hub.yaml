object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $acs := (index $config "acs" | default dict) hub}}
  {{hub- $scannerV4 := (index $acs "scannerV4" | default "Enabled") hub}}
  {{hub- $collector := (index $acs "collector" | default dict) hub}}
  {{hub- $collection := (index $collector "collection" | default "CORE_BPF") hub}}
  {{hub- $ac := (index $acs "admissionControl" | default dict) hub}}
  {{hub- $acEnabled := (index $ac "enabled" | default false) hub}}
  {{hub- $contactImageScanners := (index $ac "contactImageScanners" | default "ScanIfMissing") hub}}
  {{hub- $failurePolicy := (index $ac "failurePolicy" | default "Ignore") hub}}
  {{hub- $networkPolicies := (index $acs "networkPolicies" | default "") hub}}
  {{hub- $vmScanning := (index $acs "vmScanning" | default false) hub}}
  {{hub- $monitoring := (index $acs "monitoring") hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: platform.stackrox.io/v1alpha1
      kind: SecuredCluster
      metadata:
        namespace: stackrox
        name: stackrox-secured-cluster-services
      spec:
        clusterName: '{{ fromSecret "open-cluster-management-agent" "hub-kubeconfig-secret" "cluster-name" | base64dec }}'
        auditLogs:
          collection: Auto
        centralEndpoint: '{{ fromSecret "stackrox" "sensor-tls" "acs-host" | base64dec }}'
        admissionControl:
          {{hub- if $acEnabled hub}}
          listenOnCreates: true
          listenOnUpdates: true
          {{hub- else hub}}
          listenOnCreates: false
          listenOnUpdates: false
          {{hub- end hub}}
          listenOnEvents: true
          contactImageScanners: '{{hub $contactImageScanners hub}}'
          failurePolicy: '{{hub $failurePolicy hub}}'
        scannerV4:
          # SecuredCluster enum is Default|AutoSense|Disabled (no "Enabled"); map Enabled -> AutoSense.
          scannerComponent: '{{hub ternary "AutoSense" $scannerV4 (eq $scannerV4 "Enabled") hub}}'
        perNode:
          collector:
            collection: '{{hub $collection hub}}'
            imageFlavor: Regular
          taintToleration: TolerateTaints
        {{hub- if ne $monitoring false hub}}
        monitoring:
          openshift:
            enabled: true
        {{hub- end hub}}
        {{hub- if $networkPolicies hub}}
        network:
          policies: '{{hub $networkPolicies hub}}'
        {{hub- end hub}}
        {{hub- if $vmScanning hub}}
        customize:
          envVars:
            - name: ROX_VIRTUAL_MACHINES
              value: "true"
        {{hub- end hub}}
