# Every cluster that gets a cluster registration secret synced to it. NOT spoke-only: a hub runs
# its own SecuredCluster (policy-acs-secured-cluster-hub) and needs registration material just as a
# spoke does, and the mint Job already produces a crs-<cluster> for it. Gating this on
# cluster-type: spoke left both hubs with no cluster-registration-secret, which policy-acs-crs-test
# then reported as a permanent violation.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-crs-managed
  namespace: ${POLICY_NAMESPACE}
spec:
  # Syncs the CRS to secured clusters, for both crs and manual modes.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/acs'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/acs-registration'
              operator: NotIn
              values:
                - 'initBundle'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
