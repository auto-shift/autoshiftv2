apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-init-bundle-managed
  namespace: ${POLICY_NAMESPACE}
spec:
  # LEGACY init bundle certificate sync. Opt-in only.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/acs'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/cluster-type'
              operator: In
              values:
                - 'spoke'
            - key: 'autoshift.io/acs-registration'
              operator: In
              values:
                - 'initBundle'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
