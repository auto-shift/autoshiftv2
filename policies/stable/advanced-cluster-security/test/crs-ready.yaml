object-templates-raw: |
  # Inform-only. In manual mode nothing creates this secret, so an absent CRS must be a
  # visible violation rather than a SecuredCluster that silently never registers.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cluster-registration-secret
        namespace: stackrox
