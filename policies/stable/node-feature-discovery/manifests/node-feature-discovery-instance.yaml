apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  name: nfd-instance
  namespace: openshift-nfd
spec:
  enableTaints: false
  instance: ''
  operand:
    image: registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.22
    imagePullPolicy: Always
    servicePort: 0
  prunerOnDelete: false
  topologyUpdater: false
  workerConfig:
    configData: |
      core:
      #  labelWhiteList:
      #  noPublish: false
        sleepInterval: 60s
      #  sources: [all]
      #  klog:
      #    addDirHeader: false
      #    alsologtostderr: false
      #    logBacktraceAt:
      #    logtostderr: true
      #    skipHeaders: false
      #    stderrthreshold: 2
      #    v: 0
      #    vmodule:
      ##   NOTE: the following options are not dynamically run-time configurable
      ##         and require a nfd-worker restart to take effect after being changed
      #    logDir:
      #    logFile:
      #    logFileMaxSize: 1800
      #    skipLogHeaders: false
      sources:
        cpu:
          cpuid:
      #     NOTE: whitelist has priority over blacklist
            attributeBlacklist:
              - "BMI1"
              - "BMI2"
              - "CLMUL"
              - "CMOV"
              - "CX16"
              - "ERMS"
              - "F16C"
              - "HTT"
              - "LZCNT"
              - "MMX"
              - "MMXEXT"
              - "NX"
              - "POPCNT"
              - "RDRAND"
              - "RDSEED"
              - "RDTSCP"
              - "SGX"
              - "SSE"
              - "SSE2"
              - "SSE3"
              - "SSE4.1"
              - "SSE4.2"
              - "SSSE3"
            attributeWhitelist:
        kernel:
          kconfigFile: "/path/to/kconfig"
          configOpts:
            - "NO_HZ"
            - "X86"
            - "DMI"
        pci:
          deviceClassWhitelist:
            - "0200"
            - "03"
            - "0302"
            - "12"
          # "vendor", not "class". The NVIDIA GPU operator gates every one of
          # its operands on feature.node.kubernetes.io/pci-10de.present, where
          # 10de is NVIDIA's PCI vendor ID. Labelling by class instead yields
          # pci-0300.present and pci-0302.present, so that label never appears,
          # the operator concludes there are no GPU nodes, and it runs with no
          # daemonsets at all — no driver, no device plugin, and no
          # nvidia.com/gpu capacity on a node that is otherwise healthy.
          #
          # Do NOT add "device" alongside it. Per
          # https://access.redhat.com/solutions/7128119 that switches the label
          # to pci-10de-<deviceid>.present, which terminates an existing driver
          # rollout and zeroes nvidia.com/gpu. Use a NodeFeatureRule if device
          # IDs are genuinely needed.
          deviceLabelFields:
            - "vendor"
