apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renders the shared components/operator-install chart. Visible per-operator ACM lookups below.
helmGlobals:
  chartHome: ../../../../../components/
helmCharts:
  - name: operator-install
    releaseName: node-feature-discovery
    valuesInline:
      name: node-feature-discovery
      namespace: openshift-nfd
      targetNamespaces:
        - openshift-nfd
      remediation: ${REMEDIATION}
      subscription:
        name: '{{hub index .ManagedClusterLabels "autoshift.io/node-feature-discovery-subscription-name" | default "nfd" hub}}'
        channel: '{{hub index .ManagedClusterLabels "autoshift.io/node-feature-discovery-channel" | default "stable" hub}}'
        source: '{{hub $base := (index .ManagedClusterLabels "autoshift.io/node-feature-discovery-source" | default "redhat-operators") hub}}{{hub ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") hub}}'
        sourceNamespace: '{{hub index .ManagedClusterLabels "autoshift.io/node-feature-discovery-source-namespace" | default "openshift-marketplace" hub}}'
        # Version resolution (config lives in the rendered-config ConfigMap on the hub):
        #   config mode (config.node-feature-discovery.versions set): versions = that list; startingCSV = config.node-feature-discovery.startingCSV
        #     (explicit — the list says what's ALLOWED, not where to START; default "" = let OLM pick).
        #   label mode (no config): versions = [node-feature-discovery-version label]; startingCSV = that same version.
        # $vers is computed here and reused by `versions` below.
        startingCSV: |-
          {{hub- $cfg := (index (index (index ((lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict) "data" | default dict) "config" | default "" | fromYaml | default dict) "node-feature-discovery" | default dict) hub}}
          {{hub- $cfgVers := (dig "versions" (list) $cfg) hub}}
          {{hub- $isCfg := (not (empty $cfgVers)) hub}}
          {{hub- $labelVer := (index .ManagedClusterLabels "autoshift.io/node-feature-discovery-version" | default "") hub}}
          {{hub- $vers := (ternary $cfgVers (ternary (list) (list $labelVer) (empty $labelVer)) $isCfg) hub}}
          {{hub- (ternary (dig "startingCSV" "" $cfg) $labelVer $isCfg) hub}}
      # versions reuses $vers set in startingCSV above (same policy, resolves after it).
      versions: '{{hub $vers | toRawJson | toLiteral hub}}'
