# Seeds the Developer Hub backend signing secret once, with a random value, and asserts it stays
# there. It is written only while the Secret has no value, so later evaluations do not rotate it.
# Same seed-once shape as gitlab-redis-password: ONE object template, always rendered, with data
# included only when the value is absent, because musthave merges and would otherwise overwrite it.
object-templates-raw: |
  {{hub- $ns := "tssc-dh" hub}}
  {{- $existingData := ((lookup "v1" "Secret" "{{hub $ns hub}}" "tssc-developer-hub-backend-secret") | default dict).data | default dict }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tssc-developer-hub-backend-secret
        namespace: '{{hub $ns hub}}'
      type: Opaque
      {{- if empty (index $existingData "secret" | default "") }}
      stringData:
        secret: {{ randAlphaNum 48 }}
      {{- end }}
