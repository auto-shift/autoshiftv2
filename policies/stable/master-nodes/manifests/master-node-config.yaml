object-templates-raw: |
  {{- $cores := 0 }}
  {{- range (lookup "v1" "Node" "" "").items }}
    {{- if hasKey .metadata.labels "node-role.kubernetes.io/master" }}
      {{- if eq $cores 0 }}
        {{- $cores = (.status.capacity.cpu | toInt) }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- $maxPods := ("{{hub index .ManagedClusterLabels "autoshift.io/master-max-pods" | default 250 hub}}" | toInt) }}
  {{- $systemReservedMemory := "{{hub index .ManagedClusterLabels "autoshift.io/master-system-reserved-memory" | default "3Gi" hub}}" }}
  {{- $systemReservedCpu := "{{hub index .ManagedClusterLabels "autoshift.io/master-system-reserved-cpu" | default "500m" hub}}" }}
  {{- $kubeReservedMemory := "{{hub index .ManagedClusterLabels "autoshift.io/master-kube-reserved-memory" | default "1536Mi" hub}}" }}
  {{- $kubeReservedCpu := "{{hub index .ManagedClusterLabels "autoshift.io/master-kube-reserved-cpu" | default "500m" hub}}" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: KubeletConfig
      metadata:
        name: master-node-config
      spec:
        machineConfigPoolSelector:
          matchLabels:
            pools.operator.machineconfiguration.openshift.io/master: ""
        kubeletConfig:
          podsPerCore: {{ add 1 (div $maxPods $cores) }}
          maxPods: {{ $maxPods }}
          systemReserved:
            memory: {{ $systemReservedMemory }}
            cpu: {{ $systemReservedCpu }}
          kubeReserved:
            memory: {{ $kubeReservedMemory }}
            cpu: {{ $kubeReservedCpu }}
          {{- /* evictionHard is deliberately NOT set here. It replaces the kubelet default set
                 rather than merging into it, so a partial map silently drops the thresholds it
                 omits and the node stops evicting on disk. The kubelet defaults already satisfy
                 the NIST kubelet-eviction-thresholds-set-hard-* rules, and the kubelet-eviction
                 manual remediation is the one place that overrides them. */}}
