# Inform-only: Compliant once Kuadrant reports Ready. MaaS will not reconcile
# until it is, and the failure otherwise shows up much later as a gateway that
# never programs.
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
status:
  conditions:
    - type: Ready
      status: 'True'
