apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: connectivity-link
# Red Hat Connectivity Link (Kuadrant) — backs the RHOAI Models-as-a-Service inference gateway
# (AuthPolicy / RateLimitPolicy / Gateway API). Installs the rhcl-operator and delivers the Kuadrant
# instance (Kuadrant CR + Authorino TLS + observability), sourced from ai-accelerator's MaaS overlay.
# Enable on a RHOAI MaaS clusterset alongside autoshift.io/openshift-ai.
placementBindingDefaults:
  name: binding-policy-connectivity-link
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  placement:
    placementPath: placement.yaml
policies:
  # 1) Connectivity Link operator install (Namespace + OperatorPolicy). AllNamespaces (global) operator.
  - name: policy-connectivity-link-operator-install
    manifests:
      - path: manifests/operator-install
  # 2) Kuadrant instance (Kuadrant CR + Authorino TLS + observability), sourced from ai-accelerator's MaaS
  #    overlay. Depends on the operator so the kuadrant.io / authorino CRDs exist first.
  - name: policy-connectivity-link-instance
    dependencies:
      - name: policy-connectivity-link-operator-install
    manifests:
      - path: manifests/instance
