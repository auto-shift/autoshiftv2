# Annotate the operator-created Authorino authorization Service so OpenShift service-ca mints the
# authorino-server-cert secret that authorino.yaml references. Only metadata is asserted (musthave merge)
# so the operator keeps ownership of the Service spec/ports.
apiVersion: v1
kind: Service
metadata:
  name: authorino-authorino-authorization
  namespace: kuadrant-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: authorino-server-cert
