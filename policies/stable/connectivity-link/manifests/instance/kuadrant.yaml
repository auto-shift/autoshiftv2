# Kuadrant instance — the operator reconciles this into Authorino + Limitador. AutoShift ships it
# natively so connectivity-link stands alone (usable for any Gateway API / AuthPolicy use case, not
# just ai-accelerator MaaS). The namespace is created by manifests/operator-install.
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec:
  # Emit ServiceMonitors/PodMonitors for Limitador + Authorino so rate-limit / token-usage / auth
  # metrics reach Prometheus. Scraped by User Workload Monitoring; feeds the RHOAI MaaS usage dashboard.
  observability:
    enable: true
