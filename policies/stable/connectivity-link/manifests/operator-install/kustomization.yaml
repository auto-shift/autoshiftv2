apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renders the shared components/operator-install chart, which owns the OperatorPolicy structure and
# creates the namespace (with the cluster-monitoring label). The per-operator ACM lookups below are the
# visible, greppable inputs — every autoshift.io/connectivity-link-* label this operator consumes is here.
# ${REMEDIATION} is substituted by the CMP before kustomize runs.
helmGlobals:
  chartHome: ../../../../../components/
helmCharts:
  - name: operator-install
    releaseName: connectivity-link
    valuesInline:
      name: connectivity-link
      namespace: openshift-operators
      remediation: ${REMEDIATION}
      policyNamespace: ${POLICY_NAMESPACE}
      subscription:
        name: '{{hub index .ManagedClusterLabels "autoshift.io/connectivity-link-subscription-name" | default "rhcl-operator" hub}}'
        channel: '{{hub index .ManagedClusterLabels "autoshift.io/connectivity-link-channel" | default "stable" hub}}'
        source: '{{hub $base := (index .ManagedClusterLabels "autoshift.io/connectivity-link-source" | default "redhat-operators") hub}}{{hub ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") hub}}'
        sourceNamespace: '{{hub index .ManagedClusterLabels "autoshift.io/connectivity-link-source-namespace" | default "openshift-marketplace" hub}}'
        # Raises the kuadrant-operator-controller-manager memory limit through the
        # Subscription, the workaround CONNLINK-1878 documents for Connectivity Link 1.5:
        # at the shipped limit the controller is OOMKilled. OLM regenerates the
        # operator's Deployment from the CSV, so patching the Deployment directly is
        # reset on the next reconcile or upgrade; spec.config.resources is the field OLM
        # applies and keeps. It REPLACES the container's whole resources block, which is
        # why the CPU request and limit are restated (the shipped defaults). Harmless on
        # 1.4. Set here, in the OperatorPolicy that owns the Subscription, rather than by
        # a second policy patching a field of a resource this one manages.
        config:
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 200m
              memory: 2Gi
        # Version resolution (config lives in the rendered-config ConfigMap on the hub):
        #   config mode (config.connectivity-link.versions set): versions = that list; startingCSV = config.connectivity-link.startingCSV
        #     (explicit — the list says what's ALLOWED, not where to START; default "" = let OLM pick).
        #   label mode (no config): versions = [connectivity-link-version label]; startingCSV = that same version.
        # $vers is computed here and reused by `versions` below.
        startingCSV: |-
          {{hub- $cfg := (index (index (index ((lookup "v1" "ConfigMap" "${POLICY_NAMESPACE}" (printf "%s.rendered-config" .ManagedClusterName)) | default dict) "data" | default dict) "config" | default "" | fromYaml | default dict) "connectivity-link" | default dict) hub}}
          {{hub- $cfgVers := (dig "versions" (list) $cfg) hub}}
          {{hub- $isCfg := (not (empty $cfgVers)) hub}}
          {{hub- $labelVer := (index .ManagedClusterLabels "autoshift.io/connectivity-link-version" | default "") hub}}
          {{hub- $vers := (ternary $cfgVers (ternary (list) (list $labelVer) (empty $labelVer)) $isCfg) hub}}
          {{hub- (ternary (dig "startingCSV" "" $cfg) $labelVer $isCfg) hub}}
      # versions reuses $vers set in startingCSV above (same policy, resolves after it).
      versions: '{{hub $vers | toRawJson | toLiteral hub}}'
