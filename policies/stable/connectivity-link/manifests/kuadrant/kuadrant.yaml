# Observability on: the operator then creates the Limitador and Authorino
# PodMonitor/ServiceMonitor resources that user workload monitoring scrapes.
# MaaS usage metrics depend on these existing.
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec:
  # Enable observability so the Kuadrant operator creates its own
  # Limitador/Authorino PodMonitor/ServiceMonitor resources that are
  # scraped by user-workload monitoring. Required for MaaS observability.
  observability:
    enable: true
