  {{- $by := concat (index $liveReach (printf "%s/%s" $s.namespace $s.name) | default list) (index $liveReach (printf "%s/*" $s.namespace) | default list) (index $liveReach "*" | default list) }}
  {{- if $by }}{{- $reached = append $reached (printf "%s/%s (by %s)" $s.namespace $s.name (join ", " (uniq $by))) }}{{- end }}
  {{- end }}
  {{- end }}
  {{- if and (eq $b.kind "Role") (hasKey $heldRoles $b.role) }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "RoleBinding %s/%s is not changed: its Role %s is held" $e.ns $b.name $b.role)) }}
  {{- else if $tokenHolders }}
