  {{- $status := $hub.errs }}
  {{- $exceptions := list }}
  {{- $tokCache := dict }}
  {{- $clusterRoleNames := list "edit" "view" }}
  {{- $renderedMinters := dict }}
  {{- $pending := list }}
  {{- $liveReach := dict }}
  {{- range $k, $v := $hub.reach }}{{- $_ := set $liveReach $k $v }}{{- end }}
  {{- range $sec := (lookup "v1" "Secret" "" "" "autoshift.io/managed-by=namespace-rbac").items | default list }}
  {{- $hn := printf "%v" (index (dig "metadata" "annotations" dict $sec) "kubernetes.io/service-account.name" | default "") }}
  {{- if and $hn (eq (printf "%v" (dig "type" "" $sec)) "kubernetes.io/service-account-token") }}
  {{- $h := printf "%v/%s" (dig "metadata" "namespace" "" $sec) $hn }}
  {{- $_ := set $liveReach $h (concat (index $liveReach $h | default list) (list $h) | uniq) }}
  {{- end }}
  {{- end }}
  {{- $liveGrew := false }}
  {{- $edges := list }}
  {{- $crBinds := list }}
  {{- $liveRBs := list }}
  {{- $liveCRBs := list }}
  {{- if $liveReach }}
  {{- $liveRBs = (lookup "rbac.authorization.k8s.io/v1" "RoleBinding" "" "").items | default list }}
  {{- $liveCRBs = (lookup "rbac.authorization.k8s.io/v1" "ClusterRoleBinding" "" "").items | default list }}
  {{- $ruleCache := dict }}
  {{- range $kb := concat $liveRBs $liveCRBs }}
  {{- $rbNs := printf "%v" (dig "metadata" "namespace" "" $kb) }}
  {{- $subs := list }}
  {{- range $ls := (index $kb "subjects" | default list) }}
  {{- $sk := printf "%v" (index $ls "kind" | default "") }}
  {{- $sn := printf "%v" (index $ls "name" | default "") }}
  {{- $sp := splitList ":" $sn }}
  {{- if eq $sk "ServiceAccount" }}{{- $subs = append $subs (dict "label" (printf "ServiceAccount %v/%s" (index $ls "namespace" | default $rbNs) $sn) "ref" (printf "%v/%s" (index $ls "namespace" | default $rbNs) $sn) "gns" "" "gall" false) }}
  {{- else if and (eq $sk "User") (eq (len $sp) 4) (eq (index $sp 0) "system") (eq (index $sp 1) "serviceaccount") }}{{- $subs = append $subs (dict "label" (printf "User %s/%s" (index $sp 2) (index $sp 3)) "ref" (printf "%s/%s" (index $sp 2) (index $sp 3)) "gns" "" "gall" false) }}
  {{- else if and (eq $sk "Group") (eq $sn "system:serviceaccounts") }}{{- $subs = append $subs (dict "label" (printf "Group %s" $sn) "ref" "" "gns" "" "gall" true) }}
  {{- else if and (eq $sk "Group") (eq (len $sp) 3) (eq (index $sp 0) "system") (eq (index $sp 1) "serviceaccounts") }}{{- $subs = append $subs (dict "label" (printf "Group %s" $sn) "ref" "" "gns" (index $sp 2) "gall" false) }}
  {{- end }}
  {{- end }}
  {{- if $subs }}
  {{- $rk := printf "%v" (dig "roleRef" "kind" "" $kb) }}
  {{- $rn := printf "%v" (dig "roleRef" "name" "" $kb) }}
  {{- $bname := ternary (printf "RoleBinding %s/%v" $rbNs (dig "metadata" "name" "" $kb)) (printf "ClusterRoleBinding %v" (dig "metadata" "name" "" $kb)) (ne $rbNs "") }}
  {{- if and (eq $rk "ClusterRole") (has $rn $clusterRoleNames) }}{{- $crBinds = append $crBinds (dict "name" $bname "role" $rn "subs" $subs) }}{{- end }}
  {{- $ck := printf "%s|%s|%s" $rk (ternary $rbNs "" (eq $rk "Role")) $rn }}
  {{- if not (hasKey $ruleCache $ck) }}
  {{- if eq $rk "Role" }}{{- $_ := set $ruleCache $ck (index (lookup "rbac.authorization.k8s.io/v1" "Role" $rbNs $rn) "rules" | default list) }}{{- else }}{{- $_ := set $ruleCache $ck (index (lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" $rn) "rules" | default list) }}{{- end }}
  {{- end }}
  {{- $targets := list }}
  {{- $all := false }}
  {{- range $rule := index $ruleCache $ck }}
  {{- $rs := list }}{{- range $x := (index $rule "resources" | default list) }}{{- $rs = append $rs (lower (printf "%v" $x)) }}{{- end }}
  {{- $vs := list }}{{- range $x := (index $rule "verbs" | default list) }}{{- $vs = append $vs (lower (printf "%v" $x)) }}{{- end }}
  {{- $any := has "*" $vs }}
  {{- $write := or $any (has "create" $vs) (has "update" $vs) (has "patch" $vs) }}
  {{- $read := or $any (has "get" $vs) (has "list" $vs) (has "watch" $vs) }}
  {{- $imp := or $any (has "impersonate" $vs) }}
  {{- $bindEsc := or $any (has "bind" $vs) (has "escalate" $vs) }}
  {{- range $x := $rs }}
  {{- $wild := contains "*" $x }}
  {{- if and $write (or (has $x $hub.workloads) (eq $x "secrets") $wild) }}{{- $all = true }}{{- end }}
  {{- if and $read (or (eq $x "secrets") $wild) }}{{- $all = true }}{{- end }}
  {{- if and (or $any (has "create" $vs) (has "get" $vs)) (has $x (list "pods/exec" "pods/attach")) }}{{- $all = true }}{{- end }}
  {{- if and (or $any (has "patch" $vs) (has "update" $vs)) (eq $x "pods/ephemeralcontainers") }}{{- $all = true }}{{- end }}
  {{- if and $bindEsc (or (has $x (list "roles" "clusterroles" "rolebindings" "clusterrolebindings")) $wild) }}{{- $all = true }}{{- end }}
  {{- if and $imp (or (has $x (list "serviceaccounts" "users" "groups" "uids")) (hasPrefix "userextras" $x) $wild) }}{{- $all = true }}{{- end }}
  {{- if and (eq $x "serviceaccounts/token") (or $any (has "create" $vs)) }}
  {{- $rnm := index $rule "resourceNames" | default list }}
  {{- if and $rnm $rbNs }}{{- range $n := $rnm }}{{- $targets = append $targets (printf "%s/%v" $rbNs $n) }}{{- end }}{{- else }}{{- $all = true }}{{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $all }}{{- $targets = append $targets (ternary (printf "%s/*" $rbNs) "*" (ne $rbNs "")) }}{{- end }}
  {{- if $targets }}{{- $edges = append $edges (dict "subs" $subs "targets" (uniq $targets)) }}{{- end }}
  {{- end }}
  {{- end }}
  {{- range $ref, $tg := $hub.declEdges }}{{- $edges = append $edges (dict "subs" (list (dict "label" "" "ref" $ref "gns" "" "gall" false)) "targets" $tg) }}{{- end }}
  {{- $liveDone := false }}
  {{- range $round := until 6 }}
  {{- if not $liveDone }}
  {{- $sigBefore := 0 }}{{- range $k, $v := $liveReach }}{{- $sigBefore = add $sigBefore 1 (len $v) }}{{- end }}
  {{- range $ed := $edges }}
  {{- $by := list }}
  {{- range $sub := $ed.subs }}
  {{- if $sub.gall }}{{- range $k, $v := $liveReach }}{{- $by = concat $by $v }}{{- end }}
  {{- else if $sub.gns }}{{- range $k, $v := $liveReach }}{{- if or (eq $k "*") (hasPrefix (printf "%s/" $sub.gns) $k) }}{{- $by = concat $by $v }}{{- end }}{{- end }}
  {{- else }}{{- $by = concat $by (index $liveReach $sub.ref | default list) (index $liveReach (printf "%s/*" (first (splitList "/" $sub.ref))) | default list) (index $liveReach "*" | default list) }}
  {{- end }}
  {{- end }}
  {{- if $by }}{{- range $x := $ed.targets }}{{- $_ := set $liveReach $x (concat (index $liveReach $x | default list) $by | uniq) }}{{- end }}{{- end }}
  {{- end }}
  {{- $sigAfter := 0 }}{{- range $k, $v := $liveReach }}{{- $sigAfter = add $sigAfter 1 (len $v) }}{{- end }}
  {{- $liveGrew = ne $sigBefore $sigAfter }}
  {{- $liveDone = not $liveGrew }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $e := $hub.entries }}
  {{- if not (lookup "v1" "Namespace" "" $e.ns) }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "namespace %s does not exist, so nothing is created in it: namespace-rbac never creates namespaces" $e.ns)) }}
  {{- else }}
  {{- $foreignSA := dict }}
  {{- range $sa := $e.sas }}
  {{- $live := lookup "v1" "ServiceAccount" $e.ns $sa }}
  {{- if and $live (ne (printf "%v" (index (dig "metadata" "labels" dict $live) "autoshift.io/managed-by" | default "")) "namespace-rbac") }}
  {{- $_ := set $foreignSA $sa true }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "ServiceAccount %s/%s already exists and is not managed by namespace-rbac, so it is not changed" $e.ns $sa)) }}
  {{- else }}
  {{hub- if eq $want "enforce" hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: {{ $sa | toJson }}
        namespace: {{ $e.ns | toJson }}
        labels:
          autoshift.io/managed-by: namespace-rbac
  {{hub- end hub}}
  {{- end }}
  {{- end }}
  {{- range $tk := $e.tokens }}
  {{- $liveSec := lookup "v1" "Secret" $e.ns $tk.secret }}
  {{- $secLabels := dig "metadata" "labels" dict $liveSec }}
  {{- $secFor := printf "%v" (index (dig "metadata" "annotations" dict $liveSec) "kubernetes.io/service-account.name" | default "") }}
  {{- if hasKey $foreignSA $tk.sa }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "token Secret %s/%s is not created or changed: its ServiceAccount %s is not managed by namespace-rbac" $e.ns $tk.secret $tk.sa)) }}
  {{- else if and $liveSec (ne (printf "%v" (index $secLabels "autoshift.io/managed-by" | default "")) "namespace-rbac") }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "Secret %s/%s already exists and is not managed by namespace-rbac, so it is not changed" $e.ns $tk.secret)) }}
  {{- else if and $liveSec (or (ne (printf "%v" (dig "type" "" $liveSec)) "kubernetes.io/service-account-token") (ne $secFor $tk.sa)) }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "Secret %s/%s is managed by namespace-rbac but is not the token Secret of ServiceAccount %s, so it is not changed: delete it by hand" $e.ns $tk.secret $tk.sa)) }}
  {{- else }}
  {{- $pending = append $pending (dict "ns" $e.ns "key" $e.key "sa" $tk.sa "secret" $tk.secret) }}
  {{- end }}
  {{- end }}
  {{- $heldRoles := dict }}
  {{- range $r := $e.roles }}
  {{- $live := lookup "rbac.authorization.k8s.io/v1" "Role" $e.ns $r.name }}
  {{- $tokenSecrets := list }}
  {{- range $n := $r.secretNames }}
  {{- if has (printf "%v" (dig "type" "" (lookup "v1" "Secret" $e.ns $n))) (list "kubernetes.io/service-account-token" "kubernetes.io/dockercfg") }}{{- $tokenSecrets = append $tokenSecrets $n }}{{- end }}
  {{- end }}
  {{- $foreignSAs := list }}
  {{- range $n := $r.tokenNames }}
  {{- $sa := lookup "v1" "ServiceAccount" $e.ns $n }}
  {{- if and $sa (ne (printf "%v" (index (dig "metadata" "labels" dict $sa) "autoshift.io/managed-by" | default "")) "namespace-rbac") }}{{- $foreignSAs = append $foreignSAs $n }}{{- end }}
  {{- end }}
  {{- $roleHolders := list }}
  {{- if not $r.minter }}
  {{- range $lrb := (lookup "rbac.authorization.k8s.io/v1" "RoleBinding" $e.ns "").items | default list }}
  {{- if and (eq (printf "%v" (dig "roleRef" "kind" "" $lrb)) "Role") (eq (printf "%v" (dig "roleRef" "name" "" $lrb)) $r.name) }}
  {{- range $ls := (index $lrb "subjects" | default list) }}
  {{- $lsKind := printf "%v" (index $ls "kind" | default "") }}
  {{- $lsName := printf "%v" (index $ls "name" | default "") }}
  {{- $lsNs := "" }}
  {{- if eq $lsKind "ServiceAccount" }}
  {{- $lsNs = printf "%v" (index $ls "namespace" | default $e.ns) }}
  {{- else if and (eq $lsKind "User") (hasPrefix "system:serviceaccount:" $lsName) (eq (len (splitList ":" $lsName)) 4) }}
  {{- $lsNs = index (splitList ":" $lsName) 2 }}
  {{- $lsName = index (splitList ":" $lsName) 3 }}
  {{- end }}
  {{- if $lsNs }}
  {{- if not (hasKey $tokCache $lsNs) }}
  {{- $holders := dict }}
  {{- range $sec := (lookup "v1" "Secret" $lsNs "" "autoshift.io/managed-by=namespace-rbac").items | default list }}
  {{- if eq (printf "%v" (dig "type" "" $sec)) "kubernetes.io/service-account-token" }}{{- $_ := set $holders (printf "%v" (index (dig "metadata" "annotations" dict $sec) "kubernetes.io/service-account.name" | default "")) true }}{{- end }}
  {{- end }}
  {{- $_ := set $tokCache $lsNs $holders }}
  {{- end }}
  {{- if hasKey (index $tokCache $lsNs) $lsName }}
  {{- $roleHolders = append $roleHolders (printf "%s/%s (RoleBinding %s)" $lsNs $lsName (dig "metadata" "name" "" $lrb)) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- $nsTokens := list }}
  {{- if $r.workload }}
  {{- if not (hasKey $tokCache $e.ns) }}
  {{- $holders := dict }}
  {{- range $sec := (lookup "v1" "Secret" $e.ns "" "autoshift.io/managed-by=namespace-rbac").items | default list }}
  {{- if eq (printf "%v" (dig "type" "" $sec)) "kubernetes.io/service-account-token" }}{{- $_ := set $holders (printf "%v" (index (dig "metadata" "annotations" dict $sec) "kubernetes.io/service-account.name" | default "")) true }}{{- end }}
  {{- end }}
  {{- $_ := set $tokCache $e.ns $holders }}
  {{- end }}
  {{- $nsTokens = keys (index $tokCache $e.ns) | sortAlpha }}
  {{- end }}
  {{- if and $live (ne (printf "%v" (index (dig "metadata" "labels" dict $live) "autoshift.io/managed-by" | default "")) "namespace-rbac") }}
  {{- $_ := set $heldRoles $r.name true }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "Role %s/%s already exists and is not managed by namespace-rbac, so it is not changed" $e.ns $r.name)) }}
  {{- else if $nsTokens }}
  {{- $_ := set $heldRoles $r.name true }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "Role %s/%s is not created or changed: it creates or changes workloads in a namespace that holds long-lived token Secrets of %s managed by namespace-rbac" $e.ns $r.name (join ", " $nsTokens))) }}
  {{- else if $roleHolders }}
  {{- $_ := set $heldRoles $r.name true }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "Role %s/%s is not created or changed: it is not minter-only, and it is bound to %s, which has a long-lived token Secret managed by namespace-rbac" $e.ns $r.name (join ", " (uniq $roleHolders)))) }}
  {{- else if $tokenSecrets }}
  {{- $_ := set $heldRoles $r.name true }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "Role %s/%s is not created or changed: secrets resourceNames %s name ServiceAccount token or dockercfg Secrets" $e.ns $r.name (join ", " $tokenSecrets))) }}
  {{- else if $foreignSAs }}
  {{- $_ := set $heldRoles $r.name true }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "Role %s/%s is not created or changed: serviceaccounts/token resourceNames %s name ServiceAccounts that are not managed by namespace-rbac" $e.ns $r.name (join ", " $foreignSAs))) }}
  {{- else }}
  {{- if $r.minter }}{{- $_ := set $renderedMinters (printf "%s|%s" $e.ns $r.name) true }}{{- end }}
  {{hub- if eq $want "enforce" hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: {{ $r.name | toJson }}
        namespace: {{ $e.ns | toJson }}
        labels:
          autoshift.io/managed-by: namespace-rbac
      rules: {{ $r.rules | toJson }}
  {{hub- end hub}}
  {{- end }}
  {{- end }}
  {{- range $b := $e.bindings }}
  {{- $live := lookup "rbac.authorization.k8s.io/v1" "RoleBinding" $e.ns $b.name }}
  {{- $kept := list }}
  {{- range $s := $b.subjects }}
  {{- if lookup "v1" "Namespace" "" $s.namespace }}
  {{- $kept = append $kept $s }}
  {{- else }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "RoleBinding %s/%s: subject %s/%s is left out, because namespace %s does not exist" $e.ns $b.name $s.namespace $s.name $s.namespace)) }}
  {{- end }}
  {{- end }}
  {{- $tokenHolders := list }}
  {{- if not $b.minter }}
  {{- range $s := $kept }}
  {{- if not (hasKey $tokCache $s.namespace) }}
  {{- $holders := dict }}
  {{- range $sec := (lookup "v1" "Secret" $s.namespace "" "autoshift.io/managed-by=namespace-rbac").items | default list }}
  {{- if eq (printf "%v" (dig "type" "" $sec)) "kubernetes.io/service-account-token" }}{{- $_ := set $holders (printf "%v" (index (dig "metadata" "annotations" dict $sec) "kubernetes.io/service-account.name" | default "")) true }}{{- end }}
