# ServiceAccounts, Roles and RoleBindings per namespace, from config.namespaceRbac, a map keyed by
# namespace. Rendered twice, identically except for $want: manifests/namespace-rbac.yaml is the
# enforce ConfigurationPolicy (Policy policy-namespace-rbac), test/namespace-rbac.yaml the inform one
# (Policy policy-namespace-rbac-test). Keep the two files in sync (a test enforces it).
#
#   config:
#     namespaceRbac:
#       <namespace>:                       # must already exist; never created here
#         serviceAccounts:
#           <name>: true                   # true creates and keeps it, false stops declaring it
#           <name>: {tokenSecret: <secret>} # true, plus a long-lived token Secret (the exception)
#         roles:
#           <name>:
#             rules: [<PolicyRule>, ...]   # apiGroups, resources, verbs, resourceNames only
#         roleBindings:
#           <name>:
#             role: <name>                 # a Role declared in roles of the same namespace, or
#             clusterRole: edit            # edit or view ($clusterRoles), never both keys
#             serviceAccounts:
#               <namespace>/<name>: true   # ServiceAccount subjects only
#
# clusterRole binds a built-in ClusterRole from the fixed allowlist $clusterRoles, edit and view.
# admin and cluster-admin are never bound: they manage RBAC in the namespace, past the safety gate.
# edit creates workloads, reads Secrets, and requests tokens for every ServiceAccount of its
# namespace, so it is refused in a namespace with a tokenSecret ServiceAccount ($tokNs, accepted or
# refused), held on the managed cluster while its namespace has a live labelled token Secret, and a
# live labelled edit RoleBinding in the namespace of a pending token Secret refuses that Secret. No
# token-reachable ServiceAccount is a subject of a clusterRole binding: the closure of what the
# holder of a long-lived token can act as ($reach on the hub from config, $liveReach on the managed
# cluster from live token Secrets and every RoleBinding/ClusterRoleBinding, groups included). An
# identity that can request tokens adds those ServiceAccounts; one that can create workloads, read or
# write Secrets, exec/attach/ephemeralcontainers, request tokens without resourceNames, bind or
# escalate, or impersonate adds its whole namespace (every namespace through a ClusterRoleBinding).
# Each binding is classified once ($declEdges from config, $edges from live bindings with a
# ServiceAccount subject); the rounds then only walk those edges, both sources in every round, and
# stop when a round adds nothing. At most 6 rounds; still growing means every clusterRole binding is
# refused (fail closed). system:authenticated is not matched (README). A pending token Secret is
# refused while a live edit or view binding names a ServiceAccount it can act as.
#
# Every object is labelled autoshift.io/managed-by: namespace-rbac. Roles and RoleBindings are
# mustonlyhave, so rules and subjects are replaced, never merged; a RoleBinding whose role changes is
# re-created (recreateOption: IfRequired), because roleRef is immutable. ServiceAccounts are
# musthave: they carry only metadata here, and OpenShift adds image pull secrets to them that
# mustonlyhave would fight over. Tokens come from the TokenRequest API.
#
# The one exception (approved 2026-11-13): tokenSecret renders a Secret of type
# kubernetes.io/service-account-token, musthave, with only the kubernetes.io/service-account.name
# annotation and the managed-by label; the cluster fills in the token, and no token or other data
# is ever rendered or read. It is refused unless every RoleBinding anywhere in config.namespaceRbac
# that binds the ServiceAccount points to a minter-only Role ($minter: every rule exactly
# serviceaccounts/token create or serviceaccounts get, in the core group, with resourceNames that
# are ServiceAccounts set to true in that Role's namespace), and unless the tokenSecret name is used
# by one ServiceAccount only. On the managed cluster it is held when the ServiceAccount is not owned,
# or the Secret exists without the managed-by label or for another ServiceAccount. Each rendered
# token Secret is listed under the token-secret-exceptions key of the status ConfigMap, an
# informational line: with no error, the inform ConfigurationPolicy asserts the ConfigMap present
# (musthave) instead of absent, so policy-namespace-rbac-test stays Compliant. A refused or removed token Secret is
# not declared, so a labelled live one is reported by the stale sweep. Whenever a ServiceAccount has
# a tokenSecret ($tokSAs, accepted or refused): a RoleBinding binding it to a non-minter Role is
# refused, and so is a Role bound to it that is not minter-only ($tokRoles); a Role reading a
# declared tokenSecret ($tokSecrets) or minting tokens for such a ServiceAccount is refused. On the
# managed cluster, a RoleBinding to a non-minter Role is held while a subject has a live labelled
# service-account-token Secret (a tokenSecret removed from the values), and so is a non-minter Role
# while a live RoleBinding in its namespace binds it to such a subject ($tokCache caches the token
# holders per namespace). A tokenSecret is refused while any part of the config cannot be inspected
# ($uninspect), or while its namespace has a config Role, accepted or refused, that creates or
# changes workloads ($workloads, $nsWorkload) or can read the Secret ($nsReaders); a config Role
# that creates workloads is held while its namespace has a live labelled token Secret. Token Secrets
# are rendered last ($pending): each is refused while any live ClusterRoleBinding names its
# ServiceAccount, any live RoleBinding names it without pointing to a minter-only Role rendered in
# this evaluation ($renderedMinters), or a live Role in its namespace creates workloads or can read
# it. A subject names a ServiceAccount as kind ServiceAccount or as kind User
# system:serviceaccount:<namespace>:<name>; groups are not matched.
#
# Errors are found on the hub (the shape of the config, the safety gate) and on the managed cluster
# (a missing namespace, an object of a declared name without the managed-by label). A namespace-level
# error (name, platform namespace, shape) skips the whole namespace. Any other error skips only its
# ServiceAccount, Role or RoleBinding; a RoleBinding whose Role has an error or is not owned here is
# skipped too. Every other entry still applies. Errors are reported in the ConfigMap
# namespace-rbac-status (open-cluster-management-agent-addon), one data key per namespace, messages
# joined by "; ". The enforce ConfigurationPolicy writes it while there are errors and deletes it
# when there are none; the inform one asserts it is absent, so policy-namespace-rbac-test is
# NonCompliant while any error stands. A hub `fail` is not used: one bad entry would block every valid one.
#
# Safety gate, rule by rule (strings are trimmed and lower-cased before the checks):
#   - * anywhere in apiGroups, resources, verbs or resourceNames;
#   - the verbs escalate, bind and impersonate;
#   - the resources roles, rolebindings, clusterroles, clusterrolebindings, rolebindingrestrictions,
#     securitycontextconstraints and nodes, with any subresource;
#   - pods/exec, pods/attach, pods/portforward, pods/proxy, pods/ephemeralcontainers, services/proxy
#     and builds/custom;
#   - manifestworks, policies, placementbindings, placements, managedclusteractions and
#     managedclusterviews, in any apiGroup, with any subresource;
#   - secrets and serviceaccounts/token without resourceNames, and serviceaccounts with create
#     without resourceNames;
#   - serviceaccounts/token resourceNames that are not a true entry of serviceAccounts of the same
#     namespace;
#   - namespaces and projects with any verb other than get, list and watch;
#   - nonResourceURLs, or a resourceNames list that is set but empty (it would mean every name).
# Also refused: a platform namespace ($platformNs: kube-*, openshift, openshift-*, default,
# open-cluster-management*, multicluster-engine, hive, local-cluster, policies-*, hypershift,
# clusters, clusters-*) or the name of a ManagedCluster on the hub, as the namespace or as the
# namespace of a subject, default as a serviceAccounts key or a subject, a name that is not DNS-1123
# (namespaces are labels, the rest subdomains), and template delimiters in any name or value.
# Keep the lists in sync with the README.
#
# On the managed cluster, a Role is held when a secrets resourceName names a Secret of type
# kubernetes.io/service-account-token or kubernetes.io/dockercfg in its namespace, or a
# serviceaccounts/token resourceName names a ServiceAccount without the managed-by label, and a
# subject whose namespace does not exist is left out of its RoleBinding (no RoleBinding is rendered
# when none is left); all are reported. A held or skipped object keeps its live state.
#
# Removal is manual. An object labelled autoshift.io/managed-by: namespace-rbac that this run does
# not declare (removed, set to false, a RoleBinding with no true subject left) gets mustnothave in
# the inform ConfigurationPolicy only, so it is reported and never deleted. Objects with errors stay
# declared and are never reported, and nothing in a namespace with a namespace-level error is. No
# sweep runs when the rendered config cannot be read or namespaceRbac is not a map.
#
# Hub results reach the managed side as base64-encoded JSON in one quoted string, never as template
# text: go-template-utils rewrites template text with regexes (autoindent, toInt) before parsing,
# also inside a quoted string.
object-templates-raw: |
  {{hub- $want := "inform" hub}}
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $cfgRaw := index ($rcm.data | default dict) "config" | default "" | fromYaml hub}}
  {{hub- $cfg := dict hub}}
  {{hub- if kindIs "map" $cfgRaw hub}}{{hub- $cfg = $cfgRaw hub}}{{hub- end hub}}
  {{hub- $errs := dict hub}}
  {{hub- $held := dict hub}}
  {{hub- $declared := dict hub}}
  {{hub- $entries := list hub}}
  {{hub- $sweep := false hub}}
  {{hub- $nsMap := dict hub}}
  {{hub- $nsRaw := index $cfg "namespaceRbac" hub}}
  {{hub- if not (and $rcm $cfg) hub}}
  {{hub- $_ := set $errs "rendered-config" (list (printf "cannot read %s.rendered-config" .ManagedClusterName)) hub}}
  {{hub- else if kindIs "map" $nsRaw hub}}
  {{hub- $nsMap = $nsRaw hub}}
  {{hub- $sweep = true hub}}
  {{hub- else if kindIs "invalid" $nsRaw hub}}
  {{hub- $sweep = true hub}}
  {{hub- else hub}}
  {{hub- $_ := set $errs "namespaceRbac" (list "config.namespaceRbac is not a map") hub}}
  {{hub- end hub}}
  {{hub- $dns1123 := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" hub}}
  {{hub- $subdomain := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" hub}}
  {{hub- $platformNs := "^(kube-.*|openshift|openshift-.*|default|open-cluster-management.*|multicluster-engine|hive|local-cluster|policies-.*|hypershift|clusters|clusters-.*)$" hub}}
  {{hub- $clusters := dict hub}}
  {{hub- range $mc := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items | default list hub}}{{hub- $_ := set $clusters (printf "%v" (dig "metadata" "name" "" $mc)) true hub}}{{hub- end hub}}
  {{hub- $ruleFields := list "apiGroups" "resources" "verbs" "resourceNames" hub}}
  {{hub- $badVerbs := list "escalate" "bind" "impersonate" hub}}
  {{hub- $readVerbs := list "get" "list" "watch" hub}}
  {{hub- $workloads := list "pods" "deployments" "statefulsets" "daemonsets" "replicasets" "jobs" "cronjobs" "replicationcontrollers" "deploymentconfigs" "deploymentconfigs/instantiate" "deploymentconfigs/rollback" "builds" "builds/clone" "builds/docker" "builds/source" "buildconfigs" "buildconfigs/instantiate" "buildconfigs/instantiatebinary" "buildconfigs/webhooks" "podtemplates" "taskruns" "pipelineruns" "virtualmachines" "virtualmachineinstances" "workflows" hub}}
  {{hub- $denied := list (dict "re" "^(roles|rolebindings|clusterroles|clusterrolebindings|rolebindingrestrictions)(/.*)?$" "why" "RBAC objects grant permissions") (dict "re" "^securitycontextconstraints(/.*)?$" "why" "SCC use changes the security posture of pods") (dict "re" "^nodes(/.*)?$" "why" "nodes are not namespaced and reach the host") (dict "re" "^(pods/(exec|attach|portforward|proxy|ephemeralcontainers)|services/proxy)$" "why" "it reaches into running workloads") (dict "re" "^builds/custom$" "why" "custom builds run privileged") (dict "re" "^(manifestworks|policies|placementbindings|placements|managedclusteractions|managedclusterviews)(/.*)?$" "why" "it acts on managed clusters through Red Hat Advanced Cluster Management") hub}}
  {{hub- $exKey := "token-secret-exceptions" hub}}
  {{hub- $usedKeys := dict $exKey true hub}}
  {{hub- $saInfo := dict hub}}
  {{hub- $owned := dict hub}}
  {{hub- $tokUsers := dict hub}}
  {{hub- $tokSAs := dict hub}}
  {{hub- $tokNs := dict hub}}
  {{hub- $clusterRoles := list "edit" "view" hub}}
  {{hub- $tokSecrets := dict hub}}
  {{hub- $tokRoles := dict hub}}
  {{hub- $uninspect := list hub}}
  {{hub- $nsWorkload := dict hub}}
  {{hub- $nsReaders := dict hub}}
  {{hub- range $ns := keys $nsMap | sortAlpha hub}}
  {{hub- $ent := index $nsMap $ns hub}}
  {{hub- if and (not (kindIs "invalid" $ent)) (not (kindIs "map" $ent)) hub}}{{hub- $uninspect = append $uninspect (printf "namespaceRbac.%s is not a map" ($ns | toJson)) hub}}{{hub- end hub}}
  {{hub- if kindIs "map" $ent hub}}
  {{hub- range $sec := list "serviceAccounts" "roleBindings" hub}}{{hub- $sv := index $ent $sec hub}}{{hub- if and (not (kindIs "invalid" $sv)) (not (kindIs "map" $sv)) hub}}{{hub- $uninspect = append $uninspect (printf "namespaceRbac.%s.%s is not a map" ($ns | toJson) $sec) hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- $rbU := index $ent "roleBindings" hub}}
  {{hub- if kindIs "map" $rbU hub}}{{hub- range $bn := keys $rbU | sortAlpha hub}}{{hub- $bU := index $rbU $bn hub}}{{hub- if not (kindIs "map" $bU) hub}}{{hub- $uninspect = append $uninspect (printf "namespaceRbac.%s.roleBindings.%s is not a map" ($ns | toJson) ($bn | toJson)) hub}}{{hub- else if not (kindIs "map" (index $bU "serviceAccounts")) hub}}{{hub- $uninspect = append $uninspect (printf "namespaceRbac.%s.roleBindings.%s.serviceAccounts is not a map" ($ns | toJson) ($bn | toJson)) hub}}{{hub- end hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- $sasP := dict hub}}
  {{hub- if kindIs "map" $ent hub}}{{hub- if kindIs "map" (index $ent "serviceAccounts") hub}}{{hub- $sasP = index $ent "serviceAccounts" hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- range $sa := keys $sasP | sortAlpha hub}}
  {{hub- $sv := index $sasP $sa hub}}
  {{hub- $serr := "" hub}}
  {{hub- $on := "false" hub}}
  {{hub- $tok := "" hub}}
  {{hub- if or (contains "{{" $sa) (contains "}}" $sa) hub}}
  {{hub- $serr = "contains template delimiters" hub}}
  {{hub- else if or (gt (len $sa) 253) (not (regexMatch $subdomain $sa)) hub}}
  {{hub- $serr = "is not a valid DNS-1123 subdomain" hub}}
  {{hub- else if eq $sa "default" hub}}
  {{hub- $serr = "is the ServiceAccount of every pod that names none, which OpenShift creates in every namespace; it is never managed here" hub}}
  {{hub- else if kindIs "map" $sv hub}}
  {{hub- range $sk := keys $sv | sortAlpha hub}}{{hub- if ne $sk "tokenSecret" hub}}{{hub- $serr = printf "key %s is not tokenSecret" ($sk | toJson) hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- $t := index $sv "tokenSecret" hub}}
  {{hub- if $serr hub}}
  {{hub- else if not (kindIs "string" $t) hub}}
  {{hub- $serr = "tokenSecret is not a string" hub}}
  {{hub- else if or (contains "{{" $t) (contains "}}" $t) hub}}
  {{hub- $serr = "tokenSecret contains template delimiters" hub}}
  {{hub- else if or (gt (len $t) 253) (not (regexMatch $subdomain $t)) hub}}
  {{hub- $serr = "tokenSecret is not a valid DNS-1123 subdomain" hub}}
  {{hub- else hub}}
  {{hub- $on = "true" hub}}
  {{hub- $tok = $t hub}}
  {{hub- end hub}}
  {{hub- else hub}}
  {{hub- $on = printf "%v" $sv hub}}
  {{hub- if or (contains "{{" $on) (contains "}}" $on) hub}}
  {{hub- $serr = "contains template delimiters" hub}}
  {{hub- else if not (has $on (list "true" "false")) hub}}
  {{hub- $serr = "is not true, false, or a map with tokenSecret" hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- $_ := set $saInfo (printf "%s/%s" $ns $sa) (dict "err" $serr "on" $on "tok" $tok) hub}}
  {{hub- if kindIs "map" $sv hub}}{{hub- if hasKey $sv "tokenSecret" hub}}{{hub- $_ := set $tokSAs (printf "%s/%s" $ns $sa) true hub}}{{hub- $_ := set $tokNs $ns (append (index $tokNs $ns | default list) $sa) hub}}{{hub- $_ := set $tokSecrets (printf "%s|%v" $ns (index $sv "tokenSecret")) true hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- if and (not $serr) (eq $on "true") hub}}{{hub- $_ := set $owned (printf "%s/%s" $ns $sa) true hub}}{{hub- end hub}}
  {{hub- if and (not $serr) $tok hub}}{{hub- $tk := printf "%s|%s" $ns $tok hub}}{{hub- $_ := set $tokUsers $tk (append (index $tokUsers $tk | default list) $sa) hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- $minter := dict hub}}
  {{hub- $saRefs := dict hub}}
  {{hub- range $ns := keys $nsMap | sortAlpha hub}}
  {{hub- $ent := index $nsMap $ns hub}}
  {{hub- if kindIs "map" $ent hub}}
  {{hub- $rolesP := index $ent "roles" hub}}
  {{hub- if kindIs "map" $rolesP hub}}
  {{hub- range $rn := keys $rolesP | sortAlpha hub}}
  {{hub- $role := index $rolesP $rn hub}}
  {{hub- $wl := false hub}}
  {{hub- $rd := list hub}}
  {{hub- $rdAll := false hub}}
  {{hub- if kindIs "map" $role hub}}{{hub- if kindIs "slice" (index $role "rules") hub}}
  {{hub- range $rule := index $role "rules" hub}}{{hub- if kindIs "map" $rule hub}}
  {{hub- $rr := list hub}}{{hub- $rv := list hub}}{{hub- $rnn := list hub}}
  {{hub- if kindIs "slice" (index $rule "resources") hub}}{{hub- range $x := index $rule "resources" hub}}{{hub- $rr = append $rr (lower (trim (printf "%v" $x))) hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- if kindIs "slice" (index $rule "verbs") hub}}{{hub- range $x := index $rule "verbs" hub}}{{hub- $rv = append $rv (lower (trim (printf "%v" $x))) hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- if kindIs "slice" (index $rule "resourceNames") hub}}{{hub- range $x := index $rule "resourceNames" hub}}{{hub- $rnn = append $rnn (printf "%v" $x) hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- $wv := false hub}}{{hub- range $x := $rv hub}}{{hub- if has $x (list "create" "update" "patch" "*") hub}}{{hub- $wv = true hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- range $x := $rr hub}}
  {{hub- if and $wv (or (has $x $workloads) (contains "*" $x)) hub}}{{hub- $wl = true hub}}{{hub- end hub}}
  {{hub- if or (eq $x "secrets") (eq $x "*") hub}}{{hub- if $rnn hub}}{{hub- $rd = concat $rd $rnn hub}}{{hub- else hub}}{{hub- $rdAll = true hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}{{hub- end hub}}
  {{hub- end hub}}{{hub- end hub}}
  {{hub- if $wl hub}}{{hub- $_ := set $nsWorkload $ns (append (index $nsWorkload $ns | default list) $rn) hub}}{{hub- end hub}}
  {{hub- range $x := $rd hub}}{{hub- $k := printf "%s|%s" $ns $x hub}}{{hub- $_ := set $nsReaders $k (append (index $nsReaders $k | default list) $rn) hub}}{{hub- end hub}}
  {{hub- if $rdAll hub}}{{hub- $k := printf "%s|*" $ns hub}}{{hub- $_ := set $nsReaders $k (append (index $nsReaders $k | default list) $rn) hub}}{{hub- end hub}}
  {{hub- $mo := false hub}}
  {{hub- if kindIs "map" $role hub}}{{hub- if and (eq (len $role) 1) (kindIs "slice" (index $role "rules")) hub}}{{hub- $mo = gt (len (index $role "rules")) 0 hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- if $mo hub}}
  {{hub- range $rule := index $role "rules" hub}}
  {{hub- if not (kindIs "map" $rule) hub}}
  {{hub- $mo = false hub}}
  {{hub- else hub}}
  {{hub- range $rk := keys $rule hub}}{{hub- if not (has $rk $ruleFields) hub}}{{hub- $mo = false hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- $ag := index $rule "apiGroups" hub}}{{hub- $rs := index $rule "resources" hub}}{{hub- $vb := index $rule "verbs" hub}}{{hub- $rnm := index $rule "resourceNames" hub}}
  {{hub- if not (and (kindIs "slice" $ag) (kindIs "slice" $rs) (kindIs "slice" $vb) (kindIs "slice" $rnm)) hub}}
  {{hub- $mo = false hub}}
  {{hub- else if not (and (eq (len $ag) 1) (eq (len $rs) 1) (eq (len $vb) 1) (gt (len $rnm) 0)) hub}}
  {{hub- $mo = false hub}}
  {{hub- else if not (has (printf "%v|%v|%v" (index $ag 0) (index $rs 0) (index $vb 0)) (list "|serviceaccounts/token|create" "|serviceaccounts|get")) hub}}
  {{hub- $mo = false hub}}
  {{hub- else hub}}
  {{hub- range $n := $rnm hub}}{{hub- if or (not (hasKey $owned (printf "%s/%v" $ns $n))) (hasKey $tokSAs (printf "%s/%v" $ns $n)) hub}}{{hub- $mo = false hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- if $mo hub}}{{hub- $_ := set $minter (printf "%s|%s" $ns $rn) true hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- $bindP := index $ent "roleBindings" hub}}
  {{hub- if kindIs "map" $bindP hub}}
  {{hub- range $bn := keys $bindP | sortAlpha hub}}
  {{hub- $b := index $bindP $bn hub}}
  {{hub- if kindIs "map" $b hub}}
  {{hub- $subjP := index $b "serviceAccounts" hub}}
  {{hub- $refKind := "Role" hub}}
  {{hub- $refName := printf "%v" (index $b "role") hub}}
  {{hub- if hasKey $b "clusterRole" hub}}{{hub- $refKind = "ClusterRole" hub}}{{hub- $refName = printf "%v" (index $b "clusterRole") hub}}{{hub- end hub}}
  {{hub- if kindIs "map" $subjP hub}}
  {{hub- range $ref := keys $subjP | sortAlpha hub}}
  {{hub- if eq (printf "%v" (index $subjP $ref)) "true" hub}}
  {{hub- $_ := set $saRefs $ref (append (index $saRefs $ref | default list) (dict "rb" (printf "%s/%s" $ns $bn) "kind" $refKind "role" $refName "ns" $ns)) hub}}
  {{hub- if and (eq $refKind "Role") (hasKey $tokSAs $ref) hub}}{{hub- $rk := printf "%s|%v" $ns (index $b "role") hub}}{{hub- $_ := set $tokRoles $rk (append (index $tokRoles $rk | default list) $ref) hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- $declEdges := dict hub}}
  {{hub- range $ref := keys $saRefs | sortAlpha hub}}
  {{hub- range $r := index $saRefs $ref hub}}
  {{hub- $targets := list hub}}
  {{hub- $all := false hub}}
  {{hub- $rules := list hub}}
  {{hub- if ne $r.kind "Role" hub}}
  {{hub- $all = ne $r.role "view" hub}}
  {{hub- else hub}}
  {{hub- $rent := index $nsMap $r.ns hub}}
  {{hub- $rrole := dict hub}}
  {{hub- if kindIs "map" $rent hub}}{{hub- if kindIs "map" (index $rent "roles") hub}}{{hub- $rrole = index (index $rent "roles") $r.role hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- if and (kindIs "map" $rrole) (kindIs "slice" (index $rrole "rules")) hub}}{{hub- $rules = index $rrole "rules" hub}}{{hub- else hub}}{{hub- $all = true hub}}{{hub- end hub}}
  {{hub- end hub}}
  {{hub- range $rule := $rules hub}}
  {{hub- if not (kindIs "map" $rule) hub}}
  {{hub- $all = true hub}}
  {{hub- else hub}}
  {{hub- $rs := list "*" hub}}{{hub- if kindIs "slice" (index $rule "resources") hub}}{{hub- $rs = list hub}}{{hub- range $x := index $rule "resources" hub}}{{hub- $rs = append $rs (lower (trim (printf "%v" $x))) hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- $vs := list "*" hub}}{{hub- if kindIs "slice" (index $rule "verbs") hub}}{{hub- $vs = list hub}}{{hub- range $x := index $rule "verbs" hub}}{{hub- $vs = append $vs (lower (trim (printf "%v" $x))) hub}}{{hub- end hub}}{{hub- end hub}}
  {{hub- $any := has "*" $vs hub}}
  {{hub- $write := or $any (has "create" $vs) (has "update" $vs) (has "patch" $vs) hub}}
  {{hub- $read := or $any (has "get" $vs) (has "list" $vs) (has "watch" $vs) hub}}
  {{hub- $imp := or $any (has "impersonate" $vs) hub}}
  {{hub- $bindEsc := or $any (has "bind" $vs) (has "escalate" $vs) hub}}
  {{hub- range $x := $rs hub}}
  {{hub- $wild := contains "*" $x hub}}
