  {{- $_ := set $tokCache $s.namespace $holders }}
  {{- end }}
  {{- if hasKey (index $tokCache $s.namespace) $s.name }}
  {{- $tokenHolders = append $tokenHolders (printf "%s/%s" $s.namespace $s.name) }}
