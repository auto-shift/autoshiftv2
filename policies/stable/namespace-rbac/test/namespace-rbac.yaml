  {{- else if $reached }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "RoleBinding %s/%s is not created or changed: it binds ClusterRole %s to %s, which whoever holds a long-lived token Secret managed by namespace-rbac can act as" $e.ns $b.name $b.role (join ", " $reached))) }}
  {{- else if $editTokens }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "RoleBinding %s/%s is not created or changed: it binds ClusterRole edit in a namespace that holds long-lived token Secrets of %s managed by namespace-rbac" $e.ns $b.name (join ", " $editTokens))) }}
  {{- else if not $kept }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "RoleBinding %s/%s is not created or changed: no subject namespace exists" $e.ns $b.name)) }}
  {{- else if and $live (ne (printf "%v" (index (dig "metadata" "labels" dict $live) "autoshift.io/managed-by" | default "")) "namespace-rbac") }}
  {{- $_ := set $status $e.key (append (index $status $e.key | default list) (printf "RoleBinding %s/%s already exists and is not managed by namespace-rbac, so it is not changed" $e.ns $b.name)) }}
  {{- else }}
  {{hub- if eq $want "enforce" hub}}
  - complianceType: mustonlyhave
    recreateOption: IfRequired
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ $b.name | toJson }}
        namespace: {{ $e.ns | toJson }}
        labels:
          autoshift.io/managed-by: namespace-rbac
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: {{ $b.kind | toJson }}
        name: {{ $b.role | toJson }}
      subjects:
        {{- range $s := $kept }}
        - kind: ServiceAccount
          name: {{ $s.name | toJson }}
          namespace: {{ $s.namespace | toJson }}
        {{- end }}
  {{hub- end hub}}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $pending (not $liveRBs) (not $liveCRBs) }}
  {{- $liveRBs = (lookup "rbac.authorization.k8s.io/v1" "RoleBinding" "" "").items | default list }}
  {{- $liveCRBs = (lookup "rbac.authorization.k8s.io/v1" "ClusterRoleBinding" "" "").items | default list }}
  {{- end }}
  {{- range $tk := $pending }}
  {{- $wide := list }}
  {{- $uName := printf "system:serviceaccount:%s:%s" $tk.ns $tk.sa }}
  {{- $tkRef := printf "%s/%s" $tk.ns $tk.sa }}
  {{- if $liveGrew }}
  {{- $wide = append $wide "token reachability did not converge within 6 rounds (fail closed)" }}
  {{- end }}
  {{- range $cb := $crBinds }}
  {{- range $sub := $cb.subs }}
  {{- $by := list }}
  {{- if $sub.gall }}{{- range $k, $v := $liveReach }}{{- $by = concat $by $v }}{{- end }}
  {{- else if $sub.gns }}{{- range $k, $v := $liveReach }}{{- if or (eq $k "*") (hasPrefix (printf "%s/" $sub.gns) $k) }}{{- $by = concat $by $v }}{{- end }}{{- end }}
  {{- else }}{{- $by = concat $by (index $liveReach $sub.ref | default list) (index $liveReach (printf "%s/*" (first (splitList "/" $sub.ref))) | default list) (index $liveReach "*" | default list) }}
  {{- end }}
  {{- if and (has $tkRef $by) (ne $sub.ref $tkRef) }}
  {{- $wide = append $wide (printf "%s binds ClusterRole %s to %s, which the ServiceAccount can act as" $cb.name $cb.role $sub.label) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $lrb := $liveRBs }}
  {{- $rbNs := printf "%v" (dig "metadata" "namespace" "" $lrb) }}
  {{- if and (eq $rbNs $tk.ns) (eq (printf "%v" (dig "roleRef" "kind" "" $lrb)) "ClusterRole") (eq (printf "%v" (dig "roleRef" "name" "" $lrb)) "edit") (eq (printf "%v" (index (dig "metadata" "labels" dict $lrb) "autoshift.io/managed-by" | default "")) "namespace-rbac") }}
  {{- $wide = append $wide (printf "RoleBinding %s/%v binds ClusterRole edit in the namespace of the Secret" $rbNs (dig "metadata" "name" "" $lrb)) }}
  {{- end }}
  {{- range $ls := (index $lrb "subjects" | default list) }}
  {{- $sk := printf "%v" (index $ls "kind" | default "") }}
  {{- $sn := printf "%v" (index $ls "name" | default "") }}
  {{- if or (and (eq $sk "ServiceAccount") (eq $sn $tk.sa) (eq (printf "%v" (index $ls "namespace" | default $rbNs)) $tk.ns)) (and (eq $sk "User") (eq $sn $uName)) }}
  {{- if not (and (eq (printf "%v" (dig "roleRef" "kind" "" $lrb)) "Role") (hasKey $renderedMinters (printf "%s|%v" $rbNs (dig "roleRef" "name" "" $lrb)))) }}
  {{- $wide = append $wide (printf "RoleBinding %s/%v (%v %v)" $rbNs (dig "metadata" "name" "" $lrb) (dig "roleRef" "kind" "" $lrb) (dig "roleRef" "name" "" $lrb)) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $crb := $liveCRBs }}
  {{- range $ls := (index $crb "subjects" | default list) }}
  {{- $sk := printf "%v" (index $ls "kind" | default "") }}
  {{- $sn := printf "%v" (index $ls "name" | default "") }}
  {{- if or (and (eq $sk "ServiceAccount") (eq $sn $tk.sa) (eq (printf "%v" (index $ls "namespace" | default "")) $tk.ns)) (and (eq $sk "User") (eq $sn $uName)) }}
  {{- $wide = append $wide (printf "ClusterRoleBinding %v (ClusterRole %v)" (dig "metadata" "name" "" $crb) (dig "roleRef" "name" "" $crb)) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $lr := (lookup "rbac.authorization.k8s.io/v1" "Role" $tk.ns "").items | default list }}
  {{- range $rule := (index $lr "rules" | default list) }}
  {{- $rr := list }}{{- range $x := (index $rule "resources" | default list) }}{{- $rr = append $rr (lower (printf "%v" $x)) }}{{- end }}
  {{- $rv := list }}{{- range $x := (index $rule "verbs" | default list) }}{{- $rv = append $rv (lower (printf "%v" $x)) }}{{- end }}
  {{- $rnn := list }}{{- range $x := (index $rule "resourceNames" | default list) }}{{- $rnn = append $rnn (printf "%v" $x) }}{{- end }}
  {{- $wv := false }}{{- range $x := $rv }}{{- if has $x (list "create" "update" "patch" "*") }}{{- $wv = true }}{{- end }}{{- end }}
  {{- range $x := $rr }}
  {{- if and $wv (or (has $x $hub.workloads) (contains "*" $x)) }}{{- $wide = append $wide (printf "Role %s/%v creates or changes %s" $tk.ns (dig "metadata" "name" "" $lr) $x) }}{{- end }}
  {{- if and (or (eq $x "secrets") (eq $x "*")) (or (not $rnn) (has $tk.secret $rnn)) }}{{- $wide = append $wide (printf "Role %s/%v can read Secret %s" $tk.ns (dig "metadata" "name" "" $lr) $tk.secret) }}{{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $wide }}
  {{- $_ := set $status $tk.key (append (index $status $tk.key | default list) (printf "token Secret %s/%s is not created or changed: live objects widen ServiceAccount %s beyond a minter-only Role that namespace-rbac renders: %s" $tk.ns $tk.secret $tk.sa (join ", " (uniq $wide)))) }}
  {{- else }}
  {{- $exceptions = append $exceptions (printf "Secret %s/%s holds a long-lived token of the minter-only ServiceAccount %s" $tk.ns $tk.secret $tk.sa) }}
  {{hub- if eq $want "enforce" hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/service-account-token
      metadata:
        name: {{ $tk.secret | toJson }}
        namespace: {{ $tk.ns | toJson }}
        labels:
          autoshift.io/managed-by: namespace-rbac
        annotations:
          kubernetes.io/service-account.name: {{ $tk.sa | toJson }}
  {{hub- end hub}}
  {{- end }}
  {{- end }}
  {{hub- if eq $want "inform" hub}}
  {{- if $hub.sweep }}
  {{- range $kind := list (dict "apiVersion" "v1" "kind" "ServiceAccount") (dict "apiVersion" "v1" "kind" "Secret") (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "Role") (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "RoleBinding") }}
  {{- range $obj := (lookup $kind.apiVersion $kind.kind "" "" "autoshift.io/managed-by=namespace-rbac").items | default list }}
  {{- $objNs := printf "%v" (dig "metadata" "namespace" "" $obj) }}
  {{- $objName := printf "%v" (dig "metadata" "name" "" $obj) }}
  {{- if not (or (hasKey $hub.held $objNs) (hasKey $hub.declared (printf "%s|%s|%s" $kind.kind $objNs $objName))) }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: {{ $kind.apiVersion | toJson }}
      kind: {{ $kind.kind | toJson }}
      metadata:
        name: {{ $objName | toJson }}
        namespace: {{ $objNs | toJson }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{hub- end hub}}
  {{hub- if eq $want "enforce" hub}}
  {{- if or $status $exceptions }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: namespace-rbac-status
        namespace: open-cluster-management-agent-addon
        labels:
          autoshift.io/managed-by: namespace-rbac
      data:
        {{- range $k, $msgs := $status }}
        {{ $k | toJson }}: {{ join "; " $msgs | toJson }}
        {{- end }}
        {{- if $exceptions }}
        {{ $hub.exKey | toJson }}: {{ printf "approved exception, informational: %s" (join "; " $exceptions) | toJson }}
        {{- end }}
  {{- else }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: namespace-rbac-status
        namespace: open-cluster-management-agent-addon
  {{- end }}
  {{hub- else hub}}
  {{- if or $status (not $exceptions) }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: namespace-rbac-status
        namespace: open-cluster-management-agent-addon
  {{- else }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: namespace-rbac-status
        namespace: open-cluster-management-agent-addon
  {{- end }}
  {{hub- end hub}}
