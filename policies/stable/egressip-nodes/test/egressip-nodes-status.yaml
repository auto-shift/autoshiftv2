# The report of the enforcing Policy (manifests/egressip-nodes.yaml) must be absent. PolicyGenerator
# renders this manifest as policy-egressip-nodes-test, mustnothave and inform
# (policy-generator-config.yaml), so that Policy is NonCompliant while the enforce side reports a
# missing node, a nodeSelector that matches nothing, or a node that is labeled but no longer
# selected.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egressip-nodes-status
  namespace: open-cluster-management-agent-addon
