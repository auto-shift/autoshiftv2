apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-global-observability-secrets
  namespace: ${POLICY_NAMESPACE}
spec:
  # Global hub only. The rollup secret is built from the observatorium Route and certificates that
  # Multicluster Observability creates on the hub the metrics roll up TO.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/global-observability'
              operator: In
              values:
                - 'true'
            # MCOA is a capability of MultiClusterObservability. Without this predicate the
            # policies here land where policy-acm-observability is never placed, and their
            # dependency on it can never be satisfied: Pending forever rather than off.
            - key: 'autoshift.io/acm-observability'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/self-managed'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
