apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-global-observability-prereq
  namespace: ${POLICY_NAMESPACE}
spec:
  # Deliberately gated on global-observability ONLY. The other policies here also require
  # acm-observability; this one must still land when that is missing, because reporting the
  # mismatch is its whole purpose.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/global-observability'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
