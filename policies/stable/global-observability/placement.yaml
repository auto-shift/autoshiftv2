apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-global-observability
  namespace: ${POLICY_NAMESPACE}
spec:
  # Default placement for this chart: every hub with global-observability enabled.
  # Each policy sets its own placement. Capabilities are not applied here; they are
  # part of policy-acm-observability.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/global-observability'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
