apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-global-observability
  namespace: ${POLICY_NAMESPACE}
spec:
  # Every participating hub, global and intermediate alike: the MCOA capability patch applies to both.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/global-observability'
              operator: In
              values:
                - 'true'
            # MCOA is a capability of MultiClusterObservability. Without this predicate these
            # policies land on a cluster where policy-acm-observability is never placed, and a
            # dependency on it can never be satisfied: Pending forever rather than off.
            - key: 'autoshift.io/acm-observability'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
