# placement-prometheus.yaml restricts this to intermediate hubs (self-managed 'false'), so no
# self-managed conditional belongs here.
object-templates-raw: |
  # INDENTATION ANCHOR
  {{hub- $rollupSrc := lookup "v1" "Secret" "${POLICY_NAMESPACE}" "global-observability-secrets" | default dict hub}}
  {{hub- if not (index $rollupSrc "data") hub}}{{hub fail "global-observability: rollup secret global-observability-secrets not found in namespace ${POLICY_NAMESPACE} on the hub (is policy-global-observability-secrets Compliant?)" hub}}{{hub- end hub}}
      [
        {
          "complianceType": "musthave",
          "objectDefinition": {
            "kind": "Secret",
            "apiVersion": "v1",
            "metadata": {
              "name": "global-observability-secrets",
              "namespace": "open-cluster-management-observability",
            },
            "data": {{hub copySecretData "${POLICY_NAMESPACE}" "global-observability-secrets" hub}},
            "type": "Opaque"

          }
        }
      ]
