object-templates-raw: |
  # INDENTATION ANCHOR
  {{hub $obsConfig := index (index (fromConfigMap "${POLICY_NAMESPACE}" (print .ManagedClusterName ".rendered-config") "config" | default "{}") | fromYaml) "globalObservability" | default dict hub}}
  {{hub- $additionalRW := index $obsConfig "additionalRemoteWrites" | default list hub}}
  {{hub- $isSelfManaged := (index .ManagedClusterLabels "autoshift.io/self-managed" | default "false") hub}}
  {{hub- range $rw := $additionalRW hub}}
    {{hub- $secretRef := index $rw "secretRef" | default dict hub}}
    {{hub- if not (empty $secretRef) hub}}
      {{hub- if not (index $secretRef "name") hub}}{{hub fail "global-observability: additionalRemoteWrites[].secretRef.name is required when secretRef is set" hub}}{{hub- end hub}}
      {{hub- if not (index $secretRef "namespace") hub}}{{hub fail "global-observability: additionalRemoteWrites[].secretRef.namespace is required when secretRef is set" hub}}{{hub- end hub}}
    {{hub- end hub}}
    {{hub- $onSelfManaged := index $rw "onSelfManagedHub" | default false hub}}
    {{hub- if not (and (eq $isSelfManaged "true") (not $onSelfManaged)) hub}}
      {{hub- if not (empty $secretRef) hub}}
      # Each TLS file mounted from this Secret must be a non-empty key in the hub source.
      {{hub- $mount := printf "/etc/prometheus/secrets/%s" (index $secretRef "name") hub}}
      {{hub- range $f := list (index $rw "caFile") (index $rw "certFile") (index $rw "keyFile") hub}}
      {{hub- if and $f (eq (dir $f) $mount) hub}}
      {{hub- if not (fromSecret (index $secretRef "namespace") (index $secretRef "name") (base $f)) hub}}{{hub fail (printf "global-observability: additionalRemoteWrites secretRef %s/%s on the hub has no %s key" (index $secretRef "namespace") (index $secretRef "name") (base $f)) hub}}{{hub- end hub}}
      {{hub- end hub}}
      {{hub- end hub}}
    - complianceType: musthave
      objectDefinition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{hub index $secretRef "name" hub}}'
          namespace: open-cluster-management-observability
        type: Opaque
        data: '{{hub copySecretData (index $secretRef "namespace") (index $secretRef "name") hub}}'
      {{hub- end hub}}
    {{hub- end hub}}
  {{hub- end hub}}
