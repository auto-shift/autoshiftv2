object-templates-raw: |
  {{ $obsHost := ((lookup "route.openshift.io/v1" "Route" "open-cluster-management-observability" "observatorium-api" | default dict).spec).host }}
  {{ if not $obsHost }}{{ fail "global-observability: observatorium-api Route not found in open-cluster-management-observability; cannot build observatorium.url" }}{{ end }}
  {{ $signerCert := lookup "v1" "Secret" "open-cluster-management-observability" "observability-controller-open-cluster-management.io-observability-signer-client-cert" | default dict }}
  {{ if not (index $signerCert "data") }}{{ fail "global-observability: secret observability-controller-open-cluster-management.io-observability-signer-client-cert not found in open-cluster-management-observability (is MCO running?)" }}{{ end }}
  {{ $mcCerts := lookup "v1" "Secret" "open-cluster-management-observability" "observability-managed-cluster-certs" | default dict }}
  {{ if not (index $mcCerts "data") }}{{ fail "global-observability: secret observability-managed-cluster-certs not found in open-cluster-management-observability (is MCO running?)" }}{{ end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: global-observability-secrets
        namespace: ${POLICY_NAMESPACE}
      type: Opaque
      data:
        tls.crt: '{{ fromSecret "open-cluster-management-observability" "observability-controller-open-cluster-management.io-observability-signer-client-cert" "tls.crt" }}'
        tls.key: '{{ fromSecret "open-cluster-management-observability" "observability-controller-open-cluster-management.io-observability-signer-client-cert" "tls.key" }}'
        ca.crt: '{{ fromSecret "open-cluster-management-observability" "observability-managed-cluster-certs" "ca.crt" }}'
      stringData:
        observatorium.url: 'https://{{ $obsHost }}/api/metrics/v1/default/api/v1/receive'
