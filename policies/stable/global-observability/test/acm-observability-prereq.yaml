# Prerequisite gate: MCOA is a capability of MultiClusterObservability, so global-observability
# cannot do anything without acm-observability enabled on the same cluster.
#
# This is placed on global-observability alone, deliberately wider than the other policies here
# (which also require acm-observability). Without it, enabling global-observability while
# acm-observability is false simply places nothing, and the operator sees no reason why. With it,
# the mismatch surfaces as one NonCompliant policy naming the label to set.
object-templates-raw: |
  - complianceType: musthave
    objectDefinition:
      apiVersion: observability.open-cluster-management.io/v1beta2
      kind: MultiClusterObservability
      metadata:
        name: observability
