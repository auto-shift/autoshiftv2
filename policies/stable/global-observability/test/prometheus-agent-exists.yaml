object-templates-raw: |
  {{hub- range $name := (list "mcoa-default-platform-metrics-collector-global" "mcoa-default-user-workload-metrics-collector-global") hub}}
    - complianceType: musthave
      objectDefinition:
        apiVersion: monitoring.rhobs/v1alpha1
        kind: PrometheusAgent
        metadata:
          name: {{hub $name hub}}
          namespace: open-cluster-management-observability
  {{hub- end hub}}
