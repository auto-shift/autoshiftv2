apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-tssc-app-namespaces
  namespace: ${POLICY_NAMESPACE}
spec:
  # Gated on its own label, spelled like its config key: the policy fails when the label is on and
  # config.tssc-app-namespaces declares no applications.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/tssc-app-namespaces'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
