apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renders the shared components/operator-install chart. Visible per-operator ACM lookups below.
#
# OpenShift APIs for Data Protection supports the OwnNamespace install mode only, so the operator
# watches nothing outside the namespace it is installed in. targetNamespaces is therefore that one
# namespace, and a DataProtectionApplication anywhere else is never reconciled. The namespace is
# fixed at openshift-adp rather than configurable: four files would have to agree on it, and a
# disagreement produces a DataProtectionApplication that no operator watches.
#
# On a hub, the cluster-backup MultiClusterHub component installs a second, separate copy into
# open-cluster-management-backup for Red Hat Advanced Cluster Management's own backups. The two do
# not conflict: each has its own OperatorGroup scoped to its own namespace.
helmGlobals:
  chartHome: ../../../../../components/
helmCharts:
  - name: operator-install
    releaseName: oadp
    valuesInline:
      name: oadp
      namespace: openshift-adp
      targetNamespaces:
        - openshift-adp
      remediation: ${REMEDIATION}
      subscription:
        name: '{{hub index .ManagedClusterLabels "autoshift.io/oadp-subscription-name" | default "redhat-oadp-operator" hub}}'
        channel: '{{hub index .ManagedClusterLabels "autoshift.io/oadp-channel" | default "stable" hub}}'
        source: '{{hub $base := (index .ManagedClusterLabels "autoshift.io/oadp-source" | default "redhat-operators") hub}}{{hub ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") hub}}'
        sourceNamespace: '{{hub index .ManagedClusterLabels "autoshift.io/oadp-source-namespace" | default "openshift-marketplace" hub}}'
        startingCSV: |-
          {{hub- $cfg := (index (index (index ((lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict) "data" | default dict) "config" | default "" | fromYaml | default dict) "oadp" | default dict) hub}}
          {{hub- $cfgVers := (dig "versions" (list) $cfg) hub}}
          {{hub- $isCfg := (not (empty $cfgVers)) hub}}
          {{hub- $labelVer := (index .ManagedClusterLabels "autoshift.io/oadp-version" | default "") hub}}
          {{hub- $vers := (ternary $cfgVers (ternary (list) (list $labelVer) (empty $labelVer)) $isCfg) hub}}
          {{hub- (ternary (dig "startingCSV" "" $cfg) $labelVer $isCfg) hub}}
      versions: '{{hub $vers | toRawJson | toLiteral hub}}'
