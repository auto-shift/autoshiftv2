# Copies the hub Secret named by the credential mode in use to this cluster.
#
#   credentialsFrom   a ready-made Velero credentials file, copied as the Secret Velero opens.
#                     One step, nothing to assemble.
#   sourceSecretRef   a plain key pair, copied as oadp-s3-source. The Velero credentials file
#                     cannot be assembled on the hub: hub fromSecret returns a value encrypted with
#                     this cluster namespace's policy encryption key, which only decrypts where it
#                     lands verbatim as a Secret data value, so it cannot be spliced into the middle
#                     of a file. policy-oadp-credentials-assemble builds the file here instead.
#
# Assembly is a separate policy because template resolution is all-or-nothing for a
# ConfigurationPolicy: a read of the staged Secret in the policy that creates it fails, and that
# failure prevents the creation, so nothing ever converges.
#
# copySecretData carries the whole data map untouched and encrypted, which is the mechanism Red Hat
# Advanced Cluster Management documents for propagating secrets. Both modes live in one policy so
# the one the example values declare exercises it; in configSecretRef mode it renders nothing, and
# the generic readiness check asserts the Secret the DataProtectionApplication references.
object-templates-raw: |
  # INDENTATION ANCHOR — every directive below sits at this indent. A shallower trim marker eats
  # past the newline into the previous line and produces invalid YAML.
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $store := (dig "oadp" "storage" (dict) $rcmConfig) hub}}
  {{hub- $credFrom := (index $store "credentialsFrom" | default dict) hub}}
  {{hub- $srcRef := (index $store "sourceSecretRef" | default dict) hub}}
  {{hub- if and (not (empty $credFrom)) (index $srcRef "name") hub}}
  {{hub- fail "oadp: config.oadp.storage.credentialsFrom and storage.sourceSecretRef both set, and both build the Secret Velero opens. Keep one." hub}}
  {{hub- end hub}}
  {{hub- if not (empty $credFrom) hub}}
  {{hub- $srcNs := (index $credFrom "namespace" | default .PolicyMetadata.namespace) hub}}
  {{hub- $srcName := (index $credFrom "name") hub}}
  {{hub- if (empty $srcName) hub}}
  {{hub- fail "oadp: config.oadp.storage.credentialsFrom.name is required when credentialsFrom is set" hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{hub index $credFrom "targetName" | default "cloud-credentials" hub}}
        namespace: openshift-adp
      type: Opaque
      data: '{{hub copySecretData $srcNs $srcName hub}}'
  {{hub- end hub}}
  {{hub- $srcName := (index $srcRef "name" | default "") hub}}
  {{hub- $srcNs := (index $srcRef "namespace" | default .PolicyMetadata.namespace) hub}}
  {{hub- if $srcName hub}}
  {{hub- $src := (lookup "v1" "Secret" $srcNs $srcName) | default dict hub}}
  {{hub- if not (index $src "data") hub}}
  {{hub- fail (printf "oadp: config.oadp.storage.sourceSecretRef names Secret %s/%s, which does not exist on the hub. It supplies access_key_id and access_key_secret, and optionally bucketnames and endpoint." $srcNs $srcName) hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oadp-s3-source
        namespace: openshift-adp
      type: Opaque
      data: '{{hub copySecretData $srcNs $srcName hub}}'
  {{hub- end hub}}
