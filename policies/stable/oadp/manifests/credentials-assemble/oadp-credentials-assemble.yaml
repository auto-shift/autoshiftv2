# sourceSecretRef mode, step two: assemble the Velero credentials file from the staged key pair.
#
# These are managed-cluster templates. The staged Secret is local by the time this runs, because the
# policy depends on the check that proves it arrived, so fromSecret returns base64 and base64dec is
# correct. A missing staged Secret fails loudly here rather than being skipped, and cannot happen
# while that dependency holds.
#
# fromSecret returns an empty string for a key the Secret does not hold, so each half of the key pair
# is checked before anything is written. Otherwise a key pair missing one half would replace a
# working credentials file with one Velero cannot authenticate with.
object-templates-raw: |
  # INDENTATION ANCHOR — every directive below sits at this indent. A shallower trim marker eats
  # past the newline into the previous line and produces invalid YAML.
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config") hub}}
  {{hub- if (empty $raw) hub}}
  {{hub- fail (printf "oadp: ConfigMap %s.rendered-config in %s has no config key, so the storage configuration is unknown" .ManagedClusterName .PolicyMetadata.namespace) hub}}
  {{hub- end hub}}
  {{hub- $rcmConfig := ($raw | fromYaml | default dict) hub}}
  {{hub- $store := (dig "oadp" "storage" (dict) $rcmConfig) hub}}
  {{hub- $srcName := (dig "sourceSecretRef" "name" "" $store) hub}}
  {{hub- $profile := (index $store "profile" | default "") hub}}
  {{hub- if $srcName hub}}
  {{- $keyId := (fromSecret "openshift-adp" "oadp-s3-source" "access_key_id" | base64dec) }}
  {{- $keySecret := (fromSecret "openshift-adp" "oadp-s3-source" "access_key_secret" | base64dec) }}
  {{- if not $keyId }}
  {{- fail "oadp: Secret openshift-adp/oadp-s3-source, copied from the Secret named by config.oadp.storage.sourceSecretRef, has no access_key_id. Add it to the Secret on the hub." }}
  {{- end }}
  {{- if not $keySecret }}
  {{- fail "oadp: Secret openshift-adp/oadp-s3-source, copied from the Secret named by config.oadp.storage.sourceSecretRef, has no access_key_secret. Add it to the Secret on the hub." }}
  {{- end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloud-credentials
        namespace: openshift-adp
      type: Opaque
      stringData:
        cloud: |
          [{{hub $profile | default "default" hub}}]
          aws_access_key_id={{ $keyId }}
          aws_secret_access_key={{ $keySecret }}
          #
          [volumeSnapshot]
          aws_access_key_id={{ $keyId }}
          aws_secret_access_key={{ $keySecret }}
  {{hub- end hub}}
