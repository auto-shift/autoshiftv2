# sourceSecretRef mode, step two: assemble the Velero credentials file from the staged key pair.
#
# These are managed-cluster templates. The staged Secret is local by the time this runs, because the
# policy depends on the check that proves it arrived, so fromSecret returns base64 and base64dec is
# correct. A missing staged Secret fails loudly here rather than being skipped, and cannot happen
# while that dependency holds.
object-templates-raw: |
  # INDENTATION ANCHOR — every directive below sits at this indent. A shallower trim marker eats
  # past the newline into the previous line and produces invalid YAML.
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $store := (dig "oadp" "storage" (dict) $rcmConfig) hub}}
  {{hub- $srcName := (dig "sourceSecretRef" "name" "" $store) hub}}
  {{hub- $profile := (index $store "profile" | default "") hub}}
  {{hub- if $srcName hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloud-credentials
        namespace: openshift-adp
      type: Opaque
      stringData:
        cloud: |
          [{{hub $profile | default "default" hub}}]
          aws_access_key_id={{ fromSecret "openshift-adp" "oadp-s3-source" "access_key_id" | base64dec }}
          aws_secret_access_key={{ fromSecret "openshift-adp" "oadp-s3-source" "access_key_secret" | base64dec }}
          #
          [volumeSnapshot]
          aws_access_key_id={{ fromSecret "openshift-adp" "oadp-s3-source" "access_key_id" | base64dec }}
          aws_secret_access_key={{ fromSecret "openshift-adp" "oadp-s3-source" "access_key_secret" | base64dec }}
  {{hub- end hub}}
