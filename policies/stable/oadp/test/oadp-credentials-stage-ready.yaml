# Has the staged key pair arrived on this cluster? Only meaningful in sourceSecretRef mode, so it
# renders nothing in the others.
#
# The assembling policy depends on this, which is what keeps its fromSecret from running against a
# Secret that does not exist yet. Existence only; the contents are never read.
object-templates-raw: |
  # INDENTATION ANCHOR — every directive below sits at this indent. A shallower trim marker eats
  # past the newline into the previous line and produces invalid YAML.
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $store := (dig "oadp" "storage" (dict) $rcmConfig) hub}}
  {{hub- if (dig "sourceSecretRef" "name" "" $store) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: oadp-s3-source
        namespace: openshift-adp
  {{hub- end hub}}
