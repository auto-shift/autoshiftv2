# The credentials Velero opens must exist on this cluster, and hold the key the
# DataProtectionApplication names.
#
# A missing Secret or key otherwise presents only as a BackupStorageLocation that never reaches
# Available, which points at the bucket rather than at the credentials. This names the cause.
#
# The Secret name and key resolve with the same precedence as manifests/storage/oadp-storage.yaml.
# The key is read with a managed-cluster lookup and only tested for being non-empty; its value is
# never written anywhere. A missing Secret is left to the musthave assertion, which names it.
object-templates-raw: |
  # INDENTATION ANCHOR — every directive below sits at this indent. A shallower trim marker eats
  # past the newline into the previous line and produces invalid YAML.
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config") hub}}
  {{hub- if (empty $raw) hub}}
  {{hub- fail (printf "oadp: ConfigMap %s.rendered-config in %s has no config key, so the storage configuration is unknown" .ManagedClusterName .PolicyMetadata.namespace) hub}}
  {{hub- end hub}}
  {{hub- $rcmConfig := ($raw | fromYaml | default dict) hub}}
  {{hub- $store := (dig "oadp" "storage" (dict) $rcmConfig) hub}}
  {{hub- $credFrom := (index $store "credentialsFrom" | default dict) hub}}
  {{hub- $credRef := (index $store "configSecretRef" | default dict) hub}}
  {{hub- $credName := (index $credRef "name" | default "cloud-credentials") hub}}
  {{hub- $credKey := (index $credRef "key" | default "cloud") hub}}
  # sourceSecretRef builds the credentials file, always as cloud-credentials key cloud.
  {{hub- if (dig "sourceSecretRef" "name" "" $store) hub}}
  {{hub- $credName = "cloud-credentials" hub}}
  {{hub- $credKey = "cloud" hub}}
  {{hub- end hub}}
  # When credentialsFrom is set the Secret is copied from the hub, and targetName is its name here.
  {{hub- if not (empty $credFrom) hub}}
  {{hub- $credName = (index $credFrom "targetName" | default "cloud-credentials") hub}}
  {{hub- $credKey = (index $credFrom "key" | default "cloud") hub}}
  {{hub- end hub}}
  {{- $cred := (lookup "v1" "Secret" "openshift-adp" "{{hub $credName hub}}") }}
  {{- if $cred }}
  {{- if not (index ($cred.data | default dict) "{{hub $credKey hub}}") }}
  {{- fail "oadp: Secret openshift-adp/{{hub $credName hub}} exists but has no key {{hub $credKey hub}}, which the DataProtectionApplication opens. Fix the key in the Secret, or the key named in config.oadp.storage." }}
  {{- end }}
  {{- end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{hub $credName | quote hub}}
        namespace: openshift-adp
