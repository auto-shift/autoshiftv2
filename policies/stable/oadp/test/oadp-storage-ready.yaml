# Storage readiness. Wrapped by PolicyGenerator into a musthave ConfigurationPolicy; its PG entry is
# remediationAction: inform, because a status can only be observed.
#
# The BackupStorageLocation is named by OADP, not by this policy, so it is matched by kind and
# namespace. Without this a cluster with an unreachable bucket looks healthy until a restore is
# attempted.
#
# Consumers depend on this policy rather than on the storage policy, so a Schedule is only created
# once Velero can actually reach the object store.
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: oadp
  namespace: openshift-adp
status:
  conditions:
    - status: 'True'
      type: Reconciled
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  namespace: openshift-adp
status:
  phase: Available
