apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: managed-autoshift
# Deploys a nested AutoShift onto each MANAGED hub. The policy runs on that hub and creates an Argo CD
# Application there, so the hub goes on to configure its own spokes. A hub whose infra agent runs
# agent-managed gets the Application from the hub above instead, through the principal. Every deployment is described by
# an entry in config.managedAutoshift in the cluster's rendered-config ConfigMap, read at enforcement
# time, so one hub can carry several. See README.md and docs/hub-of-hubs.md.
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  # One placement per policy, each named after it. Sharing one forces placementBindingDefaults.name,
  # and that single name collides as soon as a policy needs a placement of its own.
  placement:
    placementPath: placement-ns.yaml
policies:
  # 1) Repository Secrets, copied into the hub's Argo CD namespace so it can reach private repos.
  - name: policy-managed-autoshift-repo
    placement:
      placementPath: placement-repo.yaml
    manifests:
      - path: manifests/repo-secrets.yaml
    dependencies:
      - name: policy-gitops-systems-argocd
      - name: policy-acm-mch-install
  # 2) The namespace the nested deployment's own policies live in.
  - name: policy-managed-autoshift-ns
    placement:
      placementPath: placement-ns.yaml
    manifests:
      - path: manifests/namespace.yaml
  # 3) The Argo CD Application itself. mustonlyhave, so it owns the spec outright — which is why the
  #    name `autoshift` is refused: that belongs to the top-level deployment. Not placed on a hub
  #    whose infra agent runs agent-managed; policy 4 writes that one from the hub above.
  - name: policy-managed-autoshift
    placement:
      placementPath: placement.yaml
    manifests:
      - path: manifests/deployment.yaml
    dependencies:
      - name: policy-gitops-systems-argocd
      # Without this the Application can be created before its repository Secret,
      # so a private repo fails its first sync until the Secret catches up.
      - name: policy-managed-autoshift-repo
  # 4) The same Application for every managed hub whose infra agent runs managed, written on the
  #    self-managed hub into that agent's namespace, where the infra principal delivers it. Same
  #    manifest: the template picks its targets from where it runs. No dependency on the repo policy,
  #    which runs on the managed hub, and a dependency resolves against this cluster's copy.
  - name: policy-managed-autoshift-agent
    placement:
      placementPath: placement-agent.yaml
    # It lists ManagedClusters, and a hub template may look up a cluster-scoped resource only
    # through a service account.
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    manifests:
      - path: manifests/deployment.yaml
    customMessage:
      compliant: >-
        Managed AutoShift Applications for agent-managed hubs match. Compliant with nothing to show
        means no managed hub with autoshift-enable-install runs its infra agent managed.
  # 5) Inform-only: assert every configured deployment actually produced its Application. An entry
  #    with a reserved or over-long appName, or ociRepo without ociVersion, creates nothing, and
  #    policy-managed-autoshift is then Compliant for wanting nothing. This is what surfaces it.
  #    No dependency on policy-managed-autoshift: on an agent-managed hub that policy is not placed,
  #    and the Application arrives through the agent instead.
  - name: policy-managed-autoshift-test
    placement:
      placementPath: placement-test.yaml
    remediationAction: inform
    manifests:
      - path: test/managed-autoshift-app.yaml
    customMessage:
      noncompliant: >-
        A config.managedAutoshift entry did not produce a synced Argo CD Application on this hub.
        Either the entry was skipped, or its source will not resolve. Check that appName is at most
        11 characters and is not 'autoshift', that exactly one of repoUrl or ociRepo is set, that
        ociVersion accompanies ociRepo, and that ociRepo carries no oci:// scheme. If the entry
        looks right, read the Application's status conditions for a repository or registry error.
