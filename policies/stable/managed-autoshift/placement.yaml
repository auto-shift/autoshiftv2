apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-managed-autoshift
  namespace: ${POLICY_NAMESPACE}
spec:
  # Runs ON each managed hub, which then deploys AutoShift to itself through its own Argo CD.
  # self-managed must be 'false'. That label marks the hub THIS AutoShift instance runs on, which
  # already has its own top-level Application; this policy bootstraps AutoShift onto the other
  # hubs the deployment governs.
  # The opt-in predicates use `In` rather than `NotIn`: NotIn also matches clusters where the
  # label is absent, which would select hubs that never opted in.
  #
  # gitops-infra is the exception and uses NotIn deliberately. In agent-managed mode the hub above
  # owns this hub's Application resources through the principal, so writing one here as well would
  # give the same object two writers. Excluding that one mode leaves every other mode, and every
  # hub with no gitops-infra label at all, selected exactly as before.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/cluster-type'
              operator: In
              values:
                - 'hub'
            - key: 'autoshift.io/gitops'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/autoshift-enable-install'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/self-managed'
              operator: In
              values:
                - 'false'
            - key: 'autoshift.io/gitops-infra'
              operator: NotIn
              values:
                - 'agent-managed'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
