{{- $policyName := "policy-managed-autoshift-repo" }}
{{- $policyNamespace := $.Values.policy_namespace }}
{{- $placementName := printf "%s-%s" "placement" $policyName }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ $policyName }}
  namespace: {{ $policyNamespace }}
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
spec: 
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-gitops-systems-argocd
      namespace: {{  $policyNamespace }}
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-acm-mch-install
      namespace: {{  $policyNamespace }}
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: autoshift-repo-secret
          namespace: {{ $policyNamespace }}
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            [
            {{ "{{hub-" }} $autoshiftConfigs := index (index (fromConfigMap "{{ $policyNamespace }}" (print  .ManagedClusterName ".rendered-config") "config" | default "{}") | fromYaml) "autoshift" | default (list) {{ "hub}}" }}
            {{ "{{hub-" }} $lastIndex := (sub (len $autoshiftConfigs) 1) {{ "hub}}" }}
            {{ "{{hub-" }} range $index, $autoshiftConfig := $autoshiftConfigs {{ "hub}}" }}
              {{ "{{hub" }} $appName := index $autoshiftConfig "appName" | default "managed-autoshift" {{ "hub}}" }}
              {{ "{{hub" }} $useRepoSecret := (index $autoshiftConfig "useRepoSecret" | default false) {{ "hub}}" }}
              {{ "{{hub-" }} $gitopsNamespace := index $autoshiftConfig "gitopsNamespace" | default "openshift-gitops" {{ "hub}}" }}
              {{ "{{hub-" }} $valuesSecretRef := index $autoshiftConfig "valuesRepoSecretRef" | default dict {{ "hub}}" }}
              {{ "{{hub-" }} $valuesSecretName := index $valuesSecretRef "name" | default "autoshift-values-repo-secret" {{ "hub}}" }}
              {{ "{{hub-" }} $valuesSecretNamespace := index $valuesSecretRef "namespace" | default "{{ $policyNamespace }}" {{ "hub}}" }}
              {{ "{{hub-" }} $valuesRepoUrl := index $autoshiftConfig "valuesRepoUrl" | default "" {{ "hub}}" }}
              {{ "{{hub" }} if $useRepoSecret {{ "hub}}" }}
                {{ "{{hub-" }} $secretRef := index $autoshiftConfig "repoSecretRef" | default dict {{ "hub}}" }}
                {{ "{{hub-" }} $secretName := index $secretRef "name" | default "autoshift-repo-secret" {{ "hub}}" }}
                {{ "{{hub-" }} $secretNamespace := index $secretRef "namespace" | default "{{ $policyNamespace }}" {{ "hub}}" }}
                  {
                    "complianceType": "musthave",
                    "objectDefinition": {
                      "kind": "Secret",
                      "apiVersion": "v1",
                      "metadata": {
                        "name": "repo-{{ "{{hub $appName hub}}" }}",
                        "namespace": "{{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}",
                        "labels": {
                          "argocd.argoproj.io/secret-type": "repository"
                        }
                      },
                      "data": '{{ "{{hub" }} copySecretData $secretNamespace $secretName {{ "hub}}" }}',
                      "type": "Opaque"
                    }
                  {{ "{{hub" }} end {{ "hub}}" }}
                  }{{ "{{hub-" }} if (ne $valuesRepoUrl "") {{ "hub}}" }},
                  {
                    "complianceType": "musthave",
                    "objectDefinition": {
                      "kind": "Secret",
                      "apiVersion": "v1",
                      "metadata": {
                        "name": "repo-{{ "{{hub $appName hub}}" }}-values",
                        "namespace": "{{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}",
                        "labels": {
                          "argocd.argoproj.io/secret-type": "repository"
                        }
                      },
                      "data": '{{ "{{hub" }} copySecretData $valuesSecretNamespace $valuesSecretName {{ "hub}}" }}',
                      "type": "Opaque"
                    }
                  }
                  {{ "{{hub- end hub}}" }}{{ "{{hub- if ne $lastIndex $index hub}}" }},{{ "{{hub- end hub}}" }}
                {{ "{{hub- end hub}}" }}
                ]
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ $placementName }}
  namespace: {{ $policyNamespace }}
spec:
  clusterSets:
    {{- range $clusterSet, $_ := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
    {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/gitops'
              operator: In
              values:
              - 'true'
            - key: 'autoshift.io/autoshift-enable-install'
              operator: In
              values: 
                - 'true'
            - key: 'autoshift.io/self-managed'
              operator: In
              values: 
                - 'false'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
#---
#apiVersion: policy.open-cluster-management.io/v1
#kind: PlacementBinding
#metadata:
#  name: {{ $placementName }}
#  namespace: {{ $policyNamespace }}
#placementRef:
#  name: {{ $placementName}}
#  apiGroup: cluster.open-cluster-management.io
#  kind: Placement
#subjects:
#  - name: {{ $policyName }}
#    apiGroup: policy.open-cluster-management.io
#    kind: Policy
---
            {{/*
            - complianceType: musthave
              objectDefinition:
                kind: Secret
                apiVersion: v1
                metadata:
                  name: repo-autoshift
                  namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                  labels:
                    argocd.argoproj.io/secret-type: repository
                data: '{{ "{{hub" }} copySecretData $secretNamespace $secretName {{ "hub}}" }}'
                type: Opaque
                */}}
