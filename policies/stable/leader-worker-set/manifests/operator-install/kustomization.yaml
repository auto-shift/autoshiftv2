apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renders the shared components/operator-install chart, which owns the OperatorPolicy structure and
# creates the namespace (with the cluster-monitoring label). The per-operator ACM lookups below are the
# visible, greppable inputs — every autoshift.io/leader-worker-set-* label this operator consumes is here.
# ${REMEDIATION} is substituted by the CMP before kustomize runs.
helmGlobals:
  chartHome: ../../../../../components/
helmCharts:
  - name: operator-install
    releaseName: leader-worker-set
    valuesInline:
      name: leader-worker-set
      namespace: openshift-lws-operator
      # OwnNamespace. leader-worker-set v1.0.1 declares OwnNamespace=True and
      # AllNamespaces=False, so the chart's default (empty -> AllNamespaces)
      # produces an OperatorGroup OLM refuses:
      #   UnsupportedOperatorGroup: AllNamespaces InstallModeType not supported
      # The CSV then sits in Failed while the policy reports only that the
      # ClusterServiceVersion was not found.
      targetNamespaces:
        - openshift-lws-operator
      remediation: ${REMEDIATION}
      policyNamespace: ${POLICY_NAMESPACE}
      subscription:
        name: '{{hub index .ManagedClusterLabels "autoshift.io/leader-worker-set-subscription-name" | default "leader-worker-set" hub}}'
        channel: '{{hub index .ManagedClusterLabels "autoshift.io/leader-worker-set-channel" | default "stable-v1.0" hub}}'
        source: '{{hub $base := (index .ManagedClusterLabels "autoshift.io/leader-worker-set-source" | default "redhat-operators") hub}}{{hub ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") hub}}'
        sourceNamespace: '{{hub index .ManagedClusterLabels "autoshift.io/leader-worker-set-source-namespace" | default "openshift-marketplace" hub}}'
        # Version resolution (config lives in the rendered-config ConfigMap on the hub):
        #   config mode (config.leader-worker-set.versions set): versions = that list; startingCSV = config.leader-worker-set.startingCSV
        #     (explicit — the list says what's ALLOWED, not where to START; default "" = let OLM pick).
        #   label mode (no config): versions = [leader-worker-set-version label]; startingCSV = that same version.
        # $vers is computed here and reused by `versions` below.
        startingCSV: |-
          {{hub- $cfg := (index (index (index ((lookup "v1" "ConfigMap" "${POLICY_NAMESPACE}" (printf "%s.rendered-config" .ManagedClusterName)) | default dict) "data" | default dict) "config" | default "" | fromYaml | default dict) "leader-worker-set" | default dict) hub}}
          {{hub- $cfgVers := (dig "versions" (list) $cfg) hub}}
          {{hub- $isCfg := (not (empty $cfgVers)) hub}}
          {{hub- $labelVer := (index .ManagedClusterLabels "autoshift.io/leader-worker-set-version" | default "") hub}}
          {{hub- $vers := (ternary $cfgVers (ternary (list) (list $labelVer) (empty $labelVer)) $isCfg) hub}}
          {{hub- (ternary (dig "startingCSV" "" $cfg) $labelVer $isCfg) hub}}
      # versions reuses $vers set in startingCSV above (same policy, resolves after it).
      versions: '{{hub $vers | toRawJson | toLiteral hub}}'
