apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gpu-nodes-aws
  namespace: ${POLICY_NAMESPACE}
spec:
  # No spec.clusterSets: selected via ManagedClusterSetBindings in this namespace + the predicate.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/gpu-nodes'
              operator: Exists
            # A blank value means "not managed here" — Exists alone would match it and create
            # MachineSets on a cluster that never asked for GPUs. '0' is NOT excluded: a parked
            # MachineSet at zero replicas is the normal resting state.
            - key: 'autoshift.io/gpu-nodes'
              operator: NotIn
              values:
                - ''
            - key: 'autoshift.io/gpu-nodes-provider'
              operator: In
              values:
                - 'aws'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
