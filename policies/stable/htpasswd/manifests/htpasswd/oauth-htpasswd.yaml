# HTPasswd identity providers on OAuth/cluster, from config.htpasswd.providers.
#
# Config (rendered-config, under htpasswd):
#   providers[]     identity providers to configure (required, at least one)
#     name          display name on the login page; must be unique
#     secretName    existing Secret in openshift-config holding the htpasswd file under key htpasswd
#
# OWNERSHIP: on a cluster with this policy placed, AutoShift owns EVERY identity provider of type
# HTPasswd. The live list is read on the managed cluster, every non-HTPasswd provider (LDAP, OIDC,
# and so on) is carried over unchanged, and the HTPasswd entries are replaced with exactly what config
# declares. An HTPasswd provider added by hand is removed on the next evaluation; declare it in
# config instead.
#
# mustonlyhave, because musthave merges into lists: renaming a provider or changing its secretName
# under musthave appends a second entry instead of replacing the first, duplicate names degrade the
# authentication operator, and the policy still reports Compliant. mustonlyhave on spec also deletes
# every spec field it is not given, so the whole live spec is carried over (templates, tokenConfig,
# and anything manual-remediations/manifests/oauth-customization.yaml sets), with only
# identityProviders rebuilt.
#
# GUARDED ON EACH SECRET EXISTING. The Secrets are created out of band (External Secrets Operator or
# by hand), never by this policy. An identity provider whose Secret is missing degrades the
# authentication operator, so a provider is only written once its Secret is present, and is removed
# again if the Secret is deleted. The order the Secret and the policy arrive in does not matter.
# policy-htpasswd-ready names the missing Secret.
#
# The Secret is checked with a regular (managed-cluster) lookup, never a hub-template lookup, so
# nothing from it is written into the replicated Policy.
#
# Fails, rather than rendering nothing, when config.htpasswd.providers is missing or empty, when an
# entry lacks name or secretName, when two entries share a name, when a name collides with a
# non-HTPasswd provider already on the cluster, or when OAuth/cluster cannot be read. The last guard
# matters most: rebuilding the list from an empty lookup would drop every other identity provider.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config") hub}}
  {{hub- $cfg := (index ($raw | fromYaml | default dict) "htpasswd" | default dict) hub}}
  {{hub- $providers := (dig "providers" (list) $cfg) hub}}
  {{hub- if not $providers hub}}{{hub fail "htpasswd: config.htpasswd.providers is missing or empty in the rendered-config ConfigMap" hub}}{{hub- end hub}}
  {{hub- $want := list hub}}
  {{hub- $seen := dict hub}}
  {{hub- range $p := $providers hub}}
  {{hub- $name := (dig "name" "" $p) hub}}
  {{hub- $secret := (dig "secretName" "" $p) hub}}
  {{hub- if not (and $name $secret) hub}}{{hub fail "htpasswd: every config.htpasswd.providers entry needs both name and secretName" hub}}{{hub- end hub}}
  {{hub- if hasKey $seen $name hub}}{{hub fail (printf "htpasswd: provider name %s appears more than once in config.htpasswd.providers" $name) hub}}{{hub- end hub}}
  {{hub- $_ := set $seen $name true hub}}
  {{hub- $want = append $want (dict "name" $name "secretName" $secret) hub}}
  {{hub- end hub}}
  {{- $want := fromJson `{{hub dict "providers" $want | toJson hub}}` }}
  {{- $oauth := (lookup "config.openshift.io/v1" "OAuth" "" "cluster") }}
  {{- if not $oauth }}{{- fail "htpasswd: OAuth/cluster could not be read, so the identity provider list was left untouched" }}{{- end }}
  {{- $spec := (dig "spec" dict $oauth) }}
  {{- $idps := list }}
  {{- $kept := dict }}
  {{- range $idp := (dig "identityProviders" (list) $spec) }}
  {{- if ne (dig "type" "" $idp) "HTPasswd" }}
  {{- $idps = append $idps $idp }}
  {{- $_ := set $kept (dig "name" "" $idp) true }}
  {{- end }}
  {{- end }}
  {{- range $p := $want.providers }}
  {{- if hasKey $kept $p.name }}{{- fail (printf "htpasswd: provider name %s is already used by a non-HTPasswd identity provider on this cluster" $p.name) }}{{- end }}
  {{- if (lookup "v1" "Secret" "openshift-config" $p.secretName) }}
  {{- $idps = append $idps (dict "name" $p.name "mappingMethod" "claim" "type" "HTPasswd" "htpasswd" (dict "fileData" (dict "name" $p.secretName))) }}
  {{- end }}
  {{- end }}
  {{- if $idps }}
  {{- $spec = set $spec "identityProviders" $idps }}
  {{- else }}
  {{- $spec = unset $spec "identityProviders" }}
  {{- end }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: OAuth
      metadata:
        name: cluster
      spec:
        {{ $spec | toYaml | autoindent }}
