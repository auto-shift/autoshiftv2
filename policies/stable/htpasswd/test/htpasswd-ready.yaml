# Are htpasswd logins actually working, as opposed to configured?
#
# inform-only. Three kinds of check, because they fail independently:
#
#   - each provider's Secret exists in openshift-config. policy-htpasswd deliberately writes no
#     provider until its Secret is present, so a missing Secret shows up there as "nothing happened".
#     This is the check that names the cause: create the Secret, with the htpasswd file under the key
#     htpasswd.
#   - OAuth/cluster carries each configured provider.
#   - the authentication ClusterOperator is Available and not Degraded. A provider pointing at a
#     malformed htpasswd file is accepted by the API server and only fails here, so this is the
#     signal that logins work.
#
# ONE OAuth check, listing every provider, built after the loop. When several object templates share
# a kind and name, Red Hat Advanced Cluster Management evaluates only one of them, so one OAuth check
# per provider would verify a single provider and could report Compliant with the others missing.
# musthave on a list requires each listed entry to match a live entry, so one object checks them all.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config") hub}}
  {{hub- $cfg := (index ($raw | fromYaml | default dict) "htpasswd" | default dict) hub}}
  {{hub- $providers := (dig "providers" (list) $cfg) hub}}
  {{hub- if not $providers hub}}{{hub fail "htpasswd: config.htpasswd.providers is missing or empty in the rendered-config ConfigMap" hub}}{{hub- end hub}}
  {{hub- $entries := list hub}}
  {{hub- range $p := $providers hub}}
  {{hub- if not (and (dig "name" "" $p) (dig "secretName" "" $p)) hub}}{{hub fail "htpasswd: every config.htpasswd.providers entry needs both name and secretName" hub}}{{hub- end hub}}
  {{hub- $entries = append $entries (dict "name" $p.name "type" "HTPasswd" "htpasswd" (dict "fileData" (dict "name" $p.secretName))) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{hub $p.secretName | toJson hub}}
        namespace: openshift-config
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: OAuth
      metadata:
        name: cluster
      spec:
        identityProviders:
          {{hub $entries | toYaml | autoindent hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: ClusterOperator
      metadata:
        name: authentication
      status:
        conditions:
          - type: Degraded
            status: 'False'
          - type: Available
            status: 'True'
