# This policy verifies the installation of the official & supported version of
# the GitOps Operator.
#
{{- if .Values.hubClusterSets }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-gitops-systems-argocd
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: {{ (($.Values.autoshift).policyStandardHub) | default "NIST SP 800-53" }}
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  dependencies:
    - name: policy-gitops-operator-install
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-systems-argocd
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            {{ "{{hub" }} $gitopsNamespace := index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "{{ .Values.gitopsNamespace | default .Values.gitops.argoNamespace }}" {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                  labels:
                    openshift.io/cluster-monitoring: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: cluster-admin-{{ .Values.gitops.argoName }}-argocd-application-controller
                  annotations:
                    helm.sh/hook-weight: "3"
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-admin
                subjects:
                - kind: ServiceAccount
                  name: {{ .Values.gitops.argoName }}-argocd-application-controller
                  namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-systems-argocd-instance
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            {{ "{{hub" }} $gitopsNamespace := index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "{{ .Values.gitopsNamespace | default .Values.gitops.argoNamespace }}" {{ "hub}}" }}
            {{/* Infra ArgoCD tuning (resources, autoscale, processors, rbac) comes from this cluster's
                 rendered-config ConfigMap (config.gitops.infra), so one policy serves per-cluster values.
                 When a field is unset there, the default is this chart's values.yaml, rendered in at Helm
                 time, so bootstrap and day 2 read the same numbers. No inline literals: every key the
                 templates below reference must exist in values.yaml or the render fails. */}}
            {{/* fromConfigMap, NOT lookup. The two differ on a MISSING ConfigMap: lookup swallows the
                 not-found and hands back an empty map, while fromConfigMap returns the error and fails
                 the template. That difference is the whole point here.

                 cluster-config-maps writes this ConfigMap for every cluster in a known cluster set, with
                 data.config set to "{}" when nothing is configured, so an empty configuration is still a
                 PRESENT ConfigMap. Absence therefore never means "no configuration"; it means the
                 rendered configuration has not landed yet, and there is no ordering between that policy
                 and this one. With lookup, that window renders a complete and plausible ArgoCD spec
                 built entirely from defaults, and enforces it -- which is how the repository server lost
                 its Config Management Plugin and stopped rendering every PolicyGenerator policy on the
                 hub. Failing the template instead leaves the existing object untouched and reports
                 template-error until the configuration arrives. */}}
            {{ "{{hub-" }} $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $infra := (index (index $cfg "gitops" | default dict) "infra" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $pgEnabled := (index (index $cfg "gitops" | default dict) "policyGenerator" | default false) {{ "hub}}" }}
            {{ "{{hub-" }} $server := (index $infra "server" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $serverAutoscale := (index $server "autoscale" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $serverLimits := (index $server "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $serverRequests := (index $server "requests" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $dex := (index $infra "dex" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $dexLimits := (index $dex "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $dexRequests := (index $dex "requests" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $repo := (index $infra "repo" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $repoLimits := (index $repo "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $repoRequests := (index $repo "requests" | default dict) {{ "hub}}" }}
            {{/* Hoisted because both the volumeMounts and the volumes list below have to know whether
                 ANY item will be emitted before they write their key. */}}
            {{ "{{hub-" }} $caBundle := (eq (index .ManagedClusterLabels "autoshift.io/gitops-cluster-ca-bundle" | default (printf "%v" (ternary (index $repo "cluster_ca_bundle") {{ $.Values.gitops.repo.cluster_ca_bundle }} (hasKey $repo "cluster_ca_bundle")))) "true") {{ "hub}}" }}
            {{ "{{hub-" }} $ha := (index $infra "ha" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $haLimits := (index $ha "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $haRequests := (index $ha "requests" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $redis := (index $infra "redis" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $redisLimits := (index $redis "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $redisRequests := (index $redis "requests" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $controller := (index $infra "controller" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $controllerLimits := (index $controller "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $controllerRequests := (index $controller "requests" | default dict) {{ "hub}}" }}
            {{/* GOMEMLIMIT is DERIVED from the controller memory limit, so the two cannot drift.
                 The Go runtime does not read the container limit; left unset it collects on GOGC
                 alone and a refresh storm is killed before it ever collects.

                 trimSuffix is deliberately avoided: the ACM 2.15 and earlier template allowlist
                 does not carry it. contains and regexReplaceAll are safe on every supported hub.

                 Only Gi and Mi are parsed, which is what Kubernetes quantities use in practice.
                 Anything else -- a decimal like 1.5Gi, SI units like 8G, or a bare byte count --
                 leaves the derivation empty and the environment variable is then omitted rather
                 than guessed. Set controller.goMemLimit explicitly for those, because a value
                 derived wrongly is worse than none: too low and the runtime collects constantly
                 without ever using the memory it has. */}}
            {{ "{{hub-" }} $ctrlMem := (index $controllerLimits "memory" | default "{{ $.Values.gitops.controller.limits.memory }}") {{ "hub}}" }}
            {{ "{{hub-" }} $gmlPct := (index $controller "goMemLimitPercent" | default {{ $.Values.gitops.controller.goMemLimitPercent }}) {{ "hub}}" }}
            {{ "{{hub-" }} $gmlMib := 0 {{ "hub}}" }}
            {{ "{{hub-" }} if not (contains "." $ctrlMem) {{ "hub}}" }}
            {{ "{{hub-" }} if contains "Gi" $ctrlMem {{ "hub}}" }}
            {{ "{{hub-" }} $gmlMib = mul ((regexReplaceAll "[^0-9]" $ctrlMem "") | int) 1024 {{ "hub}}" }}
            {{ "{{hub-" }} else if contains "Mi" $ctrlMem {{ "hub}}" }}
            {{ "{{hub-" }} $gmlMib = ((regexReplaceAll "[^0-9]" $ctrlMem "") | int) {{ "hub}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} $gmlDerived := (ternary (printf "%dMiB" (div (mul $gmlMib $gmlPct) 100)) "" (gt $gmlMib 0)) {{ "hub}}" }}
            {{ "{{hub-" }} $goMemLimit := (index $controller "goMemLimit" | default $gmlDerived) {{ "hub}}" }}
            {{ "{{hub-" }} $pgSidecar := (index $infra "policyGenerator" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $pgSidecarLimits := (index $pgSidecar "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $pgSidecarRequests := (index $pgSidecar "requests" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $pgTarExclusions := (index $pgSidecar "tarExclusions" | default (list{{ range $.Values.gitops.policyGenerator.tarExclusions }} {{ . | quote }}{{ end }})) {{ "hub}}" }}
            {{ "{{hub-" }} $applicationSet := (index $infra "applicationSet" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $applicationSetLimits := (index $applicationSet "limits" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $applicationSetRequests := (index $applicationSet "requests" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $rbac := "" {{ "hub}}" }}
            {{ "{{hub-" }} range (index $infra "rbac_policies" | default (list{{ range $.Values.gitops.rbac_policies }} {{ . | quote }}{{ end }})) {{ "hub}}" }}
            {{ "{{hub-" }} $rbac = printf "%s%s\n" $rbac . {{ "hub}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
            {{/* The CMP sidecar image is the SAME image as the running argocd-repo-server (operator-set),
                 resolved via a SPOKE-side lookup ({{ }}) — config-policy-controller runs it on the managed
                 cluster (this self-managed hub), where the repo-server actually lives. A hub-side lookup
                 ({{hub}}) is namespace-restricted to the policy namespace and would fail; a helm lookup
                 returns nothing in ArgoCD's repo-server. No value fallback: if the repo-server isn't found
                 the image resolves empty and the ArgoCD CR fails loudly rather than retrying a bad pinned
                 tag. The repo-server always exists by the time this day-2 policy runs. */}}
            {{ "{{" }} $argoRepoDep := (lookup "apps/v1" "Deployment" "{{ .Values.gitops.argoNamespace }}" "{{ .Values.gitops.argoName }}-repo-server") {{ "}}" }}
            {{ "{{" }} $argoImageLive := "" {{ "}}" }}
            {{ "{{" }} if $argoRepoDep {{ "}}" }}{{ "{{" }} $argoImageLive = (index $argoRepoDep.spec.template.spec.containers 0).image {{ "}}" }}{{ "{{" }} end {{ "}}" }}
            {{/* Same for the ACM subscription image (ships the PolicyGenerator binary): spoke-side lookup of
                 the running multicluster-operators-hub-subscription so it matches the hub's ACM version.
                 No value fallback — the lookup is the source of truth. */}}
            {{ "{{" }} $acmSubDep := (lookup "apps/v1" "Deployment" "open-cluster-management" "multicluster-operators-hub-subscription") {{ "}}" }}
            {{ "{{" }} $acmImageLive := "" {{ "}}" }}
            {{ "{{" }} if $acmSubDep {{ "}}" }}{{ "{{" }} $acmImageLive = (index $acmSubDep.spec.template.spec.containers 0).image {{ "}}" }}{{ "{{" }} end {{ "}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: argoproj.io/v1beta1
                kind: ArgoCD
                metadata:
                  name: {{ .Values.gitops.argoName }}
                  namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                spec:
                  disableAdmin: {{ "{{hub" }} ternary (index $infra "disableAdmin") {{ $.Values.gitops.disableAdmin }} (hasKey $infra "disableAdmin") {{ "hub}}" }}
                  server:
                    {{ "{{hub-" }} if (ternary (index $serverAutoscale "enabled") {{ $.Values.gitops.server.autoscale.enabled }} (hasKey $serverAutoscale "enabled")) {{ "hub}}" }}
                    autoscale:
                      enabled: true
                      hpa:
                        maxReplicas: {{ "{{hub" }} index $serverAutoscale "maxReplicas" | default {{ $.Values.gitops.server.autoscale.maxReplicas }} {{ "hub}}" }}
                        scaleTargetRef:
                          apiVersion: "apps/v1"
                          kind: deployment
                          name: {{ $.Values.gitops.argoName }}-server
                        targetCPUUtilizationPercentage: {{ "{{hub" }} index $serverAutoscale "targetCPUUtilizationPercentage" | default {{ $.Values.gitops.server.autoscale.targetCPUUtilizationPercentage }} {{ "hub}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
                    resources:
                      limits:
                        cpu: {{ "{{hub" }} index $serverLimits "cpu" | default "{{ $.Values.gitops.server.limits.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $serverLimits "memory" | default "{{ $.Values.gitops.server.limits.memory }}" {{ "hub}}" }}
                      requests:
                        cpu: {{ "{{hub" }} index $serverRequests "cpu" | default "{{ $.Values.gitops.server.requests.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $serverRequests "memory" | default "{{ $.Values.gitops.server.requests.memory }}" {{ "hub}}" }}
                    route:
                      enabled: true
                  monitoring:
                    enabled: false
                  kustomizeBuildOptions: --enable-helm --helm-command /usr/local/bin/helm --enable-alpha-plugins --load-restrictor LoadRestrictionsNone
                  applicationInstanceLabelKey: argocd.argoproj.io/instance
                  resourceTrackingMethod: annotation+label
                  # THE CLUSTER CACHE IS THE CONTROLLER'S LARGEST ALLOCATION. It watches every API
                  # kind in the cluster by default, so its footprint tracks whatever else is
                  # installed rather than how many Applications exist. The Operator already excludes
                  # a sane base set (endpoints, leases, subject access reviews, Kyverno reports);
                  # this adds the kinds that are heavy on an OpenShift hub and that Argo CD never
                  # manages, because they are generated rather than authored. Measured on one hub:
                  # 43521 Events, 605 PackageManifests.
                  #
                  # Excluding a kind removes it from discovery and sync EVERYWHERE for this
                  # instance, so anything listed here can no longer be deployed by it. Keep the list
                  # to generated, never-authored resources. Set config.gitops.infra.resourceExclusions
                  # to replace it wholesale.
                  resourceExclusions: |
                    {{ "{{hub" }} (index $infra "resourceExclusions" | default {{ $.Values.gitops.resourceExclusions | toJson }}) | autoindent {{ "hub}}" }}
                  sso:
                    dex:
                      resources:
                        limits:
                          cpu: {{ "{{hub" }} index $dexLimits "cpu" | default "{{ $.Values.gitops.dex.limits.cpu }}" {{ "hub}}" }}
                          memory: {{ "{{hub" }} index $dexLimits "memory" | default "{{ $.Values.gitops.dex.limits.memory }}" {{ "hub}}" }}
                        requests:
                          cpu: {{ "{{hub" }} index $dexRequests "cpu" | default "{{ $.Values.gitops.dex.requests.cpu }}" {{ "hub}}" }}
                          memory: {{ "{{hub" }} index $dexRequests "memory" | default "{{ $.Values.gitops.dex.requests.memory }}" {{ "hub}}" }}
                      openShiftOAuth: true
                    provider: dex
                  rbac:
                    defaultPolicy: ''
                    # Every line comes from config.gitops.infra.rbac_policies, falling back to this
                    # chart's gitops.rbac_policies ($rbac built at the top of this block). Nothing is
                    # granted implicitly: defaultPolicy is empty, so an empty list means no access
                    # apart from the built-in admin account. A `g` line takes a user or a group,
                    # but OpenShift login yields an opaque sub, so groups are the practical unit.
                    policy: {{ "{{hub" }} $rbac | toJson {{ "hub}}" }}
                    scopes: '[groups]'
                  repo:
                    replicas: {{ "{{hub" }} index $repo "replicas" | default {{ $.Values.gitops.repo.replicas }} {{ "hub}}" }}
                    {{ "{{hub-" }} if $pgEnabled {{ "hub}}" }}
                    # Trim the tarball streamed to the CMP sidecar on every render.
                    extraRepoCommandArgs:
                      {{ "{{hub-" }} range $pgTarExclusions {{ "hub}}" }}
                      - --plugin-tar-exclude
                      - {{ "{{hub" }} . | quote {{ "hub}}" }}
                      {{ "{{hub-" }} end {{ "hub}}" }}
                      {{ "{{hub-" }} if (index $pgSidecar "useManifestGeneratePaths" | default {{ $.Values.gitops.policyGenerator.useManifestGeneratePaths }}) {{ "hub}}" }}
                      - --plugin-use-manifest-generate-paths
                      {{ "{{hub-" }} end {{ "hub}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
                    resources:
                      limits:
                        cpu: {{ "{{hub" }} index $repoLimits "cpu" | default "{{ $.Values.gitops.repo.limits.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $repoLimits "memory" | default "{{ $.Values.gitops.repo.limits.memory }}" {{ "hub}}" }}
                      requests:
                        cpu: {{ "{{hub" }} index $repoRequests "cpu" | default "{{ $.Values.gitops.repo.requests.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $repoRequests "memory" | default "{{ $.Values.gitops.repo.requests.memory }}" {{ "hub}}" }}
                    {{ "{{hub-" }} if $pgEnabled {{ "hub}}" }}
                    env:
                      - name: POLICY_GEN_ENABLE_HELM
                        value: "true"
                      - name: KUSTOMIZE_PLUGIN_HOME
                        value: /etc/kustomize/plugin
                    initContainers:
                      # Binary path inside the ACM image varies by version; search known locations.
                      - name: policy-generator-install
                        image: {{ "{{" }} $acmImageLive {{ "}}" }}
                        command: [/bin/sh, -c]
                        args:
                          - |
                            set -e
                            for src in \
                              /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator/PolicyGenerator \
                              /policy-generator/PolicyGenerator \
                              /policy-generator/PolicyGenerator-rhel8 \
                              /policy-generator/PolicyGenerator-not-fips-compliant; do
                              if [ -f "$src" ]; then
                                cp "$src" /policy-generator-tmp/PolicyGenerator
                                chmod +x /policy-generator-tmp/PolicyGenerator
                                exit 0
                              fi
                            done
                            echo "PolicyGenerator binary not found in ACM image" >&2
                            exit 1
                        volumeMounts:
                          - name: policy-generator
                            mountPath: /policy-generator-tmp
                    sidecarContainers:
                      - name: policy-generator
                        command: [/var/run/argocd/argocd-cmp-server]
                        image: {{ "{{" }} $argoImageLive {{ "}}" }}
                        securityContext:
                          runAsNonRoot: true
                        env:
                          - name: KUSTOMIZE_PLUGIN_HOME
                            value: /etc/kustomize/plugin
                        # The sidecar runs the actual kustomize/PolicyGenerator/Helm render, so it
                        # needs real CPU. Without resources it competes unbounded and renders time out.
                        resources:
                          limits:
                            cpu: {{ "{{hub" }} index $pgSidecarLimits "cpu" | default "{{ $.Values.gitops.policyGenerator.limits.cpu }}" {{ "hub}}" }}
                            memory: {{ "{{hub" }} index $pgSidecarLimits "memory" | default "{{ $.Values.gitops.policyGenerator.limits.memory }}" {{ "hub}}" }}
                          requests:
                            cpu: {{ "{{hub" }} index $pgSidecarRequests "cpu" | default "{{ $.Values.gitops.policyGenerator.requests.cpu }}" {{ "hub}}" }}
                            memory: {{ "{{hub" }} index $pgSidecarRequests "memory" | default "{{ $.Values.gitops.policyGenerator.requests.memory }}" {{ "hub}}" }}
                        volumeMounts:
                          - name: var-files
                            mountPath: /var/run/argocd
                          - name: plugins
                            mountPath: /home/argocd/cmp-server/plugins
                          - name: policy-generator-cmp-config
                            mountPath: /home/argocd/cmp-server/config/plugin.yaml
                            subPath: plugin.yaml
                          - name: cmp-tmp
                            mountPath: /tmp
                          - name: policy-generator
                            mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
                    {{ "{{hub-" }} end {{ "hub}}" }}
                    {{ "{{hub-" }} if or $pgEnabled $caBundle {{ "hub}}" }}
                    volumeMounts:
                      {{ "{{hub-" }} if $pgEnabled {{ "hub}}" }}
                      - name: policy-generator
                        mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
                      {{ "{{hub-" }} end {{ "hub}}" }}
                      {{ "{{hub-" }} if $caBundle {{ "hub}}" }}
                      - name: user-ca-bundle
                        mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
                        subPath: ca-bundle.crt
                      {{ "{{hub-" }} end {{ "hub}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
                    {{ "{{hub-" }} if or $pgEnabled $caBundle {{ "hub}}" }}
                    volumes:
                      {{ "{{hub-" }} if $pgEnabled {{ "hub}}" }}
                      - name: policy-generator
                        emptyDir: {}
                      - name: policy-generator-cmp-config
                        configMap:
                          name: policy-generator-cmp-plugin
                      - name: cmp-tmp
                        emptyDir: {}
                      {{ "{{hub-" }} end {{ "hub}}" }}
                      {{ "{{hub-" }} if $caBundle {{ "hub}}" }}
                      - name: user-ca-bundle
                        configMap:
                          name: user-ca-bundle
                      {{ "{{hub-" }} end {{ "hub}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
                  ha:
                    resources:
                      limits:
                        cpu: {{ "{{hub" }} index $haLimits "cpu" | default "{{ $.Values.gitops.ha.limits.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $haLimits "memory" | default "{{ $.Values.gitops.ha.limits.memory }}" {{ "hub}}" }}
                      requests:
                        cpu: {{ "{{hub" }} index $haRequests "cpu" | default "{{ $.Values.gitops.ha.requests.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $haRequests "memory" | default "{{ $.Values.gitops.ha.requests.memory }}" {{ "hub}}" }}
                    enabled: {{ "{{hub" }} ternary (index $ha "enabled") {{ $.Values.gitops.ha.enabled }} (hasKey $ha "enabled") {{ "hub}}" }}
                  redis:
                    resources:
                      limits:
                        cpu: {{ "{{hub" }} index $redisLimits "cpu" | default "{{ $.Values.gitops.redis.limits.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $redisLimits "memory" | default "{{ $.Values.gitops.redis.limits.memory }}" {{ "hub}}" }}
                      requests:
                        cpu: {{ "{{hub" }} index $redisRequests "cpu" | default "{{ $.Values.gitops.redis.requests.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $redisRequests "memory" | default "{{ $.Values.gitops.redis.requests.memory }}" {{ "hub}}" }}
                  controller:
                    processors:
                      status: {{ "{{hub" }} index $controller "statusProcessors" | default {{ $.Values.gitops.controller.statusProcessors }} {{ "hub}}" }}
                      operation: {{ "{{hub" }} index $controller "operationProcessors" | default {{ $.Values.gitops.controller.operationProcessors }} {{ "hub}}" }}
                    # GOMEMLIMIT is a SOFT ceiling that makes the Go runtime collect harder as it
                    # approaches, trading CPU for staying alive instead of being OOMKilled. Argo CD
                    # recommends 80-90% of the container limit; $goMemLimit is derived from
                    # controller.limits.memory above so the two cannot drift apart. Omitted entirely
                    # when the limit is in a form the derivation does not parse.
                    {{ "{{hub-" }} if $goMemLimit {{ "hub}}" }}
                    env:
                      - name: GOMEMLIMIT
                        value: '{{ "{{hub" }} $goMemLimit {{ "hub}}" }}'
                    {{ "{{hub-" }} end {{ "hub}}" }}
                    # Stop watching resource kinds this instance cannot list at all, rather than
                    # retrying them forever.
                    respectRBAC: {{ "{{hub" }} index $controller "respectRBAC" | default "{{ $.Values.gitops.controller.respectRBAC }}" {{ "hub}}" }}
                    resources:
                      limits:
                        cpu: {{ "{{hub" }} index $controllerLimits "cpu" | default "{{ $.Values.gitops.controller.limits.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $controllerLimits "memory" | default "{{ $.Values.gitops.controller.limits.memory }}" {{ "hub}}" }}
                      requests:
                        cpu: {{ "{{hub" }} index $controllerRequests "cpu" | default "{{ $.Values.gitops.controller.requests.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $controllerRequests "memory" | default "{{ $.Values.gitops.controller.requests.memory }}" {{ "hub}}" }}
                  applicationSet:
                    resources:
                      limits:
                        cpu: {{ "{{hub" }} index $applicationSetLimits "cpu" | default "{{ $.Values.gitops.applicationSet.limits.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $applicationSetLimits "memory" | default "{{ $.Values.gitops.applicationSet.limits.memory }}" {{ "hub}}" }}
                      requests:
                        cpu: {{ "{{hub" }} index $applicationSetRequests "cpu" | default "{{ $.Values.gitops.applicationSet.requests.cpu }}" {{ "hub}}" }}
                        memory: {{ "{{hub" }} index $applicationSetRequests "memory" | default "{{ $.Values.gitops.applicationSet.requests.memory }}" {{ "hub}}" }}
                  resourceHealthChecks:
                    - group: policy.open-cluster-management.io
                      kind: Policy
                      check: |
                        hs = {}
                        if obj.metadata.labels ~= nil and obj.metadata.labels["policy.open-cluster-management.io/root-policy"] ~= nil then
                          hs.status = "Healthy"
                          hs.message = "Replicated policy managed by ACM"
                          return hs
                        end
                        if obj.status == nil or obj.status.compliant == nil then
                          hs.status = "Healthy"
                          hs.message = "No clusters matched by placement"
                          return hs
                        end
                        if obj.status.compliant == "Compliant" then
                          hs.status = "Healthy"
                        elseif obj.status.compliant == "Pending" then
                          hs.status = "Progressing"
                        else
                          hs.status = "Degraded"
                        end
                        hs.message = obj.status.compliant
                        return hs
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-systems-argocd-cluster-config
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            {{ "{{hub" }} $gitopsNamespace := index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "{{ .Values.gitopsNamespace | default .Values.gitops.argoNamespace }}" {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: Placement
                metadata:
                  name: systems-argocd-cluster-placement
                  namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                spec:
                  clusterSets:
                  {{- range $clusterSet, $value := .Values.hubClusterSets }}
                    - {{ $clusterSet }}
                  {{- end }}
                  {{- range $clusterSet, $value := .Values.managedClusterSets }}
                    - {{ $clusterSet }}
                  {{- end }}
                  # Hub cluster sets are included deliberately: under hub-of-hubs a regional hub is a
                  # managed cluster of the global hub AND lives in a hub cluster set, so the global
                  # hub's Argo CD can only reach it through a registration made here.
                  #
                  # This cluster itself is excluded. GitOpsCluster exists so an Argo CD can reach
                  # OTHER clusters; Argo CD already reaches the one it runs on as the built-in
                  # in-cluster destination, and every AutoShift Application targets exactly that. A
                  # self registration adds a second entry for the same cluster reached through the
                  # cluster-proxy addon, and the application controller builds a FULL CLUSTER CACHE
                  # PER REGISTERED CLUSTER, so the hub pays for two complete caches of itself before
                  # comparing a single Application. Measured on a hub with 58 Applications and 299
                  # Policies: the controller was OOMKilled repeatedly against a 4Gi limit.
                  #
                  # local-cluster is the right discriminator and cluster-type is not. Red Hat
                  # Advanced Cluster Management sets local-cluster on the cluster running THAT
                  # instance, so a regional hub carries it in its own instance and never in the
                  # global hub's. Excluding on cluster-type would drop every regional hub.
                  #
                  # NotIn also matches a cluster with no such label, which is every managed cluster.
                  predicates:
                    - requiredClusterSelector:
                        labelSelector:
                          matchExpressions:
                            - key: 'local-cluster'
                              operator: NotIn
                              values:
                                - 'true'
                  tolerations:
                    - key: cluster.open-cluster-management.io/unreachable
                      operator: Exists
                    - key: cluster.open-cluster-management.io/unavailable
                      operator: Exists
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps.open-cluster-management.io/v1beta1
                kind: GitOpsCluster
                metadata:
                  name: argo-acm-importer
                  namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                spec:
                  argoServer:
                    cluster: notused
                    argoNamespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                  placementRef:
                    kind: Placement
                    apiVersion: cluster.open-cluster-management.io/v1beta1
                    name: systems-argocd-cluster-placement
                    namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
            {{- range $clusterSet, $value := .Values.managedClusterSets }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: {{ $clusterSet }}
                  namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                spec:
                  clusterSet: {{ $clusterSet }}
            {{- end }}
            {{- range $clusterSet, $value := .Values.hubClusterSets }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: {{ $clusterSet }}
                  namespace: {{ "{{hub" }} $gitopsNamespace {{ "hub}}" }}
                spec:
                  clusterSet: {{ $clusterSet }}
            {{- end }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gitops-systems-argocd
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-gitops-systems-argocd
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-gitops-systems-argocd
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-gitops-systems-argocd
    apiGroup: policy.open-cluster-management.io
    kind: Policy
{{- end }}
