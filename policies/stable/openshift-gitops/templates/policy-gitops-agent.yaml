# Argo CD agent (the Red Hat Advanced Cluster Management GitOps add-on).
#
# SEPARATE from policy-gitops-systems-argocd on purpose. That policy owns the push-model
# GitOpsCluster (argo-acm-importer), which registers every managed cluster into this hub's Argo CD
# and is load-bearing for the whole fleet. Enabling the add-on on that object would switch every
# registered cluster to agent mode at once. This policy creates its OWN GitOpsCluster against its
# OWN placement, so enrolling a cluster in the agent is opt-in per cluster and leaves the push model
# untouched.
#
# Two labels, two meanings:
#   autoshift.io/gitops-agent          on a HUB    -- run the principal here (places THIS policy)
#   autoshift.io/gitops-agent-enroll   on a SPOKE  -- deploy an agent there (selected below)
#
# Opting in at a managed hub alone works because cluster-type hub selects the self-managed hub AND
# every managed hub, while a managed hub's labels are consumed by the layer above it. Setting
# gitops-agent in a managed hub's clusterset values therefore enables that hub and nothing above it.
#
# Technology Preview in Red Hat Advanced Cluster Management 2.17 with OpenShift GitOps 1.21.
{{- if .Values.hubClusterSets }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-gitops-agent
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  # Required by the ManagedCluster lookup in the principal's sourceNamespaces below. Cluster-scoped
  # lookups in a hub template are refused without it.
  hubTemplateOptions:
    serviceAccountName: autoshift-policy-service-account
  dependencies:
    - name: policy-gitops-systems-argocd
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-agent
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            {{ "{{hub" }} $gitopsNamespace := index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "{{ .Values.gitopsNamespace | default .Values.gitops.argoNamespace }}" {{ "hub}}" }}
            {{ "{{hub" }} $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict {{ "hub}}" }}
            {{ "{{hub" }} $agentCfg := (index (index (index (index $rcm "data" | default dict) "config" | default "" | fromYaml | default dict) "gitops" | default dict) "agent" | default dict) {{ "hub}}" }}
            {{ "{{hub" }} $clusterSets := (index $agentCfg "clusterSets" | default list) {{ "hub}}" }}
            {{ "{{hub" }} $serverAddress := (index $agentCfg "serverAddress" | default "") {{ "hub}}" }}
            {{ "{{hub" }} $serverPort := (index $agentCfg "serverPort" | default "") {{ "hub}}" }}
            {{ "{{hub" }} $agentMode := (index $agentCfg "mode" | default "autonomous") {{ "hub}}" }}
            {{ "{{hub" }} $agentNs := (index $agentCfg "namespace" | default "openshift-gitops-agent") {{ "hub}}" }}
            #
            # A DEDICATED Argo CD instance for the principal, not the one AutoShift runs its own
            # configuration from. Two independent reasons. The Red Hat Advanced Cluster Management
            # side of this is Technology Preview, and it has no business sharing a process with the
            # instance that reconciles every policy on the fleet. And in autonomous mode the
            # principal mirrors each spoke Application into a hub namespace named after that
            # cluster, so the instance hosting it grows a namespace and a cache per managed cluster.
            # The main instance is already sized for the work it does.
            #
            # argoServer.argoNamespace below points the add-on at this namespace, and the controller
            # honours it (GetEffectiveArgoNamespace), so the whole automatic public key
            # infrastructure lands here: the cert-manager CA, the principal and resource proxy
            # certificates the controller derives from it, and the JSON web token signing key.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                  labels:
                    openshift.io/cluster-monitoring: 'true'
            #
            # The principal. It will not start until the controller has created
            # argocd-agent-principal-tls and argocd-agent-jwt, so a crash loop on first install is
            # expected and self-resolving; the controller creates those before it looks for this
            # service. insecureGenerate stays false on both because they are supplied, never
            # self-signed here.
            #
            # The auth pattern is NOT the upstream `mtls:CN=([^,]+)`. Agent client certificates are
            # issued through the add-on certificate signing request flow and carry that framework's
            # identity, so the generic pattern rejects every agent while presenting valid
            # certificates. This value matches what the add-on actually issues.
            - complianceType: musthave
              objectDefinition:
                apiVersion: argoproj.io/v1beta1
                kind: ArgoCD
                metadata:
                  name: argocd-agent-principal
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                spec:
                  # DISABLED DELIBERATELY, and this is why the principal needs an instance of its
                  # own. Red Hat documents agent mode as replacing the Argo CD custom resource with
                  # one whose application controller is off, because that instance becomes a
                  # principal rather than a reconciler. Doing that to the instance AutoShift runs
                  # its own configuration from would stop the fleet reconciling, so the principal
                  # gets a separate instance and infra-gitops keeps its controller.
                  controller:
                    enabled: false
                  # Autonomous mode mirrors each spoke Application into a hub namespace named after
                  # its cluster, and those namespaces have to be source namespaces for this instance.
                  #
                  # Enumerated, NOT '*'. A wildcard makes the Argo CD operator claim every namespace
                  # on the cluster: it stamps argocd.argoproj.io/managed-by-cluster-argocd on each
                  # and writes Application RBAC there. A namespace carries only ONE such claim, so a
                  # wildcard here silently takes the team principals' agent namespaces away from
                  # them and their informers are denied with nothing logged above debug.
                  #
                  # This list needs hubTemplateOptions.serviceAccountName on the policy spec below.
                  # A hub template may not list a CLUSTER-SCOPED resource without one, failing with
                  # "lookup of cluster-scoped resource 'ManagedCluster/' is not allowed", and a
                  # template error puts the whole policy NonCompliant, which its dependents then
                  # treat as unmet and un-enforce themselves over.
                  #
                  # A spoke template would carry its own permissions and need no service account,
                  # but object-templates-raw is serialized before it reaches the spoke and the
                  # double quotes inside the action come back escaped, so it fails to parse.
                  sourceNamespaces:
                    {{ "{{hub-" }} $mcs := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "") | default dict {{ "hub}}" }}
                    {{ "{{hub-" }} range $mc := ($mcs.items | default list) {{ "hub}}" }}
                    {{ "{{hub-" }} $mcLabels := (dig "metadata" "labels" dict $mc) {{ "hub}}" }}
                    {{ "{{hub-" }} if and (eq (dig "autoshift.io/gitops-agent-enroll" "" $mcLabels) "true") (ne (dig "local-cluster" "" $mcLabels) "true") {{ "hub}}" }}
                    - '{{ "{{hub" }} dig "metadata" "name" "" $mc {{ "hub}}" }}'
                    {{ "{{hub-" }} end {{ "hub}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
                  argoCDAgent:
                    principal:
                      enabled: true
                      destinationBasedMapping: true
                      auth: 'mtls:CN=system:open-cluster-management:cluster:([^:]+):addon:gitops-addon:agent:gitops-addon-agent'
                      logLevel: {{ "{{hub" }} (index $agentCfg "logLevel" | default "info") {{ "hub}}" }}
                      namespace:
                        allowedNamespaces:
                          - '*'
                        enableNamespaceCreate: true
                      server:
                        route:
                          enabled: true
                      tls:
                        insecureGenerate: false
                        secretName: argocd-agent-principal-tls
                        rootCASecretName: argocd-agent-ca
                      jwt:
                        insecureGenerate: false
                        secretName: argocd-agent-jwt
                      resourceProxy:
                        secretName: argocd-agent-resource-proxy-tls
                        caSecretName: argocd-agent-ca
            #
            # The principal only propagates AppProject resources whose destinations and source
            # namespaces match the agent configuration. Without the wildcards the propagation is
            # skipped silently and agents never find their AppProject, so applications simply do
            # not appear. Red Hat documents this as a required step, not a convenience.
            - complianceType: musthave
              objectDefinition:
                apiVersion: argoproj.io/v1alpha1
                kind: AppProject
                metadata:
                  name: default
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                spec:
                  sourceNamespaces:
                    - '*'
                  sourceRepos:
                    - '*'
                  destinations:
                    - namespace: '*'
                      server: '*'
                  clusterResourceWhitelist:
                    - group: '*'
                      kind: '*'
            #
            # Which clusters get an agent. No clusterSets stanza: a Placement with none selects
            # across every ManagedClusterSet bound to its namespace, which is what makes this work
            # unchanged on a managed hub. The push-model placement cannot be reused, because it
            # bakes its cluster sets from the Helm values of the layer that AUTHORED the policy,
            # and on a managed hub those are the names of the layer above, not that hub's own.
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: Placement
                metadata:
                  name: systems-argocd-agent-placement
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                spec:
                  predicates:
                    - requiredClusterSelector:
                        labelSelector:
                          matchExpressions:
                            - key: 'autoshift.io/gitops-agent-enroll'
                              operator: In
                              values:
                                - 'true'
                            # The hub reaches itself as the built-in in-cluster destination and
                            # never runs an agent against itself. The controller skips
                            # local-cluster when propagating the trust bundle for the same reason.
                            - key: 'local-cluster'
                              operator: NotIn
                              values:
                                - 'true'
                  tolerations:
                    - key: cluster.open-cluster-management.io/unreachable
                      operator: Exists
                    - key: cluster.open-cluster-management.io/unavailable
                      operator: Exists
            #
            # Bind cluster sets into the PRINCIPAL namespace so the placement above can see them.
            # A Placement with no clusterSets selects across the bindings in its own namespace, and
            # this namespace is not the one the push-model policy binds into, so without these the
            # placement reports NoManagedClusterSetBindings and selects nothing at all.
            #
            # config.gitops.agent.clusterSets wins when set, which is how a MANAGED hub names its own
            # spoke cluster sets: the layer that authors this policy is the one above and does not
            # know them. Left empty, fall back to the cluster sets this chart was rendered with,
            # which are the right ones on a self-managed hub.
            {{ "{{hub" }} if $clusterSets {{ "hub}}" }}
            {{ "{{hub" }} range $cs := $clusterSets {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: {{ "{{hub" }} $cs {{ "hub}}" }}
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                spec:
                  clusterSet: {{ "{{hub" }} $cs {{ "hub}}" }}
            {{ "{{hub" }} end {{ "hub}}" }}
            {{ "{{hub" }} else {{ "hub}}" }}
            {{- range $clusterSet, $value := .Values.managedClusterSets }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: {{ $clusterSet }}
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                spec:
                  clusterSet: {{ $clusterSet }}
            {{- end }}
            {{- range $clusterSet, $value := .Values.hubClusterSets }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: {{ $clusterSet }}
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                spec:
                  clusterSet: {{ $clusterSet }}
            {{- end }}
            {{ "{{hub" }} end {{ "hub}}" }}
            #
            # The add-on itself. The controller derives the whole agent public key infrastructure
            # from the argocd-agent-ca secret in this namespace: principal serving certificate,
            # resource proxy certificate, the trust bundle it pushes to each spoke, and every agent
            # client certificate. Issue that secret with cert-manager (the gitops-agent-ca label,
            # policy-cert-manager-gitops-agent-ca) to put the mesh under a known certificate
            # authority; leave it alone and the controller self-signs one per hub.
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps.open-cluster-management.io/v1beta1
                kind: GitOpsCluster
                metadata:
                  name: argo-acm-importer-agent
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                spec:
                  argoServer:
                    cluster: notused
                    argoNamespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                  placementRef:
                    kind: Placement
                    apiVersion: cluster.open-cluster-management.io/v1beta1
                    name: systems-argocd-agent-placement
                    namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                  gitopsAddon:
                    enabled: true
                    argoCDAgent:
                      enabled: true
                      # Whether the controller ships the trust bundle to each spoke itself. Turn it
                      # off only where the organization distributes that trust by its own means.
                      propagateHubCA: {{ "{{hub" }} (index $agentCfg "propagateHubCA" | default true) {{ "hub}}" }}
                      {{ "{{hub" }} if ne $serverAddress "" {{ "hub}}" }}
                      serverAddress: {{ "{{hub" }} $serverAddress {{ "hub}}" }}
                      {{ "{{hub" }} end {{ "hub}}" }}
                      {{ "{{hub" }} if ne $serverPort "" {{ "hub}}" }}
                      serverPort: '{{ "{{hub" }} $serverPort {{ "hub}}" }}'
                      {{ "{{hub" }} end {{ "hub}}" }}
                      # autonomous by default, deliberately. AutoShift already delivers
                      # configuration to spokes through Red Hat Advanced Cluster Management
                      # policies, and managed mode would put a second mechanism in competition with
                      # that one for desired state. Autonomous mode instead fills the gap AutoShift
                      # has: the spoke keeps ownership of its own applications and the hub gains one
                      # real-time view of the fleet. Set 'managed' to make the hub authoritative.
                      mode: {{ "{{hub" }} $agentMode {{ "hub}}" }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gitops-agent
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/gitops-agent'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-gitops-agent
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-gitops-agent
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-gitops-agent
    apiGroup: policy.open-cluster-management.io
    kind: Policy
{{- end }}
