{{- $policyName := "policy-gitops-operator-install" }}
{{- $placementName := "placement-policy-gitops-operator-install" }}

apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ $policyName }}
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-operator-ns
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ .Values.gitops.namespace }}
                  labels:
                    openshift.io/cluster-monitoring: "true"
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: install-operator-gitops
        spec:
          remediationAction: enforce
          severity: high
          complianceType: musthave
          operatorGroup:
            # if operator group exists in namespace use that, otherwise use namespace name as default
            name: '{{ "{{" }} with (lookup "operators.coreos.com/v1" "OperatorGroup" "{{ .Values.gitops.namespace }}" "").items {{ "}}" }}{{ "{{" }} (index . 0).metadata.name {{ "}}" }}{{ "{{" }} else {{ "}}" }}{{ .Values.gitops.namespace }}{{ "{{" }} end {{ "}}" }}'
            namespace: {{ .Values.gitops.namespace }}
          subscription:
            name: '{{ "{{hub" }} index .ManagedClusterLabels "autoshift.io/gitops-subscription-name" | default "{{ .Values.gitops.name }}" {{ "hub}}" }}'
            namespace: {{ .Values.gitops.namespace }}
            # Source: base from label or helm default; if disconnected-mirror is true, appends -<suffix>
            source: '{{ "{{hub" }} $base := (index .ManagedClusterLabels "autoshift.io/gitops-source" | default "{{ .Values.gitops.source }}") {{ "hub}}" }}{{ "{{hub" }} ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") {{ "hub}}" }}'
            config:
              env:
              # disableDefaultArgoCD default = not config.gitops.defaultInstance (from rendered-config);
              # the gitops-disable-default-argocd label still overrides.
              #
              # fromConfigMap, NOT lookup: lookup returns an empty map for a ConfigMap that is missing
              # rather than failing, and an empty map here resolves to DISABLE_DEFAULT_ARGOCD_INSTANCE
              # true, which removes the default instance from any cluster that asked for one. The
              # ConfigMap is written for every cluster in a known cluster set even when nothing is
              # configured, so its absence only ever means the rendered configuration has not landed
              # yet. Failing the template waits; defaulting acts on a guess.
              - name: DISABLE_DEFAULT_ARGOCD_INSTANCE
                value: >-
                  {{ "{{hub-" }} $renderedConfig := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) {{ "hub}}" }}
                  {{ "{{hub-" }} $gitops := (index $renderedConfig "gitops" | default dict) {{ "hub}}" }}
                  {{ "{{hub-" }} $defaultInstance := (index $gitops "defaultInstance" | default false) {{ "hub}}" }}
                  {{ "{{hub-" }} index .ManagedClusterLabels "autoshift.io/gitops-disable-default-argocd" | default (printf "%v" (not $defaultInstance)) {{ "hub}}" }}
              # Base ArgoCD namespace, plus openshift-gitops-<team> for each cluster-scoped dev team on
              # the cluster, plus openshift-gitops-<team>-agent for each team running an Argo CD agent
              # principal, plus the infra agent namespace.
              #
              # A team AGENT is deliberately NOT listed here. It needs one thing at cluster scope,
              # get/list/watch on namespaces, and naming its namespace here would instead make that
              # Argo CD a cluster-scoped instance with broad rights over the cluster. The agent gets
              # a purpose-built ClusterRole in the gitops-dev policy instead.
              #
              # The team principal namespaces are NOT optional. The operator only grants a principal
              # its cluster-scoped permissions, including listing Applications, for namespaces named
              # here; without it the principal starts, fails to build its application cache and exits.
              # This list is also enforced by this policy, so patching the Subscription by hand does
              # not hold.
              - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
                value: >-
                  {{ "{{hub-" }} $namespaces := (index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "{{ .Values.gitopsNamespace | default .Values.gitops.argoNamespace }}") {{ "hub}}" }}
                  {{ "{{hub-" }} range $label, $val := .ManagedClusterLabels {{ "hub}}" }}
                  {{ "{{hub-" }} if and ($label | hasPrefix "autoshift.io/gitops-dev-team-") ($label | hasSuffix "-cluster-scoped") (eq $val "true") {{ "hub}}" }}
                  {{ "{{hub-" }} $team := $label | replace "autoshift.io/gitops-dev-team-" "" | replace "-cluster-scoped" "" {{ "hub}}" }}
                  {{ "{{hub-" }} $namespaces = printf "%s,openshift-gitops-%s" $namespaces $team {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  {{ "{{hub-" }} $rcTeams := (dig "gitops" "teams" dict (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict)) {{ "hub}}" }}
                  {{ "{{hub-" }} range $tName, $tSpec := $rcTeams {{ "hub}}" }}
                  {{ "{{hub-" }} if (dig "agent" "enabled" false $tSpec) {{ "hub}}" }}
                  {{ "{{hub-" }} $namespaces = printf "%s,openshift-gitops-%s-agent" $namespaces $tName {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  {{ "{{hub-" }} if eq (index .ManagedClusterLabels "autoshift.io/gitops-agent" | default "false") "true" {{ "hub}}" }}
                  {{ "{{hub-" }} $agentCfg := (index (index (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) "gitops" | default dict) "agent" | default dict) {{ "hub}}" }}
                  {{ "{{hub-" }} $namespaces = printf "%s,%s" $namespaces (index $agentCfg "namespace" | default "openshift-gitops-agent") {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  {{ "{{hub-" }} $namespaces {{ "hub}}" }}
              # Argo CD agent principal settings. Both are read only by the principal component, so
              # they are inert on a cluster that does not run one, and the keys are set everywhere
              # for the same reason the two above are: this file varies env VALUES per cluster, not
              # the set of keys.
              #
              # Red Hat documents ALLOW_GENERATE false as the way to stop the principal minting its
              # own serving certificate. That matters here more than it does in the documented
              # setup: the whole point of this design is that the certificate authority comes from
              # cert-manager, and a principal that self-signs would quietly opt out of it.
              - name: ARGOCD_PRINCIPAL_TLS_SERVER_ALLOW_GENERATE
                value: 'false'
              # Redis for the principal. The documented value assumes the principal runs inside the
              # openshift-gitops instance; AutoShift gives it an instance of its own, so this has to
              # name that instance's Redis service rather than the default one.
              - name: ARGOCD_PRINCIPAL_REDIS_SERVER_ADDRESS
                value: >-
                  {{ "{{hub-" }} $agentCfg := (index (index (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) "gitops" | default dict) "agent" | default dict) {{ "hub}}" }}
                  {{ "{{hub-" }} $agentNs := (index $agentCfg "namespace" | default "openshift-gitops-agent") {{ "hub}}" }}
                  {{ "{{hub-" }} printf "argocd-agent-principal-redis.%s.svc.cluster.local:6379" $agentNs {{ "hub}}" }}
            sourceNamespace: '{{ "{{hub" }} index .ManagedClusterLabels "autoshift.io/gitops-source-namespace" | default "{{ .Values.gitops.sourceNamespace }}" {{ "hub}}" }}'
            channel: '{{ "{{hub" }} index .ManagedClusterLabels "autoshift.io/gitops-channel" | default "{{ .Values.gitops.channel }}" {{ "hub}}" }}'
            # Version resolution (config in the rendered-config ConfigMap): config.gitops.versions/.startingCSV
            # when set, else the gitops-version label. $vers computed here, reused by versions below.
            startingCSV: >-
              {{ "{{hub-" }} $cfg := (index (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) "gitops" | default dict) {{ "hub}}" }}
              {{ "{{hub-" }} $cfgVers := (dig "versions" (list) $cfg) {{ "hub}}" }}
              {{ "{{hub-" }} $isCfg := (not (empty $cfgVers)) {{ "hub}}" }}
              {{ "{{hub-" }} $labelVer := (index .ManagedClusterLabels "autoshift.io/gitops-version" | default "") {{ "hub}}" }}
              {{ "{{hub-" }} $vers := (ternary $cfgVers (ternary (list) (list $labelVer) (empty $labelVer)) $isCfg) {{ "hub}}" }}
              {{ "{{hub-" }} (ternary (dig "startingCSV" "" $cfg) $labelVer $isCfg) {{ "hub}}" }}
          # Upgrade approval for subscription will be set based on if version is set not this flag
          # If version is set install plan is set to manual and only the version specified will be installed
          upgradeApproval: Automatic
          versions: '{{ "{{hub" }} $vers | toRawJson | toLiteral {{ "hub}}" }}'
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: {{ $placementName }}
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := $.Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/gitops'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ $placementName }}
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: {{ $placementName }}
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: {{ $policyName }}
    apiGroup: policy.open-cluster-management.io
    kind: Policy
