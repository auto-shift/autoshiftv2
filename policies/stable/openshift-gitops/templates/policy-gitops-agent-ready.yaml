# Inform-only health check for the Argo CD agent control plane.
#
# Separate from policy-gitops-agent because a readiness assertion must never ride inside an
# enforcing policy: a root remediationAction overrides its children, so bundling these would turn
# existence checks into things AutoShift tries to CREATE. In particular the secret check below would
# materialise an empty argocd-agent-ca under enforce, which is precisely the failure it exists to
# report.
#
# What it catches that nothing else does: the add-on derives the entire agent public key
# infrastructure from one secret, and when that goes wrong the symptoms are quiet. A failed
# propagation leaves spokes trusting nothing. A missing secret leaves the principal unable to serve.
# Neither raises an error anywhere an operator would look.
{{- if .Values.hubClusterSets }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-gitops-agent-ready
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-12 Cryptographic Key Establishment and Management
spec:
  remediationAction: inform
  disabled: false
  dependencies:
    - name: policy-gitops-agent
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-agent-ready
        spec:
          remediationAction: inform
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            {{ "{{hub" }} $gitopsNamespace := index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "{{ .Values.gitopsNamespace | default .Values.gitops.argoNamespace }}" {{ "hub}}" }}
            {{ "{{hub" }} $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict {{ "hub}}" }}
            {{ "{{hub" }} $agentCfg := (dig "gitops" "infra" "addon" dict (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict)) {{ "hub}}" }}
            {{ "{{hub" }} $propagate := (index $agentCfg "propagateHubCA" | default true) {{ "hub}}" }}
            {{ "{{hub" }} $agentNs := (index $agentCfg "namespace" | default "openshift-gitops-agent") {{ "hub}}" }}
            #
            # The signing certificate authority exists at all. This is the only check that holds for
            # every way of supplying it, including a secret delivered out of band with no
            # cert-manager Certificate behind it to report on.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: argocd-agent-ca
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
            #
            # The controller has signed the principal and resource proxy certificates from it.
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps.open-cluster-management.io/v1beta1
                kind: GitOpsCluster
                metadata:
                  name: argo-acm-importer-agent
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                status:
                  conditions:
                    - type: CertificatesReady
                      status: 'True'
            #
            # The trust bundle reached the spokes. Only asserted when the add-on is the thing
            # distributing it; where an organization distributes that trust by its own means this
            # condition is not the measure of anything.
            {{ "{{hub" }} if $propagate {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps.open-cluster-management.io/v1beta1
                kind: GitOpsCluster
                metadata:
                  name: argo-acm-importer-agent
                  namespace: {{ "{{hub" }} $agentNs {{ "hub}}" }}
                status:
                  conditions:
                    - type: ManifestWorksApplied
                      status: 'True'
            {{ "{{hub" }} end {{ "hub}}" }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gitops-agent-ready
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/gitops-agent'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-gitops-agent-ready
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-gitops-agent-ready
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-gitops-agent-ready
    apiGroup: policy.open-cluster-management.io
    kind: Policy
{{- end }}
