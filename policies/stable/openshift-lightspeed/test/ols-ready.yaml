# Inform-only: Compliant once the Lightspeed app server is serving. The
# OperatorPolicy reports on the Subscription and CSV, which say nothing about
# whether the OLSConfig resolved to a provider that actually answers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-app-server
  namespace: openshift-lightspeed
status:
  conditions:
    - type: Available
      status: 'True'
