object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $ls := (index $config "openshift-lightspeed" | default dict) hub}}
  {{hub- $secretName := (index $ls "credentialsSecretName" | default "lightspeed-llm-credentials") hub}}
  {{hub- $hs := (index $ls "hubSecret" | default dict) hub}}
  {{hub- $hsName := (index $hs "name" | default "") hub}}
  {{hub- $hsNs := (index $hs "namespace" | default "lightspeed-secrets") hub}}
  {{hub- $hsKey := (index $hs "key" | default "apitoken") hub}}
  {{/* No hubSecret configured -> emit nothing. The OLSConfig then references a Secret the cluster
       owner (or External Secrets) provides. The guard is load-bearing: musthave + enforce CREATES
       absent objects, so an ungated template would materialize an empty phantom Secret. */}}
  {{hub- if $hsName hub}}
  {{/* fromSecret (not lookup): ACM encrypts fromSecret output in the replicated policy, whereas a
       lookup would leave the token in plaintext in every managed-cluster namespace. It also hard-
       errors when the hub Secret is missing, which is the loud failure we want for configured-but-
       absent — hence the whole block sitting inside the if. Output is already base64, so `data`. */}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: '{{hub $secretName hub}}'
        namespace: openshift-lightspeed
      data:
        # OLSConfig always reads the token from the `apitoken` key regardless of what the provider
        # calls it, so the hub-side key name is remapped here.
        apitoken: '{{hub fromSecret $hsNs $hsName $hsKey hub}}'
  {{hub- end hub}}
