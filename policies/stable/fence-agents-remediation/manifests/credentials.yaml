object-templates-raw: |
  {{hub- $config := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $far := (index $config "fenceAgentsRemediation" | default dict) hub}}
  {{hub- $creds := (index $far "credentials" | default dict) hub}}
  {{hub- $ci := (index $config "clusterInstall" | default dict) hub}}
  {{hub- $hosts := (index $config "hosts" | default dict) hub}}
  {{hub- $srcNs := (index $creds "sourceNamespace" | default (index $ci "secretSourceNamespace") | default "cluster-install-secrets") hub}}
  {{hub- $srcName := (index $creds "sourceName" | default (index $ci "bmcCredentialRef") | default "default-bmc-cred") hub}}
  {{hub- $userKey := (index $creds "usernameKey" | default "username") hub}}
  {{hub- $passKey := (index $creds "passwordKey" | default "password") hub}}
  {{hub- $secretName := (index $creds "secretName" | default "fence-agents-credentials-shared") hub}}
  {{- /* FAR reads the Secret keys as fence-agent flags, so the BMC username/password are renamed. */}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{hub $secretName hub}}'
        namespace: openshift-workload-availability
        labels:
          app.kubernetes.io/managed-by: autoshift
      type: Opaque
      data:
        '--username': '{{hub fromSecret $srcNs $srcName $userKey hub}}'
        '--password': '{{hub fromSecret $srcNs $srcName $passKey hub}}'
  {{hub- range $hostname, $host := $hosts hub}}
  {{hub- $ref := (index $host "bmcCredentialRef" | default dict) hub}}
  {{hub- if $ref hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: 'fence-agents-credentials-{{hub $hostname hub}}'
        namespace: openshift-workload-availability
        labels:
          app.kubernetes.io/managed-by: autoshift
      type: Opaque
      data:
        '--username': '{{hub fromSecret (index $ref "namespace" | default $srcNs) (index $ref "name") $userKey hub}}'
        '--password': '{{hub fromSecret (index $ref "namespace" | default $srcNs) (index $ref "name") $passKey hub}}'
  {{hub- end hub}}
  {{hub- end hub}}
