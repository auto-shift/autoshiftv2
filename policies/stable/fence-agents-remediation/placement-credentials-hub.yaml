apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-far-credentials
  namespace: ${POLICY_NAMESPACE}
spec:
  # Places the hub credential copy unless the cluster brings its own Secret
  # (fence-agents-remediation-credentials: existing). NotIn also matches an absent label, so `hub`
  # is the default. Gated here rather than in the template so the policy is never placed empty.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/fence-agents-remediation'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/fence-agents-remediation-credentials'
              operator: NotIn
              values:
                - 'existing'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
