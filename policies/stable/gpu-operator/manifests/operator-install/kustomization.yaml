apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renders the shared components/operator-install chart. Label-driven subscription; certified-operators
# catalog. Own-mode install (targetNamespaces) since the GPU operator is namespaced.
helmGlobals:
  chartHome: ../../../../../components/
helmCharts:
  - name: operator-install
    releaseName: gpu-operator
    valuesInline:
      name: gpu-operator
      namespace: nvidia-gpu-operator
      remediation: ${REMEDIATION}
      targetNamespaces:
        - nvidia-gpu-operator
      subscription:
        name: '{{hub index .ManagedClusterLabels "autoshift.io/gpu-operator-subscription-name" | default "gpu-operator-certified" hub}}'
        channel: '{{hub index .ManagedClusterLabels "autoshift.io/gpu-operator-channel" | default "stable" hub}}'
        source: '{{hub $base := (index .ManagedClusterLabels "autoshift.io/gpu-operator-source" | default "certified-operators") hub}}{{hub ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") hub}}'
        sourceNamespace: '{{hub index .ManagedClusterLabels "autoshift.io/gpu-operator-source-namespace" | default "openshift-marketplace" hub}}'
        # $v (version label) is set here and reused by versions below (same policy, resolves first).
        startingCSV: |-
          {{hub- $v := (index .ManagedClusterLabels "autoshift.io/gpu-operator-version" | default "") hub}}
          {{hub- $v hub}}
      # versions = [] when no version label (let OLM pick), else [<version>] to pin.
      versions: '{{hub ternary (list) (list $v) (empty $v) | toRawJson | toLiteral hub}}'
