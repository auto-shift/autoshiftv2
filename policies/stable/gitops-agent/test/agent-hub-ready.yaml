# Inform-only: the hub half of each team's agent is actually serving.
#
# EVERY assertion here is unconditional for a team that has the agent enabled. That is the point:
# an inform policy that renders nothing reports Compliant, which reads as "verified" when in fact
# nothing was examined. The placement decides whether this policy exists at all; once it exists it
# always checks something.
object-templates-raw: |
  # fromConfigMap: without this cluster's values there is nothing to assert against, so failing is
  # more honest than asserting defaults.
  {{hub- $rcmCfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $cfg := $rcmCfg hub}}
  # infra joins the iteration as a team named infra; whether its principal lives here is the
  # gitops-agent label, not this hub's own gitops-infra mode.
  {{hub- $teamSpecs := (dig "gitops" "teams" dict $cfg) hub}}
  {{hub- $teamSpecs = merge (dict "infra" (dig "gitops" "infra" dict $cfg)) $teamSpecs hub}}
  # Hoisted: range rebinds the dot, and the uninstall test below needs this hub's own labels.
  {{hub- $hubLabels := .ManagedClusterLabels hub}}
  {{hub- range $team, $spec := $teamSpecs hub}}
  {{hub- $agentCfg := (dig "agent" dict $spec) hub}}
  # Skipped once this hub's label for the team reads uninstall. Teardown is driven by the label
  # while this loop reads config, so a torn-down team would otherwise stay asserted here forever.
  # Keying on the label alone means the operator sets one value rather than two.
  # infra's principal is here when this hub carries gitops-agent; a team's when this hub carries
  # gitops-agent-teams and the team's config enables its agent.
  {{hub- $agentOn := ternary (eq (index $hubLabels "autoshift.io/gitops-agent" | default "") "true") (and (dig "enabled" false $agentCfg) (eq (index $hubLabels "autoshift.io/gitops-agent-teams" | default "") "true")) (eq $team "infra") hub}}
  {{hub- if and $agentOn (ne (index $hubLabels (printf "autoshift.io/gitops-dev-team-%s" $team) | default "") "uninstall") hub}}
  {{hub- $agentNs := (dig "agentNamespace" (printf "openshift-gitops-%s-agent" $team) $spec) hub}}
  # The namespace, which exists whenever this policy has ever run. Asserting it means a Compliant
  # verdict can never mean "checked nothing".
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{hub $agentNs hub}}
  # The signing certificate authority, and the JSON web token key the principal needs to start.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitops-agent-ca
        namespace: {{hub $agentNs hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitops-agent-jwt
        namespace: {{hub $agentNs hub}}
  # The principal itself, reconciled by the operator.
  - complianceType: musthave
    objectDefinition:
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: {{hub printf "%s-principal" $team hub}}
        namespace: {{hub $agentNs hub}}
      status:
        phase: Available
  # The principal deployment's rollout, for the same reason the spoke asserts the agent's: the
  # operator reports the custom resource Available off minimum availability, which a stalled rolling
  # update still satisfies while the OLD pod serves the OLD configuration. Progressing stays True
  # after a completed rollout and goes False on ProgressDeadlineExceeded.
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{hub printf "%s-principal-agent-principal" $team hub}}
        namespace: {{hub $agentNs hub}}
      status:
        conditions:
          - type: Available
            status: 'True'
          - type: Progressing
            status: 'True'
  # PER ENROLLED CLUSTER. The assertions above are team-scoped, which cannot detect one cluster
  # falling out of enrollment while the team itself stays healthy. musthave never removes what it
  # created, so that cluster's objects persist and only a per-cluster assertion notices.
  # The enrolled clusters are THIS hub's own, so they are read by a spoke template, which runs on
  # the hub this check lands on; a hub template would read the hub that placed it.
  {{- range $mc := ((lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items | default list) }}
  {{- if hasPrefix "agent" (dig "metadata" "labels" "{{hub ternary "autoshift.io/gitops-infra" (printf "autoshift.io/gitops-dev-team-%s" $team) (eq $team "infra") hub}}" "" $mc) }}
  {{- $agentName := printf "%s-{{hub $team hub}}" (dig "metadata" "name" "" $mc) }}
  # The agent's own namespace, whose name must equal the agent name for the principal to map it.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ $agentName }}'
  # The client certificate this cluster's agent authenticates with.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ printf "%s-client-tls" $agentName }}'
        namespace: {{hub $agentNs hub}}
  # The agent-to-cluster mapping. Absent, the principal authenticates the agent and then refuses to
  # route anything to it, logging only "is not mapped to any cluster".
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ printf "cluster-%s" $agentName }}'
        namespace: {{hub $agentNs hub}}
  # The permit list actually naming this agent. Naming too few namespaces is not an error: the
  # principal just never propagates the project, and the team's applications never appear.
  - complianceType: musthave
    objectDefinition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: default
        namespace: {{hub $agentNs hub}}
      spec:
        sourceNamespaces:
          - '{{ $agentName }}'
  {{- end }}
  {{- end }}
  {{hub- end hub}}
  {{hub- end hub}}
