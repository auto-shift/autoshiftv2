object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- if hasKey $config "Error" hub}}
  {{hub- fail (printf "nhc config error: rendered-config YAML parse error: %v" (index $config "Error")) hub}}
  {{hub- end hub}}
  {{hub- /* Remediation operators this policy knows about. To check another operator, add one more dict here */hub}}
  {{hub- $ops := list (dict "label" "Fence Agents Remediation" "prefix" "fence-agents-remediation" "kind" "FenceAgentsRemediationTemplate" "type" "far") (dict "label" "Self Node Remediation" "prefix" "self-node-remediation" "kind" "SelfNodeRemediationTemplate" "type" "snr") (dict "label" "Machine Deletion Remediation" "prefix" "machine-deletion-remediation" "kind" "MachineDeletionRemediationTemplate" "type" "mdr") hub}}
  {{hub- /* Keep only the operators the config actually references (by template kind, or legacy type/far markers) */hub}}
  {{hub- $json := toRawJson $config hub}}
  {{hub- $required := list hub}}
  {{hub- range $op := $ops hub}}
  {{hub- if or (contains $op.kind $json) (contains (printf `"type":"%s"` $op.type) $json) (and (eq $op.type "far") (contains `"far":true` $json)) hub}}
  {{hub- $required = append $required $op hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- if $required hub}}
  {{- /* Collect installed operator CSVs once, then check each required operator against them */}}
  {{- $missing := list }}
  {{- $csvs := (lookup "operators.coreos.com/v1alpha1" "ClusterServiceVersion" "" "").items }}
  {{hub- range $op := $required hub}}
  {{- $found := false }}
  {{- range $csv := $csvs }}
  {{- if and (hasPrefix "{{hub $op.prefix hub}}" $csv.metadata.name) (eq (default dict $csv.status).phase "Succeeded") }}
  {{- $found = true }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: ClusterServiceVersion
      metadata:
        name: {{ $csv.metadata.name }}
        namespace: {{ $csv.metadata.namespace }}
      status:
        phase: Succeeded
  {{- end }}
  {{- end }}
  {{- if not $found }}{{- $missing = append $missing "{{hub $op.label hub}}" }}{{- end }}
  {{hub- end hub}}
  {{- if $missing }}
  {{- fail (printf "The nhc config references remediation types whose operators are not installed (no Succeeded ClusterServiceVersion found): %s. Install the missing operator(s), for example by subscribing to the matching package from redhat-operators in the openshift-workload-availability namespace." (join ", " $missing)) }}
  {{- end }}
  {{hub- else hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: default
  {{hub- end hub}}