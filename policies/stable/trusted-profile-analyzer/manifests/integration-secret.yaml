# TPA integration secret — advertises the TPA API endpoints to other TSSC components (RHDH, pipelines).
# The key names are the TSSC contract from TPA 1, which split the APIs across services. TPA 2 and later
# serve them all from one server, at the route instance.yaml's appDomain produces.
object-templates-raw: |
  {{hub- $ns := "tssc-tpa" hub}}
  {{- $appsDomain := (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tssc-tpa-integration
        namespace: '{{hub $ns hub}}'
      type: Opaque
      stringData:
        bombastic_api_url: 'https://server-{{hub $ns hub}}.{{ $appsDomain }}'
        vexination_api_url: 'https://server-{{hub $ns hub}}.{{ $appsDomain }}'
        collectorist_api_url: 'https://server-{{hub $ns hub}}.{{ $appsDomain }}'
