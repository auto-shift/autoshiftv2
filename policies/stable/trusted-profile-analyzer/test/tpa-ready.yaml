# Readiness gate (inform-only): the Operator installed the TrustedProfileAnalyzer release, and its server
# is Available. The Operator is Helm-based, so the CR reports Deployed and ReleaseFailed, not a Ready
# condition, and Deployed says nothing about the pods; the server Deployment does.
object-templates-raw: |
  - complianceType: musthave
    objectDefinition:
      apiVersion: rhtpa.io/v1
      kind: TrustedProfileAnalyzer
      metadata:
        name: trustedprofileanalyzer
        namespace: tssc-tpa
      status:
        conditions:
          - type: Deployed
            status: "True"
          - type: ReleaseFailed
            status: "False"
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: server
        namespace: tssc-tpa
      status:
        conditions:
          - type: Available
            status: "True"
