apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: ztwim
# Per-deployment scalars (${...}) are substituted by the repo-server CMP (envsubst/sed) BEFORE
# `kustomize build` runs. They live here and in the placement files — never in manifests/, whose hub
# templates contain `$vars` that substitution would clobber.
#
# manifests[].path is a DIRECTORY: drop a new manifest into it and it is picked up automatically.
# Only edit this file to change the policy graph itself (names, dependencies, per-policy remediation).
# Keep the placement files OUT of manifests/ (a Placement inside a wildcarded dir would be wrapped
# into the Policy as a managed object).
placementBindingDefaults:
  name: binding-policy-ztwim
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: high
  # Every manifest here is object-templates-raw, which must stay its own ConfigurationPolicy.
  consolidateManifests: false
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - AC Access Control
  controls:
    - AC-3 Access Enforcement
  # Placement authored by us (full fidelity); PG includes it and generates only the PlacementBinding.
  placement:
    placementPath: placement.yaml
policies:
  # The operator itself. consolidateManifests: true here only — this policy is the shared
  # operator-install chart (a raw Namespace plus a first-class OperatorPolicy), not a raw template.
  - name: policy-ztwim-operator-install
    consolidateManifests: true
    manifests:
      - path: manifests/operator-install
  # ZeroTrustWorkloadIdentityManager carries the trust domain and cluster name that every other
  # operand controller reads, so it lands before them.
  - name: policy-ztwim-instance
    # On a nested SPOKE this manifest reads the HUB's ZeroTrustWorkloadIdentityManager CR to derive
    # the shared trust domain. That CR is CLUSTER-SCOPED, and a hub template may not look up
    # cluster-scoped resources at all without an elevated service account -- it fails with
    # "lookup of cluster-scoped resource ... is not allowed", which is a different error from an
    # RBAC denial and easy to misread.
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-ztwim-operator-install
    manifests:
      - path: manifests/instance
  # Opt-in shared datastore. Ordered BEFORE the operands: SpireServer's connectionString reads the
  # password out of the Secret CNPG generates, so the database has to exist first or the server is
  # configured with an empty password and fails to start.
  - name: policy-ztwim-cnpg
    placement:
      placementPath: placement-ztwim-cnpg.yaml
    dependencies:
      - name: policy-ztwim-instance
    manifests:
      - path: manifests/cnpg
  # The operands: SPIRE server, agent, CSI driver and OIDC discovery provider.
  - name: policy-ztwim-config
    dependencies:
      - name: policy-ztwim-instance
    manifests:
      - path: manifests/config
  # Opt-in (autoshift.io/ztwim-federation): trust bundles from FOREIGN trust domains.
  - name: policy-ztwim-federation
    placement:
      placementPath: placement-ztwim-federation.yaml
    dependencies:
      - name: policy-ztwim-config
    manifests:
      - path: manifests/federation
  # ---------------------------------------------------------------------------------------------
  # Nested SPIRE (opt-in, autoshift.io/ztwim-nested-role: hub|spoke).
  #
  # Ordering is expressed as dependencies rather than left to chance: CREATE_ONLY_MODE must be in
  # effect BEFORE either side patches the operator-generated server.conf, or the operator reverts
  # the patch on its next reconcile.
  # ---------------------------------------------------------------------------------------------
  - name: policy-ztwim-nested-create-only
    placement:
      placementPath: placement-ztwim-nested.yaml
    dependencies:
      - name: policy-ztwim-config
    manifests:
      - path: manifests/nested-create-only
  # Hub side: the gRPC endpoint spokes dial, a per-spoke kubeconfig assembled from ACM state, the
  # k8s_psat patch that consumes it, and the registration entries that permit downstream signing.
  - name: policy-ztwim-nested-hub
    placement:
      placementPath: placement-ztwim-nested-hub.yaml
    dependencies:
      - name: policy-ztwim-nested-create-only
    manifests:
      - path: manifests/nested-hub
  # Spoke side: the hub trust bundle, the upstream agent and its CSI bridge, and the upstream
  # authority patch. The trust-bundle manifest reads a ConfigMap in the operator namespace ON THE
  # HUB, which is cross-namespace, so this policy needs the elevated hub-template service account.
  - name: policy-ztwim-nested-spoke
    placement:
      placementPath: placement-ztwim-nested-spoke.yaml
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-ztwim-nested-create-only
    manifests:
      - path: manifests/nested-spoke
  # OPT-IN (autoshift.io/ztwim-nested-auto-reset): automates the one manual step by clearing the
  # spoke's SPIRE datastore so it re-mints its CA from the hub. Split in two so the clear is ORDERED
  # before the resume rather than racing it. This is the only part of the policy that can delete a
  # PersistentVolumeClaim, which is why it needs its own label and is off by default.
  - name: policy-ztwim-nested-auto-reset
    placement:
      placementPath: placement-ztwim-nested-auto-reset.yaml
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-ztwim-nested-spoke
    manifests:
      - path: manifests/nested-spoke-reset
  - name: policy-ztwim-nested-auto-resume
    placement:
      placementPath: placement-ztwim-nested-auto-reset.yaml
    dependencies:
      - name: policy-ztwim-nested-auto-reset
    manifests:
      - path: manifests/nested-spoke-resume
  # inform: catches a nested pair that reports green while silently doing nothing. An unsatisfied
  # guard renders no object templates, and an empty ConfigurationPolicy reports Compliant -- so
  # these assert the EFFECTS exist rather than trusting the enforcing policies' own status.
  # Deliberately NOT depended on by the enforcing policies: they detect, they do not gate, so
  # making them a dependency would deadlock (the effect cannot exist until the enforcer runs).
  - name: policy-ztwim-nested-hub-effective
    placement:
      placementPath: placement-ztwim-nested-hub.yaml
    remediationAction: inform
    dependencies:
      - name: policy-ztwim-nested-hub
    manifests:
      - path: test/nested-hub-effective.yaml
    customMessage:
      noncompliant: >
        Nested SPIRE is enabled on this hub but its gRPC Route is absent, so the hub-side policies
        rendered no objects. The usual cause is the cluster ingress domain not resolving. Check
        policy-ztwim-nested-hub and note that an empty render reports Compliant, so its green
        status is not evidence that it did anything.
  - name: policy-ztwim-nested-spoke-effective
    placement:
      placementPath: placement-ztwim-nested-spoke.yaml
    remediationAction: inform
    dependencies:
      - name: policy-ztwim-nested-spoke
    manifests:
      - path: test/nested-spoke-effective.yaml
    customMessage:
      noncompliant: >
        Nested SPIRE is enabled on this spoke but the upstream agent or the hub trust bundle is
        absent, so the spoke-side policies rendered no objects. Check that
        config.ztwim.trustDomain is set to the SAME value as the hub, and that the elevated hub
        template service account can get, list AND watch ConfigMaps in the operator namespace on
        the hub. An empty render reports Compliant, so policy-ztwim-nested-spoke being green is
        not evidence that it did anything.
  # inform: proves the nested CA chain actually FORMED. The two checks above catch "rendered
  # nothing"; this catches "rendered everything and still did not chain" -- a trust domain mismatch,
  # an upstream authority patch that did not take, or a datastore PVC that was never cleared.
  - name: policy-ztwim-nested-spoke-chained
    placement:
      placementPath: placement-ztwim-nested-spoke.yaml
    remediationAction: inform
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-ztwim-nested-spoke
    manifests:
      - path: test/nested-spoke-chained.yaml
    customMessage:
      noncompliant: >
        This spoke is not chained to the hub: its SPIRE trust bundle differs from the hub's root, so
        it is still serving a CA of its own. Check that config.ztwim.trustDomain is the SAME value
        on hub and spoke, that the spire UpstreamAuthority block is present in the spoke's
        spire-server ConfigMap, and that the one-time datastore PVC clear has been done on the
        spoke (see the policy README) -- SPIRE keeps the root it minted on first boot until that
        volume is removed.
  # OPT-IN (autoshift.io/ztwim-operand-reconcile): forces the operator to reapply a changed operand
  # CR under CREATE_ONLY_MODE, by deleting the stale workload so the create path runs. Off by
  # default because on a nested hub it restarts the SPIRE server, and with it the fleet's CA.
  - name: policy-ztwim-operand-reconcile
    placement:
      placementPath: placement-ztwim-operand-reconcile.yaml
    dependencies:
      - name: policy-ztwim-config
    manifests:
      - path: manifests/operand-reconcile
  # inform: catches an operator that upgraded while CREATE_ONLY_MODE held its operands at the
  # previous release's images. Placed on every ztwim cluster, not just nested ones.
  - name: policy-ztwim-operand-drift
    remediationAction: inform
    dependencies:
      - name: policy-ztwim-config
    manifests:
      - path: test/operand-image-drift.yaml
    customMessage:
      noncompliant: >
        The ZTWIM operator has upgraded but one or more SPIRE operands are still running the
        previous release's images. This is CREATE_ONLY_MODE: the operator creates absent objects
        but never updates existing ones, so the operand CRs report Ready while the workloads are
        stale. The drifted workloads are named in the annotation on the violating object. To
        repair, set autoshift.io/ztwim-operand-reconcile to 'true' so AutoShift deletes them and
        the operator recreates them at the declared images, or delete them by hand. On a nested hub
        this restarts the SPIRE server and therefore the trust domain's CA -- see the policy README.
  # inform: surfaces a SPIRE control plane that installed but never became ready.
  - name: policy-ztwim-ready
    remediationAction: inform
    dependencies:
      - name: policy-ztwim-config
    manifests:
      - path: test/spire-ready.yaml
