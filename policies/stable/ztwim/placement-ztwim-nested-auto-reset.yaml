apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-ztwim-nested-auto-reset
  namespace: ${POLICY_NAMESPACE}
spec:
  # Opt-in, and deliberately narrow. This is the only placement in the policy that selects clusters
  # where AutoShift may DELETE a PersistentVolumeClaim, so it requires an explicit third label
  # rather than riding on ztwim-nested-role alone.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/ztwim'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/ztwim-nested-role'
              operator: In
              values:
                - 'spoke'
                - 'both'
            - key: 'autoshift.io/ztwim-nested-auto-reset'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
