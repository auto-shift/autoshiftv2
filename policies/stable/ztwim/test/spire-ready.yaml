# inform-only: surfaces a SPIRE control plane that installed but never became ready.
#
# Kept OUT of the enforcing policies deliberately — a root remediationAction overrides its children,
# so an existence or readiness assertion bundled into an enforcing policy would be enforced too, and
# ACM would try to CREATE the StatefulSet it is only meant to observe.
#
# The status subresource is matched, not the spec: readyReplicas is what distinguishes "the operator
# wrote the workload" from "SPIRE is actually issuing identities".
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: zero-trust-workload-identity-manager
status:
  readyReplicas: 1
