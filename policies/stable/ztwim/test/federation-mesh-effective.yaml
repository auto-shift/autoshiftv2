# inform: catches a federation mesh that reports success while trusting nobody.
#
# Both halves of the mesh are guard-wrapped, and an unsatisfied guard renders no object templates,
# which a ConfigurationPolicy reports as Compliant. A member can therefore carry the mesh label,
# have both enforcing policies green, and hold no federated trust domains at all, because a peer
# view never reported, or because the endpoint the views read does not exist.
#
# Two distinct failures are checked, and the violating object name says which.
#
# ztwim-federation-not-in-server-config: the running server has no federation block. Either
# config.ztwim.federation.bundleEndpoint was never set, so the Operator published no endpoint for
# peers to fetch from, or the cluster is in CREATE_ONLY_MODE for nesting and the Operator could not
# rewrite the generated configuration. Under that mode the federation Route still appears, because
# creating it is a create, while server.conf is left untouched.
#
# ztwim-mesh-missing-<peer>: that peer's trust domain has no ClusterFederatedTrustDomain here,
# either because its views have not reported a trust domain yet or because the resource was never
# written. The sentinel is named for the peer rather than the domain so the violation says which
# cluster to look at.
#
# The assertion tracks manifests/federation-mesh/mesh-trust-domains.yaml exactly, and has to: that
# manifest emits one resource per peer TRUST DOMAIN, skipping peers that share this cluster's own
# domain and peers whose domain another peer already supplied. Asserting one per peer instead would
# hold a nested pair permanently in violation for a resource that is correctly never created.
#
# The peer list and the trust domains are hub templates, because ManagedCluster membership and the
# views both live on the cluster running Red Hat Advanced Cluster Management. The presence checks
# are spoke templates against local resources. The hub pass emits one local check per peer.
object-templates-raw: |
  {{hub- $self := .ManagedClusterName hub}}
  {{hub- $group := (index .ManagedClusterLabels "autoshift.io/ztwim-federation-mesh" | default "") hub}}
  {{hub- $selfDomainView := (lookup "view.open-cluster-management.io/v1beta1" "ManagedClusterView" $self "ztwim-fed-domain") | default dict hub}}
  {{hub- $selfDomain := (dig "status" "result" "spec" "trustDomain" "" $selfDomainView) hub}}
  {{hub- $seen := dict hub}}
  {{hub- if $group hub}}
  {{- $ns := "zero-trust-workload-identity-manager" }}
  {{- $conf := (lookup "v1" "ConfigMap" $ns "spire-server") | default dict }}
  {{- $raw := dig "data" "server.conf" "" $conf }}
  {{- if and $raw (not (hasKey ($raw | fromJSON).server "federation")) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ztwim-federation-not-in-server-config
        namespace: {{ $ns }}
  {{- end }}
  {{hub- range $mc := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items hub}}
  {{hub- $peer := $mc.metadata.name hub}}
  {{hub- $peerGroup := (index $mc.metadata.labels "autoshift.io/ztwim-federation-mesh" | default "") hub}}
  {{hub- if and (eq $peerGroup $group) (ne $peer $self) hub}}
  {{hub- $domainView := (lookup "view.open-cluster-management.io/v1beta1" "ManagedClusterView" $peer "ztwim-fed-domain") | default dict hub}}
  {{hub- $domain := (dig "status" "result" "spec" "trustDomain" "" $domainView) hub}}
  {{hub- $domainName := ($domain | lower | replace "_" "-" | trunc 240) hub}}
  {{hub- if and $domain (ne $domain $selfDomain) (not (hasKey $seen $domainName)) hub}}
  {{hub- $_ := set $seen $domainName $peer hub}}
  {{- $p := `{{hub $peer hub}}` }}
  {{- $d := `{{hub $domainName hub}}` }}
  {{- if not (lookup "spire.spiffe.io/v1alpha1" "ClusterFederatedTrustDomain" "" (printf "ztwim-mesh-%s" $d)) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ztwim-mesh-missing-{{ $p }}
        namespace: {{ $ns }}
  {{- end }}
  {{hub- end hub}}
  {{hub- if not $domain hub}}
  {{- $p := `{{hub $peer hub}}` }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ztwim-mesh-missing-{{ $p }}
        namespace: {{ $ns }}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
