# inform-only: catches a nested HUB that reports green while doing nothing.
#
# WHY THIS EXISTS: the nested manifests guard their output on inputs being present
# (config.ztwim.trustDomain, the cluster ingress domain, a spoke kubeconfig). When a guard is not
# satisfied the template renders to NOTHING, and a ConfigurationPolicy with no object templates
# reports **Compliant**: "contains no object templates to check, and thus has no violations".
# So a misconfigured hub looks identical to a working one.
#
# This asserts the EFFECTS instead. If the hub-side policies silently no-opped, these objects are
# absent and the policy goes NonCompliant with a message naming the likely cause.
#
# Placed on the nested hub only, so it never fires on a cluster that is not part of a nested pair.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spire-server-grpc
  namespace: zero-trust-workload-identity-manager
