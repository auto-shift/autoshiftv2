# Hub side of the spoke->hub credential.
#
# The hub's spire-server must run a TokenReview against EACH spoke's API server to validate the
# k8s_psat token its upstream agent presents. That needs a kubeconfig per spoke, on the hub.
#
# ACM supplies every piece, so nothing has to be pushed from spoke to hub:
#   - ManagedServiceAccount (multicluster-engine, enabled by default since ACM 2.10) creates a
#     ServiceAccount ON the spoke and reports its token into a Secret in the spoke's cluster
#     namespace ON the hub, rotating it automatically.
#   - ManagedCluster.spec.managedClusterClientConfigs[0] already carries both the spoke API URL and
#     its CA bundle.
# So the kubeconfig is assembled entirely from state the hub already holds. No ESO, no external
# secret store, no credential travelling spoke->hub.
#
# ONE SECRET, KEYED BY SPOKE NAME. This is what decides how many spokes a hub can carry. A Secret
# per spoke would need a volume and a volumeMount per spoke on the single spire-server pod, growing
# the pod spec without bound and leaving the kubelet holding one secret watch per spoke on one pod.
# Keyed into a single Secret, each key surfaces as a file under one mount and the pod spec is
# constant. See psat-clusters.yaml for the mount.
#
# The ceiling moves to the Secret size limit rather than the pod spec: 1048576 bytes of DECODED
# data, since the check sums the raw values and not their base64 form. Spokes per hub is therefore
# 1048576 divided by the size of one kubeconfig.
#
# That divisor is NOT a constant, so do not hardcode the result. A kubeconfig is dominated by the
# spoke's API server CA bundle -- on a default Red Hat OpenShift cluster roughly 15KB of certificate
# authority data against 1.3KB of token and 350 bytes of everything else, landing near 60 spokes. A
# corporate certificate chain appended to that bundle drops it to roughly 35; one shared root
# referenced by path instead of inlined raises it into the hundreds.
#
# Beyond whatever a hub carries, shard: ztwim-nested-role 'both' on a middle tier squares it.
#
# mustonlyhave, deliberately: musthave MERGES map keys, so a spoke that is removed from the fleet
# would keep its key here forever. Replacing the object makes the Secret exactly the current set.
#
# Rotation is left at the MSA default rather than pinned long: the point of using MSA over a copied
# credential is short-lived, auto-rotated tokens. A rotation changes this Secret's CONTENT but not
# the spire-server pod spec, so it propagates through the kubelet without a restart.
#
# This policy is placed on the HUB, so these templates run against the hub's own API. Objects land
# on the cluster the policy is placed on, which is why the kubeconfig Secret can be written into the
# operand namespace here.
object-templates-raw: |
  {{- $ns := "zero-trust-workload-identity-manager" }}
  {{- $msaName := "ztwim-tokenreview" }}
  {{- $data := dict }}
  {{- range $mc := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items }}
  {{- $role := index $mc.metadata.labels "autoshift.io/ztwim-nested-role" | default "" }}
  {{- if eq $role "spoke" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: authentication.open-cluster-management.io/v1beta1
      kind: ManagedServiceAccount
      metadata:
        name: {{ $msaName }}
        namespace: {{ $mc.metadata.name }}
      spec:
        rotation:
          enabled: true
  {{- $tok := (lookup "v1" "Secret" $mc.metadata.name $msaName) | default dict }}
  {{- $tokData := dig "data" "token" "" $tok }}
  {{- $ccfg := index (dig "spec" "managedClusterClientConfigs" (list) $mc) 0 | default dict }}
  {{- $url := dig "url" "" $ccfg }}
  {{- $ca := dig "caBundle" "" $ccfg }}
  {{- /* A spoke is added only once the MSA has reported a token AND the client config carries a CA,
         so a half-built kubeconfig is never written. token/ca stay base64 throughout - they are
         moved, never decoded, except the token which kubeconfig requires in clear. */}}
  {{- if and $tokData $url $ca }}
  {{- $n := $mc.metadata.name }}
  {{- $_ := set $data $n (printf "apiVersion: v1\nkind: Config\nclusters:\n  - name: %s\n    cluster:\n      server: %s\n      certificate-authority-data: %s\nusers:\n  - name: %s\n    user:\n      token: %s\ncontexts:\n  - name: %s\n    context:\n      cluster: %s\n      user: %s\ncurrent-context: %s\n" $n $url $ca $msaName ($tokData | base64dec) $n $n $msaName $n) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $data }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: spoke-kubeconfigs
        namespace: {{ $ns }}
      type: Opaque
      stringData: {{ $data | toRawJson | toLiteral }}
  {{- end }}
