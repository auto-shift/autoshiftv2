# SpireAgent — the per-node DaemonSet that attests workloads and hands them SVIDs.
#
# k8s_psat is the only node attestor the CRD exposes, and it is on by default; the workload attestor
# verification type `auto` picks host-cert verification where the kubelet serving cert allows it and
# falls back otherwise, which is the right default on OpenShift.
#
# SCHEDULING. This is a DaemonSet, and it is the reason the tolerations matter: a workload can be
# scheduled onto ANY node that admits workloads, and if this pod is not on that node the workload
# silently cannot obtain an SVID -- there is no error, the socket is simply absent. AutoShift's own
# infra-nodes and storage-nodes policies taint most nodes, so anything less than TOLERATE ALL leaves
# SPIRE covering a fraction of the cluster. That is the same posture the CNI and CSI DaemonSets take,
# because node-level identity infrastructure has to be wherever workloads are. Setting config.ztwim.agent.tolerations: [] explicitly clears it -- hasKey
# distinguishes an explicit empty list from an unset key -- and a non-empty list replaces the
# default outright.
#
# Requests only, no limits -- see the note in spire-server.yaml.
object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $cfg := (index (index (index $cm "data" | default dict) "config" | default "" | fromYaml | default dict) "ztwim" | default dict) hub}}
  {{hub- $agent := (index $cfg "agent" | default dict) hub}}
  {{hub- $agentRes := (index $agent "resources" | default (dict "requests" (dict "cpu" "50m" "memory" "128Mi"))) hub}}
  {{hub- $agentTol := (ternary (index $agent "tolerations") (list (dict "operator" "Exists")) (hasKey $agent "tolerations")) hub}}
  {{hub- $agentSel := (index $agent "nodeSelector" | default dict) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: operator.openshift.io/v1alpha1
      kind: SpireAgent
      metadata:
        name: cluster
      spec:
        logLevel: {{hub (index $agent "logLevel" | default (index $cfg "logLevel" | default "info")) hub}}
        nodeAttestor:
          k8sPSATEnabled: 'true'
        workloadAttestors:
          k8sEnabled: 'true'
          workloadAttestorsVerification:
            type: {{hub (index $agent "workloadAttestorVerification" | default "auto") hub}}
        resources: {{hub $agentRes | toRawJson | toLiteral hub}}
        {{hub- if $agentTol hub}}
        tolerations: {{hub $agentTol | toRawJson | toLiteral hub}}
        {{hub- end hub}}
        {{hub- if $agentSel hub}}
        nodeSelector: {{hub $agentSel | toRawJson | toLiteral hub}}
        {{hub- end hub}}
