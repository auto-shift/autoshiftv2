apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  # Both ends of a nested pair. Used only by the create-only policy, which is identical on each.
  name: placement-policy-ztwim-nested
  namespace: ${POLICY_NAMESPACE}
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/ztwim'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/ztwim-nested-role'
              operator: In
              values:
                - 'hub'
                - 'spoke'
                - 'both'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
