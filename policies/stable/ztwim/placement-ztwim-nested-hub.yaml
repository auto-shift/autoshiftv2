apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-ztwim-nested-hub
  namespace: ${POLICY_NAMESPACE}
spec:
  # The signing end of a nested pair: this cluster's SPIRE CA signs the spokes' intermediates.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/ztwim'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/ztwim-nested-role'
              operator: In
              values:
                - 'hub'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
