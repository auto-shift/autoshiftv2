# One AutoShift deployment per file in site-config/deployments/, which the CI pipelines write: this
# ApplicationSet in the infra Argo CD turns each file into an Application that renders the signed
# autoshift chart, at the version the file names, with the site's values. Each deployment uses
# versioned ClusterSets, so it owns copies such as hub-<version> that start with no clusters: its
# policies render but reach a cluster only when one is moved into its ClusterSet. Removing a file
# removes its deployment.
#
# config.autoshift-cicd.deployments.valueFiles lists the site-config files each deployment reads, in
# order. The {{ "{{" }} ... {{ "}}" }} expressions are the ApplicationSet's own Go templates, which
# ACM writes out unchanged.
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $valueFiles := (dig "autoshift-cicd" "deployments" "valueFiles" (list "global.yaml") $cfg) hub}}
  {{hub- $gitopsNs := (index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "openshift-gitops") hub}}
  {{- $ep := ((lookup "v1" "ConfigMap" "autoshift-ci" "autoshift-ci-endpoints") | default dict).data | default dict }}
  {{- $siteUrl := index $ep "siteConfigUrl" | default "" }}
  {{- if not (and $siteUrl (index $ep "siteConfigBranch")) }}
  {{-   fail "The AutoShift deployments ApplicationSet cannot be set up yet. Missing: siteConfigUrl and siteConfigBranch in autoshift-ci/autoshift-ci-endpoints" }}
  {{- end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: autoshift-deployments
        namespace: '{{hub $gitopsNs hub}}'
      spec:
        goTemplate: true
        goTemplateOptions:
          - missingkey=error
        generators:
          - git:
              repoURL: '{{ $siteUrl }}'
              revision: '{{ index $ep "siteConfigBranch" }}'
              files:
                - path: deployments/*.yaml
        template:
          metadata:
            name: '{{ "{{" }} .name {{ "}}" }}'
            labels:
              autoshift.io/deployment: '{{ "{{" }} .name {{ "}}" }}'
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: default
            destination:
              server: https://kubernetes.default.svc
              namespace: '{{hub $gitopsNs hub}}'
            sources:
              - repoURL: '{{ $siteUrl }}'
                targetRevision: '{{ "{{" }} .valuesRevision {{ "}}" }}'
                ref: siteValues
              - repoURL: '{{ "{{" }} printf "oci://%s/autoshift" .chartRepo {{ "}}" }}'
                path: .
                targetRevision: '{{ "{{" }} .chartVersion {{ "}}" }}'
                helm:
                  releaseName: '{{ "{{" }} .name {{ "}}" }}'
                  valueFiles:
                    {{hub- range $f := $valueFiles hub}}
                    - '$siteValues/{{hub $f hub}}'
                    {{hub- end hub}}
                  valuesObject:
                    autoshiftOciRepo: '{{ "{{" }} printf "oci://%s/policies" .chartRepo {{ "}}" }}'
                    autoshiftOciVersion: '{{ "{{" }} .chartVersion {{ "}}" }}'
                    versionedClusterSets: true
                    policyGenerator: false
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
