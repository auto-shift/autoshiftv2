# Argo CD credentials for the AutoShift deployments, copied from autoshift-ci into the infra Argo CD
# namespace:
#   autoshift-site-config   the site-config repository, with the token that pushes to it
#   autoshift-registry      every repository under the registry namespace, with the push credential
# The repository, registry and Secret names come from autoshift-ci-endpoints, which
# policy-autoshift-cicd-endpoints resolves. A missing Secret or key fails the policy with the list.
object-templates-raw: |
  {{hub- $gitopsNs := (index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "openshift-gitops") hub}}
  {{- $ep := ((lookup "v1" "ConfigMap" "autoshift-ci" "autoshift-ci-endpoints") | default dict).data | default dict }}
  {{- $missing := list }}
  {{- range $k := (list "siteConfigUrl" "siteConfigBranch" "siteConfigSecret" "siteConfigSecretKey" "siteConfigUser" "registryHost" "registryNamespace" "registryPushSecret") }}
  {{-   if not (index $ep $k) }}{{- $missing = append $missing (printf "%s in autoshift-ci/autoshift-ci-endpoints" $k) }}{{- end }}
  {{- end }}
  {{- $scData := ((lookup "v1" "Secret" "autoshift-ci" (index $ep "siteConfigSecret" | default "-")) | default dict).data | default dict }}
  {{- $scToken := index $scData (index $ep "siteConfigSecretKey" | default "token") | default "" }}
  {{- if and (index $ep "siteConfigSecret") (not $scToken) }}{{- $missing = append $missing (printf "Secret autoshift-ci/%s with key %s" (index $ep "siteConfigSecret") (index $ep "siteConfigSecretKey")) }}{{- end }}
  {{- $regData := ((lookup "v1" "Secret" "autoshift-ci" (index $ep "registryPushSecret" | default "-")) | default dict).data | default dict }}
  {{- $regAuth := "" }}
  {{- if index $regData ".dockerconfigjson" }}
  {{-   $regAuth = (dig "auths" (index $ep "registryHost") "auth" "" (index $regData ".dockerconfigjson" | base64dec | fromJson)) | base64dec }}
  {{- end }}
  {{- if and (index $ep "registryPushSecret") (not (contains ":" $regAuth)) }}{{- $missing = append $missing (printf "Secret autoshift-ci/%s with a .dockerconfigjson auth for %s; bootstrap-quay writes it for the hub's Quay" (index $ep "registryPushSecret") (index $ep "registryHost")) }}{{- end }}
  {{- if $missing }}
  {{-   fail (printf "The Argo CD credentials for the AutoShift deployments cannot be set up yet. Missing: %s" (join "; " $missing)) }}
  {{- end }}
  {{- $siteUrl := index $ep "siteConfigUrl" }}
  {{- $registry := printf "%s/%s" (index $ep "registryHost") (index $ep "registryNamespace") }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: autoshift-site-config
        namespace: '{{hub $gitopsNs hub}}'
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      data:
        type: '{{ "git" | b64enc }}'
        url: '{{ $siteUrl | b64enc }}'
        username: '{{ index $ep "siteConfigUser" | b64enc }}'
        password: '{{ $scToken }}'
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: autoshift-registry
        namespace: '{{hub $gitopsNs hub}}'
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      data:
        type: '{{ "oci" | b64enc }}'
        url: '{{ printf "oci://%s" $registry | b64enc }}'
        username: '{{ regexReplaceAll ":.*$" $regAuth "" | b64enc }}'
        password: '{{ regexReplaceAll "^[^:]*:" $regAuth "" | b64enc }}'
