# What the bootstrap tasks read, gathered on the cluster so the tasks never look outside
# autoshift-ci:
#   autoshift-ci-endpoints  the Pipelines as Code URL, and the Quay host and GitLab URL while their
#                           labels are on
#   autoshift-ci-ca         the ingress CA, and autoshift-ca when cert-manager has issued it, so the
#                           tasks verify TLS against routes signed by either
#   gitlab-autoshift-token  the GitLab PAT from gitlab-system/tssc-gitlab-credentials, while gitlab is on
#   registry*               the OCI registry the pipelines publish to, from
#                           config.autoshift-cicd.registry: the customer's registry with its push
#                           Secret, or by default the hub's Quay and the bootstrap-quay robot
#   siteConfig*             the site-config repository from config.autoshift-cicd.siteConfig, on
#                           GitHub or GitLab: its URL and branch, and the Secret, key and git user
#                           that push to it
#   keycloak-autoshift-ci   the autoshift-ci Keycloak client the pipelines sign with, while tas is on,
#                           with the Fulcio, Rekor and TUF URLs and the signer identity in the endpoints
# An enabled component whose endpoint is missing fails the policy with the list, rather than writing
# an empty value the tasks would only trip over later.
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $realm := (dig "keycloak" "realmName" "tssc-iam" $cfg) hub}}
  {{hub- $reg := (dig "autoshift-cicd" "registry" (dict) $cfg) hub}}
  {{hub- $quayOrg := (dig "autoshift-cicd" "quayOrg" "autoshift" $cfg) hub}}
  {{hub- $sc := (dig "autoshift-cicd" "siteConfig" (dict) $cfg) hub}}
  {{hub- $scProvider := (index $sc "provider" | default "gitlab") hub}}
  {{hub- $tasOn := eq (index .ManagedClusterLabels "autoshift.io/tas" | default "false") "true" hub}}
  {{hub- $quayOn := eq (index .ManagedClusterLabels "autoshift.io/quay" | default "false") "true" hub}}
  {{hub- $gitlabOn := eq (index .ManagedClusterLabels "autoshift.io/gitlab" | default "false") "true" hub}}
  {{- $missing := list }}
  {{- $pacHost := (dig "spec" "host" "" ((lookup "route.openshift.io/v1" "Route" "openshift-pipelines" "pipelines-as-code-controller") | default dict)) }}
  {{- if not $pacHost }}{{- $missing = append $missing "Route openshift-pipelines/pipelines-as-code-controller (the Pipelines Operator)" }}{{- end }}
  {{- $ingressCA := (index (((lookup "v1" "ConfigMap" "openshift-config-managed" "default-ingress-cert") | default dict).data | default dict) "ca-bundle.crt" | default "") }}
  {{- if not $ingressCA }}{{- $missing = append $missing "ConfigMap openshift-config-managed/default-ingress-cert" }}{{- end }}
  {{- $autoshiftCA := (index (((lookup "v1" "Secret" "cert-manager" "autoshift-ca") | default dict).data | default dict) "tls.crt" | default "" | base64dec) }}
  {{- $quayHost := "" }}
  {{hub- if $quayOn hub}}
  {{- $quayHost = (dig "spec" "host" "" ((lookup "route.openshift.io/v1" "Route" "quay-enterprise" "registry-quay") | default dict)) }}
  {{- if not $quayHost }}{{- $missing = append $missing "Route quay-enterprise/registry-quay (policy-quay-deploy)" }}{{- end }}
  {{hub- end hub}}
  {{hub- if $gitlabOn hub}}
  {{- $glData := ((lookup "v1" "Secret" "gitlab-system" "tssc-gitlab-credentials") | default dict).data | default dict }}
  {{- if not (and (index $glData "host") (index $glData "token")) }}{{- $missing = append $missing "Secret gitlab-system/tssc-gitlab-credentials with host and token (the gitlab create-gitlab-token Job; needs dev-hub: 'true')" }}{{- end }}
  {{hub- end hub}}
  {{- /* registry: a host in config is the customer's registry and needs its push Secret; no host
       means the hub's Quay, pushed by the robot bootstrap-quay creates, which runs after this */}}
  {{- $regHost := "{{hub index $reg "host" | default "" hub}}" }}
  {{- $regNs := "{{hub index $reg "namespace" | default $quayOrg hub}}" }}
  {{- $regSecret := "{{hub index $reg "pushSecret" | default "" hub}}" }}
  {{- $regSecretSet := ne $regSecret "" }}
  {{- if not $regHost }}
  {{-   if and (not $quayHost) (not {{hub $quayOn hub}}) }}{{- $missing = append $missing "config.autoshift-cicd.registry.host, or the quay label for the hub's Quay" }}{{- end }}
  {{-   $regHost = $quayHost }}
  {{-   if not $regSecret }}{{- $regSecret = printf "quay-%s-ci" $regNs }}{{- end }}
  {{- else if not $regSecret }}
  {{-   $missing = append $missing (printf "config.autoshift-cicd.registry.pushSecret, a Secret in autoshift-ci that can push to %s" $regHost) }}
  {{- end }}
  {{- if $regSecretSet }}
  {{-   if not (index (((lookup "v1" "Secret" "autoshift-ci" $regSecret) | default dict).data | default dict) ".dockerconfigjson") }}
  {{-     $missing = append $missing (printf "Secret autoshift-ci/%s of type kubernetes.io/dockerconfigjson, with push access to %s/%s" $regSecret $regHost $regNs) }}
  {{-   end }}
  {{- end }}
  {{- /* site-config: repo is a URL, used as written, or a project path on the hub's GitLab, which
       bootstrap-gitlab creates and the GitLab token this policy copies pushes to */}}
  {{- $scRepo := "{{hub index $sc "repo" | default "" hub}}" }}
  {{- $scSecret := "{{hub index $sc "secret" | default "" hub}}" }}
  {{- $scKey := "{{hub index $sc "secretKey" | default "token" hub}}" }}
  {{- $scUser := "x-access-token" }}
  {{- if not $scRepo }}
  {{-   $missing = append $missing "config.autoshift-cicd.siteConfig.repo, a repository URL or a project path on the hub's GitLab" }}
  {{- else if not (regexMatch "^https?://" $scRepo) }}
  {{-   $scHost := (index (((lookup "v1" "Secret" "gitlab-system" "tssc-gitlab-credentials") | default dict).data | default dict) "host" | default "" | base64dec) }}
  {{-   if not $scHost }}{{- $missing = append $missing (printf "Secret gitlab-system/tssc-gitlab-credentials with host, the hub's GitLab that holds %s" $scRepo) }}{{- end }}
  {{-   $scRepo = printf "https://%s/%s.git" $scHost $scRepo }}
  {{- end }}
  {{hub- if eq $scProvider "gitlab" hub}}
  {{- $scUser = "oauth2" }}
  {{- if not $scSecret }}{{- $scSecret = "gitlab-autoshift-token" }}{{- end }}
  {{hub- else if eq $scProvider "github" hub}}
  {{- if not $scSecret }}{{- $missing = append $missing "config.autoshift-cicd.siteConfig.secret, a Secret in autoshift-ci with a token that can push to it" }}{{- end }}
  {{hub- else hub}}
  {{- $missing = append $missing "config.autoshift-cicd.siteConfig.provider must be gitlab or github, not {{hub $scProvider hub}}" }}
  {{hub- end hub}}
  {{- if and $scSecret (ne $scSecret "gitlab-autoshift-token") }}
  {{-   if not (index (((lookup "v1" "Secret" "autoshift-ci" $scSecret) | default dict).data | default dict) $scKey) }}
  {{-     $missing = append $missing (printf "Secret autoshift-ci/%s with key %s, a token that can push to %s" $scSecret $scKey $scRepo) }}
  {{-   end }}
  {{- end }}
  {{hub- if $tasOn hub}}
  {{- $fulcioUrl := (dig "status" "url" "" ((lookup "rhtas.redhat.com/v1" "Fulcio" "tssc-tas" "trusted-artifact-signer") | default dict)) }}
  {{- $rekorUrl := (dig "status" "url" "" ((lookup "rhtas.redhat.com/v1" "Rekor" "tssc-tas" "trusted-artifact-signer") | default dict)) }}
  {{- $tufUrl := (dig "status" "url" "" ((lookup "rhtas.redhat.com/v1" "Tuf" "tssc-tas" "trusted-artifact-signer") | default dict)) }}
  {{- if not (and $fulcioUrl $rekorUrl $tufUrl) }}{{- $missing = append $missing "the Fulcio, Rekor and Tuf URLs in tssc-tas (policy-tas-securesign)" }}{{- end }}
  {{- $kcHost := (dig "spec" "hostname" "hostname" "" ((lookup "k8s.keycloak.org/v2beta1" "Keycloak" "keycloak-system" "keycloak") | default dict)) }}
  {{- if not $kcHost }}{{- $missing = append $missing "Keycloak keycloak-system/keycloak with spec.hostname.hostname (policy-keycloak)" }}{{- end }}
  {{- $ciClient := (index (((lookup "v1" "Secret" "keycloak-system" "autoshift-ci-realm-clients") | default dict).data | default dict) "autoshiftCi" | default "") }}
  {{- if not $ciClient }}{{- $missing = append $missing "Secret keycloak-system/autoshift-ci-realm-clients (policy-keycloak-realm-secrets)" }}{{- end }}
  {{- $appsDomain := (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain }}
  {{hub- end hub}}
  {{- if $missing }}
  {{-   fail (printf "The AutoShift CI endpoints are not available yet. Missing: %s" (join "; " $missing)) }}
  {{- end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: autoshift-ci-endpoints
        namespace: autoshift-ci
      data:
        pacUrl: 'https://{{ $pacHost }}'
        registryHost: '{{ $regHost }}'
        registryNamespace: '{{ $regNs }}'
        registryPushSecret: '{{ $regSecret }}'
        siteConfigUrl: '{{ $scRepo }}'
        siteConfigBranch: '{{hub index $sc "branch" | default "main" hub}}'
        siteConfigSecret: '{{ $scSecret }}'
        siteConfigSecretKey: '{{ $scKey }}'
        siteConfigUser: '{{ $scUser }}'
        {{hub- if $quayOn hub}}
        quayHost: '{{ $quayHost }}'
        {{hub- end hub}}
        {{hub- if $gitlabOn hub}}
        gitlabUrl: 'https://{{ index $glData "host" | base64dec }}'
        {{hub- end hub}}
        {{hub- if $tasOn hub}}
        fulcioUrl: '{{ $fulcioUrl }}'
        rekorUrl: '{{ $rekorUrl }}'
        tufUrl: '{{ $tufUrl }}'
        oidcIssuer: 'https://{{ $kcHost }}/realms/{{hub $realm hub}}'
        signerIdentity: 'autoshift-ci@{{ $appsDomain }}'
        {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: autoshift-ci-ca
        namespace: autoshift-ci
      data:
        ingress-ca.crt: |
          {{ $ingressCA | autoindent }}
        {{- if $autoshiftCA }}
        autoshift-ca.crt: |
          {{ $autoshiftCA | autoindent }}
        {{- end }}
  {{hub- if $gitlabOn hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-autoshift-token
        namespace: autoshift-ci
      type: Opaque
      data:
        host: '{{ index $glData "host" }}'
        token: '{{ index $glData "token" }}'
  {{hub- end hub}}
  {{hub- if $tasOn hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-autoshift-ci
        namespace: autoshift-ci
      type: Opaque
      data:
        clientId: '{{ "autoshift-ci" | b64enc }}'
        clientSecret: '{{ $ciClient }}'
        tokenUrl: '{{ printf "https://%s/realms/{{hub $realm hub}}/protocol/openid-connect/token" $kcHost | b64enc }}'
  {{hub- end hub}}
