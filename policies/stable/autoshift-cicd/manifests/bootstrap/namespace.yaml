# The namespace the AutoShift CI/CD and bootstrap pipelines run in. The Pipelines Operator gives its
# pipeline ServiceAccount edit here, which is all the bootstrap tasks need: they write Secrets in this
# namespace only.
apiVersion: v1
kind: Namespace
metadata:
  name: autoshift-ci
---
# The cluster trust bundle, injected by the network Operator. The tasks also trust the ingress and
# autoshift-ca certificates that policy-autoshift-cicd-endpoints copies into autoshift-ci-ca.
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoshift-ci-trusted-ca
  namespace: autoshift-ci
  labels:
    config.openshift.io/inject-trusted-cabundle: 'true'
