# The bootstrap Pipelines. AutoShift only delivers them; start one from the console or with
# tkn pipeline start -n autoshift-ci, overriding any parameter. Defaults come from
# config.autoshift-cicd, and the images are resolved on the cluster:
#   cliImage  config.images.cli, else the openshift/cli ImageStream, a digest against the release
#             payload that follows the cluster's image mirrors (the same rule as AutoShift's Jobs)
#   gitImage  the image of the git-clone Task the Pipelines Operator installed, so it is the
#             mirrored git-init image that matches the installed Pipelines version
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $cicd := (index $cfg "autoshift-cicd" | default dict) hub}}
  {{hub- $upstreamRepo := (index $cicd "upstreamRepo" | default "https://github.com/auto-shift/autoshiftv2.git") hub}}
  {{hub- $upstreamRef := (index $cicd "upstreamRef" | default "main") hub}}
  {{hub- $group := (index $cicd "gitlabGroup" | default "autoshift") hub}}
  {{hub- $org := (index $cicd "quayOrg" | default "autoshift") hub}}
  {{hub- $realm := (dig "keycloak" "realmName" "tssc-iam" $cfg) hub}}
  {{hub- $srcCfg := (dig "autoshift-cicd" "source" (dict) $cfg) hub}}
  {{hub- $scCfg := (dig "autoshift-cicd" "siteConfig" (dict) $cfg) hub}}
  # The GitLab projects bootstrap-gitlab creates: autoshift while the source is the hub's GitLab, and
  # site-config while site-config is. A repository named in config lives elsewhere.
  {{hub- $glSource := and (eq (index $srcCfg "provider" | default "gitlab") "gitlab") (not (index $srcCfg "repo" | default "")) hub}}
  {{hub- $glSite := and (eq (index $scCfg "provider" | default "gitlab") "gitlab") (not (index $scCfg "repo" | default "")) hub}}
  {{- $cliImage := "{{hub (index (index $cfg "images" | default dict) "cli" | default "") hub}}" }}
  {{- if not $cliImage }}
  {{-   $isCli := (lookup "image.openshift.io/v1" "ImageStream" "openshift" "cli") | default dict }}
  {{-   range $t := (dig "spec" "tags" (list) $isCli) }}
  {{-     if eq (index $t "name" | default "") "latest" }}{{- $cliImage = (dig "from" "name" "" $t) }}{{- end }}
  {{-   end }}
  {{- end }}
  {{- $gitImage := "" }}
  {{- range $s := (dig "spec" "steps" (list) ((lookup "tekton.dev/v1" "Task" "openshift-pipelines" "git-clone") | default dict)) }}
  {{-   if not $gitImage }}{{- $gitImage = (index $s "image" | default "") }}{{- end }}
  {{- end }}
  {{- $missing := list }}
  {{- if not $cliImage }}{{- $missing = append $missing "ImageStream openshift/cli tag latest (or set config.images.cli)" }}{{- end }}
  {{- if not $gitImage }}{{- $missing = append $missing "Task openshift-pipelines/git-clone (installed by the Pipelines Operator)" }}{{- end }}
  {{- if $missing }}
  {{-   fail (printf "The bootstrap Pipelines cannot resolve their images. Missing: %s" (join "; " $missing)) }}
  {{- end }}
  {{- $gitlabHost := (index (((lookup "v1" "Secret" "gitlab-system" "tssc-gitlab-credentials") | default dict).data | default dict) "host" | default "" | base64dec) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: tekton.dev/v1
      kind: Pipeline
      metadata:
        name: bootstrap-quay
        namespace: autoshift-ci
      spec:
        description: >-
          Create the Quay organization AutoShift publishes to, a CI robot that can create and push
          repositories in it, and the robot's push Secret in autoshift-ci.
        params:
          - name: org
            type: string
            default: '{{hub $org hub}}'
          - name: robot
            type: string
            default: ci
          - name: quayHost
            type: string
            default: ''
            description: Empty uses the registry-quay Route.
          - name: adminTokenSecret
            type: string
            default: quay-admin-token
            description: Secret in autoshift-ci with a Quay superuser OAuth token under key token.
          - name: initialize
            type: string
            default: 'false'
            description: true creates the first Quay user instead; needs config.quay.bootstrap.userInitialize.
          - name: adminUser
            type: string
            default: quayadmin
          - name: adminEmail
            type: string
            default: quayadmin@example.com
          - name: orgEmail
            type: string
            default: ''
          - name: tlsVerify
            type: string
            default: 'true'
        tasks:
          - name: quay-bootstrap
            taskRef:
              name: quay-bootstrap
            params:
              - name: cliImage
                value: '{{ $cliImage }}'
              - name: org
                value: $(params.org)
              - name: robot
                value: $(params.robot)
              - name: quayHost
                value: $(params.quayHost)
              - name: adminTokenSecret
                value: $(params.adminTokenSecret)
              - name: initialize
                value: $(params.initialize)
              - name: adminUser
                value: $(params.adminUser)
              - name: adminEmail
                value: $(params.adminEmail)
              - name: orgEmail
                value: $(params.orgEmail)
              - name: tlsVerify
                value: $(params.tlsVerify)
  - complianceType: musthave
    objectDefinition:
      apiVersion: tekton.dev/v1
      kind: Pipeline
      metadata:
        name: bootstrap-gitlab
        namespace: autoshift-ci
      spec:
        description: >-
          Create the GitLab group and the projects that config.autoshift-cicd places on this GitLab:
          autoshift, with the Pipelines as Code webhook and the upstream branches pushed into it, and
          site-config. Seed site-config afterwards with bootstrap-site-config.
        params:
          - name: group
            type: string
            default: '{{hub $group hub}}'
          - name: projects
            type: array
            {{hub- if or $glSource $glSite hub}}
            default:
              {{hub- if $glSource hub}}
              - autoshift
              {{hub- end hub}}
              {{hub- if $glSite hub}}
              - site-config
              {{hub- end hub}}
            {{hub- else hub}}
            default: []
            {{hub- end hub}}
          - name: webhookProject
            type: string
            default: '{{hub ternary "autoshift" "" $glSource hub}}'
            description: Project that gets the Pipelines as Code webhook. Empty skips it.
          - name: syncUpstream
            type: string
            default: '{{hub ternary "true" "false" $glSource hub}}'
            description: true pushes the upstream branches into the autoshift project.
          - name: upstreamUrl
            type: string
            default: '{{hub $upstreamRepo hub}}'
          - name: upstreamRefs
            type: string
            default: '{{hub $upstreamRef hub}}'
            description: Space-separated branches to push into the autoshift project, or *.
          - name: gitlabUrl
            type: string
            default: ''
            description: Empty uses the host in gitlab-system/tssc-gitlab-credentials.
          - name: tlsVerify
            type: string
            default: 'true'
        tasks:
          - name: gitlab-bootstrap
            taskRef:
              name: gitlab-bootstrap
            params:
              - name: cliImage
                value: '{{ $cliImage }}'
              - name: gitlabUrl
                value: $(params.gitlabUrl)
              - name: group
                value: $(params.group)
              - name: projects
                value: $(params.projects[*])
              - name: webhookProject
                value: $(params.webhookProject)
              - name: tlsVerify
                value: $(params.tlsVerify)
          - name: sync-autoshift
            runAfter:
              - gitlab-bootstrap
            when:
              - input: $(params.syncUpstream)
                operator: in
                values:
                  - 'true'
            taskRef:
              name: git-sync
            params:
              - name: gitImage
                value: '{{ $gitImage }}'
              - name: sourceUrl
                value: $(params.upstreamUrl)
              - name: refs
                value: $(params.upstreamRefs)
              - name: targetUrl
                value: $(tasks.gitlab-bootstrap.results.gitlabUrl)/$(params.group)/autoshift.git
              - name: tlsVerify
                value: $(params.tlsVerify)
  - complianceType: musthave
    objectDefinition:
      apiVersion: tekton.dev/v1
      kind: Pipeline
      metadata:
        name: sync-upstream
        namespace: autoshift-ci
      spec:
        description: >-
          Push branches and tags from the upstream AutoShift repository into the GitLab autoshift
          project. Does not force unless asked, so a branch changed in GitLab is reported, not lost.
        params:
          - name: upstreamUrl
            type: string
            default: '{{hub $upstreamRepo hub}}'
          - name: refs
            type: string
            default: '{{hub $upstreamRef hub}}'
          - name: tags
            type: string
            default: 'true'
          - name: force
            type: string
            default: 'false'
          - name: targetUrl
            type: string
            default: '{{ ternary (printf "https://%s/{{hub $group hub}}/autoshift.git" $gitlabHost) "" (ne $gitlabHost "") }}'
          - name: tlsVerify
            type: string
            default: 'true'
        tasks:
          - name: sync
            taskRef:
              name: git-sync
            params:
              - name: gitImage
                value: '{{ $gitImage }}'
              - name: sourceUrl
                value: $(params.upstreamUrl)
              - name: refs
                value: $(params.refs)
              - name: tags
                value: $(params.tags)
              - name: force
                value: $(params.force)
              - name: targetUrl
                value: $(params.targetUrl)
              - name: tlsVerify
                value: $(params.tlsVerify)
  - complianceType: musthave
    objectDefinition:
      apiVersion: tekton.dev/v1
      kind: Pipeline
      metadata:
        name: bootstrap-keycloak
        namespace: autoshift-ci
      spec:
        description: >-
          Copy clients from the realm import into a Keycloak realm that already exists, such as the
          autoshift-ci signing client, and check that its token carries the claims Fulcio requires.
          A realm created after the client was added already has it.
        params:
          - name: realm
            type: string
            default: '{{hub $realm hub}}'
          - name: clients
            type: string
            default: autoshift-ci
            description: Space-separated client IDs to copy from the realm import.
          - name: keycloakUrl
            type: string
            default: ''
            description: Empty derives it from oidcIssuer in autoshift-ci-endpoints.
          - name: tlsVerify
            type: string
            default: 'true'
        tasks:
          - name: keycloak-client-sync
            taskRef:
              name: keycloak-client-sync
            params:
              - name: cliImage
                value: '{{ $cliImage }}'
              - name: realm
                value: $(params.realm)
              - name: clients
                value: $(params.clients)
              - name: keycloakUrl
                value: $(params.keycloakUrl)
              - name: tlsVerify
                value: $(params.tlsVerify)
  - complianceType: musthave
    objectDefinition:
      apiVersion: tekton.dev/v1
      kind: Pipeline
      metadata:
        name: bootstrap-site-config
        namespace: autoshift-ci
      spec:
        description: >-
          Seed the site-config repository, on GitHub or GitLab, from the AutoShift values once. The
          repository, branch and credential come from config.autoshift-cicd.siteConfig through
          autoshift-ci-endpoints. A repository that already has a branch is left alone.
        params:
          - name: upstreamUrl
            type: string
            default: '{{hub $upstreamRepo hub}}'
          - name: sourceRef
            type: string
            default: '{{hub $upstreamRef hub}}'
            description: Upstream ref whose autoshift/values seeds site-config.
          - name: tlsVerify
            type: string
            default: 'true'
        tasks:
          - name: site-config-endpoint
            taskRef:
              name: site-config-endpoint
            params:
              - name: cliImage
                value: '{{ $cliImage }}'
          - name: seed-site-config
            taskRef:
              name: seed-site-config
            params:
              - name: gitImage
                value: '{{ $gitImage }}'
              - name: sourceUrl
                value: $(params.upstreamUrl)
              - name: sourceRef
                value: $(params.sourceRef)
              - name: targetUrl
                value: $(tasks.site-config-endpoint.results.url)
              - name: branch
                value: $(tasks.site-config-endpoint.results.branch)
              - name: tokenSecret
                value: $(tasks.site-config-endpoint.results.secret)
              - name: tokenKey
                value: $(tasks.site-config-endpoint.results.secretKey)
              - name: tokenUser
                value: $(tasks.site-config-endpoint.results.user)
              - name: tlsVerify
                value: $(params.tlsVerify)
