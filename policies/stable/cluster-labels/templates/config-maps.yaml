{{- $labelPrefix := ($.Values.autoshiftLabelPrefix | default "autoshift.io/") }}
{{- if (.Values.enabled | default false) }}
  {{- range $cluster, $data := $.Values.clusters }}
---
    {{- $prefixedClusterLabels := dict -}}
    {{- range $label, $value := $data.labels -}}
      {{- if eq ($value | trim) "" -}}
        {{- $_ := set $prefixedClusterLabels (printf "%s%s" $labelPrefix $label) "_" -}}
      {{- else -}}
        {{- $_ := set $prefixedClusterLabels (printf "%s%s" $labelPrefix $label) ($value | trim) -}}
      {{- end -}}
    {{- end -}}
    {{- $_ := set $data "labels" $prefixedClusterLabels -}}
apiVersion: v1
kind: ConfigMap
metadata: 
  name: "{{ printf "managed-cluster.%s" $cluster }}"
  namespace: "{{ $.Values.policy_namespace }}" 
  labels:
    autoshift.io/cluster-labels: ""
data: 
  values: '{{ $data | toJson }}'
  labels: '{{ $prefixedClusterLabels | toJson }}'
  {{- end }}

  {{- range $clusterSet, $data := merge (dict) (deepCopy ($.Values.hubClusterSets | default dict)) (deepCopy ($.Values.managedClusterSets | default dict)) }}
---
    {{- $prefixedClusterSetLabels := dict -}}
    {{- range $label, $value := $data.labels -}}
      {{- if eq ($value | trim) "" -}}
        {{- $_ := set $prefixedClusterSetLabels (printf "%s%s" $labelPrefix $label) "_" -}}
      {{- else -}}
        {{- $_ := set $prefixedClusterSetLabels (printf "%s%s" $labelPrefix $label) ($value | trim) -}}
      {{- end -}}
    {{- end -}}
    {{- /* Stamped on every clusterset so the label, not a per-policy fallback, is the source of
           truth for the gitops namespace. Helm policies default it to the rendered
           .Values.gitopsNamespace; PolicyGenerator policies cannot read values and can only
           hardcode a literal, so only a stamped label keeps the two in agreement when
           gitopsNamespace is not openshift-gitops. A per-cluster label still overrides this, and an
           explicit empty value still deletes, because both set the key. */ -}}
    {{- $gitopsNsKey := printf "%sgitops-namespace" $labelPrefix -}}
    {{- if not (hasKey $prefixedClusterSetLabels $gitopsNsKey) -}}
      {{- $_ := set $prefixedClusterSetLabels $gitopsNsKey ($.Values.gitopsNamespace | default "openshift-gitops") -}}
    {{- end -}}
    {{- $_ := set $data "labels" $prefixedClusterSetLabels -}}
apiVersion: v1
kind: ConfigMap
metadata: 
  name: {{ printf "cluster-set.%s" $clusterSet }}
  namespace: "{{ $.Values.policy_namespace }}" 
  labels:
    autoshift.io/cluster-labels: ""
data:
  values: '{{ $data | toJson }}'
  labels: '{{ $prefixedClusterSetLabels | toJson }}'
  {{- end }}
{{- end }}
