# fromConfigMap fails the policy when rendered-config is missing, rather than rendering
# nothing and reporting Compliant.
object-templates-raw: |
  {{hub $configYaml := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "" | fromYaml | default dict) hub}}
  {{hub $disconnected := (index $configYaml "disconnected" | default dict) hub}}
  {{hub if eq (index $disconnected "disableDefaultCatalogs" | default false) true hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: OperatorHub
      metadata:
        name: cluster
      spec:
        disableAllDefaultSources: true
  {{hub end hub}}
