# fromConfigMap fails the policy when rendered-config or a caRef ConfigMap is missing, and a caRef
# key that is absent fails explicitly, rather than rendering nothing and reporting Compliant.
object-templates-raw: |
  {{hub $configYaml := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "" | fromYaml | default dict) hub}}
  {{hub $disconnected := (index $configYaml "disconnected" | default dict) hub}}
  {{hub $mirror := (index $disconnected "mirrorRegistry" | default dict) hub}}
  {{hub $mirrorHost := (index $mirror "host") hub}}
  {{hub $ca := (index $mirror "ca" | default "") hub}}
  {{hub $caRef := (index $mirror "caRef" | default dict) hub}}
  {{hub if not (empty $caRef) hub}}
  {{hub $refNs := (index $caRef "namespace" | default .PolicyMetadata.namespace) hub}}
  {{hub $ca = (fromConfigMap $refNs (index $caRef "name") (index $caRef "key")) hub}}
  {{hub if not $ca hub}}
  {{hub fail (printf "config.disconnected.mirrorRegistry.caRef: ConfigMap %s/%s has no key %s" $refNs (index $caRef "name") (index $caRef "key")) hub}}
  {{hub end hub}}
  {{hub end hub}}
  {{hub if and (gt (len $mirrorHost) 0) (gt (len $ca) 0) hub}}
  {{hub $registryKey := (replace ":" ".." $mirrorHost) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: autoshift-registry-ca
        namespace: openshift-config
      data:
        {{hub $registryKey hub}}: |
          {{hub $ca | autoindent hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: Image
      metadata:
        name: cluster
      spec:
        additionalTrustedCA:
          name: autoshift-registry-ca
  {{hub end hub}}
