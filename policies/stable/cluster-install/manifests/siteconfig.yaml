object-templates-raw: |
  {{- $configMaps := (lookup "v1" "ConfigMap" "" "" "autoshift.io/rendered-config-map") | default dict }}
  {{- range $_, $cm := ($configMaps.items | default list) }}
    {{- $clusterName := (replace ".rendered-config" "" $cm.metadata.name) }}
    {{- $mc := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" $clusterName) | default dict }}
    {{- $mcOwningNs := dig "metadata" "labels" "autoshift.io/owning-namespace" "" $mc }}
    {{- $config := ($cm.data.config | fromYaml) }}
    {{- $ci := (index $config "clusterInstall" | default dict) }}
    {{- $platform := (index $ci "platform" | default "baremetal") }}
    {{- if and (eq (index $ci "createCluster" | default "") "true") (eq $platform "baremetal") (or (empty $mc) (eq $mcOwningNs $cm.metadata.namespace)) }}
      {{- $networking := (index $config "networking") }}
      {{- $hosts := (index $config "hosts") }}
      {{- $openshiftVersion := (index $ci "openshiftVersion") }}
      {{- $cpuArch := (index $ci "cpuArch" | default "x86_64") }}
      {{- $imageSet := (index $ci "clusterImageSet" | default (printf "openshift-image-set-%s" $openshiftVersion)) }}
      {{- $controlPlaneCount := (index $ci "controlPlaneAgents" | default 3 | toInt) }}
      {{- $workerAgents := (index $ci "workerAgents" | default 0 | toInt) }}
      {{- $workerCount := $workerAgents }}
      {{- if (eq $workerCount 0) }}
        {{- $workerCount = (sub (len (keys $hosts)) $controlPlaneCount) }}
      {{- end }}
      {{- $baseDomain := (index $ci "baseDomain" | default "") }}
      {{- if not $baseDomain }}
      {{- $hubDNS := (lookup "config.openshift.io/v1" "DNS" "" "cluster") | default dict }}
      {{- $baseDomain = (splitList "." (dig "spec" "baseDomain" "" $hubDNS) | rest | join ".") }}
      {{- end }}{{- $fips := (eq (printf "%v" (index $ci "fips" | default false)) "true") }}
      {{- /* Node hostname: hosts.<key>.hostname when set, otherwise <key> with hostnameFormat
             short, or <key>.<cluster>.<baseDomain> with fqdn, the default. The nmstate policy
             applies the same rule to its per-host nodeSelector. */ -}}
      {{- $hostnameFormat := (index $ci "hostnameFormat" | default "fqdn") }}
      {{- /* config.versionTag pins the clusterset to a specific release; otherwise this
             deployment's own suffix is used. cluster-set-assignment applies the identical rule. */ -}}
      {{- $versionTag := (printf "%v" (index $config "versionTag" | default "")) }}
      {{- $csSuffix := "${CLUSTER_SET_SUFFIX}" }}
      {{- if ne $versionTag "" }}{{- $csSuffix = printf "-%s" ($versionTag | replace "." "-" | replace "/" "-" | lower) }}{{- end }}
      {{- $managedClusterSet := (printf "%s%s" (index $config "clusterSet" | default "default") $csSuffix) }}
      {{- $sshPublicKey := (index $ci "sshPublicKey" | default "") }}
      {{- $sshPublicKeyRef := (index $ci "sshPublicKeyRef" | default dict) }}
      {{- if not (empty $sshPublicKeyRef) }}
        {{- $refNs := (index $sshPublicKeyRef "namespace" | default $cm.metadata.namespace) }}
        {{- $refCM := (lookup "v1" "ConfigMap" $refNs (index $sshPublicKeyRef "name")) | default dict }}
        {{- $refData := (index $refCM "data" | default dict) }}
        {{- $sshPublicKey = (index $refData (index $sshPublicKeyRef "key") | default $sshPublicKey) }}
      {{- end }}
      {{- $disconnected := (index $config "disconnected" | default dict) }}
      {{- $mirrorReg := (index $disconnected "mirrorRegistry" | default dict) }}
      {{- $mirrorHost := (index $mirrorReg "host" | default "") }}
      {{- $mirrorPath := (index $mirrorReg "path" | default "") }}
      {{- $mirrorUrl := $mirrorHost }}
      {{- if $mirrorPath }}
      {{- $mirrorUrl = (printf "%s/%s" $mirrorHost $mirrorPath) }}
      {{- end }}
      {{- $mirrors := (index $mirrorReg "mirrors" | default list) }}
      {{- $caTrustBundle := (index $mirrorReg "ca" | default "") }}
      {{- $caRef := (index $mirrorReg "caRef" | default dict) }}
      {{- if not (empty $caRef) }}
        {{- $refNs := (index $caRef "namespace" | default $cm.metadata.namespace) }}
        {{- $caTrustBundle = (fromConfigMap $refNs (index $caRef "name") (index $caRef "key")) }}
        {{- if not $caTrustBundle }}
        {{- fail (printf "config.disconnected.mirrorRegistry.caRef: ConfigMap %s/%s has no key %s" $refNs (index $caRef "name") (index $caRef "key")) }}
        {{- end }}
      {{- end }}
      {{- /* InfraEnv image type: explicit value wins; otherwise full-iso when mirrors are set, else the InfraEnv default. */ -}}
      {{- $imageType := (index $ci "imageType" | default "") }}
      {{- if and (not $imageType) (gt (len $mirrors) 0) }}
      {{- $imageType = "full-iso" }}
      {{- end }}
      {{- if and $imageType (ne $imageType "full-iso") (ne $imageType "minimal-iso") }}
      {{- fail (printf "config.clusterInstall.imageType for %s must be full-iso or minimal-iso, got %s" $clusterName $imageType) }}
      {{- end }}
      {{- $bmcEndpoint := (index $ci "bmcEndpoint" | default "/redfish/v1/Systems/1") }}
      {{- $clusterNetwork := (index $networking "clusterNetwork") }}
      {{- $machineNetwork := (index $networking "machineNetwork") }}
      {{- $serviceNetwork := (index $networking "serviceNetwork") }}
      {{- if (gt (len $mirrors) 0) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mirror-registry-config
        namespace: {{ $clusterName }}
        labels:
          app: {{ $clusterName }}
      data:
        registries.conf: |
          unqualified-search-registries = ["registry.access.redhat.com", "docker.io"]
          {{- range $_, $entry := $mirrors }}
          {{- $source := (index $entry "source") }}
          {{- $mirrorLoc := (index $entry "mirror" | default "") }}
          {{- if $mirrorLoc }}
          {{- $mirrorLoc = (printf "%s/%s" $mirrorHost $mirrorLoc) }}
          {{- else }}
          {{- $mirrorLoc = $mirrorUrl }}
          {{- end }}
          [[registry]]
            prefix = ""
            location = "{{ $source }}"
            mirror-by-digest-only = true
            [[registry.mirror]]
              location = "{{ $mirrorLoc }}"
          {{- end }}
        {{- if $caTrustBundle }}
        ca-bundle.crt: |
          {{ $caTrustBundle | autoindent }}
        {{- end }}

  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: autoshift-idms-config
        namespace: {{ $clusterName }}
      data:
        autoshift-idms.yaml: |
          apiVersion: config.openshift.io/v1
          kind: ImageDigestMirrorSet
          metadata:
            name: autoshift-disconnected-mirrors
          spec:
            imageDigestMirrors:
          {{- range $_, $entry := $mirrors }}
          {{- $source := (index $entry "source") }}
          {{- $mirrorLoc := (index $entry "mirror" | default "") }}
          {{- if $mirrorLoc }}
          {{- $mirrorLoc = (printf "%s/%s" $mirrorHost $mirrorLoc) }}
          {{- else }}
          {{- $mirrorLoc = $mirrorUrl }}
          {{- end }}
            - source: {{ $source }}
              mirrors:
                - {{ $mirrorLoc }}
          {{- end }}
      {{- end }}

      {{- $parts := (index $ci "diskPartitions" | default dict) }}
      {{- $partList := (index $parts "partitions" | default list) }}
      {{- if $partList }}
  {{- /* Day 1 disk partitioning. Satisfies the partition-for-var-log* rules in the NIST and STIG
         profiles, which cannot be remediated later: partitioning Red Hat CoreOS is an install time
         operation. Emitted as an extra manifest so it lands before the node first boots.
         The device must be the install disk, and startMiB has to sit past the root filesystem. */}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: autoshift-partitions-config
        namespace: {{ $clusterName }}
      data:
      {{- range $_, $role := (index $parts "roles" | default (list "master" "worker")) }}
        autoshift-partitions-{{ $role }}.yaml: |
          apiVersion: machineconfiguration.openshift.io/v1
          kind: MachineConfig
          metadata:
            name: 98-{{ $role }}-autoshift-partitions
            labels:
              machineconfiguration.openshift.io/role: {{ $role }}
          spec:
            config:
              ignition:
                version: 3.2.0
              storage:
                disks:
                  - device: {{ index $parts "device" }}
                    partitions:
                  {{- range $_, $p := $partList }}
                      - label: {{ index $p "label" }}
                        startMiB: {{ index $p "startMiB" | default 0 }}
                        sizeMiB: {{ index $p "sizeMiB" | default 0 }}
                  {{- end }}
                filesystems:
                {{- range $_, $p := $partList }}
                  - device: /dev/disk/by-partlabel/{{ index $p "label" }}
                    path: {{ index $p "mountPath" }}
                    format: {{ index $p "format" | default "xfs" }}
                    wipeFilesystem: true
                    mountOptions:
                      - defaults
                      - prjquota
                {{- end }}
              systemd:
                units:
                {{- range $_, $p := $partList }}
                {{- /* systemd unit names use - as the path separator, so a hyphen inside a path
                       component must be escaped as \x2d first: /var/log/kube-apiserver becomes
                       var-log-kube\x2dapiserver.mount. A plain slash replace produces a name
                       systemd never matches to the path, and the mount silently never happens. The
                       rest of the unit is what butane emits for with_mount_unit: fsck ordering,
                       and RequiredBy rather than WantedBy so a mount that fails stops the boot
                       instead of leaving the path quietly on the root filesystem. */}}
                {{- $unit := (printf "%s.mount" (trimPrefix "-" (replace "/" "-" (replace "-" "\\x2d" (index $p "mountPath"))))) }}
                {{- $fsck := (printf "systemd-fsck@%s.service" (trimPrefix "-" (replace "/" "-" (replace "-" "\\x2d" (printf "/dev/disk/by-partlabel/%s" (index $p "label")))))) }}
                  - name: {{ $unit }}
                    enabled: true
                    contents: |
                      [Unit]
                      Before=local-fs.target
                      Requires={{ $fsck }}
                      After={{ $fsck }}
                      [Mount]
                      Where={{ index $p "mountPath" }}
                      What=/dev/disk/by-partlabel/{{ index $p "label" }}
                      Type={{ index $p "format" | default "xfs" }}
                      Options=defaults,prjquota
                      [Install]
                      RequiredBy=local-fs.target
                {{- end }}
      {{- end }}
      {{- end }}

      {{- $extraManifests := (index $ci "extraManifests" | default dict) }}
  {{- /* networking.brEx: a custom br-ex on an OVS bond, the layout the OpenShift documentation gives
         for balance-slb. On first boot a node applies /etc/nmstate/openshift/<short hostname>.yml,
         so each host's nmstate is written into one MachineConfig per role. */}}
      {{- $brEx := (index $networking "brEx" | default dict) }}
      {{- $brExMtu := (index $brEx "mtu" | default "") }}
      {{- $brExIpv4 := (index $brEx "ipv4" | default "") }}
      {{- $brExFiles := dict }}
      {{- if $brEx }}
      {{- $brOther := dict }}
      {{- range $k, $v := (index $brEx "bondOtherConfig" | default dict) }}
      {{- $_ := set $brOther $k (printf "%v" $v) }}
      {{- end }}
      {{- $brDns := (index $networking "dns" | default dict) }}
      {{- range $hostname, $host := $hosts }}
      {{- $hostBrEx := (dig "networking" "brEx" dict $host) }}
      {{- $brPorts := (index $hostBrEx "ports" | default (index $brEx "ports")) }}
      {{- $bondPorts := list }}
      {{- $portIfaces := list }}
      {{- range $_, $port := $brPorts }}
      {{- $bondPorts = append $bondPorts (dict "name" $port) }}
      {{- $portIface := (dict "name" $port "type" "ethernet" "state" "up" "ipv4" (dict "enabled" false) "ipv6" (dict "enabled" false)) }}
      {{- if $brExMtu }}
      {{- $_ := set $portIface "mtu" $brExMtu }}
      {{- end }}
      {{- $portIfaces = append $portIfaces $portIface }}
      {{- end }}
      {{- $lag := (dict "mode" (index $brEx "mode") "port" $bondPorts) }}
      {{- if $brOther }}
      {{- $_ := set $lag "ovs-db" (dict "other_config" $brOther) }}
      {{- end }}
      {{- $brIpv4 := (dict "enabled" true "dhcp" true "auto-route-metric" 48) }}
      {{- if eq $brExIpv4 "static" }}
      {{- $brAddrs := list }}
      {{- range $_, $addr := (dig "ipv4" "addresses" list $hostBrEx) }}
      {{- $brAddrs = append $brAddrs (dict "ip" (index $addr "ip") "prefix-length" (index $addr "prefixLength" | toInt)) }}
      {{- end }}
      {{- $brIpv4 = (dict "enabled" true "dhcp" false "address" $brAddrs) }}
      {{- end }}
      {{- $brIfaces := (list
          (dict "name" "br-ex" "type" "ovs-bridge" "state" "up"
              "bridge" (dict "allow-extra-patch-ports" true "port" (list (dict "name" "br-ex") (dict "name" "patch-ex-to-phy")))
              "ovs-db" (dict "external_ids" (dict "bridge-uplink" "patch-ex-to-phy")))
          (dict "name" "br-ex" "type" "ovs-interface" "state" "up" "copy-mac-from" (first $brPorts)
              "ipv4" $brIpv4 "ipv6" (dict "enabled" false "dhcp" false))
          (dict "name" "br-phy" "type" "ovs-bridge" "state" "up"
              "ipv4" (dict "enabled" false) "ipv6" (dict "enabled" false)
              "bridge" (dict "allow-extra-patch-ports" true "port" (list (dict "name" "patch-phy-to-ex") (dict "name" "ovs-bond" "link-aggregation" $lag))))
          (dict "name" "patch-ex-to-phy" "type" "ovs-interface" "state" "up" "patch" (dict "peer" "patch-phy-to-ex"))
          (dict "name" "patch-phy-to-ex" "type" "ovs-interface" "state" "up" "patch" (dict "peer" "patch-ex-to-phy"))
      ) }}
      {{- if $brExMtu }}
      {{- $_ := set (index $brIfaces 1) "mtu" $brExMtu }}
      {{- end }}
      {{- $brState := (dict "interfaces" (concat $brIfaces $portIfaces)) }}
      {{- if eq $brExIpv4 "static" }}
      {{- $_ := set $brState "routes" (dict "config" (list (dict "destination" "0.0.0.0/0" "next-hop-address" (index $brEx "gateway") "next-hop-interface" "br-ex" "table-id" 254))) }}
      {{- end }}
      {{- if (index $brDns "servers") }}
      {{- $brResolver := (dict "server" (index $brDns "servers")) }}
      {{- if (index $brDns "search") }}
      {{- $_ := set $brResolver "search" (index $brDns "search") }}
      {{- end }}
      {{- $_ := set $brState "dns-resolver" (dict "config" $brResolver) }}
      {{- end }}
      {{- $brRole := (index $host "role" | default "master") }}
      {{- $roleFiles := (index $brExFiles $brRole | default dict) }}
      {{- $_ := set $roleFiles $hostname ($brState | toYaml | base64enc) }}
      {{- $_ := set $brExFiles $brRole $roleFiles }}
      {{- end }}
      {{- end }}
      {{- if or $extraManifests $brExFiles }}
  {{- /* Install-time manifests from config, such as MachineConfigs that must be in place before
         the first boot. mustonlyhave, so a manifest removed from config also leaves the ConfigMap. */}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: autoshift-extra-manifests
        namespace: {{ $clusterName }}
      data:
      {{- range $emKey, $emObj := $extraManifests }}
        {{ $emKey }}.yaml: |
          {{ $emObj | toYaml | autoindent }}
      {{- end }}
      {{- range $brRole, $files := $brExFiles }}
        autoshift-br-ex-{{ $brRole }}.yaml: |
          apiVersion: machineconfiguration.openshift.io/v1
          kind: MachineConfig
          metadata:
            name: 10-br-ex-{{ $brRole }}
            labels:
              machineconfiguration.openshift.io/role: {{ $brRole }}
          spec:
            config:
              ignition:
                version: 3.2.0
              storage:
                files:
          {{- range $shortName, $b64 := $files }}
                  - path: /etc/nmstate/openshift/{{ $shortName }}.yml
                    mode: 420
                    overwrite: true
                    contents:
                      source: data:text/plain;charset=utf-8;base64,{{ $b64 }}
          {{- end }}
      {{- end }}
      {{- end }}
      {{- $manifestRefs := list }}
      {{- if (gt (len $mirrors) 0) }}
      {{- $manifestRefs = append $manifestRefs "autoshift-idms-config" }}
      {{- end }}
      {{- if $partList }}
      {{- $manifestRefs = append $manifestRefs "autoshift-partitions-config" }}
      {{- end }}
      {{- if or $extraManifests $brExFiles }}
      {{- $manifestRefs = append $manifestRefs "autoshift-extra-manifests" }}
      {{- end }}

  {{- /* The ClusterInstance extraManifestsRefs reach the installer only through this template:
         the SiteConfig operator renders them into manifestsConfigMapRefs here, nowhere else. */}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: agent-cluster-install
        namespace: {{ $clusterName }}
      data:
        AgentClusterInstall: |
          apiVersion: extensions.hive.openshift.io/v1beta1
          kind: AgentClusterInstall
          metadata:
            name: {{ $clusterName }}
            namespace: {{ $clusterName }}
          {{- if $fips }}
            annotations:
              agent-install.openshift.io/install-config-overrides: '{"fips": true}'
          {{- end }}
          spec:
            clusterDeploymentRef:
              name: {{ $clusterName }}
            imageSetRef:
              name: {{ $imageSet }}
          {{- if (gt (len $mirrors) 0) }}
            mirrorRegistryRef:
              name: mirror-registry-config
              namespace: {{ $clusterName }}
          {{- end }}
          {{- if (gt $controlPlaneCount 1) }}
            platformType: BareMetal
            apiVIP: {{ index $ci "apiVip" }}
            ingressVIP: {{ index $ci "ingressVip" }}
            mastersSchedulable: {{ index $ci "mastersSchedulable" | default false }}
            provisionRequirements:
              controlPlaneAgents: {{ $controlPlaneCount }}
              workerAgents: {{ $workerCount }}
          {{- else }}
            provisionRequirements:
              controlPlaneAgents: 1
          {{- end }}
            networking:
          {{- if (eq $controlPlaneCount 1) }}
              userManagedNetworking: true
          {{- end }}
              clusterNetwork:
              - cidr: {{ index $clusterNetwork "cidr" }}
                hostPrefix: {{ index $clusterNetwork "hostPrefix" }}
              machineNetwork:
              - cidr: {{ index $machineNetwork "cidr" }}
              serviceNetwork:
          {{- range $_, $network := $serviceNetwork }}
              - {{ $network }}
          {{- end }}
            sshPublicKey: {{ $sshPublicKey }}
          {{- if $manifestRefs }}
            manifestsConfigMapRefs:
          {{- range $_, $ref := $manifestRefs }}
              - name: {{ $ref }}
          {{- end }}
          {{- end }}

  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cluster-deployment
        namespace: {{ $clusterName }}
      data:
        ClusterDeployment: |
          apiVersion: hive.openshift.io/v1
          kind: ClusterDeployment
          metadata:
            name: {{ $clusterName }}
            namespace: {{ $clusterName }}
            labels:
              cluster.open-cluster-management.io/clusterset: {{ $managedClusterSet }}
              hive.openshift.io/cluster-platform: agent-baremetal
          spec:
            baseDomain: {{ $baseDomain }}
            clusterInstallRef:
              group: extensions.hive.openshift.io
              kind: AgentClusterInstall
              name: {{ $clusterName }}
              version: v1beta1
            clusterName: {{ $clusterName }}
            controlPlaneConfig:
              servingCertificates: {}
            platform:
              agentBareMetal:
                agentSelector:
                  matchLabels:
                    agentBareMetal-generated-infraenv-ai-flow: {{ printf "%s-%s" $clusterName $clusterName }}
            pullSecretRef:
              name: {{ printf "%s-pull-secret" $clusterName }}

  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: infra-env
        namespace: {{ $clusterName }}
      data:
        InfraEnv: |
          apiVersion: agent-install.openshift.io/v1beta1
          kind: InfraEnv
          metadata:
            labels:
              networkType: dhcp
            name: {{ $clusterName }}
            namespace: {{ $clusterName }}
          spec:
            agentLabels:
              agentBareMetal-generated-infraenv-ai-flow: {{ printf "%s-%s" $clusterName $clusterName }}
          {{- if $imageType }}
            imageType: {{ $imageType }}
          {{- end }}
          {{- if (gt (len $mirrors) 0) }}
            mirrorRegistryRef:
              name: mirror-registry-config
              namespace: {{ $clusterName }}
            ignitionConfigOverride: '{"ignition":{"version":"3.1.0"},"storage":{"files":[{"path":"/etc/containers/policy.json","mode":420,"overwrite":true,"contents":{"source":"data:text/plain;base64,ewogICJkZWZhdWx0IjogW3sidHlwZSI6ICJpbnNlY3VyZUFjY2VwdEFueXRoaW5nIn1dCn0K"}}]}}'
          {{- end }}
          {{- if $caTrustBundle }}
            additionalTrustBundle: |
              {{ $caTrustBundle | autoindent }}
          {{- end }}
          {{- $ntpSources := (index $ci "ntpSources" | default list) }}
          {{- if (gt (len $ntpSources) 0) }}
            additionalNTPSources:
          {{- range $_, $ntp := $ntpSources }}
              - {{ $ntp }}
          {{- end }}
          {{- end }}
            clusterRef:
              name: {{ $clusterName }}
              namespace: {{ $clusterName }}
            cpuArchitecture: {{ $cpuArch }}
            pullSecretRef:
              name: {{ printf "%s-pull-secret" $clusterName }}
            sshAuthorizedKey: {{ $sshPublicKey }}
            nmStateConfigLabelSelector:
              matchLabels:
                infraenvs.agent-install.openshift.io: {{ $clusterName }}

  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: managed-cluster
        namespace: {{ $clusterName }}
      data:
        ManagedCluster: |
          apiVersion: cluster.open-cluster-management.io/v1
          kind: ManagedCluster
          metadata:
            name: {{ $clusterName }}
            labels:
              cluster.open-cluster-management.io/clusterset: {{ $managedClusterSet }}
          spec:
            hubAcceptsClient: true

      {{- range $hostname, $host := $hosts }}
        {{ $nodeHostname := (index $host "hostname" | default "") }}
        {{- if not $nodeHostname }}
          {{- if eq $hostnameFormat "short" }}
            {{- $nodeHostname = $hostname }}
          {{- else }}
            {{- $nodeHostname = (printf "%s.%s.%s" $hostname $clusterName $baseDomain) }}
          {{- end }}
        {{- end }}
        {{ $hostBmcEndpoint := (index $host "bmcEndpoint" | default $bmcEndpoint) }}
        {{ $bmcAddress := (printf "%s://%s%s" (index $host "bmcPrefix") (index $host "bmcIP") $hostBmcEndpoint) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: bmh-{{ $hostname }}
        namespace: {{ $clusterName }}
      data:
        BareMetalHost: |
          apiVersion: metal3.io/v1alpha1
          kind: BareMetalHost
          metadata:
            name: {{ $hostname }}
            namespace: {{ $clusterName }}
            annotations:
              inspect.metal3.io: disabled
              bmac.agent-install.openshift.io/hostname: {{ $nodeHostname }}
            labels:
              infraenvs.agent-install.openshift.io: {{ $clusterName }}
          spec:
            automatedCleaningMode: disabled
            bmc:
              address: '{{ $bmcAddress }}'
              credentialsName: {{ $hostname }}-bmc-cred
              disableCertificateVerification: true
            bootMACAddress: '{{ index $host "bootMACAddress" }}'
          {{- if not (empty (index $host "rootDeviceHints" | default "")) }}
            rootDeviceHints:
              {{ index $host "rootDeviceHints" | toYaml | autoindent }}
          {{- end }}
            customDeploy:
              method: start_assisted_install
            online: true

      {{- $netInterfaces := (index $networking "interfaces" | default dict) }}
      {{- $hostNet := (index $host "networking" | default dict) }}
      {{- $hostNetIfaces := (index $hostNet "interfaces" | default dict) }}
      {{- $hostBrEx := (index $hostNet "brEx" | default dict) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nmstate-{{ $hostname }}
        namespace: {{ $clusterName }}
      data:
        NMStateConfig: |
          apiVersion: agent-install.openshift.io/v1beta1
          kind: NMStateConfig
          metadata:
            labels:
              infraenvs.agent-install.openshift.io: {{ $clusterName }}
            name: {{ $hostname }}
            namespace: {{ $clusterName }}
          spec:
            config:
      {{- $netDns := (index $networking "dns" | default dict) }}
      {{- $dnsServers := (index $netDns "servers" | default list) }}
      {{- if (gt (len $dnsServers) 0) }}
              dns-resolver:
                config:
                  server:
      {{- range $_, $dns := $dnsServers }}
                    - {{ $dns }}
      {{- end }}
      {{- end }}
              interfaces:
      {{- if $brEx }}
  {{- /* br-ex does not exist until the installed node first boots, so the install network uses
         the bond ports directly: the first port carries the host address, as in the documented
         install-config networkConfig for balance-slb. */}}
        {{- range $idx, $port := (index $hostBrEx "ports" | default (index $brEx "ports")) }}
                - name: {{ $port }}
                  type: ethernet
                  state: up
          {{- if $brExMtu }}
                  mtu: {{ $brExMtu }}
          {{- end }}
          {{- if ne $idx 0 }}
                  ipv4:
                    enabled: false
          {{- else if eq $brExIpv4 "static" }}
                  ipv4:
                    enabled: true
                    dhcp: false
                    address:
            {{- range $_, $addr := (dig "ipv4" "addresses" list $hostBrEx) }}
                      - ip: {{ index $addr "ip" }}
                        prefix-length: {{ index $addr "prefixLength" }}
            {{- end }}
          {{- else }}
                  ipv4:
                    enabled: true
                    dhcp: true
          {{- end }}
                  ipv6:
                    enabled: false
        {{- end }}
      {{- end }}
      {{- range $ifaceId, $topoIface := $netInterfaces }}
        {{- $ifaceType := (index $topoIface "type" | default "ethernet") }}
        {{- $ifaceName := (index $topoIface "name" | default "") }}
        {{- $ifaceState := (index $topoIface "state" | default "up") }}
        {{- $ifaceMtu := (index $topoIface "mtu" | default "") }}
        {{- $ifaceMac := (index $topoIface "mac" | default "") }}
        {{- $topoIpv4 := (index $topoIface "ipv4" | default "disabled") }}
        {{- $topoIpv6 := (index $topoIface "ipv6" | default "disabled") }}{{- $hostOverride := (index $hostNetIfaces $ifaceId | default dict) }}
        {{- $hostIpv4 := (index $hostOverride "ipv4" | default dict) }}
        {{- $hostAddrs := (index $hostIpv4 "addresses" | default list) }}
        {{- $hostIpv6 := (index $hostOverride "ipv6" | default dict) }}
        {{- $hostIpv6Addrs := (index $hostIpv6 "addresses" | default list) }}
        {{- $hostPorts := (index $hostOverride "ports" | default list) }}
                - name: {{ $ifaceName }}
                  type: {{ $ifaceType }}
                  state: {{ $ifaceState }}
        {{- if $ifaceMac }}
                  identifier: mac-address
                  mac-address: {{ $ifaceMac }}
        {{- end }}
        {{- if $ifaceMtu }}
                  mtu: {{ $ifaceMtu }}
        {{- end }}{{- if eq $topoIpv4 "disabled" }}
                  ipv4:
                    enabled: false
                    dhcp: false
        {{- else if eq $topoIpv4 "dhcp" }}
                  ipv4:
                    enabled: true
                    dhcp: true
        {{- else if eq $topoIpv4 "static" }}
                  ipv4:
          {{- if (gt (len $hostAddrs) 0) }}
                    address:
            {{- range $_, $addr := $hostAddrs }}
                      - ip: {{ index $addr "ip" }}
                        prefix-length: {{ index $addr "prefixLength" }}
            {{- end }}
          {{- end }}
                    dhcp: false
                    enabled: true
        {{- end }}{{- if eq $topoIpv6 "disabled" }}
                  ipv6:
                    enabled: false
        {{- else if eq $topoIpv6 "dhcp" }}
                  ipv6:
                    enabled: true
                    dhcp: true
        {{- else if eq $topoIpv6 "autoconf" }}
                  ipv6:
                    enabled: true
                    autoconf: true
        {{- else if eq $topoIpv6 "static" }}
                  ipv6:
          {{- if (gt (len $hostIpv6Addrs) 0) }}
                    address:
            {{- range $_, $addr := $hostIpv6Addrs }}
                      - ip: {{ index $addr "ip" }}
                        prefix-length: {{ index $addr "prefixLength" }}
            {{- end }}
          {{- end }}
                    dhcp: false
                    autoconf: false
                    enabled: true
        {{- end }}{{- if eq $ifaceType "bond" }}
          {{- $bondMode := (index $topoIface "mode" | default "802.3ad") }}
          {{- $bondMiimon := (index $topoIface "miimon" | default "") }}
          {{- $ports := $hostPorts }}
          {{- if (eq (len $ports) 0) }}
            {{- $ports = (index $topoIface "ports" | default list) }}
          {{- end }}
                  link-aggregation:
                    mode: {{ $bondMode }}
          {{- if $bondMiimon }}
                    options:
                      miimon: {{ $bondMiimon }}
          {{- end }}
          {{- if (gt (len $ports) 0) }}
                    port:
            {{- range $_, $port := $ports }}
                      - {{ $port }}
            {{- end }}
          {{- end }}
          {{- $primaryMac := (index $host "primaryMac" | default "") }}
          {{- if not $primaryMac }}
            {{- $hwIfaces := (index $host "interfaces" | default list) }}
            {{- if (gt (len $hwIfaces) 0) }}
              {{- $primaryMac = (index (index $hwIfaces 0) "macAddress" | default "") }}
            {{- end }}
          {{- end }}
          {{- if $primaryMac }}
                  mac-address: {{ $primaryMac }}
          {{- end }}
        {{- end }}{{- if eq $ifaceType "vlan" }}
          {{- $vlanId := (index $topoIface "id" | default 0) }}
          {{- $vlanBase := (index $topoIface "base" | default "") }}
                  vlan:
                    base-iface: {{ $vlanBase }}
                    id: {{ $vlanId }}
        {{- end }}
      {{- end }}{{- $netRoutes := (index $networking "routes" | default dict) }}
      {{- $hostRoutes := (index $hostNet "routes" | default dict) }}
      {{- $brExGateway := "" }}
      {{- if $brEx }}
      {{- if eq $brExIpv4 "static" }}
      {{- $brExGateway = (index $brEx "gateway") }}
      {{- end }}
      {{- end }}
      {{- if or (gt (len (keys $netRoutes)) 0) (gt (len (keys $hostRoutes)) 0) $brExGateway }}
              routes:
                config:
        {{- if $brExGateway }}
                  - destination: 0.0.0.0/0
                    next-hop-address: {{ $brExGateway }}
                    next-hop-interface: {{ first (index $hostBrEx "ports" | default (index $brEx "ports")) }}
        {{- end }}
        {{- range $_, $route := $netRoutes }}
                  - destination: {{ index $route "destination" }}
                    next-hop-address: {{ index $route "gateway" }}
                    next-hop-interface: {{ index $route "interface" }}
        {{- end }}
        {{- range $_, $route := $hostRoutes }}
                  - destination: {{ index $route "destination" }}
                    next-hop-address: {{ index $route "gateway" }}
                    next-hop-interface: {{ index $route "interface" }}
        {{- end }}
      {{- end }}
            interfaces:
        {{- $hwInterfaces := (index $host "interfaces" | default list) }}
        {{- range $idx, $iface := $hwInterfaces }}
              - macAddress: {{ index $iface "macAddress" }}
                name: {{ index $iface "name" | default (printf "eno%d" (add $idx 1)) }}
        {{- end }}
      {{- end }}

  - complianceType: musthave
    objectDefinition:
      apiVersion: siteconfig.open-cluster-management.io/v1alpha1
      kind: ClusterInstance
      metadata:
        name: {{ $clusterName }}
        namespace: {{ $clusterName }}
      spec:
        baseDomain: {{ $baseDomain }}
        clusterImageSetNameRef: {{ $imageSet }}
        clusterName: {{ $clusterName }}
      {{- if (eq (index $ci "cpuPartitioning" | default "None") "AllNodes") }}
        cpuPartitioningMode: AllNodes
      {{- end }}
        nodes:
      {{- range $hostname, $host := $hosts }}
        {{ $nodeHostname := (index $host "hostname" | default "") }}
        {{- if not $nodeHostname }}
          {{- if eq $hostnameFormat "short" }}
            {{- $nodeHostname = $hostname }}
          {{- else }}
            {{- $nodeHostname = (printf "%s.%s.%s" $hostname $clusterName $baseDomain) }}
          {{- end }}
        {{- end }}
        {{ $hostBmcEndpoint := (index $host "bmcEndpoint" | default $bmcEndpoint) }}
        {{ $bmcAddress := (printf "%s://%s%s" (index $host "bmcPrefix") (index $host "bmcIP") $hostBmcEndpoint) }}
          - hostName: {{ $nodeHostname }}
            role: {{ index $host "role" | default "master" }}
            bmcAddress: {{ $bmcAddress }}
            bmcCredentialsName:
              name: {{ $hostname }}-bmc-cred
            bootMACAddress: {{ index $host "bootMACAddress" }}
            templateRefs:
              - name: bmh-{{ $hostname }}
                namespace: {{ $clusterName }}
              - name: nmstate-{{ $hostname }}
                namespace: {{ $clusterName }}
      {{- end }}
        pullSecretRef:
          name: {{ printf "%s-pull-secret" $clusterName }}
        sshPublicKey: {{ $sshPublicKey }}
      {{- if $manifestRefs }}
        extraManifestsRefs:
      {{- range $_, $ref := $manifestRefs }}
          - name: {{ $ref }}
      {{- end }}
      {{- end }}
        templateRefs:
          - name: agent-cluster-install
            namespace: {{ $clusterName }}
          - name: cluster-deployment
            namespace: {{ $clusterName }}
          - name: infra-env
            namespace: {{ $clusterName }}
          - name: managed-cluster
            namespace: {{ $clusterName }}
    {{- end }}
  {{- end }}
