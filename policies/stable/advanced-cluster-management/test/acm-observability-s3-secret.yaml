# Inform gate for external-s3. Compliant only when the credentials Secret named by
# config.acm.observability.thanosStorage.source exists on this hub and fromSecret can
# read AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Bucket, endpoint, and TLS are
# config, not keys in this Secret.
object-templates-raw: |
  {{hub- $raw := fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "" hub}}
  {{hub- if empty $raw hub}}
  {{hub- fail "advanced-cluster-management: external-s3 requires config.acm.observability.thanosStorage in the rendered-config ConfigMap" hub}}
  {{hub- end hub}}
  {{hub- $thanos := dig "acm" "observability" "thanosStorage" dict ($raw | fromYaml) hub}}
  {{hub- $source := index $thanos "source" | default dict hub}}
  {{hub- $sourceNs := index $source "namespace" | default "" hub}}
  {{hub- $sourceSecret := index $source "secretName" | default "" hub}}
  {{hub- if or (empty $sourceNs) (empty $sourceSecret) hub}}
  {{hub- fail "advanced-cluster-management: external-s3 requires config.acm.observability.thanosStorage source.namespace and source.secretName" hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{hub $sourceSecret hub}}'
        namespace: '{{hub $sourceNs hub}}'
      data:
        AWS_ACCESS_KEY_ID: '{{ fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceSecret hub}}" "AWS_ACCESS_KEY_ID" }}'
        AWS_SECRET_ACCESS_KEY: '{{ fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceSecret hub}}" "AWS_SECRET_ACCESS_KEY" }}'
