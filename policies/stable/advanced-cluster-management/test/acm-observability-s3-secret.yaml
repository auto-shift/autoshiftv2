# Inform gate for external-s3. Compliant only when thanos-s3-bucket exists in the
# namespace from autoshift.io/acm-observability-s3-namespace and fromSecret can read
# every key. A missing key leaves this NonCompliant, so thanos-object-storage is not written.
object-templates-raw: |
  {{hub- $ns := index .ManagedClusterLabels "autoshift.io/acm-observability-s3-namespace" | default "" hub}}
  {{hub- if empty $ns hub}}
    {{hub- fail "advanced-cluster-management: external-s3 requires autoshift.io/acm-observability-s3-namespace, the namespace of Secret thanos-s3-bucket" hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: thanos-s3-bucket
        namespace: '{{hub $ns hub}}'
      data:
        BUCKET_NAME: '{{ fromSecret "{{hub $ns hub}}" "thanos-s3-bucket" "BUCKET_NAME" }}'
        BUCKET_HOST: '{{ fromSecret "{{hub $ns hub}}" "thanos-s3-bucket" "BUCKET_HOST" }}'
        BUCKET_PORT: '{{ fromSecret "{{hub $ns hub}}" "thanos-s3-bucket" "BUCKET_PORT" }}'
        AWS_ACCESS_KEY_ID: '{{ fromSecret "{{hub $ns hub}}" "thanos-s3-bucket" "AWS_ACCESS_KEY_ID" }}'
        AWS_SECRET_ACCESS_KEY: '{{ fromSecret "{{hub $ns hub}}" "thanos-s3-bucket" "AWS_SECRET_ACCESS_KEY" }}'
