# ACM Search persistent storage.
#
# storageClassName is REQUIRED to get a PersistentVolumeClaim. Red Hat Advanced Cluster Management
# stores the search PostgreSQL data in an emptyDir until a storage class is named, and setting only
# size leaves it there: the Search CR looks configured, this policy reports Compliant, and the data
# is still lost on restart. The cluster raises SearchPVCNotPresent and SearchPVCNotPresentCritical
# when that happens.
#
# So when autoshift.io/acm-search-storage-class is not set, the cluster's default StorageClass is
# looked up and used. The lookup is spoke side because that is where the StorageClasses live. If the
# cluster has no default class either, the field is omitted and the two alerts above are the signal.
object-templates-raw: |
  {{hub- $size := (index .ManagedClusterLabels "autoshift.io/acm-search-storage-size" | default "100Gi") hub}}
  {{- $class := "{{hub index .ManagedClusterLabels "autoshift.io/acm-search-storage-class" | default "" hub}}" }}
  {{- if not $class }}
  {{- range $sc := (dig "items" (list) ((lookup "storage.k8s.io/v1" "StorageClass" "" "") | default dict)) }}
  {{- if eq (dig "metadata" "annotations" "storageclass.kubernetes.io/is-default-class" "" $sc) "true" }}
  {{- $class = $sc.metadata.name }}
  {{- end }}
  {{- end }}
  {{- end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: search.open-cluster-management.io/v1alpha1
      kind: Search
      metadata:
        name: search-v2-operator
        namespace: open-cluster-management
      spec:
        dbStorage:
          {{- if $class }}
          storageClassName: '{{ $class }}'
          {{- end }}
          size: '{{hub $size hub}}'
