object-templates-raw: |
  - complianceType: musthave
    objectDefinition:
      apiVersion: operator.open-cluster-management.io/v1
      kind: MultiClusterHub
      metadata:
        name: multiclusterhub
        namespace: open-cluster-management
      spec:
        availabilityConfig: '{{hub $availability_config := index .ManagedClusterLabels "autoshift.io/acm-availability-config" | default "High" -hub}} {{hub print (substr 0 1 $availability_config | upper) (substr 1 (len $availability_config) $availability_config) -hub}}'
        {{- $selfmanaged := {{hub (index .ManagedClusterLabels "autoshift.io/self-managed") | default "true" hub}} }}
        {{- if eq (print $selfmanaged) "false" }}
        disableHubSelfManagement: true
        {{- end }}
        {{- /* Optional MultiClusterHub components, each gated on its own label.
               Enabling a component here is not reversible from values: musthave does not remove
               list entries, so clearing the label leaves the component enabled and the policy
               still reports Compliant. Disable one by editing the MultiClusterHub directly. */ -}}
        {{- $clusterInstall := {{hub (index .ManagedClusterLabels "autoshift.io/cluster-install") | default "false" hub}} }}
        {{- $backupMode := "{{hub (index .ManagedClusterLabels "autoshift.io/acm-failover") | default "false" hub}}" }}
        {{- $siteconfig := eq (print $clusterInstall) "true" }}
        {{- /* Both sides of an active/passive pair need the backup component: the standby restores
               through the same operator the active hub backs up with. */ -}}
        {{- $clusterBackup := has $backupMode (list "active" "passive") }}
        {{- if or $siteconfig $clusterBackup }}
        overrides:
          components:
            {{- if $siteconfig }}
            - name: siteconfig
              enabled: true
            {{- end }}
            {{- if $clusterBackup }}
            - name: cluster-backup
              enabled: true
            {{- end }}
        {{- end }}
