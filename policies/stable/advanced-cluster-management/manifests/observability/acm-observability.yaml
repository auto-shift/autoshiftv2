# Base MultiCluster Observability on a hub: pull secret, the MultiClusterObservability
# object, and its MCOA capabilities. Capabilities come from
# config.acm.observability.capabilities and default to all enabled. A toggle set to
# "false" omits that capability. musthave does not remove a capability that was
# previously applied, so clearing one that is already on the object has to be done
# on the object itself.
object-templates-raw: |
  {{hub- $raw := fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | default "{}" hub}}
  {{hub- $obs := dig "acm" "observability" dict ($raw | fromYaml) hub}}
  {{hub- $capabilities := index $obs "capabilities" | default dict hub}}
  {{hub- $platformAnalytics := index $capabilities "platformAnalytics" | default "true" hub}}
  {{hub- $platformLogs := index $capabilities "platformLogs" | default "true" hub}}
  {{hub- $platformMetrics := index $capabilities "platformMetrics" | default "true" hub}}
  {{hub- $userWorkloadLogs := index $capabilities "userWorkloadLogs" | default "true" hub}}
  {{hub- $userWorkloadMetrics := index $capabilities "userWorkloadMetrics" | default "true" hub}}
  {{hub- $userWorkloadTraces := index $capabilities "userWorkloadTraces" | default "true" hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: multiclusterhub-operator-pull-secret
        namespace: open-cluster-management-observability
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" }}'
  - complianceType: musthave
    objectDefinition:
      apiVersion: observability.open-cluster-management.io/v1beta2
      kind: MultiClusterObservability
      metadata:
        name: observability
        namespace: open-cluster-management-observability
      spec:
        observabilityAddonSpec: {}
        storageConfig:
          metricObjectStorage:
            name: thanos-object-storage
            key: thanos.yaml
        {{hub- if or (eq $platformAnalytics "true") (eq $platformLogs "true") (eq $platformMetrics "true") (eq $userWorkloadLogs "true") (eq $userWorkloadMetrics "true") (eq $userWorkloadTraces "true") hub}}
        capabilities:
          {{hub- if or (eq $platformAnalytics "true") (eq $platformLogs "true") (eq $platformMetrics "true") hub}}
          platform:
            {{hub- if eq $platformAnalytics "true" hub}}
            analytics:
              incidentDetection: {}
              namespaceRightSizingRecommendation: {}
              virtualizationRightSizingRecommendation: {}
            {{hub- end hub}}
            {{hub- if eq $platformLogs "true" hub}}
            logs:
              collection: {}
            {{hub- end hub}}
            {{hub- if eq $platformMetrics "true" hub}}
            metrics:
              default:
                enabled: true
              ui: {}
            {{hub- end hub}}
          {{hub- end hub}}
          {{hub- if or (eq $userWorkloadLogs "true") (eq $userWorkloadMetrics "true") (eq $userWorkloadTraces "true") hub}}
          userWorkloads:
            {{hub- if eq $userWorkloadLogs "true" hub}}
            logs:
              collection:
                clusterLogForwarder: {}
            {{hub- end hub}}
            {{hub- if eq $userWorkloadMetrics "true" hub}}
            metrics:
              default:
                enabled: true
            {{hub- end hub}}
            {{hub- if eq $userWorkloadTraces "true" hub}}
            traces:
              collection:
                collector: {}
                instrumentation: {}
            {{hub- end hub}}
          {{hub- end hub}}
        {{hub- end hub}}
