# A VolumeSnapshotClass must exist, or CSI backups silently produce nothing usable.
#
# This is the prerequisite that disqualifies a cluster: the StorageClass being CSI-provisioned is not
# enough, the driver must also support snapshots and a VolumeSnapshotClass must be present. Matched
# by kind alone, since the name and driver vary by platform.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
