# The credentials Velero opens must exist on this cluster.
#
# A missing Secret otherwise presents only as a BackupStorageLocation that never reaches Available,
# which points at the bucket rather than at the credentials. This names the cause.
#
# Existence only. The contents are never read.
object-templates-raw: |
  # INDENTATION ANCHOR
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $store := (dig "vm-backup" "storage" (dict) $rcmConfig) hub}}
  {{hub- $credFrom := (index $store "credentialsFrom" | default dict) hub}}
  {{hub- $credName := (dig "configSecretRef" "name" "cloud-credentials" $store) hub}}
  # When credentialsFrom is set the Secret is copied from the hub, and targetName is its name here.
  {{hub- if not (empty $credFrom) hub}}
  {{hub- $credName = (index $credFrom "targetName" | default "cloud-credentials") hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{hub $credName hub}}
        namespace: openshift-adp
