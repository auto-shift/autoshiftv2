# Securesign CR (Fulcio, Rekor, Trillian, CTlog, TUF, TSA) in the tssc-tas namespace, plus the
# tssc-tas-integration secret advertising rekor/tuf URLs to pipelines + RHDH. Fulcio uses Keycloak
# OIDC — the issuer is derived from cluster DNS so it matches the Keycloak Route. Org name from
# config.tas.orgName; realm from config.keycloak.realmName.
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $realm := (index (index $cfg "keycloak" | default dict) "realmName" | default "tssc-iam") hub}}
  {{hub- $orgName := (index (index $cfg "tas" | default dict) "orgName" | default "TSSC") hub}}
  {{hub- $ns := "tssc-tas" hub}}
  {{- $appsDomain := (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain }}
  {{- $oidcIssuer := printf "https://keycloak.%s/realms/{{hub $realm hub}}" $appsDomain }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{hub $ns hub}}'
        labels:
          openshift.io/cluster-monitoring: "true"
  - complianceType: musthave
    objectDefinition:
      apiVersion: rhtas.redhat.com/v1
      kind: Securesign
      metadata:
        name: trusted-artifact-signer
        namespace: '{{hub $ns hub}}'
      # Written as v1, the storage version. A v1alpha1 object converts its defaulted trillian port to
      # url ":8091" next to the ref the Operator sets, and the CTlog then rejects both.
      spec:
        fulcio:
          ingress:
            enabled: true
          signer:
            certificateChain:
              commonName: 'fulcio.{{ $appsDomain }}'
              organizationEmail: 'tas@{{ $appsDomain }}'
              organizationName: '{{hub $orgName hub}}'
          config:
            oidcIssuers:
              - issuer: '{{ $oidcIssuer }}'
                issuerURL: '{{ $oidcIssuer }}'
                clientID: trusted-artifact-signer
                type: email
        rekor:
          ingress:
            enabled: true
          signer:
            type: secret
        trillian:
          database:
            create: true
        # No tsa here or under tuf: a nil tuf.tsa keeps TSA out of the trust root, which the standard
        # RHTAS deployment does not include.
        tuf:
          ingress:
            enabled: true
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tssc-tas-integration
        namespace: '{{hub $ns hub}}'
      type: Opaque
      stringData:
        rekor_url: 'https://rekor-server-{{hub $ns hub}}.{{ $appsDomain }}'
        tuf_url: 'https://tuf-{{hub $ns hub}}.{{ $appsDomain }}'
