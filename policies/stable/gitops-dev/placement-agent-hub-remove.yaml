apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gitops-dev-agent-hub-remove
  namespace: ${POLICY_NAMESPACE}
spec:
  # cluster-type hub only, and gitops-agent-teams by Exists rather than by value, for the same
  # reason the spoke removal placement does: the change that sets a team to 'uninstall' commonly
  # flips gitops-agent-teams to 'false' at the same time, and un-placing the removal policy before
  # it has removed anything would leave the principal and every credential behind.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/cluster-type'
              operator: In
              values:
                - 'hub'
            - key: 'autoshift.io/gitops-agent-teams'
              operator: Exists
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
