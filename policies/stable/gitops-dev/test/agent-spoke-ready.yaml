# Inform-only: this cluster's team agents have their credentials and their instance.
#
# The agent-to-cluster mapping is deliberately NOT asserted here: it lives on the hub, and a policy
# cannot assert an object on another cluster. It is covered by agent-hub-ready.yaml instead.
object-templates-raw: |
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- range $label, $val := .ManagedClusterLabels hub}}
  {{hub- if and (hasPrefix "autoshift.io/gitops-dev-team-" $label) (not (hasSuffix "-cluster-scoped" $label)) (hasPrefix "agent" $val) hub}}
  {{hub- $team := replace "autoshift.io/gitops-dev-team-" "" $label hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-gitops-{{hub $team hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-agent-client-tls
        namespace: openshift-gitops-{{hub $team hub}}
  # The instance, reconciled by the operator. server is deliberately off on an agent instance, so
  # that component reports Unknown; phase still reaches Available.
  - complianceType: musthave
    objectDefinition:
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: {{hub printf "%s-agent" $team hub}}
        namespace: openshift-gitops-{{hub $team hub}}
      status:
        phase: Available
  # The rollout, which the custom resource above does not cover: the operator reports Available off
  # minimum availability, and a stalled rolling update satisfies that while the previous pod goes on
  # serving the previous configuration.
  #
  # Progressing is the signal. It stays True after a completed rollout and goes False with
  # ProgressDeadlineExceeded when one stalls. Replica counts do not catch it, because spec.replicas
  # and readyReplicas both read 1 throughout. The operator owns this deployment, so maxSurge cannot
  # be set to 0 to avoid the stall; only reporting it is available.
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{hub printf "%s-agent-agent-agent" $team hub}}
        namespace: openshift-gitops-{{hub $team hub}}
      status:
        conditions:
          - type: Available
            status: 'True'
          - type: Progressing
            status: 'True'
  {{hub- end hub}}
  {{hub- end hub}}
