# Inform-only: this cluster's team agents have their credentials and their instance.
#
# The agent-to-cluster mapping is deliberately NOT asserted here: it lives on the hub, and a policy
# cannot assert an object on another cluster. It is covered by agent-hub-ready.yaml instead.
object-templates-raw: |
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- range $label, $val := .ManagedClusterLabels hub}}
  {{hub- if and (hasPrefix "autoshift.io/gitops-dev-team-" $label) (not (hasSuffix "-cluster-scoped" $label)) (hasPrefix "agent" $val) hub}}
  {{hub- $team := replace "autoshift.io/gitops-dev-team-" "" $label hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-gitops-{{hub $team hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-agent-client-tls
        namespace: openshift-gitops-{{hub $team hub}}
  # The instance, reconciled by the operator. server is deliberately off on an agent instance, so
  # that component reports Unknown; phase still reaches Available.
  - complianceType: musthave
    objectDefinition:
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: {{hub printf "%s-agent" $team hub}}
        namespace: openshift-gitops-{{hub $team hub}}
      status:
        phase: Available
  # THE AGENT IS ACTUALLY THE ONE RUNNING. Asserting the ArgoCD custom resource is not enough: the
  # operator reports Available off minimum availability, which a HALF-FINISHED rollout satisfies.
  # At replicas 1 a rolling update needs maxSurge 1, so on a node at its pod limit the new pod never
  # schedules, the old one keeps serving, and the deployment sits at replicas 2 / updated 1 / ready 1
  # forever. The agent announces its mode in its authentication token, so the principal goes on
  # reporting the OLD pod's mode and a mode change appears to have been applied when it has not.
  #
  # Progressing is the direct signal: it stays True after a completed rollout and flips to False
  # with ProgressDeadlineExceeded when one stalls. Replica counts do NOT catch this -- spec.replicas
  # and readyReplicas both read 1 and look perfectly healthy. The operator owns this deployment, so
  # maxSurge 0 is not available to us; reporting it is.
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{hub printf "%s-agent-agent-agent" $team hub}}
        namespace: openshift-gitops-{{hub $team hub}}
      status:
        conditions:
          - type: Available
            status: 'True'
          - type: Progressing
            status: 'True'
  {{hub- end hub}}
  {{hub- end hub}}
