apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gitops-dev
# Per-deployment scalars (${...}) are substituted by the repo-server CMP BEFORE `kustomize build`
# runs. They live here and in placement.yaml — never in manifests/, whose hub templates contain
# `$vars` that substitution would clobber.
#
# gitops-dev is a single first-class ConfigurationPolicy (object-templates-raw). It ranges the
# cluster's gitops-dev-team-<team> labels on the hub, reads each team's ArgoCD spec from the
# cluster-set-config.<clusterset> ConfigMap (hubClusterSets.<hub>.config.gitops.teams), and stamps
# the per-team GitOps objects, one set per team on the cluster. Because it is a
# first-class manifest, remediationAction + evaluationInterval are baked in the manifest (PG will
# not inject them); ${REMEDIATION} here drives the root Policy action to match.
# NOTE: each policy below has its OWN placement file, even where two placements are identical in
# content. Sharing one placement between two policies forces placementBindingDefaults.name, and a
# single default name then collides as soon as a SECOND placement is shared. One placement per
# policy keeps the generated PlacementBinding names unique without that knob.
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: high
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  placement:
    placementPath: placement.yaml
policies:
  - name: policy-gitops-dev
    # Hub lookups (cluster-set-config ConfigMap, ManagedClusterSet, Route) need a service account.
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-gitops-operator-install
    manifests:
      - path: manifests
  # HUB half of the team agents. Its own policy and its own placement so that an agent problem
  # reports against the agent, not against the team's Argo CD, and so a hub running no team agents
  # simply does not receive it.
  - name: policy-gitops-dev-agent-hub
    placement:
      placementPath: placement-agent-hub.yaml
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-gitops-dev
    manifests:
      - path: agent-hub
  # inform: the hub half is actually serving. Asserts the principal namespace unconditionally, so a
  # Compliant result always means a real check ran rather than an empty render.
  - name: policy-gitops-dev-agent-hub-ready
    placement:
      placementPath: placement-agent-hub-ready.yaml
    remediationAction: inform
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    manifests:
      - path: test/agent-hub-ready.yaml
  # SPOKE half. Depends on nothing: its inputs are guarded in-template, so it converges on its own
  # once the hub half has produced the credentials rather than being held Pending.
  - name: policy-gitops-dev-agent-spoke
    placement:
      placementPath: placement-agent-spoke.yaml
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    manifests:
      - path: agent-spoke
  - name: policy-gitops-dev-agent-spoke-ready
    placement:
      placementPath: placement-agent-spoke-ready.yaml
    remediationAction: inform
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    manifests:
      - path: test/agent-spoke-ready.yaml
