# Is the autoscaler running? The ClusterAutoscaler `default` makes the machine-api operator
# deploy cluster-autoscaler-default in openshift-machine-api. A ClusterAutoscaler that exists
# with no running Deployment scales nothing, and reports nothing either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler-default
  namespace: openshift-machine-api
status:
  availableReplicas: 1
