# Readiness gate: the CheCluster reports phase Active, which the Dev Spaces operator sets only once
# the server, dashboard and gateway are all running. policy-devspaces-instance stays Compliant on
# the spec alone, so this is what shows whether Dev Spaces actually came up. Wrapped by PG into a
# musthave ConfigurationPolicy; its PG policy entry is remediationAction: inform.
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
status:
  chePhase: Active
