object-templates-raw: |
  {{- /* Specify the parameters needed to create the MachineSet  */ -}}
  {{- $machineset_role := "infra" }}
  {{- $zones_from_labels := list {{hub range $label, $labelvalue := .ManagedClusterLabels hub}}{{hub if $label | hasPrefix "autoshift.io/infra-nodes-zone" hub}}"{{hub $labelvalue hub}}"{{hub end hub}}{{hub end hub}} }}
  {{- $infrastructure_id := (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}
  {{- $worker_ms := dict }}
  {{- range (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "").items }}
    {{- if hasPrefix (printf "%s-worker" $infrastructure_id) .metadata.name }}
      {{- $worker_ms = . }}
    {{- end }}
  {{- end }}
  {{- /* Zone resolution that works on every provider.
         AWS nests the zone under providerSpec.value.placement.availabilityZone.
         IBM Cloud and the other flat provider specs carry it as `zone`. vSphere
         has no zone field at all - it encodes placement through workspace and
         network - so the MachineSet name suffix is the only handle.

         This file is shared across providers: its placement has no -provider
         predicate, so it lands on every cluster regardless of platform. Reading
         .placement.availabilityZone directly is therefore a nil dereference
         anywhere that is not AWS, and the ConfigurationPolicy fails with a
         template error rather than rendering nothing. dig throughout is what
         turns that into an empty string.

         CI does not currently catch this: every worker MachineSet in tools/testdata
         is a hybrid carrying AWS and vSphere fields on the same object, so the
         AWS path always resolves there. */ -}}
  {{- $pv := (dig "spec" "template" "spec" "providerSpec" "value" (dict) $worker_ms) }}
  {{- $worker_zone := "" }}
  {{- if (dig "zone" "" $pv) }}
    {{- $worker_zone = (dig "zone" "" $pv) }}
  {{- else if (dig "placement" "availabilityZone" "" $pv) }}
    {{- $worker_zone = (dig "placement" "availabilityZone" "" $pv) }}
  {{- else if (dig "metadata" "name" "" $worker_ms) }}
    {{- $worker_zone = trimPrefix (printf "%s-worker-" $infrastructure_id) (dig "metadata" "name" "" $worker_ms) }}
  {{- end }}
  {{- range $zone := ternary (ternary (list $worker_zone) (list) (ne $worker_zone "")) $zones_from_labels (eq 0 (len $zones_from_labels)) }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: machine.openshift.io/v1beta1
      kind: MachineSet
      metadata:
        labels:
          machine.openshift.io/cluster-api-cluster: {{ $infrastructure_id }}
        name: {{ $infrastructure_id }}-{{ $machineset_role }}-{{ $zone }}
        namespace: openshift-machine-api
  {{- end }}
