object-templates-raw: |
  {{- $cores := 0 }}
  {{- range (lookup "v1" "Node" "" "").items }}
    {{- if and (hasKey .metadata.labels "node-role.kubernetes.io/worker") (not (hasKey .metadata.labels "node-role.kubernetes.io/master")) (not (hasKey .metadata.labels "node-role.kubernetes.io/infra")) }}
      {{- if eq $cores 0 }}
        {{- $cores = (.status.capacity.cpu | toInt) }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- $maxPods := ("{{hub index .ManagedClusterLabels "autoshift.io/worker-max-pods" | default 250 hub}}" | toInt) }}
  {{- $systemReservedMemory := "{{hub index .ManagedClusterLabels "autoshift.io/worker-system-reserved-memory" | default "1Gi" hub}}" }}
  {{- $systemReservedCpu := "{{hub index .ManagedClusterLabels "autoshift.io/worker-system-reserved-cpu" | default "250m" hub}}" }}
  {{- $kubeReservedMemory := "{{hub index .ManagedClusterLabels "autoshift.io/worker-kube-reserved-memory" | default "512Mi" hub}}" }}
  {{- $kubeReservedCpu := "{{hub index .ManagedClusterLabels "autoshift.io/worker-kube-reserved-cpu" | default "250m" hub}}" }}
  {{- $evictionMemory := "{{hub index .ManagedClusterLabels "autoshift.io/worker-eviction-memory" | default "500Mi" hub}}" }}
  {{hub- $cm := ((lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict) hub}}
  {{hub- $cfg := ((dig "data" "config" "" $cm) | fromYaml | default dict) hub}}
  {{- $evictionCfg := `
  evictionHard:
    {{hub (dig "workerNodes" "evictionHard" dict $cfg) | toYaml | autoindent hub}}
  ` | fromYaml }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: KubeletConfig
      metadata:
        name: worker-node-config
      spec:
        machineConfigPoolSelector:
          matchLabels:
            pools.operator.machineconfiguration.openshift.io/worker: ""
        kubeletConfig:
          podsPerCore: {{ add 1 (div $maxPods $cores) }}
          maxPods: {{ $maxPods }}
          systemReserved:
            memory: {{ $systemReservedMemory }}
            cpu: {{ $systemReservedCpu }}
          kubeReserved:
            memory: {{ $kubeReservedMemory }}
            cpu: {{ $kubeReservedCpu }}
          {{- /* evictionHard REPLACES the kubelet default set rather than merging into it, so
                 setting memory.available alone silently drops the imagefs and nodefs thresholds and
                 the node stops evicting on disk at all. The defaults below restate the rest, which
                 is also what the NIST kubelet-eviction-thresholds-set-hard-* rules check for.
                 config.workerNodes.evictionHard overrides any of them by key. */}}
          {{- $evictionDefaults := (dict "memory.available" $evictionMemory "imagefs.available" "15%" "imagefs.inodesFree" "5%" "nodefs.available" "10%" "nodefs.inodesFree" "5%") }}
          evictionHard:
            {{ (mergeOverwrite $evictionDefaults (dig "evictionHard" dict $evictionCfg)) | toYaml | autoindent }}
