# Readiness gate: the AnsibleAutomationPlatform must report its last reconcile Successful. The
# condition aggregates every enabled component, so a failing Hub, controller or EDA turns it False
# while policy-aap-instance stays Compliant on the spec alone. Wrapped by PG into a musthave
# ConfigurationPolicy; its PG policy entry is remediationAction: inform.
# Failure is not asserted False: the operator sets it only after a failure, so a healthy instance
# may not carry it at all.
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
status:
  conditions:
    - status: 'True'
      type: Successful
