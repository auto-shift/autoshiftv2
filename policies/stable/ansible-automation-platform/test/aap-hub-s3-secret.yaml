# Reports when Hub is on S3 storage but the Secret it names is missing or incomplete. Reads the live
# instance, so it covers every source of the name: aap-external-s3-secret-name, NooBaa, or
# config.aap.instance. Renders nothing when Hub does not use S3.
object-templates-raw: |
  {{- $aap := (lookup "aap.ansible.com/v1alpha1" "AnsibleAutomationPlatform" "ansible-automation-platform" "aap") | default dict }}
  {{- $hub := (dig "spec" "hub" (dict) $aap) }}
  {{- if eq (lower (dig "storage_type" "" $hub)) "s3" }}
  {{- $name := (dig "object_storage_s3_secret" "" $hub) }}
  {{- $data := dict }}
  {{- if $name }}
  {{- $data = (dig "data" (dict) ((lookup "v1" "Secret" "ansible-automation-platform" $name) | default dict)) }}
  {{- end }}
  {{- /* Nothing creates this Deployment, and metadata alone is invalid, so an enforce override
         cannot satisfy or create it. */ -}}
  {{- if not (and (hasKey $data "s3-access-key-id") (hasKey $data "s3-secret-access-key") (hasKey $data "s3-bucket-name")) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aap-hub-s3-secret-incomplete
        namespace: ansible-automation-platform
  {{- end }}
  {{- end }}
