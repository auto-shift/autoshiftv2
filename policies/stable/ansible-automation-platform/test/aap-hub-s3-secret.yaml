# Reports when Hub is on S3 storage but the Secret it names is missing.
#
# Reads the live instance, so it covers every source of the name: aap-external-s3-secret-name,
# NooBaa, or config.aap.instance. Asserts the named Secret itself, so a missing one is reported by
# name rather than through a stand-in object. Renders nothing when Hub does not use S3, which is
# correct: there is no S3 secret to require.
#
# Inform only. The Secret holds credentials this policy never creates.
object-templates-raw: |
  {{- $aap := (lookup "aap.ansible.com/v1alpha1" "AnsibleAutomationPlatform" "ansible-automation-platform" "aap") | default dict }}
  {{- $hub := (dig "spec" "hub" (dict) $aap) }}
  {{- if eq (lower (dig "storage_type" "" $hub)) "s3" }}
  {{- $name := (dig "object_storage_s3_secret" "" $hub) }}
  {{- if $name }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ $name }}
        namespace: ansible-automation-platform
  {{- end }}
  {{- end }}
