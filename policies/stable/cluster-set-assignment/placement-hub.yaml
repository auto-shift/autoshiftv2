apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-cluster-set-assignment
  namespace: ${POLICY_NAMESPACE}
spec:
  # Runs on the hub: the policy reads rendered-config ConfigMaps and stamps ManagedCluster clusterset
  # labels — hub-side work, like cluster-install / cluster-labels. cluster-type: hub selects
  # hub-clusterset members. It is a no-op for clusters without config.clusterSet.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/cluster-type'
              operator: In
              values:
                - 'hub'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
