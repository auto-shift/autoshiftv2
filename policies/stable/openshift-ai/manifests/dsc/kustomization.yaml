apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sources the RHOAI DataScienceCluster + DSCInitialization from ai-accelerator. Repo, ref and the
# openshift-ai sub-path (overlay) are per-deployment render tokens, so a deployment can point at its own
# fork/branch/overlay: ${AI_ACCELERATOR_REPO}, ${AI_ACCELERATOR_REF}, ${AI_ACCELERATOR_OVERLAY}
# (defaults in autoshift/values/global.yaml; e.g. overlay = instance-3.x/base for the clean DSC/DSCI, or
# instance-3.x/overlays/<name> for a full overlay). CONFIG is owned by the overlay — change repo/ref/
# overlay, not labels. The patches below only adapt ENVIRONMENT WIRING the upstream can't know; they
# no-op on overlays that lack the targeted objects (e.g. base). Connected git-mode + the CI-render/OCI
# release fetch this; live DISCONNECTED git-mode needs the repo mirrored into your Git or the OCI release.
resources:
  - ${AI_ACCELERATOR_REPO}//components/operators/openshift-ai/${AI_ACCELERATOR_OVERLAY}?ref=${AI_ACCELERATOR_REF}
patches:
  # MaaS overlay only: issue the Postgres TLS cert from AutoShift's built-in CA (autoshift-ca) instead of
  # the upstream's hardcoded 'ca-issuer' ClusterIssuer. Requires cert-manager-ca. No-op on base.
  - target:
      group: cert-manager.io
      kind: Certificate
      name: openshift-ai-maas
      namespace: models-as-a-service-db
    patch: |
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: openshift-ai-maas
        namespace: models-as-a-service-db
      spec:
        issuerRef:
          name: autoshift-ca
