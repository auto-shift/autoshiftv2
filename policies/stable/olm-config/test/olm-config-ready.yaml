# Readiness gate: OLM sets the DisabledCopiedCSVs condition to True on the OLMConfig once it has
# stopped copying CSVs and removed the existing copies. Wrapped by PG into a musthave
# ConfigurationPolicy; its PG policy entry is remediationAction: inform.
apiVersion: operators.coreos.com/v1
kind: OLMConfig
metadata:
  name: cluster
status:
  conditions:
    - type: DisabledCopiedCSVs
      status: 'True'
