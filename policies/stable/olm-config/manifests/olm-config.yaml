# Turns off OLM's copied CSVs. An operator installed for all namespaces otherwise gets a copy of its
# ClusterServiceVersion in every namespace. CSVs are large objects, and on a hub with many
# namespaces the copies add hundreds of objects to etcd (about 930 on our hub). The OpenShift OLM
# documentation and the Dev Spaces documentation both recommend turning them off on large clusters.
#
# Side effect: users without cluster-wide rights no longer see cluster-wide operators listed in
# their own namespaces in the web console. Operators keep working.
#
# OLMConfig is a cluster singleton named cluster. musthave sets only this field.
apiVersion: operators.coreos.com/v1
kind: OLMConfig
metadata:
  name: cluster
spec:
  features:
    disableCopiedCSVs: true
