apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: manual-remediations
# Per-deployment scalars (${...}) are substituted by the repo-server CMP (envsubst/sed) BEFORE
# `kustomize build` runs. They live here and in placement.yaml — never in manifests/, whose hub
# templates contain `$vars` that substitution would clobber.
#
# manifests[].path points at a single FILE. Only edit this file to change the policy graph itself
# (names, dependencies, per-policy remediation). Keep placement.yaml OUT of manifests/ (a Placement
# inside a wildcarded dir would be wrapped into the Policy as a managed object).
# One policy per STIG finding the Compliance Operator ships no automatic remediation for. Every
# manifest is object-templates-raw driven by config.manualRemediations and renders nothing until
# its key is set, so the single autoshift.io/manual-remediations label enables the set and config
# decides which members actually apply. Findings that cannot be remediated at all are reported by
# policy-stig-manual-review in openshift-compliance-operator.
placementBindingDefaults:
  name: binding-policy-manual-remediations
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
policies:
  - name: policy-image-registries
    manifests:
      - path: manifests/image-registries.yaml
    placement:
      placementPath: placement-image-registries.yaml
  - name: policy-remove-samples-operator
    manifests:
      - path: manifests/remove-samples-operator.yaml
    placement:
      placementPath: placement-remove-samples-operator.yaml
  - name: policy-classification-banner
    manifests:
      - path: manifests/classification-banner.yaml
    placement:
      placementPath: placement-classification-banner.yaml
  - name: policy-motd
    manifests:
      - path: manifests/motd.yaml
    placement:
      placementPath: placement-motd.yaml
  - name: policy-oauth-customization
    manifests:
      - path: manifests/oauth-customization.yaml
    placement:
      placementPath: placement-oauth-customization.yaml
  - name: policy-route-rate-limits
    manifests:
      - path: manifests/route-rate-limits.yaml
  # Inform only: a compute ResourceQuota with no LimitRange will reject pods that declare no
  # resources. Reports them rather than deleting, since the quota may be deliberate.
  # NIST node and OS level fixes. Each is opt-in and each rolls the nodes in its pools.
    placement:
      placementPath: placement-route-rate-limits.yaml
  - name: policy-kubelet-eviction
    manifests:
      - path: manifests/kubelet-eviction.yaml
    placement:
      placementPath: placement-kubelet-eviction.yaml
  - name: policy-auditd-config
    manifests:
      - path: manifests/auditd-config.yaml
    placement:
      placementPath: placement-auditd-config.yaml
  - name: policy-sshd-access
    manifests:
      - path: manifests/sshd-access.yaml
    placement:
      placementPath: placement-sshd-access.yaml
  - name: policy-audit-rule-order
    manifests:
      - path: manifests/audit-rule-order.yaml
    placement:
      placementPath: placement-audit-rule-order.yaml
  - name: policy-cluster-proxy
    manifests:
      - path: manifests/cluster-proxy.yaml
    placement:
      placementPath: placement-cluster-proxy.yaml
  - name: policy-quota-guard
    remediationAction: inform
    manifests:
      - path: manifests/quota-guard.yaml
  # Default project template: satisfies both project-config-and-template rules without the
  # breakage the operator's own remediations cause. Keep those four in exclude.
    placement:
      placementPath: placement-quota-guard.yaml
  - name: policy-project-template
    manifests:
      - path: manifests/project-template.yaml
  # Rolls every node in the listed pools; off unless rejectUnsignedImages.enabled is set.
    placement:
      placementPath: placement-project-template.yaml
  - name: policy-reject-unsigned-images
    manifests:
      - path: manifests/reject-unsigned-images.yaml
    placement:
      placementPath: placement-reject-unsigned-images.yaml
