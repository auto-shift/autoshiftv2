# NIST audit-rules-unsuccessful-file-modification-open-rule-order, -openat-rule-order and
# -open-by-handle-at-rule-order.
#
# The rules must appear in this exact order: the specific create and modification cases before the
# general access case, for each syscall and architecture. augenrules concatenates
# /etc/audit/rules.d in filename order, so these live in one file to keep the sequence intact.
#
# Writes through a MachineConfig, which ROLLS EVERY NODE in the listed pools. The key spelling
# "unsuccesful" is the profile's, not a typo here; the check matches it literally.
object-templates-raw: |
  {{hub- $cm := ((lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict) hub}}
  {{hub- $cfg := ((dig "data" "config" "" $cm) | fromYaml | default dict) hub}}
  {{hub- $ar := (dig "manualRemediations" "auditRuleOrder" dict $cfg) hub}}
  {{hub- range $pool := (dig "pools" (list "master" "worker") $ar) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfig
      metadata:
        name: 75-{{hub $pool hub}}-audit-rule-order
        labels:
          machineconfiguration.openshift.io/role: {{hub $pool hub}}
      spec:
        config:
          ignition:
            version: 3.2.0
          storage:
            files:
              - path: /etc/audit/rules.d/75-autoshift-unsuccessful-access.rules
                mode: 384
                overwrite: true
                contents:
                  source: data:text/plain;charset=utf-8;base64,
  {{hub- end hub}}
