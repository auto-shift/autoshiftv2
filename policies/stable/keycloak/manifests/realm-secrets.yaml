# Realm client secrets, generated on the cluster in keycloak-system. Keycloak and every client that
# reads them run on this cluster, so nothing is supplied by an administrator: each value is random,
# written once, then read back on every evaluation so it never rotates. Each Secret exists only
# while its component is enabled (tas / trusted-profile-analyzer / dev-hub / quay / gitlab), and the
# Argo CD client only while config.keycloak.argocdSso is true.
#
# The realm import is one-shot, so these must exist before it runs; policy-keycloak-realm-import
# depends on this policy and fails with the list of any that are missing.
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{- $ns := "keycloak-system" }}
  {{hub- if eq (index .ManagedClusterLabels "autoshift.io/tas" | default "false") "true" hub}}
  {{- $tas := (lookup "v1" "Secret" $ns "trusted-artifact-signer-clients" | default dict).data | default dict }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: trusted-artifact-signer-clients
        namespace: '{{ $ns }}'
      type: Opaque
      data:
        trustedArtifactSigner: '{{ index $tas "trustedArtifactSigner" | default (randAlphaNum 40 | b64enc) }}'
  {{hub- end hub}}
  {{hub- if eq (index .ManagedClusterLabels "autoshift.io/trusted-profile-analyzer" | default "false") "true" hub}}
  {{- $tpa := (lookup "v1" "Secret" $ns "tpa-realm-clients" | default dict).data | default dict }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tpa-realm-clients
        namespace: '{{ $ns }}'
      type: Opaque
      data:
        cli: '{{ index $tpa "cli" | default (randAlphaNum 40 | b64enc) }}'
        frontend: '{{ index $tpa "frontend" | default (randAlphaNum 40 | b64enc) }}'
  {{hub- end hub}}
  {{hub- if eq (index .ManagedClusterLabels "autoshift.io/dev-hub" | default "false") "true" hub}}
  {{- $rhdh := (lookup "v1" "Secret" $ns "rhdh-realm-clients" | default dict).data | default dict }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: rhdh-realm-clients
        namespace: '{{ $ns }}'
      type: Opaque
      data:
        rhdh: '{{ index $rhdh "rhdh" | default (randAlphaNum 40 | b64enc) }}'
  {{hub- end hub}}
  {{hub- if eq (index .ManagedClusterLabels "autoshift.io/quay" | default "false") "true" hub}}
  {{- $quay := (lookup "v1" "Secret" $ns "quay-realm-clients" | default dict).data | default dict }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: quay-realm-clients
        namespace: '{{ $ns }}'
      type: Opaque
      data:
        quay: '{{ index $quay "quay" | default (randAlphaNum 40 | b64enc) }}'
  {{hub- end hub}}
  {{hub- if eq (index .ManagedClusterLabels "autoshift.io/gitlab" | default "false") "true" hub}}
  {{- $gitlab := (lookup "v1" "Secret" $ns "gitlab-realm-clients" | default dict).data | default dict }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-realm-clients
        namespace: '{{ $ns }}'
      type: Opaque
      data:
        gitlab: '{{ index $gitlab "gitlab" | default (randAlphaNum 40 | b64enc) }}'
  {{hub- end hub}}
  {{hub- if (dig "keycloak" "argocdSso" false $cfg) hub}}
  {{- $argocd := (lookup "v1" "Secret" $ns "argocd-realm-clients" | default dict).data | default dict }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-realm-clients
        namespace: '{{ $ns }}'
      type: Opaque
      data:
        argocd: '{{ index $argocd "argocd" | default (randAlphaNum 40 | b64enc) }}'
  {{hub- end hub}}
