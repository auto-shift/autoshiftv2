# Renders config.eso.secrets into ExternalSecrets on whichever cluster the
# config lands on. storeRef names the provider
# (eso-vault, hub-bootstrap, or any other store on that cluster).
#
# A component that owns a secret still belongs under its own config key and should render its own
# ExternalSecret. Use this list for secrets that belong to no component, and for the hub-to-spoke
# hop: the same name on the global hub with storeRef eso-vault into eso-shared, then on the site
# or spoke with storeRef hub-bootstrap.
#
# Config shape (per cluster, from the rendered-config ConfigMap):
#
#   config:
#     eso:
#       secrets:
#         - name: demo-app-creds            # ExternalSecret name; also the default target Secret name
#           namespace: app-secrets          # where the Secret lands ON THIS CLUSTER
#                                           # omitted -> hubBootstrap.sharedNamespace (eso-shared)
#           storeRef:
#             name: hub-bootstrap           # required (or secretStoreRef: <name> alias)
#             kind: ClusterSecretStore      # default ClusterSecretStore
#           refreshInterval: 1h             # optional
#           target:                         # optional, passed through verbatim
#             creationPolicy: Owner
#           data:                           # per-key pulls; remoteRef is verbatim ESO
#             - secretKey: password
#               remoteRef:
#                 key: demo-app-creds
#                 property: password
#           dataFrom:                       # OR whole-secret / find pulls, verbatim ESO
#             - extract:
#                 key: demo-app-creds
#           prune: true                     # optional; default config.eso.pruneRemovedStores
#
# Shorthand: {name, secretStoreRef: eso-vault} is a whole-secret extract of `name` into
# sharedNamespace. If both data and dataFrom are omitted, dataFrom.extract.key defaults to name.
#
# `data` / `dataFrom` / `target` are passed through as authored — this policy validates only what it
# must to avoid emitting a half-formed object, and reports the rest as data rather than failing.
#
# NOTE on reading through hub-bootstrap: the store reads sharedNamespace (eso-shared). Children
# have list+get there by default. Policy-namespace keys need a declared resourceNames grant and
# are not visible through hub-bootstrap.
#
{{- if or $.Values.hubClusterSets $.Values.managedClusterSets }}
{{- $policyNamespace := $.Values.policy_namespace }}
{{- $sharedNamespace := (dig "hubBootstrap" "sharedNamespace" "" $.Values.externalSecretsOperator | default $policyNamespace) }}
{{- /* Prune default. hasKey (not dig|default) so an explicit values-level `false` survives. */}}
{{- $pruneDefault := true }}
{{- if hasKey $.Values.externalSecretsOperator "pruneRemovedStores" }}{{- $pruneDefault = $.Values.externalSecretsOperator.pruneRemovedStores }}{{- end }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-eso-cluster-secrets
  namespace: {{ $policyNamespace }}
  annotations:
    policy.open-cluster-management.io/description: 'Create the ExternalSecrets declared in config.eso.secrets on each placed cluster; sweep entries that are removed from the list per their baked prune labels.'
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-12 Cryptographic Key Establishment and Management
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  dependencies:
    - name: policy-eso-install
      namespace: {{ $policyNamespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: eso-cluster-secrets
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            #Indentation Anchor
            ##### LOAD PER-CLUSTER RENDERED CONFIG #####
            {{ "{{hub" }} $clusterConfig := (dig "data" "config" "" ((lookup "v1" "ConfigMap" "{{ $policyNamespace }}" (printf "%s.rendered-config" $.ManagedClusterName)) | default dict) | fromYaml | default dict) {{ "hub}}" }}
            {{ "{{hub" }} $clusterPrune := (dig "eso" "pruneRemovedStores" {{ $pruneDefault }} $clusterConfig) {{ "hub}}" }}
            {{ "{{hub-" }} $defaultNs := (dig "eso" "hubBootstrap" "sharedNamespace" "{{ $sharedNamespace }}" $clusterConfig) {{ "hub}}" }}
            {{ "{{hub-" }} if eq $defaultNs "" {{ "hub}}" }}{{ "{{hub-" }} $defaultNs = "{{ $policyNamespace }}" {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
            ##### VALIDATE + EMIT. Problems are collected and reported in the status ConfigMap below #####
            ##### rather than aborting: one malformed entry must not stop the others from being created. #####
            {{ "{{hub" }} $problems := list {{ "hub}}" }}
            {{ "{{hub" }} $expected := dict {{ "hub}}" }}
            {{ "{{hub" }} $entries := (dig "eso" "secrets" (list) $clusterConfig) {{ "hub}}" }}
            {{ "{{hub-" }} range $idx, $entry := $entries {{ "hub}}" }}
              ##### `default dict` on every user-authored node: a null list item would otherwise crash #####
              ##### hasKey/index and abort the WHOLE hub template, which is the unreadable failure mode. #####
              {{ "{{hub-" }} $entry = ($entry | default dict) {{ "hub}}" }}
              {{ "{{hub-" }} $esName := (index $entry "name" | default "") {{ "hub}}" }}
              {{ "{{hub-" }} $esNs := (index $entry "namespace" | default $defaultNs) {{ "hub}}" }}
              {{ "{{hub-" }} $storeRef := (index $entry "storeRef" | default dict) {{ "hub}}" }}
              {{ "{{hub-" }} $storeName := (index $storeRef "name" | default "") {{ "hub}}" }}
              {{ "{{hub-" }} if eq $storeName "" {{ "hub}}" }}{{ "{{hub-" }} $storeName = (printf "%v" (index $entry "secretStoreRef" | default "")) {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} $storeKind := (index $storeRef "kind" | default "ClusterSecretStore") {{ "hub}}" }}
              {{ "{{hub-" }} $data := (index $entry "data" | default list) {{ "hub}}" }}
              {{ "{{hub-" }} $dataFrom := (index $entry "dataFrom" | default list) {{ "hub}}" }}
              {{ "{{hub-" }} $entryPrune := $clusterPrune {{ "hub}}" }}
              {{ "{{hub-" }} if hasKey $entry "prune" {{ "hub}}" }}{{ "{{hub-" }} $entryPrune = (index $entry "prune") {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} $ok := true {{ "hub}}" }}
              {{ "{{hub-" }} if eq $esName "" {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %v: name is required" $idx) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if eq $esNs "" {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q: namespace is required (where the Secret lands on this cluster)" $esName) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if eq $storeName "" {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q: storeRef.name (or secretStoreRef) is required" $esName) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              ##### Both empty: whole-secret extract of `name`. Both set is ambiguous. #####
              {{ "{{hub-" }} if and (eq (len $data) 0) (eq (len $dataFrom) 0) (ne $esName "") {{ "hub}}" }}{{ "{{hub-" }} $dataFrom = list (dict "extract" (dict "key" $esName)) {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if and (gt (len $data) 0) (gt (len $dataFrom) 0) {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q: data and dataFrom are both set — use one or the other" $esName) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              ##### Duplicate (namespace, name) would have two entries fighting over one object. #####
              {{ "{{hub-" }} $sig := (printf "%s/%s" $esNs $esName) {{ "hub}}" }}
              {{ "{{hub-" }} if and $ok (hasKey $expected $sig) {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q is declared twice in namespace %q; skipping the duplicate" $esName $esNs) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if $ok {{ "hub}}" }}
              {{ "{{hub-" }} $_ := set $expected $sig true {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ "{{hub" }} $esNs {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: {{ "{{hub" }} $esName {{ "hub}}" }}
                  namespace: {{ "{{hub" }} $esNs {{ "hub}}" }}
                  labels:
                    ##### The sweep below lists by this label; prune is baked at emission time so a #####
                    ##### later flip of the default does not retroactively change what gets deleted. #####
                    autoshift.io/eso-cluster-secret: "true"
                    autoshift.io/eso-prune: {{ "{{hub" }} $entryPrune | quote {{ "hub}}" }}
                spec:
                  secretStoreRef:
                    name: {{ "{{hub" }} $storeName {{ "hub}}" }}
                    kind: {{ "{{hub" }} $storeKind {{ "hub}}" }}
                  {{ "{{hub-" }} if hasKey $entry "refreshInterval" {{ "hub}}" }}
                  refreshInterval: {{ "{{hub" }} index $entry "refreshInterval" {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  ##### target defaults to the ExternalSecret's own name; an authored target wins verbatim. #####
                  target: {{ "{{hub" }} (index $entry "target" | default (dict "name" $esName "creationPolicy" "Owner")) | toRawJson {{ "hub}}" }}
                  {{ "{{hub-" }} if gt (len $data) 0 {{ "hub}}" }}
                  data: {{ "{{hub" }} $data | toRawJson {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  {{ "{{hub-" }} if gt (len $dataFrom) 0 {{ "hub}}" }}
                  dataFrom: {{ "{{hub" }} $dataFrom | toRawJson {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
            ##### SWEEP: only this policy labels ExternalSecrets autoshift.io/eso-cluster-secret, so any #####
            ##### labelled object not in the CURRENT expected set had its entry removed from config. Honour #####
            ##### the prune label baked on the object itself: false means leave it behind deliberately. #####
            ##### Guard on the CRD existing so this is a no-op before ESO is installed. #####
            ##### Hand the hub-computed expected set to the spoke side as JSON, the same way boot-store #####
            ##### passes $hubServer / $storeName across the two template passes. #####
            {{ "{{-" }} $expectedSet := (`{{ "{{hub" }} $expected | toRawJson {{ "hub}}" }}` | fromJson) {{ "}}" }}
            {{ "{{-" }} $sweepOn := `{{ "{{hub" }} if not $problems {{ "hub}}" }}1{{ "{{hub" }} end {{ "hub}}" }}` {{ "}}" }}
            {{ "{{-" }} if and (eq $sweepOn "1") (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "externalsecrets.external-secrets.io") {{ "}}" }}
            {{ "{{-" }} range $obj := ((lookup "external-secrets.io/v1" "ExternalSecret" "" "").items | default list) {{ "}}" }}
              {{ "{{-" }} $objLabels := (dig "metadata" "labels" (dict) $obj) {{ "}}" }}
              {{ "{{-" }} $objName := (dig "metadata" "name" "" $obj) {{ "}}" }}
              {{ "{{-" }} $objNs := (dig "metadata" "namespace" "" $obj) {{ "}}" }}
              {{ "{{-" }} if and (hasKey $objLabels "autoshift.io/eso-cluster-secret") (eq (index $objLabels "autoshift.io/eso-prune" | default "true") "true") (not (hasKey $expectedSet (printf "%s/%s" $objNs $objName))) {{ "}}" }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                metadata:
                  name: {{ "{{" }} $objName {{ "}}" }}
                  namespace: {{ "{{" }} $objNs {{ "}}" }}
              {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            ##### SURFACE problems as DATA, not as a template failure: a bad entry is reported here and #####
            ##### skipped, while the good entries are still provisioned. The inform gate below is the #####
            ##### compliance signal for it. #####
            {{ "{{hub-" }} if $problems {{ "hub}}" }}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-cluster-secrets-status
                  namespace: open-cluster-management-agent-addon
                  labels:
                    autoshift.io/eso-boot-status: "true"
                    autoshift.io/eso-boot-policy: eso-cluster-secrets
                data:
                  policy: eso-cluster-secrets
                  problemCount: {{ "{{hub" }} $problems | len | quote {{ "hub}}" }}
                  problems: |
                    {{ "{{hub-" }} range $p := $problems {{ "hub}}" }}
                    - {{ "{{hub" }} $p {{ "hub}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} else {{ "hub}}" }}
            ##### No problems: clear any stale status ConfigMap so the signal self-heals. #####
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-cluster-secrets-status
                  namespace: open-cluster-management-agent-addon
            {{ "{{hub-" }} end {{ "hub}}" }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: eso-cluster-secrets-gate
        spec:
          # inform GATE: the compliance proxy for the report above. It mutates nothing; it asserts the
          # status ConfigMap is ABSENT. Present (at least one entry was malformed) -> NonCompliant.
          # The valid entries are still provisioned by the enforce policy, so this flags "some entry is
          # misconfigured" without blocking the working ones.
          remediationAction: inform
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-cluster-secrets-status
                  namespace: open-cluster-management-agent-addon
{{- end }}
