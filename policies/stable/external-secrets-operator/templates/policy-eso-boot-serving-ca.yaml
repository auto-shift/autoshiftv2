{{- /*
  TWIN-COPY STRUCTURE (no Helm defines/includes — the upstream architecture is moving away from
  Helm, so the object-templates body is duplicated INLINE instead of single-sourced in a define):
  the body appears TWICE in this file:
    - live copy:  12-space indent, applied when diagnostics.debugRender is off
    - debug copy: 20-space indent, embedded as the text payload of the *-debug-render ConfigMap,
      so the target cluster resolves it and captures what WOULD be applied (nothing goes live)
  RULE: the two copies MUST stay byte-identical apart from the indentation. Debug/live divergence
  is handled INSIDE the shared body by hub-template `if $debug` conditionals (secret-material
  emissions swap to DEBUG placeholder text), never by editing one copy alone.
*/ -}}
# Serving-CA capture, hub-side. Placed ONLY on hub clusters (hubClusterSets). It resolves the
# CA that signs the hub apiserver's SERVING cert and stashes it as a ConfigMap in every tenancy
# namespace on THIS hub (this chart's policy namespace PLUS each unique
# autoshift.io/owning-namespace on local ManagedClusters), where the copy policy
# (policy-eso-boot-store.yaml) can read it with a hub template and ship it to the spokes.
# This is the client->server half of the mTLS trust (the spoke's store must trust the cert the
# hub apiserver presents).
#
# Why a separate policy that writes into tenancy namespaces:
#   - The apiserver serving cert lives in openshift-config / openshift-config-managed and the
#     APIServer config object — NONE of which the policy propagator may read. So the lookup CANNOT
#     be a hub template. Instead this whole policy is RUNTIME: it lands on the hub (which is self-
#     managing, or is an intermediate hub managed by a self-managed hub) and the LOCAL
#     config-policy-controller (cluster-admin) does the lookup on the cluster itself.
#   - It writes the result into each AutoShift policy namespace on this hub. boot-store then reads
#     with a hub template from ITS own policy namespace (hub templates ARE allowed to read that
#     namespace) and copies it to each spoke. In hub-of-hubs the global app places this policy onto
#     the site hub (Helm policy ns = global app) while leaf boot-store is rendered by the site app
#     (fromConfigMap uses the site app ns = the leaves' owning-namespace). Stashing into every
#     owning-namespace is what makes those two apps meet. Every hub still captures its OWN serving
#     CA locally; the copy only ever reads a policy namespace.
#
# Resolution (runtime, on the hub): if the hub apiserver serves a custom named certificate for its
# external apiserver host, trust that cert's chain (its openshift-config Secret, key tls.crt);
# otherwise fall back to the operator-managed serving CA bundle (the apiserver always serves
# something signed by an operator-managed signer, so that bundle is the safe default).
#
# Rotation note (named-cert path only): tls.crt is the leaf+intermediate chain, not the issuing CA,
# so the spoke effectively pins the current serving leaf. When that serving cert rotates, the spoke
# trusts the stale leaf until this policy re-stashes and the copy policy re-ships it (one evalInterval
# window), during which store reads can fail closed. The operator-managed fallback path stashes the
# real CA bundle and is rotation-clean. If the hub uses a stable custom CA, point hubCASource* at it.
#
{{- if $.Values.hubClusterSets }}
{{- $policyNamespace := $.Values.policy_namespace }}
{{- $eso := $.Values.externalSecretsOperator }}
{{- $hb := (default (dict) $eso.hubBootstrap) }}
{{- $storePrefix := (dig "storePrefix" "" $hb | default "hub-bootstrap") }}
{{- $servingCAConfigMap := (printf "%s-hub-ca" $storePrefix) }}
{{- /* Fallback serving-CA bundle (operator-managed) used when no custom named cert matches. */}}
{{- $caNamespace := ($eso.hubCASourceNamespace | default "openshift-config-managed") }}
{{- $caName := ($eso.hubCASourceName | default "kube-apiserver-server-ca") }}
{{- $caKey := ($eso.hubCASourceKey | default "ca-bundle.crt") }}
{{- /* Explicit decommission flag (config.eso.hubBootstrap.teardown / values hubBootstrap.teardown). */}}
{{- $defaultTeardown := (dig "teardown" "" $hb | default false) }}
{{- /* Diagnostics run modes (deployment-wide). readinessOnly: suppress this active policy entirely.
       debugRender: emit only a preview ConfigMap of what this policy WOULD apply (nothing live).
       debugRender wins, so previews still render under readinessOnly. */ -}}
{{- $readinessOnly := (dig "diagnostics" "readinessOnly" "" $hb | default false) }}
{{- $debugRender := (dig "diagnostics" "debugRender" "" $hb | default false) }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-eso-boot-serving-ca
  namespace: {{ $policyNamespace }}
  annotations:
    policy.open-cluster-management.io/description: 'Discover the hub apiserver serving CA at runtime (custom named cert or operator-managed bundle) and stash it in every tenancy namespace on this hub (Helm policy ns + each ManagedCluster owning-namespace) for delivery to spokes.'
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-17 Public Key Infrastructure Certificates
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  # Share the single hub-side precursor with the other hub boot policies. In external modes the gate is
  # Compliant immediately; in selfSigned it waits for cert-manager (already required for the hub mint),
  # so capturing the serving CA never races ahead of the rest of the hub bootstrap.
  dependencies:
    - name: policy-eso-boot-readiness-hub
      namespace: {{ $policyNamespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: eso-boot-serving-ca
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            #Indentation Anchor
            {{ "{{hub-" }} $debugCfg := (dig "data" "config" "" ((lookup "v1" "ConfigMap" "{{ $policyNamespace }}" (printf "%s.rendered-config" $.ManagedClusterName)) | default dict) | fromYaml | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $debug := (dig "eso" "hubBootstrap" "diagnostics" "debugRender" {{ $debugRender }} $debugCfg) {{ "hub}}" }}
            {{ "{{hub-" }} $readinessOnly := (dig "eso" "hubBootstrap" "diagnostics" "readinessOnly" {{ $readinessOnly }} $debugCfg) {{ "hub}}" }}
            {{ "{{hub-" }} if $debug {{ "hub}}" }}
            ##### DEBUG RENDER: applies nothing live; captures the full object stream this policy WOULD #####
            ##### apply (resolved on the target cluster) as text, for inspection. #####
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-boot-serving-ca-debug-render
                  namespace: {{ $policyNamespace }}
                  labels:
                    autoshift.io/eso-debug-render: "true"
                data:
                  rendered.yaml: |
                    ##### DERIVE (hub): the explicit teardown flag from THIS cluster's rendered config — a positive flag, #####
                    ##### never inferred from config absence, so a transient read miss can never trigger a teardown. #####
                    {{ "{{hub" }} $clusterConfig := (dig "data" "config" "" ((lookup "v1" "ConfigMap" "{{ $policyNamespace }}" (printf "%s.rendered-config" $.ManagedClusterName)) | default dict) | fromYaml | default dict) {{ "hub}}" }}
                    {{ "{{hub-" }} $teardown := (dig "eso" "hubBootstrap" "teardown" {{ $defaultTeardown }} $clusterConfig) {{ "hub}}" }}
                    {{ "{{-" }} $teardown := `{{ "{{hub" }} if $teardown {{ "hub}}" }}1{{ "{{hub" }} end {{ "hub}}" }}` {{ "}}" }}
                    ##### Tenancy namespaces to stash/remove: this chart's policy ns FIRST, then each unique #####
                    ##### autoshift.io/owning-namespace on THIS hub's ManagedClusters (cluster-labels) if not #####
                    ##### already present — a list so object-stream order is deterministic (map range is not). #####
                    ##### In hub-of-hubs the rendering app's ns (global) and the child app's ns (site) differ; #####
                    ##### boot-store fromConfigMap uses the child app ns. #####
                    {{ "{{-" }} $stashNs := list "{{ $policyNamespace }}" {{ "}}" }}
                    {{ "{{-" }} range $mc := ((lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items | default list) {{ "}}" }}
                      {{ "{{-" }} $own := (dig "metadata" "labels" "autoshift.io/owning-namespace" "" $mc) {{ "}}" }}
                      {{ "{{-" }} if and (ne $own "") (not (has $own $stashNs)) {{ "}}" }}{{ "{{-" }} $stashNs = append $stashNs $own {{ "}}" }}{{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} if eq $teardown "1" {{ "}}" }}
                    ##### TEARDOWN (explicit config.eso.hubBootstrap.teardown): remove the stashed serving-CA ConfigMap #####
                    ##### from every tenancy namespace we wrote it to. The copy policy skips its copies under the same flag. #####
                    {{ "{{-" }} range $ns := $stashNs {{ "}}" }}
                    - complianceType: mustnothave
                      objectDefinition:
                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: {{ $servingCAConfigMap }}
                          namespace: {{ "{{" }} $ns {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} else {{ "}}" }}
                    ##### RUNTIME (on the hub itself): resolve the hub apiserver serving CA #####
                    ##### prefer a custom named serving cert for the hub's external apiserver host; else the operator-managed CA #####
                    {{ "{{-" }} $apiserver := ((lookup "config.openshift.io/v1" "APIServer" "" "cluster") | default dict) {{ "}}" }}
                    {{ "{{-" }} $apiUrl := (fromClusterClaim "apiserverurl.openshift.io") {{ "}}" }}
                    {{ "{{-" }} $apiHost := (index (splitList ":" (replace "https://" "" $apiUrl)) 0) {{ "}}" }}
                    {{ "{{-" }} $caPEM := "" {{ "}}" }}
                    {{ "{{-" }} range $nc := (dig "spec" "servingCerts" "namedCertificates" list $apiserver) {{ "}}" }}
                      {{ "{{-" }} if has $apiHost ((index $nc "names") | default list) {{ "}}" }}
                        {{ "{{-" }} $ncSecret := (dig "servingCertificate" "name" "" $nc) {{ "}}" }}
                        {{ "{{-" }} if ne $ncSecret "" {{ "}}" }}
                          {{ "{{-" }} $caPEM = (fromSecret "openshift-config" $ncSecret "tls.crt" | base64dec) {{ "}}" }}
                        {{ "{{-" }} end {{ "}}" }}
                      {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} if eq $caPEM "" {{ "}}" }}
                      {{ "{{-" }} $caPEM = (fromConfigMap "{{ $caNamespace }}" "{{ $caName }}" "{{ $caKey }}") {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                    ##### STASH the serving CA into every tenancy namespace on THIS hub so each AutoShift #####
                    ##### app's boot-store can fromConfigMap it from its own policy namespace. #####
                    {{ "{{-" }} if ne $caPEM "" {{ "}}" }}
                    {{ "{{-" }} range $ns := $stashNs {{ "}}" }}
                    - complianceType: musthave
                      objectDefinition:
                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: {{ $servingCAConfigMap }}
                          namespace: {{ "{{" }} $ns {{ "}}" }}
                        data:
                          ca.crt: |
                            {{ "{{hub-" }} if $debug {{ "hub}}" }}
                            DEBUG would-read serving CA at runtime: named-cert Secret openshift-config/<servingCertificate.name> key tls.crt, else ConfigMap {{ $caNamespace }}/{{ $caName }} key {{ $caKey }}
                            {{ "{{hub-" }} else {{ "hub}}" }}
                            {{ "{{" }} $caPEM | autoindent {{ "}}" }}
                            {{ "{{hub-" }} end {{ "hub}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
            {{ "{{hub-" }} else {{ "hub}}" }}
            ##### debugRender OFF: clear any stale preview ConfigMap left by a previous debug run #####
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-boot-serving-ca-debug-render
                  namespace: {{ $policyNamespace }}
            {{ "{{hub-" }} if not $readinessOnly {{ "hub}}" }}
            ##### DERIVE (hub): the explicit teardown flag from THIS cluster's rendered config — a positive flag, #####
            ##### never inferred from config absence, so a transient read miss can never trigger a teardown. #####
            {{ "{{hub" }} $clusterConfig := (dig "data" "config" "" ((lookup "v1" "ConfigMap" "{{ $policyNamespace }}" (printf "%s.rendered-config" $.ManagedClusterName)) | default dict) | fromYaml | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $teardown := (dig "eso" "hubBootstrap" "teardown" {{ $defaultTeardown }} $clusterConfig) {{ "hub}}" }}
            {{ "{{-" }} $teardown := `{{ "{{hub" }} if $teardown {{ "hub}}" }}1{{ "{{hub" }} end {{ "hub}}" }}` {{ "}}" }}
            ##### Tenancy namespaces to stash/remove: this chart's policy ns FIRST, then each unique #####
            ##### autoshift.io/owning-namespace on THIS hub's ManagedClusters (cluster-labels) if not #####
            ##### already present — a list so object-stream order is deterministic (map range is not). #####
            ##### In hub-of-hubs the rendering app's ns (global) and the child app's ns (site) differ; #####
            ##### boot-store fromConfigMap uses the child app ns. #####
            {{ "{{-" }} $stashNs := list "{{ $policyNamespace }}" {{ "}}" }}
            {{ "{{-" }} range $mc := ((lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items | default list) {{ "}}" }}
              {{ "{{-" }} $own := (dig "metadata" "labels" "autoshift.io/owning-namespace" "" $mc) {{ "}}" }}
              {{ "{{-" }} if and (ne $own "") (not (has $own $stashNs)) {{ "}}" }}{{ "{{-" }} $stashNs = append $stashNs $own {{ "}}" }}{{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} if eq $teardown "1" {{ "}}" }}
            ##### TEARDOWN (explicit config.eso.hubBootstrap.teardown): remove the stashed serving-CA ConfigMap #####
            ##### from every tenancy namespace we wrote it to. The copy policy skips its copies under the same flag. #####
            {{ "{{-" }} range $ns := $stashNs {{ "}}" }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: {{ $servingCAConfigMap }}
                  namespace: {{ "{{" }} $ns {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} else {{ "}}" }}
            ##### RUNTIME (on the hub itself): resolve the hub apiserver serving CA #####
            ##### prefer a custom named serving cert for the hub's external apiserver host; else the operator-managed CA #####
            {{ "{{-" }} $apiserver := ((lookup "config.openshift.io/v1" "APIServer" "" "cluster") | default dict) {{ "}}" }}
            {{ "{{-" }} $apiUrl := (fromClusterClaim "apiserverurl.openshift.io") {{ "}}" }}
            {{ "{{-" }} $apiHost := (index (splitList ":" (replace "https://" "" $apiUrl)) 0) {{ "}}" }}
            {{ "{{-" }} $caPEM := "" {{ "}}" }}
            {{ "{{-" }} range $nc := (dig "spec" "servingCerts" "namedCertificates" list $apiserver) {{ "}}" }}
              {{ "{{-" }} if has $apiHost ((index $nc "names") | default list) {{ "}}" }}
                {{ "{{-" }} $ncSecret := (dig "servingCertificate" "name" "" $nc) {{ "}}" }}
                {{ "{{-" }} if ne $ncSecret "" {{ "}}" }}
                  {{ "{{-" }} $caPEM = (fromSecret "openshift-config" $ncSecret "tls.crt" | base64dec) {{ "}}" }}
                {{ "{{-" }} end {{ "}}" }}
              {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} if eq $caPEM "" {{ "}}" }}
              {{ "{{-" }} $caPEM = (fromConfigMap "{{ $caNamespace }}" "{{ $caName }}" "{{ $caKey }}") {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            ##### STASH the serving CA into every tenancy namespace on THIS hub so each AutoShift #####
            ##### app's boot-store can fromConfigMap it from its own policy namespace. #####
            {{ "{{-" }} if ne $caPEM "" {{ "}}" }}
            {{ "{{-" }} range $ns := $stashNs {{ "}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: {{ $servingCAConfigMap }}
                  namespace: {{ "{{" }} $ns {{ "}}" }}
                data:
                  ca.crt: |
                    {{ "{{hub-" }} if $debug {{ "hub}}" }}
                    DEBUG would-read serving CA at runtime: named-cert Secret openshift-config/<servingCertificate.name> key tls.crt, else ConfigMap {{ $caNamespace }}/{{ $caName }} key {{ $caKey }}
                    {{ "{{hub-" }} else {{ "hub}}" }}
                    {{ "{{" }} $caPEM | autoindent {{ "}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
{{ end }}
