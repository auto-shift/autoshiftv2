# Renders config.eso.pushSecrets into PushSecrets on whichever cluster the config lands on.
# storeRef names the provider (hub-bootstrap-writeback toward the parent, eso-vault on the
# global hub). The source Secret must already exist in the same namespace as the PushSecret.
#
# Config shape (per cluster, from the rendered-config ConfigMap):
#
#   config:
#     eso:
#       pushSecrets:
#         - name: kvm1-sa-token              # source Secret name on THIS cluster
#           namespace: eso-writeback         # omitted -> writebackNamespace (eso-writeback)
#           storeRef:
#             name: hub-bootstrap-writeback  # child/site: parent write-back store
#             # name: eso-vault              # global only
#           remoteKey: kvm1-sa-token         # omitted -> name
#           refreshInterval: 1h
#           data:                            # omitted -> push every key
#             - match:
#                 secretKey: token
#                 remoteRef:
#                   remoteKey: kvm1-sa-token
#                   property: token
#           stripServiceAccountTokenType: true  # see note below; requires data[].match.secretKey
#
# Hub-of-hubs is explicit: the producing cluster and each parent that must re-publish list
# the name. Site hubs re-publish names that arrived in their write-back namespace.
#
# stripServiceAccountTokenType (bool, default false): PushSecret has no field to override
# the destination Secret's type — the kubernetes-provider push always copies the SOURCE
# Secret's type verbatim, whole-secret or per-key alike. A source of type
# kubernetes.io/service-account-token therefore produces a same-typed destination Secret,
# and Kubernetes' own controller-manager garbage-collects any service-account-token Secret
# whose referenced ServiceAccount doesn't exist (by UID) in *that Secret's own namespace* —
# which it never will in a different cluster's/namespace's write-back target. The Secret is
# deleted moments after ESO creates it, repeatedly, with no error surfaced anywhere in this
# chart's own signals (see troubleshooting.md R11 cause 10).
#
# When true, this policy materializes an intermediate plain Opaque Secret named
# "<name>-opaque" in the same namespace, containing exactly the keys named by
# data[].match.secretKey (fromSecret runs on THIS cluster at apply time, so it works for any
# spoke — not just a self-managed hub), and points the PushSecret at that copy instead of the
# original. Requires at least one data[].match.secretKey entry: there is no way to discover
# key names for a whole-secret ("push every key") staging copy from hub-side config alone.
# Only meant for the narrow service-account-token case — leave unset for
# TLS/dockerconfigjson/etc. sources, where preserving the source type is correct and desired.
#
{{- if or $.Values.hubClusterSets $.Values.managedClusterSets }}
{{- $policyNamespace := $.Values.policy_namespace }}
{{- $esoNamespace := $.Values.externalSecretsOperator.namespace }}
{{- $writebackNamespace := (dig "hubBootstrap" "writebackNamespace" "eso-writeback" $.Values.externalSecretsOperator) }}
{{- $pruneDefault := true }}
{{- if hasKey $.Values.externalSecretsOperator "pruneRemovedStores" }}{{- $pruneDefault = $.Values.externalSecretsOperator.pruneRemovedStores }}{{- end }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-eso-cluster-push-secrets
  namespace: {{ $policyNamespace }}
  annotations:
    policy.open-cluster-management.io/description: 'Create the PushSecrets declared in config.eso.pushSecrets on each placed cluster; sweep entries that are removed from the list per their baked prune labels.'
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-12 Cryptographic Key Establishment and Management
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  dependencies:
    - name: policy-eso-install
      namespace: {{ $policyNamespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
    - name: policy-eso-boot-store
      namespace: {{ $policyNamespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: eso-cluster-push-secrets
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            #Indentation Anchor
            {{ "{{hub" }} $clusterConfig := (dig "data" "config" "" ((lookup "v1" "ConfigMap" "{{ $policyNamespace }}" (printf "%s.rendered-config" $.ManagedClusterName)) | default dict) | fromYaml | default dict) {{ "hub}}" }}
            {{ "{{hub" }} $clusterPrune := (dig "eso" "pruneRemovedStores" {{ $pruneDefault }} $clusterConfig) {{ "hub}}" }}
            {{ "{{hub-" }} $defaultNs := "{{ $writebackNamespace }}" {{ "hub}}" }}
            {{ "{{hub-" }} if hasKey (dig "eso" "hubBootstrap" (dict) $clusterConfig) "writebackNamespace" {{ "hub}}" }}{{ "{{hub-" }} $defaultNs = (printf "%v" (dig "eso" "hubBootstrap" "writebackNamespace" "" $clusterConfig)) {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} if eq $defaultNs "" {{ "hub}}" }}{{ "{{hub-" }} $defaultNs = "{{ $esoNamespace }}" {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub" }} $problems := list {{ "hub}}" }}
            {{ "{{hub" }} $expected := dict {{ "hub}}" }}
            {{ "{{hub" }} $entries := (dig "eso" "pushSecrets" (list) $clusterConfig) {{ "hub}}" }}
            {{ "{{hub-" }} range $idx, $entry := $entries {{ "hub}}" }}
              {{ "{{hub-" }} $entry = ($entry | default dict) {{ "hub}}" }}
              {{ "{{hub-" }} $psName := (index $entry "name" | default "") {{ "hub}}" }}
              {{ "{{hub-" }} $psNs := (index $entry "namespace" | default $defaultNs) {{ "hub}}" }}
              {{ "{{hub-" }} $storeRef := (index $entry "storeRef" | default dict) {{ "hub}}" }}
              {{ "{{hub-" }} $storeName := (index $storeRef "name" | default "") {{ "hub}}" }}
              {{ "{{hub-" }} if eq $storeName "" {{ "hub}}" }}{{ "{{hub-" }} $storeName = (printf "%v" (index $entry "secretStoreRef" | default "")) {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} $storeKind := (index $storeRef "kind" | default "ClusterSecretStore") {{ "hub}}" }}
              {{ "{{hub-" }} $remoteKey := (index $entry "remoteKey" | default $psName) {{ "hub}}" }}
              {{ "{{hub-" }} $data := (index $entry "data" | default list) {{ "hub}}" }}
              {{ "{{hub-" }} $stripSAToken := (index $entry "stripServiceAccountTokenType" | default false) {{ "hub}}" }}
              {{ "{{hub-" }} $stagingName := (printf "%s-opaque" $psName) {{ "hub}}" }}
              {{ "{{hub-" }} $stageKeys := list {{ "hub}}" }}
              {{ "{{hub-" }} range $d := $data {{ "hub}}" }}{{ "{{hub-" }} $dk := (dig "match" "secretKey" "" ($d | default dict)) {{ "hub}}" }}{{ "{{hub-" }} if ne $dk "" {{ "hub}}" }}{{ "{{hub-" }} $stageKeys = append $stageKeys $dk {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} $entryPrune := $clusterPrune {{ "hub}}" }}
              {{ "{{hub-" }} if hasKey $entry "prune" {{ "hub}}" }}{{ "{{hub-" }} $entryPrune = (index $entry "prune") {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} $ok := true {{ "hub}}" }}
              {{ "{{hub-" }} if eq $psName "" {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %v: name is required" $idx) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if eq $psNs "" {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q: namespace is required (where the source Secret lives on this cluster)" $psName) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if eq $storeName "" {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q: storeRef.name (or secretStoreRef) is required" $psName) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if and $stripSAToken (eq (len $stageKeys) 0) {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q: stripServiceAccountTokenType requires at least one data[].match.secretKey entry naming the key(s) to stage" $psName) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} $sig := (printf "%s/%s" $psNs $psName) {{ "hub}}" }}
              {{ "{{hub-" }} if and $ok (hasKey $expected $sig) {{ "hub}}" }}{{ "{{hub-" }} $problems = append $problems (printf "entry %q is declared twice in namespace %q; skipping the duplicate" $psName $psNs) {{ "hub}}" }}{{ "{{hub-" }} $ok = false {{ "hub}}" }}{{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} if $ok {{ "hub}}" }}
              {{ "{{hub-" }} $_ := set $expected $sig true {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ "{{hub" }} $psNs {{ "hub}}" }}
            {{ "{{hub-" }} if $stripSAToken {{ "hub}}" }}
            ##### Intermediate plain-Opaque copy of just the configured keys, sourced from THIS cluster's #####
            ##### own copy of the secret via the runtime (non-hub) fromSecret template — resolved by the #####
            ##### config-policy-controller on whichever cluster this ConfigurationPolicy lands on, i.e. #####
            ##### the same cluster the source Secret lives on, spoke or hub alike. See the #####
            ##### stripServiceAccountTokenType note at the top of this file. mustonlyhave: this object is #####
            ##### fully owned by this policy while the entry exists; like the PushSecret itself #####
            ##### (deletionPolicy: None), it is intentionally NOT swept if the entry is later removed — #####
            ##### labeled autoshift.io/eso-cluster-push-secret-staging for manual cleanup if needed. #####
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                type: Opaque
                metadata:
                  name: {{ "{{hub" }} $stagingName {{ "hub}}" }}
                  namespace: {{ "{{hub" }} $psNs {{ "hub}}" }}
                  labels:
                    autoshift.io/eso-cluster-push-secret-staging: "true"
                    autoshift.io/eso-prune: {{ "{{hub" }} $entryPrune | quote {{ "hub}}" }}
                data:
                  {{ "{{hub-" }} range $k := $stageKeys {{ "hub}}" }}
                  {{ "{{hub" }} $k {{ "hub}}" }}: '{{ "{{" }} fromSecret {{ "{{hub" }} printf "%q %q %q" $psNs $psName $k {{ "hub}}" }} {{ "}}" }}'
                  {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
            ##### mustonlyhave: musthave only merges list entries (docs/policy-behavior.md), so changing #####
            ##### data (e.g. switching from a whole-secret push to a secretKey/property extraction, or #####
            ##### changing remoteKey) would leave the OLD data entry alongside the new one instead of #####
            ##### replacing it — ESO would then push both, defeating the config change. spec here is #####
            ##### fully declared, so mustonlyhave is exact, not lossy. #####
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: external-secrets.io/v1alpha1
                kind: PushSecret
                metadata:
                  name: {{ "{{hub" }} $psName {{ "hub}}" }}
                  namespace: {{ "{{hub" }} $psNs {{ "hub}}" }}
                  labels:
                    autoshift.io/eso-cluster-push-secret: "true"
                    autoshift.io/eso-prune: {{ "{{hub" }} $entryPrune | quote {{ "hub}}" }}
                spec:
                  updatePolicy: Replace
                  deletionPolicy: None
                  secretStoreRefs:
                    - name: {{ "{{hub" }} $storeName {{ "hub}}" }}
                      kind: {{ "{{hub" }} $storeKind {{ "hub}}" }}
                  {{ "{{hub-" }} if hasKey $entry "refreshInterval" {{ "hub}}" }}
                  refreshInterval: {{ "{{hub" }} index $entry "refreshInterval" {{ "hub}}" }}
                  {{ "{{hub-" }} else {{ "hub}}" }}
                  refreshInterval: 1h
                  {{ "{{hub-" }} end {{ "hub}}" }}
                  selector:
                    secret:
                      {{ "{{hub-" }} if $stripSAToken {{ "hub}}" }}
                      name: {{ "{{hub" }} $stagingName {{ "hub}}" }}
                      {{ "{{hub-" }} else {{ "hub}}" }}
                      name: {{ "{{hub" }} $psName {{ "hub}}" }}
                      {{ "{{hub-" }} end {{ "hub}}" }}
                  {{ "{{hub-" }} if gt (len $data) 0 {{ "hub}}" }}
                  data: {{ "{{hub" }} $data | toRawJson {{ "hub}}" }}
                  {{ "{{hub-" }} else {{ "hub}}" }}
                  data:
                    - match:
                        remoteRef:
                          remoteKey: {{ "{{hub" }} $remoteKey {{ "hub}}" }}
                  {{ "{{hub-" }} end {{ "hub}}" }}
              {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{-" }} $expectedSet := (`{{ "{{hub" }} $expected | toRawJson {{ "hub}}" }}` | fromJson) {{ "}}" }}
            {{ "{{-" }} $sweepOn := `{{ "{{hub" }} if not $problems {{ "hub}}" }}1{{ "{{hub" }} end {{ "hub}}" }}` {{ "}}" }}
            {{ "{{-" }} if and (eq $sweepOn "1") (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "pushsecrets.external-secrets.io") {{ "}}" }}
            {{ "{{-" }} range $obj := ((lookup "external-secrets.io/v1alpha1" "PushSecret" "" "").items | default list) {{ "}}" }}
              {{ "{{-" }} $objLabels := (dig "metadata" "labels" (dict) $obj) {{ "}}" }}
              {{ "{{-" }} $objName := (dig "metadata" "name" "" $obj) {{ "}}" }}
              {{ "{{-" }} $objNs := (dig "metadata" "namespace" "" $obj) {{ "}}" }}
              {{ "{{-" }} if and (hasKey $objLabels "autoshift.io/eso-cluster-push-secret") (eq (index $objLabels "autoshift.io/eso-prune" | default "true") "true") (not (hasKey $expectedSet (printf "%s/%s" $objNs $objName))) {{ "}}" }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: external-secrets.io/v1alpha1
                kind: PushSecret
                metadata:
                  name: {{ "{{" }} $objName {{ "}}" }}
                  namespace: {{ "{{" }} $objNs {{ "}}" }}
              {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{hub-" }} if $problems {{ "hub}}" }}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-cluster-push-secrets-status
                  namespace: open-cluster-management-agent-addon
                  labels:
                    autoshift.io/eso-boot-status: "true"
                    autoshift.io/eso-boot-policy: eso-cluster-push-secrets
                data:
                  policy: eso-cluster-push-secrets
                  problemCount: {{ "{{hub" }} $problems | len | quote {{ "hub}}" }}
                  problems: |
                    {{ "{{hub-" }} range $p := $problems {{ "hub}}" }}
                    - {{ "{{hub" }} $p {{ "hub}}" }}
                    {{ "{{hub-" }} end {{ "hub}}" }}
            {{ "{{hub-" }} else {{ "hub}}" }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-cluster-push-secrets-status
                  namespace: open-cluster-management-agent-addon
            {{ "{{hub-" }} end {{ "hub}}" }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: eso-cluster-push-secrets-gate
        spec:
          remediationAction: inform
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: eso-cluster-push-secrets-status
                  namespace: open-cluster-management-agent-addon
{{- end }}
