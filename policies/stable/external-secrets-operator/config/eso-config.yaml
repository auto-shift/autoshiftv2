# The singleton ExternalSecretsConfig that actually deploys the controller.
#
# Installing the operator is not enough. Without this resource the operator runs its own manager and
# deploys NO external-secrets controller or webhook pods at all, so every SecretStore stays unready
# and every ExternalSecret reports "could not get secret data from provider". The failure looks like
# a store misconfiguration rather than a missing controller, which is why it is worth stating.
#
# The custom resource definition only exists once the operator has reconciled, so this stays
# NonCompliant and retrying until then. That is expected on a fresh cluster, not a fault.
#
# EGRESS IS CONFIGURED HERE, NOT AS A SEPARATE NETWORK POLICY. The operator applies a deny-all
# egress policy to its own operands and opens only 6443 and DNS, so a store provider on any other
# port times out. Measured: a store pointed at an in-cluster service on 8443 failed with
# "InvalidProviderConfig ... dial tcp <ip>:8443: i/o timeout", which names neither TLS nor network
# policy and reads like a certificate problem.
#
#   443  covers the common provider port -- Vault, the cloud secret managers, anything behind a
#        Route.
#   8443 covers the SPIRE bundle endpoint, which the ztwim federation policy fetches through a
#        SecretStore to seed federated trust domains.
#
# A per-cluster overlay at config.eso.externalSecretsConfig is deep-merged OVER the defaults below,
# so any field the custom resource definition supports can be set without touching this file. Two
# merge behaviours to know, both inherited from sprig and both able to surprise:
#   - LISTS REPLACE WHOLESALE. An overlay that sets networkPolicies drops both rules above unless it
#     restates them.
#   - A ZERO VALUE in the overlay (0, false, "") cannot override a non-zero default, because the
#     merge treats zeros as empty and refills them. Set those at the level that needs them.
#
# RECONCILIATION NOTE. The eso-rework-merge branch carries this same resource as a Helm template in
# policy-eso-install.yaml, with the defaults in that chart's values under
# externalSecretsOperator.externalSecretsConfig. The spec and the overlay mechanism are deliberately
# identical here so the two can be reconciled by deleting one of them; the only intended difference
# is the 8443 rule, which that branch does not carry because federation does not live there.
object-templates-raw: |
  {{hub- $cfg := (index (index (index ((lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict) "data" | default dict) "config" | default "" | fromYaml | default dict) "eso" | default dict) hub}}
  {{hub- $overlay := (index $cfg "externalSecretsConfig" | default dict) hub}}
  {{hub- $base := fromJson `{"appConfig":{"logLevel":1,"webhookConfig":{"certificateCheckInterval":"5m0s"}},"controllerConfig":{"networkPolicies":[{"name":"allow-https-egress","componentName":"ExternalSecretsCoreController","egress":[{"ports":[{"protocol":"TCP","port":443}]}]},{"name":"allow-spire-bundle-egress","componentName":"ExternalSecretsCoreController","egress":[{"ports":[{"protocol":"TCP","port":8443}]}]}]},"plugins":{"bitwardenSecretManagerProvider":{"mode":"Disabled"}}}` hub}}
  {{hub- $spec := (merge $overlay $base) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: operator.openshift.io/v1alpha1
      kind: ExternalSecretsConfig
      metadata:
        name: cluster
        labels:
          app: external-secrets-operator
      # Guarded so the block does not END on a toLiteral expression. Ending on one swallows the
      # trailing newline and PolicyGenerator's next key is appended to the same line, producing
      # `spec: {...}remediationAction: enforce`. The guard is always satisfied; it exists to leave a
      # control line last.
      {{hub- if $spec hub}}
      spec: {{hub $spec | toRawJson | toLiteral hub}}
      {{hub- end hub}}
