# Deploys the External Secrets controllers. The Subscription alone installs the operator but leaves it
# idle — without this singleton `cluster` CR, ExternalSecrets never reconcile (empty status). The egress
# NetworkPolicy lets the core controller reach the Kubernetes API (required by kubernetes-provider
# SecretStores).
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  labels:
    app: external-secrets-operator
    app.kubernetes.io/name: cluster
spec:
  controllerConfig:
    networkPolicies:
      - componentName: ExternalSecretsCoreController
        name: allow-external-secrets-egress
        egress:
          - {}
