# Readiness gate: the three Deployments the Vertical Pod Autoscaler Operator creates for its default
# VerticalPodAutoscalerController are Available. The admission plugin is the one that matters most:
# Initial and Auto modes set pod resources through it, so without it a VerticalPodAutoscaler is
# accepted and does nothing. Wrapped by PG into musthave ConfigurationPolicies; its PG policy entry is
# remediationAction: inform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-admission-plugin-default
  namespace: openshift-vertical-pod-autoscaler
status:
  conditions:
    - type: Available
      status: 'True'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-recommender-default
  namespace: openshift-vertical-pod-autoscaler
status:
  conditions:
    - type: Available
      status: 'True'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-updater-default
  namespace: openshift-vertical-pod-autoscaler
status:
  conditions:
    - type: Available
      status: 'True'
