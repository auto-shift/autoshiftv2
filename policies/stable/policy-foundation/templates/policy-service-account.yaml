---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: autoshift-policy-service-account
  namespace: {{ .Values.policy_namespace }}
---
# This account exists so a policy's hub templates can look up objects outside their own namespace.
# Hub templates cannot write: lookup, fromSecret and fromConfigMap are the only things it is used
# for. It previously held cluster-admin, which granted write and delete on everything in order to
# perform get, list and watch on a handful of kinds.
#
# cluster-reader is the built-in read-only role and already covers custom resources, so a policy
# that starts looking up a new kind keeps working. It deliberately excludes Secrets, which is why
# the narrow role below exists: those are the one sensitive read, granted explicitly rather than
# buried inside cluster-admin.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: autoshift-policy-cluster-reader-{{ .Values.policy_namespace }}
subjects:
  - kind: ServiceAccount
    name: autoshift-policy-service-account
    namespace: {{ .Values.policy_namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
---
# Secrets are read by the Red Hat Advanced Cluster Security, Quay, GitLab and Vault policies, which
# reference credentials created out of band. The namespaces come from configuration, so this cannot
# be narrowed to a fixed list without breaking those policies.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: autoshift-policy-secret-reader
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
# Named differently from the old autoshift-policy-service-account-rb-* binding on purpose. A
# ClusterRoleBinding roleRef is immutable, so reusing that name would fail every upgrade with
# "cannot change roleRef". Under new names the old binding is pruned and these are created.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: autoshift-policy-secret-reader-{{ .Values.policy_namespace }}
subjects:
  - kind: ServiceAccount
    name: autoshift-policy-service-account
    namespace: {{ .Values.policy_namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autoshift-policy-secret-reader
