apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-cert-manager-ingress-cert
  namespace: ${POLICY_NAMESPACE}
spec:
  # Opt-in: cert-manager-managed default Ingress wildcard cert (replaces *.apps). Higher blast radius —
  # gate separately from the API cert.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/cert-manager'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/cert-manager-ingress-cert'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
