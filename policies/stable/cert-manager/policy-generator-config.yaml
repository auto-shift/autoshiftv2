apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: cert-manager
# Per-deployment scalars (${...}) are substituted by the repo-server CMP (envsubst/sed) BEFORE
# `kustomize build` runs. They live here and in placement.yaml — never in manifests/, whose hub
# templates contain `$vars` that substitution would clobber.
#
# manifests[].path is a DIRECTORY: drop a new manifest into manifests/ and it is picked up
# automatically — no edit to this file needed. Only edit this file to change the policy graph
# itself (names, dependencies, per-policy remediation). Keep placement.yaml OUT of manifests/
# (a Placement inside a wildcarded dir would be wrapped into the Policy as a managed object).
placementBindingDefaults:
  name: binding-policy-cert-manager
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: high
  # Consolidate the raw Namespace into one generated ConfigurationPolicy; the first-class
  # OperatorPolicy stays its own policy-template. Net: one Policy, two policy-templates.
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - ${POLICY_STANDARD}
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  # Placement authored by us (placement.yaml at the dir root, full fidelity); PG includes it and
  # generates only the PlacementBinding.
  placement:
    placementPath: placement.yaml
policies:
  - name: policy-cert-manager-operator-install
    manifests:
      - path: manifests
  # AutoShift's built-in CA (autoshift-ca ClusterIssuer) — default TLS issuer where cert-manager is on.
  # Signer is a ref (config.certManager.ca.issuer): default self-signed root, or point at your own
  # issuer to make autoshift-ca an intermediate. Opt out per cluster with cert-manager-ca: 'false' (via the
  # placement). Per-cluster CA (no key sharing); Vault cross-cluster transit trusts the hub CA public cert.
  - name: policy-cert-manager-ca
    placement:
      placementPath: placement-cert-manager-ca.yaml
    # object-templates-raw (conditional signer) — its own ConfigurationPolicy, don't consolidate.
    consolidateManifests: false
    dependencies:
      - name: policy-cert-manager-operator-install
    manifests:
      - path: manifests/ca
  # Opt-in (cert-manager-issuers): ClusterIssuers from config.certManager.issuers (any issuer type; spec
  # passed through), plus cert-manager controller args from config.certManager.controller.overrideArgs.
  # Point config.certManager.{apiCert,ingressCert}.issuer.name at an issuer created here.
  - name: policy-cert-manager-issuers
    placement:
      placementPath: placement-cert-manager-issuers.yaml
    consolidateManifests: false
    # None: disabling the policy must not delete issuers that Certificates depend on.
    pruneObjectBehavior: None
    dependencies:
      - name: policy-cert-manager-operator-install
    manifests:
      - path: manifests/issuers
    # A fail on the managed cluster reports the whole ConfigurationPolicy as JSON before its text.
    # Strip that so the message reads as the reason. Messages without a fail pass through unchanged.
    customMessage:
      noncompliant: '{{ regexReplaceAll "(?s).*error calling fail: " .DefaultMessage "" | trim }}'
  # inform: each issuer is Ready, which for ACME means the account registered (catches a bad EAB key).
  # No dependency on policy-cert-manager-issuers: a broken issuer is exactly when this check matters.
  - name: policy-cert-manager-issuers-ready
    placement:
      placementPath: placement-cert-manager-issuers.yaml
    remediationAction: inform
    manifests:
      - path: test/issuers-ready.yaml
  # Opt-in (cert-manager-api-cert): cert-manager-managed API server serving cert. ADDITIVE namedCertificate
  # (SNI, api.<domain> only — never api-int). Only patches APIServer once the Certificate is Ready (gated in
  # the manifest). object-templates-raw -> consolidateManifests: false.
  - name: policy-cert-manager-api-cert
    placement:
      placementPath: placement-cert-manager-api-cert.yaml
    consolidateManifests: false
    dependencies:
      - name: policy-cert-manager-ca
    manifests:
      - path: manifests/api-cert
  # inform: surfaces the api-cert Certificate NOT being Ready (fallback visibility).
  - name: policy-cert-manager-api-cert-ready
    placement:
      placementPath: placement-cert-manager-api-cert.yaml
    remediationAction: inform
    dependencies:
      - name: policy-cert-manager-api-cert
    manifests:
      - path: test/api-cert-ready.yaml
  # Opt-in (cert-manager-ingress-cert): cert-manager-managed default Ingress wildcard cert. REPLACES *.apps
  # (higher blast radius). Only patches IngressController once the Certificate is Ready (gated in the manifest).
  - name: policy-cert-manager-ingress-cert
    placement:
      placementPath: placement-cert-manager-ingress-cert.yaml
    consolidateManifests: false
    dependencies:
      - name: policy-cert-manager-ca
    manifests:
      - path: manifests/ingress-cert
  # inform: surfaces the ingress-cert Certificate NOT being Ready (fallback visibility).
  - name: policy-cert-manager-ingress-cert-ready
    placement:
      placementPath: placement-cert-manager-ingress-cert.yaml
    remediationAction: inform
    dependencies:
      - name: policy-cert-manager-ingress-cert
    manifests:
      - path: test/ingress-cert-ready.yaml
