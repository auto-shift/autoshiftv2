# Inform-only: Compliant once the Argo CD agent signing CA is Ready.
#
# This is the backstop for the 80% rule described in manifests/gitops-agent-ca/. If issuance fails,
# or renewal stalls, or the certificate was delivered out of band and nobody renewed it, the
# GitOpsCluster controller eventually overwrites the secret with a self-signed certificate authority
# of its own and every chain to the customer root is broken without an error anywhere. A failing
# certificate surfacing as NonCompliant is the warning that arrives before that happens.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-ca
  namespace: '{{hub index .ManagedClusterLabels "autoshift.io/gitops-namespace" | default "openshift-gitops" hub}}'
status:
  conditions:
    - type: Ready
      status: 'True'
