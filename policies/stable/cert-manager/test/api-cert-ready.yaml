# Inform-only: Compliant once the api-cert Certificate is Ready. Fallback visibility — a failing or
# expiring API cert surfaces as NonCompliant instead of silently degrading.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-api-cert
  namespace: openshift-config
status:
  conditions:
    - type: Ready
      status: 'True'
