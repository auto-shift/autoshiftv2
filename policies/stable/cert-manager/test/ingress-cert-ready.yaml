# Inform-only: Compliant once the ingress-cert Certificate is Ready. Fallback visibility — a failing or
# expiring Ingress cert surfaces as NonCompliant instead of silently degrading.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-ingress-cert
  namespace: openshift-ingress
status:
  conditions:
    - type: Ready
      status: 'True'
