object-templates-raw: |
  {{- /* Inform-only existence check: autoshift.io/openshift-version must appear in
         ClusterVersion.status.availableUpdates with a release image. The enforce policy
         reads that same image; without this gate it would set upstream and look Compliant
         while never starting the upgrade. Already-at-target is Compliant (no upgrade). */ -}}
  {{- $target := "{{hub index .ManagedClusterLabels "autoshift.io/openshift-version" | default "" hub}}" }}
  {{- $status := (index (lookup "config.openshift.io/v1" "ClusterVersion" "" "version" | default dict) "status" | default dict) }}
  {{- $current := "" }}
  {{- range $h := (index $status "history" | default list) }}
  {{-   if and (eq $current "") (eq (index $h "state") "Completed") }}{{- $current = (index $h "version") }}{{- end }}
  {{- end }}
  {{- $found := false }}
  {{- range $u := (index $status "availableUpdates" | default list) }}
  {{-   if and (eq (index $u "version") $target) (ne (index $u "image" | default "") "") }}{{- $found = true }}{{- end }}
  {{- end }}
  {{- $done := false }}
  {{- if regexMatch "^[0-9]+[.][0-9]+[.][0-9]+" $target }}
  {{-   $done = and (ne $current "") (semverCompare (printf ">= %s" $target) $current) }}
  {{- end }}
  {{- /* Unconstructible Deployment: metadata only is invalid, so an enforce override of this
         inform policy cannot create it, and cannot delete ClusterVersion. customMessage is the
         operator-visible error. */ -}}
  {{- if or (eq $target "") (and (not $done) (not $found)) }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openshift-upgrade-version-not-available
        namespace: openshift-cluster-version
  {{- end }}
