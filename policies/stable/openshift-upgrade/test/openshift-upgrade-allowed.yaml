object-templates-raw: |
  {{- /* Inform gate. autoshift.io/openshift-version must appear in
         ClusterVersion.status.availableUpdates with a release image. Already-at-target
         is Compliant. A Recommended False conditional update is reported by
         openshift-upgrade-allowed-conditional, so this gate stays Compliant in that case. */ -}}
  {{- $target := "{{hub index .ManagedClusterLabels "autoshift.io/openshift-version" | default "" hub}}" }}
  {{- $status := (index (lookup "config.openshift.io/v1" "ClusterVersion" "" "version" | default dict) "status" | default dict) }}
  {{- $current := "" }}
  {{- range $h := (index $status "history" | default list) }}
  {{-   if and (eq $current "") (eq (index $h "state") "Completed") }}{{- $current = (index $h "version") }}{{- end }}
  {{- end }}
  {{- $found := false }}
  {{- range $u := (index $status "availableUpdates" | default list) }}
  {{-   if and (eq (index $u "version") $target) (ne (index $u "image" | default "") "") }}{{- $found = true }}{{- end }}
  {{- end }}
  {{- $done := false }}
  {{- if regexMatch "^[0-9]+[.][0-9]+[.][0-9]+" $target }}
  {{-   $done = and (ne $current "") (semverCompare (printf ">= %s" $target) $current) }}
  {{- end }}
  {{- $conditional := false }}
  {{- if and (ne $target "") (not $done) (not $found) }}
  {{-   range $u := (index $status "conditionalUpdates" | default list) }}
  {{-     $rel := (index $u "release" | default dict) }}
  {{-     if and (not $conditional) (eq (printf "%v" (index $rel "version" | default "") | trim) $target) }}
  {{-       $conditional = true }}
  {{-     end }}
  {{-   end }}
  {{- end }}
  {{- /* Validity is decided in Go (reliable). When invalid, force NonCompliant with a mustnothave on
         the ClusterVersion (which always exists) — a scalar existence check, not status-list matching.
         A version listed under status.conditionalUpdates is a different ConfigurationPolicy,
         so this message is only the plain miss. */ -}}
  {{- if or (eq $target "") (and (not $done) (not $found) (not $conditional)) }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: config.openshift.io/v1
      kind: ClusterVersion
      metadata:
        name: version
  {{- end }}
