apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: openshift-upgrade
# Multiple policies share one placement, so the binding must be named.
placementBindingDefaults:
  name: binding-policy-openshift-upgrade
# Day-2 OpenShift upgrade, staged: set the channel, assert openshift-version exists in
# availableUpdates (inform, clear error), drive the ClusterVersion once it validates, and
# report completion (inform). A cluster upgrades when it lands in a clusterset whose
# openshift-version is higher than its current version; blast radius is controlled by
# clusterset membership (roll out in waves). See docs/ocp-upgrade.md.
#
# Design note: the inform checks decide Compliant/NonCompliant in Go template logic and force
# NonCompliant with a mustnothave on the ClusterVersion (an object that always exists) — ACM does not
# reliably match status lists (conditions/history/availableUpdates), so those are never asserted.
# Failure visibility for an in-flight upgrade comes from OpenShift's own upgrade alerts, not a
# (flappy) policy check.
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  placement:
    placementPath: placement.yaml
policies:
  # 1. Channel (enforce, unconditional) — so availableUpdates recomputes for the desired channel and
  #    the y-stream case can't deadlock the dependency below.
  - name: policy-openshift-upgrade-channel
    manifests:
      - path: manifests/channel.yaml

  # 2. Version-exists check (inform) — ClusterVersion.status.availableUpdates must list
  #    openshift-version with a release image (the same lookup the enforce policy uses).
  #    Depends on the channel so availableUpdates has recomputed before this runs.
  - name: policy-openshift-upgrade-allowed
    remediationAction: inform
    dependencies:
      - name: policy-openshift-upgrade-channel
    manifests:
      - path: test/openshift-upgrade-allowed.yaml
    customMessage:
      noncompliant: >
        openshift-version '{{hub index .ManagedClusterLabels "autoshift.io/openshift-version" hub}}'
        is missing or is not in ClusterVersion status.availableUpdates with a release image on
        channel '{{hub index .ManagedClusterLabels "autoshift.io/openshift-upgrade-channel" | default "stable-4.22" hub}}'.
        policy-openshift-upgrade will not start until this is Compliant. Check the
        autoshift.io/openshift-version label, the channel, and the cluster's available updates.

  # 3. The upgrade (enforce) — sets upstream + desiredUpdate (unless already Progressing). Blocked
  #    until the target exists in availableUpdates (dependency on the allowed check).
  - name: policy-openshift-upgrade
    dependencies:
      - name: policy-openshift-upgrade-allowed
      - name: policy-openshift-upgrade-channel
    manifests:
      - path: manifests/clusterversion.yaml

  # 4. Completion status (inform) — Compliant once the cluster has reached the target version
  #    (latest Completed history >= target). Non-flapping; this is the wave-rollout gate.
  - name: policy-openshift-upgrade-status
    remediationAction: inform
    manifests:
      - path: test/openshift-upgrade-status.yaml
    customMessage:
      noncompliant: >
        Cluster has not yet reached openshift-version
        '{{hub index .ManagedClusterLabels "autoshift.io/openshift-version" hub}}' — upgrade in progress or
        pending. Check Governance / the OpenShift console for progress and any upgrade alerts.
