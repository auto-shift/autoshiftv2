apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: acm-backup
# Red Hat Advanced Cluster Management hub disaster recovery: the cluster backup and restore
# operator, backed by OpenShift APIs for Data Protection and Velero.
#
# Layout convention:
#   manifests/ — desired state to APPLY; respects dry-run via remediationAction: ${REMEDIATION}
#   test/      — assertions to OBSERVE (readiness/status); ALWAYS remediationAction: inform
# Per-deployment scalars (${...}) are substituted by the repo-server CMP BEFORE `kustomize build`.
# They live only in this file and the placement-*.yaml files.
#
# The autoshift.io/acm-backup label is the mode, and its values are the keys of the mode-specific
# blocks in config.acm-backup:
#   active   — this hub writes the backups. Gets the BackupSchedule. config.acm-backup.active
#   passive  — this hub is the standby. Gets the sync Restore.    config.acm-backup.passive
#   false    — no hub disaster recovery on this cluster.
# Both modes get the object store and the DataProtectionApplication, because the standby reads the
# same bucket the active hub writes.
#
# Mode is enforced at the PLACEMENT, never inside a template. A template conditional that renders
# nothing leaves an empty ConfigurationPolicy, and an empty ConfigurationPolicy reports Compliant —
# which for a backup policy means a hub silently backing up nothing.
placementBindingDefaults:
  name: binding-policy-acm-backup
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CP Contingency Planning
  controls:
    - CP-9 System Backup
  # Default placement: hubs in either mode. Mode-specific policies override below.
  placement:
    placementPath: placement-acm-backup.yaml
policies:
  # 1) Object store + DataProtectionApplication. Both modes.
  #    Depends on the MultiClusterHub policy because the cluster-backup component is what creates
  #    the open-cluster-management-backup namespace and installs OpenShift APIs for Data Protection.
  #    Cross-directory dependency, but same namespace and same cluster, so it resolves.
  - name: policy-acm-backup-storage
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-acm-mch-install
        namespace: ${POLICY_NAMESPACE}
    manifests:
      - path: manifests/storage/acm-backup-storage.yaml
  # 1-test) Storage readiness (status observation → inform, its own Policy in test/).
  - name: policy-acm-backup-storage-test
    remediationAction: inform
    dependencies:
      - name: policy-acm-backup-storage
    manifests:
      - path: test/acm-backup-storage-ready.yaml
    customMessage:
      noncompliant: >-
        The backup storage location is not Available. Velero cannot write hub backups until it is,
        so this hub currently has no disaster recovery. Check the DataProtectionApplication in
        open-cluster-management-backup, the bucket named by config.acm-backup.storage, and the
        credentials Secret it references.
  # 2) BackupSchedule — ACTIVE hub only, by placement.
  - name: policy-acm-backup-schedule
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    placement:
      placementPath: placement-acm-backup-active.yaml
    dependencies:
      - name: policy-acm-backup-storage-test
    manifests:
      - path: manifests/schedule/acm-backup-schedule.yaml
  # 2-test) Schedule readiness. Catches BackupCollision, which stops backups on BOTH hubs.
  - name: policy-acm-backup-schedule-test
    remediationAction: inform
    placement:
      placementPath: placement-acm-backup-active.yaml
    dependencies:
      - name: policy-acm-backup-schedule
    manifests:
      - path: test/acm-backup-schedule-ready.yaml
    customMessage:
      noncompliant: >-
        The BackupSchedule is not Enabled. A phase of BackupCollision means another hub is writing
        to the same storage location and backups have stopped on both; FailedValidation usually
        means the cron expression or the storage location is wrong.
  # 3) Passive-sync Restore — STANDBY hub only, by placement.
  - name: policy-acm-backup-restore
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    placement:
      placementPath: placement-acm-backup-passive.yaml
    dependencies:
      - name: policy-acm-backup-storage-test
    manifests:
      - path: manifests/restore/acm-backup-restore.yaml
  # 3-test) Sync readiness. Enabled is the steady state for a syncing Restore.
  - name: policy-acm-backup-restore-test
    remediationAction: inform
    placement:
      placementPath: placement-acm-backup-passive.yaml
    dependencies:
      - name: policy-acm-backup-restore
    manifests:
      - path: test/acm-backup-restore-ready.yaml
    customMessage:
      noncompliant: >-
        The standby hub is not syncing from the backup storage location, so it is not a usable
        recovery target. Check that it reads the same bucket as the active hub and that the
        credentials Secret exists in open-cluster-management-backup.
