apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-acm-backup-active
  namespace: ${POLICY_NAMESPACE}
spec:
  # The BackupSchedule, and ONLY on the active hub. Two hubs scheduling backups into one storage
  # location put both BackupSchedules into BackupCollision and stop backups on both, so the standby
  # is excluded here at the placement rather than inside a template: a template conditional that
  # renders nothing would leave an empty ConfigurationPolicy reporting Compliant.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/cluster-type'
              operator: In
              values:
                - 'hub'
            - key: 'autoshift.io/acm-backup'
              operator: In
              values:
                - 'active'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
