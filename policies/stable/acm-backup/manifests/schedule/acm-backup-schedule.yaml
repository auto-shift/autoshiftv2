# The backup schedule, on the ACTIVE hub only. Creates the schedule.velero.io resources; check
# them with `oc get schedules -A | grep acm`.
#
# Placement, not a template conditional, keeps this off the standby: two hubs scheduling into one
# storage location put both BackupSchedules into BackupCollision and stop backups on both.
#
# Entirely hub-side. Every value comes from config.acm-backup.active, which lives in the policy
# namespace on the hub, so the object is built there and arrives resolved. Nothing here reads an
# object on the target cluster.
object-templates-raw: |
  # INDENTATION ANCHOR
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $bk := (index $rcmConfig "acm-backup" | default dict) hub}}
  {{hub- $active := (index $bk "active" | default dict) hub}}
  {{hub- $schedule := (index $active "veleroSchedule" | default "0 */2 * * *") hub}}
  {{hub- if (empty $schedule) hub}}
  {{hub- fail "acm-backup: config.acm-backup.active.veleroSchedule is required on an active hub. A BackupSchedule with no cron expression never produces a backup." hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: cluster.open-cluster-management.io/v1beta1
      kind: BackupSchedule
      metadata:
        name: acm-backup-schedule
        namespace: open-cluster-management-backup
      spec:
        # Both durations stay quoted. A cron expression beginning with an asterisk is a YAML alias
        # when unquoted, and the whole policy then fails to render with
        # "did not find expected alphabetic or numeric character".
        veleroSchedule: '{{hub $schedule hub}}'
        veleroTtl: '{{hub index $active "veleroTtl" | default "720h" hub}}'
        useManagedServiceAccount: {{hub index $active "useManagedServiceAccount" | default "true" hub}}
