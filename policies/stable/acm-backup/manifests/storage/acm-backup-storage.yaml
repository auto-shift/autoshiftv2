# The object store the hub backups are written to, and the OADP DataProtectionApplication that
# points Velero at it. Both sides of an active/passive pair get this: the standby reads the same
# bucket the active hub writes.
#
# config.acm-backup.storage.type names the object store, and the Velero provider and plugin follow
# from it:
#   s3    Amazon Simple Storage Service, or ANY S3-compatible store reached through
#         storage.endpoint: NetApp StorageGRID, Pure Storage FlashBlade, Dell ECS, MinIO,
#         Ceph RADOS Gateway, Wasabi. Velero provider aws.
#   azure Azure Blob Storage. Velero provider azure. Needs storage.azure.
#   gcp   Google Cloud Storage. Velero provider gcp.
#   obc   an ObjectBucketClaim against the local ODF NooBaa, which is S3, so provider aws.
#         Lab and sandbox only: a bucket that lives on the hub cannot survive the hub, which is
#         the exact failure this policy exists to cover.
#
# Enumerating vendors would mean predicting each one's quirks, so it is deliberately not done.
# storage.config is a free-form map merged LAST into the Velero config, and storage.provider and
# storage.plugins override the derived values, so an appliance nobody here has seen is still
# configurable from values alone. The common case: some S3-compatible stores reject Velero's
# newer checksum headers and need checksumAlgorithm set to an empty string.
#
# Credentials are never in values. Every backend except obc reads a Secret created out of band and
# named through configSecretRef; obc derives its own from the claim.
#
# The OBC branch always emits the claim itself, so the ConfigurationPolicy is never empty while the
# bucket is still binding — an empty ConfigurationPolicy reports Compliant and would hide a hub
# with no backup storage at all.
object-templates-raw: |
  # INDENTATION ANCHOR — every directive below sits at this indent. A shallower trim marker eats
  # past the newline into the previous line and produces invalid YAML.
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $bk := (index $rcmConfig "acm-backup" | default dict) hub}}
  {{hub- $store := (index $bk "storage" | default dict) hub}}
  {{hub- $credRef := (index $store "configSecretRef" | default dict) hub}}
  {{hub- $azure := (index $store "azure" | default dict) hub}}
  {{hub- $caRef := (index $store "caRef" | default dict) hub}}
  {{hub- $hubCa := "" hub}}
  {{hub- if not (empty $caRef) hub}}
  {{hub- $caCM := (lookup "v1" "ConfigMap" (index $caRef "namespace" | default .PolicyMetadata.namespace) (index $caRef "name")) | default dict hub}}
  {{hub- $hubCa = (index ($caCM.data | default dict) (index $caRef "key") | default "") hub}}
  {{hub- end hub}}
  #
  {{- /* Hub-side scalars hoisted into spoke variables, so the branching below is plain spoke
         templating rather than interleaved hub and spoke directives. The two maps come over as
         base64 JSON: toJson alone would emit quotes that break the enclosing string literal. */ -}}
  {{- $type := "{{hub index $store "type" | default "s3" hub}}" }}
  {{- $bucket := "{{hub index $store "bucket" | default "" hub}}" }}
  {{- $prefix := "{{hub index $store "prefix" | default "" hub}}" }}
  {{- $region := "{{hub index $store "region" | default "" hub}}" }}
  {{- $endpoint := "{{hub index $store "endpoint" | default "" hub}}" }}
  {{- $credName := "{{hub index $credRef "name" | default "cloud-credentials" hub}}" }}
  {{- $credKey := "{{hub index $credRef "key" | default "cloud" hub}}" }}
  {{- $obcClass := "{{hub index $store "storageClassName" | default "openshift-storage.noobaa.io" hub}}" }}
  {{- $providerOverride := "{{hub index $store "provider" | default "" hub}}" }}
  {{- $storeCa := "{{hub $hubCa hub}}" }}
  {{- $extra := ("{{hub index $store "config" | default dict | toJson | b64enc hub}}" | base64dec | fromJson) }}
  {{- $pluginOverride := ("{{hub index $store "plugins" | default list | toJson | b64enc hub}}" | base64dec | fromJson) }}
  {{- $az := ("{{hub $azure | toJson | b64enc hub}}" | base64dec | fromJson) }}
  #
  {{- if not (has $type (list "s3" "obc" "azure" "gcp")) }}
  {{- fail (printf "acm-backup: config.acm-backup.storage.type must be 's3', 'obc', 'azure' or 'gcp', got %q. For an S3-compatible appliance use 's3' with storage.endpoint." $type) }}
  {{- end }}
  #
  {{- /* obc is an ObjectBucketClaim against NooBaa, which speaks S3, so it is an aws provider like
         any other S3 store. storage.provider overrides this for anything unforeseen. */ -}}
  {{- $provider := $type }}
  {{- if has $type (list "s3" "obc") }}
  {{- $provider = "aws" }}
  {{- end }}
  {{- if $providerOverride }}
  {{- $provider = $providerOverride }}
  {{- end }}
  #
  {{- $cfg := dict }}
  {{- $emitDpa := true }}
  #
  {{- if eq $type "obc" }}
  {{- /* The service CA signs the in-cluster NooBaa endpoint, so Velero needs it in the trust
         bundle. The annotation makes OpenShift populate service-ca.crt for us.
         This comment deliberately closes WITHOUT a trailing dash. A trailing dash before literal
         content eats the newline and glues the first object onto the previous line. */}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: acm-backup-service-ca
        namespace: open-cluster-management-backup
        annotations:
          service.beta.openshift.io/inject-cabundle: 'true'
  - complianceType: musthave
    objectDefinition:
      apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      metadata:
        name: acm-backup
        namespace: open-cluster-management-backup
      spec:
        generateBucketName: acm-backup
        storageClassName: {{ $obcClass }}
  {{- $obcCM := (lookup "v1" "ConfigMap" "open-cluster-management-backup" "acm-backup") | default dict }}
  {{- $obcCMData := ($obcCM.data | default dict) }}
  {{- $obcSecret := (lookup "v1" "Secret" "open-cluster-management-backup" "acm-backup") | default dict }}
  {{- $obcSecData := ($obcSecret.data | default dict) }}
  {{- $caCM := (lookup "v1" "ConfigMap" "open-cluster-management-backup" "acm-backup-service-ca") | default dict }}
  {{- $accessKey := (index $obcSecData "AWS_ACCESS_KEY_ID" | default "" | base64dec) }}
  {{- $secretKey := (index $obcSecData "AWS_SECRET_ACCESS_KEY" | default "" | base64dec) }}
  {{- $bucket = (index $obcCMData "BUCKET_NAME" | default "") }}
  {{- $host := (index $obcCMData "BUCKET_HOST" | default "") }}
  {{- $port := (index $obcCMData "BUCKET_PORT" | default "443") }}
  {{- $storeCa = (index ($caCM.data | default dict) "service-ca.crt" | default "") }}
  {{- $_ := set $cfg "region" (index $obcCMData "BUCKET_REGION" | default "noobaa") }}
  {{- $_ := set $cfg "s3ForcePathStyle" "true" }}
  {{- if $host }}
  {{- $_ := set $cfg "s3Url" (printf "https://%s:%s" $host $port) }}
  {{- end }}
  {{- if or (empty $bucket) (empty $accessKey) }}
  {{- /* Claim placed, credentials not issued yet. Emit no DataProtectionApplication rather than
         one pointing at an empty bucket; policy-acm-backup-test reports the not-ready state. */ -}}
  {{- $emitDpa = false }}
  {{- else }}
  {{- $credName = "acm-backup-cloud-credentials" }}
  {{- $credKey = "cloud" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: acm-backup-cloud-credentials
        namespace: open-cluster-management-backup
      type: Opaque
      stringData:
        cloud: |
          [default]
          aws_access_key_id={{ $accessKey }}
          aws_secret_access_key={{ $secretKey }}
  {{- end }}
  {{- else }}
  {{- if empty $bucket }}
  {{- fail (printf "acm-backup: config.acm-backup.storage.bucket is required when storage.type is %q. Refusing to configure a DataProtectionApplication with no bucket, which would report Compliant while backing up nothing." $type) }}
  {{- end }}
  {{- if eq $type "s3" }}
  {{- if $region }}
  {{- $_ := set $cfg "region" $region }}
  {{- end }}
  {{- if $endpoint }}
  {{- /* A custom endpoint means an S3-compatible appliance rather than Amazon S3. Those almost
         universally need path-style addressing, because virtual-host style needs wildcard DNS. */ -}}
  {{- $_ := set $cfg "s3Url" $endpoint }}
  {{- $_ := set $cfg "s3ForcePathStyle" "true" }}
  {{- end }}
  {{- else if eq $type "azure" }}
  {{- range $k := (list "resourceGroup" "storageAccount" "subscriptionId") }}
  {{- if not (index $az $k) }}
  {{- fail (printf "acm-backup: config.acm-backup.storage.azure.%s is required when storage.type is 'azure'" $k) }}
  {{- end }}
  {{- $_ := set $cfg $k (index $az $k) }}
  {{- end }}
  {{- $_ := set $cfg "storageAccountKeyEnvVar" "AZURE_STORAGE_ACCOUNT_ACCESS_KEY" }}
  {{- end }}
  {{- end }}
  #
  {{- /* Free-form passthrough, merged LAST so it wins over everything derived above. This is what
         makes an unforeseen object store configurable without changing this policy. */ -}}
  {{- range $k, $v := $extra }}
  {{- $_ := set $cfg $k (printf "%v" $v) }}
  {{- end }}
  #
  {{- $plugins := (list "openshift" $provider) }}
  {{- if $pluginOverride }}
  {{- $plugins = $pluginOverride }}
  {{- end }}
  #
  {{- if $emitDpa }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: oadp.openshift.io/v1alpha1
      kind: DataProtectionApplication
      metadata:
        name: acm-backup
        namespace: open-cluster-management-backup
      spec:
        # Hub backups are Kubernetes resources, never images, so the image-backup registry is off.
        # This is also required: with backupImages unset, OADP 1.6 refuses to reconcile the
        # DataProtectionApplication with "BackupLocation must have velero prefix when backupImages
        # is not set to false", and no BackupStorageLocation is ever created.
        backupImages: false
        configuration:
          velero:
            defaultPlugins:
              {{- range $p := $plugins }}
              - {{ $p }}
              {{- end }}
        backupLocations:
          - name: default
            velero:
              provider: {{ $provider }}
              default: true
              objectStorage:
                bucket: {{ $bucket }}
                {{- if $prefix }}
                prefix: {{ $prefix }}
                {{- end }}
                {{- if $storeCa }}
                caCert: {{ $storeCa | base64enc }}
                {{- end }}
              {{- if $cfg }}
              config:
                {{- range $k, $v := $cfg }}
                {{ $k }}: '{{ $v }}'
                {{- end }}
              {{- end }}
              credential:
                name: {{ $credName }}
                key: {{ $credKey }}
  {{- end }}
