# The object store the hub backups are written to, and the OADP DataProtectionApplication that
# points Velero at it. Both sides of an active/passive pair get this: the standby reads the same
# bucket the active hub writes.
#
# WHERE EACH HALF RUNS. Hub templates are resolved by one controller on the hub, which substitutes
# them into the policy text; the resolved document is then shipped to the target cluster, where the
# config-policy-controller evaluates the remaining plain templates locally. So each half belongs
# where its data is:
#   hub   config.acm-backup, read from <cluster>.rendered-config in the policy namespace. A target
#         cluster cannot see that ConfigMap. Every backend except obc is pure configuration, so its
#         whole DataProtectionApplication is emitted here.
#   local the ObjectBucketClaim, its generated Secret and the service-CA bundle. Those live on the
#         TARGET cluster, which in a hub-of-hubs is not the cluster that placed the policy. Being
#         local is also what makes evaluationInterval: watch re-evaluate when the claim binds.
# Hub values are written straight into the YAML at the point of use. Never hoist one into a local
# variable through a quoted string literal: a map's quotes and a multi-line value's newlines both
# break the enclosing literal.
#
# config.acm-backup.storage.type names the object store, and the Velero provider and plugin follow:
#   s3    Amazon Simple Storage Service, or ANY S3-compatible store reached through
#         storage.endpoint: NetApp StorageGRID, Pure Storage FlashBlade, Dell ECS, MinIO,
#         Ceph RADOS Gateway, Wasabi. Velero provider aws.
#   azure Azure Blob Storage. Velero provider azure. Needs storage.azure.
#   gcp   Google Cloud Storage. Velero provider gcp.
#   obc   an ObjectBucketClaim against the local ODF NooBaa, which is S3, so provider aws.
#         Lab and sandbox only: a bucket that lives on the hub cannot survive the hub, which is
#         the exact failure this policy exists to cover.
#
# Enumerating vendors would mean predicting each one's quirks, so it is deliberately not done.
# storage.config is a free-form map merged LAST into the Velero config, and storage.provider and
# storage.plugins override the derived values, so an appliance nobody here has seen is still
# configurable from values alone. The common case: some S3-compatible stores reject Velero's
# newer checksum headers and need checksumAlgorithm set to an empty string.
#
# Credentials are never in values. Every backend except obc reads a Secret created out of band and
# named through configSecretRef; obc derives its own from the claim.
object-templates-raw: |
  # INDENTATION ANCHOR — every directive below sits at this indent. A shallower trim marker eats
  # past the newline into the previous line and produces invalid YAML.
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $bk := (index $rcmConfig "acm-backup" | default dict) hub}}
  {{hub- $store := (index $bk "storage" | default dict) hub}}
  {{hub- $credRef := (index $store "configSecretRef" | default dict) hub}}
  {{hub- $azure := (index $store "azure" | default dict) hub}}
  {{hub- $caRef := (index $store "caRef" | default dict) hub}}
  {{hub- $type := (index $store "type" | default "s3") hub}}
  {{hub- $prefix := (index $store "prefix" | default "") hub}}
  {{hub- $credName := (index $credRef "name" | default "cloud-credentials") hub}}
  {{hub- $credKey := (index $credRef "key" | default "cloud") hub}}
  {{hub- if not (has $type (list "s3" "obc" "azure" "gcp")) hub}}
  {{hub- fail (printf "acm-backup: config.acm-backup.storage.type must be 's3', 'obc', 'azure' or 'gcp', got %q. For an S3-compatible appliance use 's3' with storage.endpoint." $type) hub}}
  {{hub- end hub}}
  {{- /* Only the REFERENCE is resolved on the hub; the bundle itself is read on the target, the
         same cluster whose Velero opens the credentials Secret. Both are trust material for one
         endpoint, so both are provisioned together in open-cluster-management-backup on each hub.
         Reading the bundle on the hub instead would look on the cluster that PLACED the policy,
         which in a hub-of-hubs is a different cluster, and would silently render no caCert. */}}
  {{hub- $caNs := (index $caRef "namespace" | default "open-cluster-management-backup") hub}}
  {{hub- $caName := (index $caRef "name" | default "") hub}}
  {{hub- $caKey := (index $caRef "key" | default "ca-bundle.crt") hub}}
  {{hub- $provider := $type hub}}
  {{hub- if has $type (list "s3" "obc") hub}}
  {{hub- $provider = "aws" hub}}
  {{hub- end hub}}
  {{hub- if (index $store "provider" | default "") hub}}
  {{hub- $provider = (index $store "provider") hub}}
  {{hub- end hub}}
  {{hub- $plugins := (list "openshift" $provider) hub}}
  {{hub- if gt (len (index $store "plugins" | default list)) 0 hub}}
  {{hub- $plugins = (index $store "plugins") hub}}
  {{hub- end hub}}
  #
  {{hub- if eq $type "obc" hub}}
  {{- /* LOCAL half. The claim and everything derived from it live on the target cluster, so this
         block is evaluated there, after the hub has substituted the scalars above. */}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: acm-backup-service-ca
        namespace: open-cluster-management-backup
        annotations:
          service.beta.openshift.io/inject-cabundle: 'true'
  - complianceType: musthave
    objectDefinition:
      apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      metadata:
        name: acm-backup
        namespace: open-cluster-management-backup
      spec:
        generateBucketName: acm-backup
        storageClassName: {{hub index $store "storageClassName" | default "openshift-storage.noobaa.io" hub}}
  {{- $obcCM := (lookup "v1" "ConfigMap" "open-cluster-management-backup" "acm-backup") | default dict }}
  {{- $obcCMData := ($obcCM.data | default dict) }}
  {{- $obcSecret := (lookup "v1" "Secret" "open-cluster-management-backup" "acm-backup") | default dict }}
  {{- $obcSecData := ($obcSecret.data | default dict) }}
  {{- $caCM := (lookup "v1" "ConfigMap" "open-cluster-management-backup" "acm-backup-service-ca") | default dict }}
  {{- $accessKey := (index $obcSecData "AWS_ACCESS_KEY_ID" | default "" | base64dec) }}
  {{- $secretKey := (index $obcSecData "AWS_SECRET_ACCESS_KEY" | default "" | base64dec) }}
  {{- $bucket := (index $obcCMData "BUCKET_NAME" | default "") }}
  {{- $host := (index $obcCMData "BUCKET_HOST" | default "") }}
  {{- $port := (index $obcCMData "BUCKET_PORT" | default "443") }}
  {{- $svcCa := (index ($caCM.data | default dict) "service-ca.crt" | default "") }}
  {{- if and (not (empty $bucket)) (not (empty $accessKey)) }}
  {{- /* Emitted only once the claim has issued credentials. Before that the claim above keeps the
         ConfigurationPolicy non-empty, so it cannot report Compliant having done nothing, and
         policy-acm-backup-storage-test reports the not-ready state. */}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: acm-backup-cloud-credentials
        namespace: open-cluster-management-backup
      type: Opaque
      stringData:
        cloud: |
          [default]
          aws_access_key_id={{ $accessKey }}
          aws_secret_access_key={{ $secretKey }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: oadp.openshift.io/v1alpha1
      kind: DataProtectionApplication
      metadata:
        name: acm-backup
        namespace: open-cluster-management-backup
      spec:
        # Hub backups are Kubernetes resources, never images, so the image-backup registry is off.
        # This is also required: with backupImages unset, OADP 1.6 refuses to reconcile the
        # DataProtectionApplication with "BackupLocation must have velero prefix when backupImages
        # is not set to false", and no BackupStorageLocation is ever created.
        backupImages: false
        configuration:
          velero:
            defaultPlugins:
              - openshift
              - aws
        backupLocations:
          - name: default
            velero:
              provider: aws
              default: true
              objectStorage:
                bucket: {{ $bucket }}
                {{hub- if $prefix hub}}
                prefix: {{hub $prefix hub}}
                {{hub- end hub}}
                {{- if $svcCa }}
                caCert: {{ $svcCa | base64enc }}
                {{- end }}
              config:
                region: {{ index $obcCMData "BUCKET_REGION" | default "noobaa" }}
                s3ForcePathStyle: 'true'
                {{- if $host }}
                s3Url: https://{{ $host }}:{{ $port }}
                {{- end }}
              credential:
                name: acm-backup-cloud-credentials
                key: cloud
  {{- end }}
  {{hub- else hub}}
  {{- /* HUB half. s3, azure and gcp are pure configuration, so the whole object is built here and
         arrives at the target cluster already resolved. */}}
  {{hub- $bucket := (index $store "bucket" | default "") hub}}
  {{hub- if (empty $bucket) hub}}
  {{hub- fail (printf "acm-backup: config.acm-backup.storage.bucket is required when storage.type is %q. Refusing to configure a DataProtectionApplication with no bucket, which would report Compliant while backing up nothing." $type) hub}}
  {{hub- end hub}}
  {{hub- $cfg := dict hub}}
  {{hub- if eq $type "s3" hub}}
  {{hub- if (index $store "region" | default "") hub}}
  {{hub- $_ := set $cfg "region" (index $store "region") hub}}
  {{hub- end hub}}
  {{hub- if (index $store "endpoint" | default "") hub}}
  {{hub- $_ := set $cfg "s3Url" (index $store "endpoint") hub}}
  {{hub- $_ := set $cfg "s3ForcePathStyle" "true" hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- if eq $type "azure" hub}}
  {{hub- range $k := (list "resourceGroup" "storageAccount" "subscriptionId") hub}}
  {{hub- if not (index $azure $k) hub}}
  {{hub- fail (printf "acm-backup: config.acm-backup.storage.azure.%s is required when storage.type is 'azure'" $k) hub}}
  {{hub- end hub}}
  {{hub- $_ := set $cfg $k (index $azure $k) hub}}
  {{hub- end hub}}
  {{hub- $_ := set $cfg "storageAccountKeyEnvVar" "AZURE_STORAGE_ACCOUNT_ACCESS_KEY" hub}}
  {{hub- end hub}}
  {{hub- range $k, $v := (index $store "config" | default dict) hub}}
  {{hub- $_ := set $cfg $k (printf "%v" $v) hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: oadp.openshift.io/v1alpha1
      kind: DataProtectionApplication
      metadata:
        name: acm-backup
        namespace: open-cluster-management-backup
      spec:
        # See the note in the obc branch: without this OADP 1.6 refuses to reconcile and no
        # BackupStorageLocation is ever created.
        backupImages: false
        configuration:
          velero:
            defaultPlugins:
              {{hub- range $p := $plugins hub}}
              - {{hub $p hub}}
              {{hub- end hub}}
        backupLocations:
          - name: default
            velero:
              provider: {{hub $provider hub}}
              default: true
              objectStorage:
                bucket: {{hub $bucket hub}}
                {{hub- if $prefix hub}}
                prefix: {{hub $prefix hub}}
                {{hub- end hub}}
                {{hub- if $caName hub}}
                {{- $caCM := (lookup "v1" "ConfigMap" "{{hub $caNs hub}}" "{{hub $caName hub}}") | default dict }}
                {{- $ca := (index ($caCM.data | default dict) "{{hub $caKey hub}}" | default "") }}
                {{- if not $ca }}
                {{- /* Configured but unreadable. Omitting caCert would leave Velero unable to
                       verify the endpoint at runtime while this policy reported Compliant. */ -}}
                {{- fail "acm-backup: config.acm-backup.storage.caRef names ConfigMap {{hub $caNs hub}}/{{hub $caName hub}} key {{hub $caKey hub}}, but it is missing or empty ON THIS CLUSTER. The trust bundle is read locally, next to the credentials Secret Velero opens." }}
                {{- end }}
                caCert: {{ $ca | base64enc }}
                {{hub- end hub}}
              {{hub- if $cfg hub}}
              config:
                {{hub- range $k, $v := $cfg hub}}
                {{hub $k hub}}: '{{hub $v hub}}'
                {{hub- end hub}}
              {{hub- end hub}}
              credential:
                name: {{hub $credName hub}}
                key: {{hub $credKey hub}}
  {{hub- end hub}}
