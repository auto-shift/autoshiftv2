apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: openshift-virtualization
# Layout convention:
#   manifests/ — desired state to APPLY; respects dry-run via remediationAction: ${REMEDIATION}
# A policy's path points at a single FILE, or a DIRECTORY when it has 2+ manifests (a dir is a wildcard:
# drop a file in, no config edit). Keep placement.yaml at the dir root, NOT inside a wildcarded dir (a
# Placement in a wildcarded dir would be wrapped into the Policy as a managed object).
placementBindingDefaults:
  name: binding-policy-virt
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  # All policies share one hand-authored Placement (predicate autoshift.io/virt).
  placement:
    placementPath: placement.yaml
policies:
  # 1) Operator install: raw Namespace (PG wraps -> ConfigurationPolicy) + first-class OperatorPolicy.
  #    2 manifests -> a directory (wildcard).
  - name: policy-virt-operator-install
    manifests:
      - path: manifests/operator-install
  # 2) HyperConverged CR (first-class ConfigurationPolicy). Waits on the operator install.
  - name: policy-virtualization-hyperconverged
    dependencies:
      - name: policy-virt-operator-install
    manifests:
      - path: manifests/hyperconverged.yaml
        complianceType: mustonlyhave
  # 3) Localnet ClusterUserDefinedNetworks from config.networking.cudn.vlans, the secondary networks
  #    virtual machines attach to. Opt-in: placed only where virt-networks is also 'true'. No
  #    dependency: a ClusterUserDefinedNetwork needs OVN-Kubernetes, not the operator, and the
  #    bridge mapping it names comes from the nmstate policy.
  - name: policy-virtualization-networks
    manifests:
      - path: manifests/networks.yaml
    placement:
      placementPath: placement-virt-networks.yaml
  # 4) inform: each configured ClusterUserDefinedNetwork reports NetworkCreated. A separate policy,
  #    because a root remediationAction overrides its children.
  - name: policy-virtualization-networks-ready
    remediationAction: inform
    manifests:
      - path: test/networks-ready.yaml
    placement:
      placementPath: placement-virt-networks.yaml
