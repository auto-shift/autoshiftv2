# Standby-hub readiness gate: the passive sync must actually be syncing.
#
# Enabled is the steady state for a Restore with syncRestoreWithNewBackups: true — it keeps pulling
# each new backup instead of finishing. A standby sitting in Error or FinishedWithErrors is a hub
# that will not be usable when it is needed.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Restore
metadata:
  name: acm-failover-restore-passive-sync
  namespace: open-cluster-management-backup
status:
  phase: Enabled
