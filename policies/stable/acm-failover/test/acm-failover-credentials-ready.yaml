# The credentials Velero opens must actually exist on this cluster.
#
# A missing Secret otherwise presents only as a BackupStorageLocation that never reaches
# Available, which points at the bucket rather than at the credentials. This names the cause.
#
# Existence only. The contents are never read: this policy has no business seeing credentials, and
# a musthave on metadata alone cannot leak them.
#
# Observation only, with no dependents, and deliberately so. Making the storage policy depend on
# this would deadlock the obc backend, where the very policy that creates the derived Secret would
# be gated on that Secret already existing.
object-templates-raw: |
  # INDENTATION ANCHOR
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $rcmConfig := (index ($rcm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $bk := (index $rcmConfig "acm-failover" | default dict) hub}}
  {{hub- $store := (index $bk "storage" | default dict) hub}}
  {{hub- if (empty $store) hub}}
  {{hub- $fo := (dig "acm" "failover" (dict) $rcmConfig) hub}}
  {{hub- if (index $fo "secretName") hub}}
  {{hub- $store = (dict "sourceSecretRef" (dict "name" (index $fo "secretName"))) hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- $credRef := (index $store "configSecretRef" | default dict) hub}}
  {{hub- $type := (index $store "type" | default "s3") hub}}
  {{hub- $credName := (index $credRef "name" | default "cloud-credentials") hub}}
  # obc derives its own from the ObjectBucketClaim rather than using configSecretRef.
  # Hub templates support no Go comments, and a leading hash is not an escape: the resolver scans
  # for its delimiters in comment lines too.
  {{hub- if eq $type "obc" hub}}
  {{hub- $credName = "acm-failover-cloud-credentials" hub}}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{hub $credName hub}}
        namespace: open-cluster-management-backup
