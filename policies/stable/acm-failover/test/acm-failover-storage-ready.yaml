# Storage readiness gate. Wrapped by PolicyGenerator into a musthave ConfigurationPolicy; its PG
# entry is remediationAction: inform, because a status can only be observed, never enforced.
#
# The BackupStorageLocation is matched by name. The storage policy names its location `default` in
# backupLocations[].name, and OpenShift APIs for Data Protection uses that name for the
# BackupStorageLocation it creates. Matching by kind alone would let any other Available location
# in the namespace satisfy the check while this one is Unavailable. Without this check, a hub with a
# misconfigured bucket looks healthy right up until a restore is attempted.
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: acm-failover
  namespace: open-cluster-management-backup
status:
  conditions:
    - status: 'True'
      type: Reconciled
---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: open-cluster-management-backup
status:
  phase: Available
