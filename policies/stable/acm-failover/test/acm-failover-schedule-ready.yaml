# Active-hub readiness gate: the schedule must actually be running.
#
# Enabled is the only healthy phase. The ones this catches are FailedValidation (bad cron or no
# storage), Paused, and above all BackupCollision, which means a second hub is writing to the same
# storage location and backups have stopped on BOTH hubs.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: BackupSchedule
metadata:
  name: acm-failover-schedule
  namespace: open-cluster-management-backup
status:
  phase: Enabled
