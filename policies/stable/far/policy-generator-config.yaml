apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: far
# Per-deployment scalars (${...}) are substituted by the repo-server CMP (envsubst/sed) BEFORE
# `kustomize build` runs. They live here and in placement.yaml — never in manifests/, whose hub
# templates contain `$vars` that substitution would clobber.
#
# The operator-install policy points at manifests/operator-install/, a nested kustomization that
# renders the shared components/operator-install chart. Add further CRs as new policies[] entries
# pointing at their own manifests/<dir> (a wildcarded dir picks up drop-in files automatically).
# Keep placement.yaml OUT of manifests/ (a Placement inside a wildcarded dir would be wrapped in).
placementBindingDefaults:
  name: binding-policy-far
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce.
  remediationAction: ${REMEDIATION}
  severity: high
  # Consolidate the raw Namespace into one generated ConfigurationPolicy; the first-class
  # OperatorPolicy stays its own policy-template. Net: one Policy, two policy-templates.
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  # Placement authored by us (placement.yaml at the dir root, full fidelity); PG includes it and
  # generates only the PlacementBinding.
  placement:
    placementPath: placement.yaml
policies:
  - name: policy-far-operator-install
    manifests:
      - path: manifests/operator-install
  - name: policy-far-secrets
    dependencies:
      - name: policy-far-operator-install
    manifests:
      - path: manifests/secrets/bmc-secret.yaml
    customMessage:
      noncompliant: >
        {{ regexReplaceAll "(?s).*error calling fail: " .DefaultMessage "" | trim }}.
        For secretsMode=copy, verify far.sharedSecretNamespace/sourceSecretName/sharedSecretName
        (or per-template overrides) and confirm the source Secret exists on the managed cluster.
        For secretsMode=external, the copy policy only asserts the FAR namespace; see
        policy-far-secrets-ready for the Secret gate.
  # Inform gate: target Secrets must exist in openshift-workload-availability with FAR keys.
  # Blocks remediation templates until copy or external delivery has landed them.
  - name: policy-far-secrets-ready
    remediationAction: inform
    dependencies:
      - name: policy-far-secrets
    manifests:
      - path: test/bmc-secret-ready.yaml
    customMessage:
      noncompliant: >
        {{ regexReplaceAll "(?s).*error calling fail: " .DefaultMessage "" | trim }}.
        Confirm far.sharedSecretName (and nodeSecretNames) exist in openshift-workload-availability
        with --username and --password keys. Missing keys fail this inform gate. For secretsMode=copy
        the enforce secrets policy writes them; for secretsMode=external, External Secrets Operator
        or another out-of-band process must land Secrets with those FAR keys there.
  # Inform: surfaces active FenceAgentsRemediation objects (Node Health Check fencing a node).
  # Does not gate remediation templates.
  - name: policy-far-active-remediations
    remediationAction: inform
    dependencies:
      - name: policy-far-operator-install
    manifests:
      - path: test/far-active-remediations.yaml
    customMessage:
      noncompliant: >
        {{ regexReplaceAll "(?s).*error calling fail: " .DefaultMessage "" | trim }}.
        A FenceAgentsRemediation in openshift-workload-availability means Node Health Check is
        remediating a node. Investigate the NodeHealthCheck and the named remediation; this policy
        becomes Compliant when no FenceAgentsRemediation objects remain.
  # Self-managed hub / local-cluster only: no hubTemplateOptions (blocks replication there).
  - name: policy-far-remediation-templates
    placement:
      placementPath: placement-remediation-hub.yaml
    dependencies:
      - name: policy-far-secrets-ready
    manifests:
      - path: manifests/far-templates-spoke/far-template.yaml
    customMessage:
      noncompliant: >-
        {{ regexReplaceAll "(?s).*error calling fail: " .DefaultMessage "" | trim }}
  # All other far=true clusters (spokes + remote hubs): hub BMH lookup via hubTemplateOptions.
  - name: policy-far-remediation-templates-managed
    placement:
      placementPath: placement-remediation-managed.yaml
    hubTemplateOptions:
      serviceAccountName: autoshift-policy-service-account
    dependencies:
      - name: policy-far-secrets-ready
    manifests:
      - path: manifests/far-templates/far-template.yaml
    customMessage:
      noncompliant: >-
        {{- $msg := (regexReplaceAll "(?s).*error calling fail: " .DefaultMessage "" | trim) -}}
        {{- if regexMatch "autoNodeIPsFromBMH=true but no BMC IPs" $msg -}}
        {{ $msg }} autoNodeIPsFromBMH looks up BareMetalHosts on the hub in the managed-cluster namespace first, then falls back to openshift-machine-api on the managed cluster. Both require readable spec.bmc.address values. Otherwise, set nodeparameters.--ip explicitly or set autoNodeIPsFromBMH=false.
        {{- else -}}
        {{ $msg }}
        {{- end -}}
