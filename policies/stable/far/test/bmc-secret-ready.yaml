# Inform gate: FAR credential Secrets must exist in openshift-workload-availability
# with non-empty --username and --password. fromSecret returns "" for a missing key
# with no error, so reject empty results explicitly before the musthave self-compare.
object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $far := (index $config "far" | default dict) hub}}
  {{hub- if empty $far hub}}
    {{ fail "Fence Agents Remediation is set to true but config.far is not detected. Please ensure the config is set, refer to documentation." }}
  {{hub- end hub}}
  {{hub- $templates := (dig "templates" (list) $far) hub}}
  {{hub- if not $templates hub}}
    {{ fail "far.templates must contain at least one entry" }}
  {{hub- end hub}}
  {{hub- $defaultTargetSecret := (dig "sharedSecretName" "" $far) hub}}
  {{hub- $userKey := "--username" hub}}
  {{hub- $passKey := "--password" hub}}
  {{hub- $seen := dict hub}}
  {{hub- range $t := $templates hub}}
  {{hub- $tplName := (dig "name" "" $t) hub}}
  {{hub- if empty $tplName hub}}
    {{ fail "far.templates[].name is required and cannot be empty" }}
  {{hub- end hub}}
  {{hub- $targetSecret := (dig "sharedSecretName" $defaultTargetSecret $t) hub}}
  {{hub- if empty $targetSecret hub}}
    {{ fail "far.templates[].sharedSecretName is required and cannot be empty" }}
  {{hub- end hub}}
  {{hub- if not (hasKey $seen $targetSecret) hub}}
  {{hub- $_ := set $seen $targetSecret true hub}}
  {{ if or (eq (fromSecret "openshift-workload-availability" "{{hub $targetSecret hub}}" "{{hub $userKey hub}}") "") (eq (fromSecret "openshift-workload-availability" "{{hub $targetSecret hub}}" "{{hub $passKey hub}}") "") }}
    {{ fail (printf "FAR Secret openshift-workload-availability/%s must contain non-empty --username and --password keys" "{{hub $targetSecret hub}}") }}
  {{ end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{hub $targetSecret hub}}'
        namespace: openshift-workload-availability
      data:
        '{{hub $userKey hub}}': '{{ fromSecret "openshift-workload-availability" "{{hub $targetSecret hub}}" "{{hub $userKey hub}}" }}'
        '{{hub $passKey hub}}': '{{ fromSecret "openshift-workload-availability" "{{hub $targetSecret hub}}" "{{hub $passKey hub}}" }}'
  {{hub- end hub}}
  {{hub- $nodeSecretNames := (dig "nodeSecretNames" (dict) $t) hub}}
  {{hub- range $nodeName, $targetNodeSecret := $nodeSecretNames hub}}
  {{hub- if and (not (empty $targetNodeSecret)) (not (hasKey $seen $targetNodeSecret)) hub}}
  {{hub- $_ := set $seen $targetNodeSecret true hub}}
  {{ if or (eq (fromSecret "openshift-workload-availability" "{{hub $targetNodeSecret hub}}" "{{hub $userKey hub}}") "") (eq (fromSecret "openshift-workload-availability" "{{hub $targetNodeSecret hub}}" "{{hub $passKey hub}}") "") }}
    {{ fail (printf "FAR Secret openshift-workload-availability/%s must contain non-empty --username and --password keys" "{{hub $targetNodeSecret hub}}") }}
  {{ end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{hub $targetNodeSecret hub}}'
        namespace: openshift-workload-availability
      data:
        '{{hub $userKey hub}}': '{{ fromSecret "openshift-workload-availability" "{{hub $targetNodeSecret hub}}" "{{hub $userKey hub}}" }}'
        '{{hub $passKey hub}}': '{{ fromSecret "openshift-workload-availability" "{{hub $targetNodeSecret hub}}" "{{hub $passKey hub}}" }}'
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
