object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $far := (index $config "far" | default dict) hub}}
  {{hub- $templates := (dig "templates" (list) $far) hub}}
  {{hub- $defaultTargetSecret := (dig "sharedSecretName" "" $far) hub}}
  {{hub- range $t := $templates hub}}
  {{hub- $tplName := (dig "name" "" $t) hub}}
  {{hub- $agent := (dig "agent" "fence_redfish" $t) hub}}
  {{hub- $strategy := (dig "remediationStrategy" "OutOfServiceTaint" $t) hub}}
  {{hub- $retrycountRaw := (dig "retrycount" 5 $t) hub}}
  {{hub- $retrycount := (int $retrycountRaw) hub}}
  {{hub- $retryinterval := (dig "retryinterval" "5s" $t) hub}}
  {{hub- $timeout := (dig "timeout" "300s" $t) hub}}
  {{hub- $secret := (dig "sharedSecretName" $defaultTargetSecret $t) hub}}
  {{hub- if empty $secret hub}}{{hub- $secret = (printf "%s-secret" $tplName) hub}}{{hub- end hub}}
  {{hub- $action := (dig "action" "reboot" $t) hub}}
  {{hub- $systemsUri := (dig "systemsUri" "/redfish/v1/Systems/1" $t) hub}}
  {{hub- $sslInsecure := (dig "sslInsecure" false $t) hub}}
  {{hub- $autoNodeIPsFromBMH := (dig "autoNodeIPsFromBMH" false $t) hub}}
  {{hub- $nodeIPs := (dig "nodeIPs" (dict) $t) hub}}
  {{hub- $nodePorts := (dig "nodePorts" (dict) $t) hub}}
  {{hub- $nodeSecretNames := (dig "nodeSecretNames" (dict) $t) hub}}
  {{hub- if empty $tplName hub}}{{ fail "far.templates[].name is required and cannot be empty" }}{{hub- end hub}}
  {{hub- if and (kindIs "string" $retrycountRaw) (not (regexMatch "^[0-9]+$" $retrycountRaw)) hub}}
    {{ fail (printf "far.templates[%s].retrycount must be an integer value, for example: retrycount: 15" $tplName) }}
  {{hub- end hub}}
  {{hub- if and (not $autoNodeIPsFromBMH) (empty $nodeIPs) hub}}
    {{ fail (printf "far.templates[%s].nodeIPs is required and cannot be empty" $tplName) }}
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
      kind: FenceAgentsRemediationTemplate
      metadata:
        name: '{{hub $tplName hub}}'
        namespace: openshift-workload-availability
      spec:
        template:
          spec:
            agent: '{{hub $agent hub}}'
            remediationStrategy: '{{hub $strategy hub}}'
            retrycount: {{hub $retrycount hub}}
            retryinterval: {{hub $retryinterval hub}}
            timeout: {{hub $timeout hub}}
            sharedSecretName: '{{hub $secret hub}}'
            {{hub- if not (empty $nodeSecretNames) hub}}
            nodeSecretNames:
              {{hub $nodeSecretNames | toYaml | autoindent hub}}
            {{hub- end hub}}
            sharedparameters:
              '--action': '{{hub $action hub}}'
              {{hub- if $sslInsecure hub}}
              '--ssl-insecure': ''
              {{hub- end hub}}
              '--systems-uri': '{{hub $systemsUri hub}}'
            nodeparameters:
              {{hub- if $autoNodeIPsFromBMH hub}}
              '--ip':
                {{- $bmhs := (lookup "metal3.io/v1alpha1" "BareMetalHost" "openshift-machine-api" "").items | default (list) -}}
                {{- $autoIPs := dict -}}
                {{- range $bmh := $bmhs -}}
                {{- $nodeName := dig "metadata" "name" "" $bmh -}}
                {{- $bmcAddr := dig "spec" "bmc" "address" "" $bmh -}}
                {{- $withoutScheme := regexReplaceAll "^[a-zA-Z0-9+.-]+://([^@/]+@)?" $bmcAddr "" -}}
                {{- $hostPort := regexReplaceAll "/.*$" $withoutScheme "" -}}
                {{- $host := regexReplaceAll ":([0-9]+)$" $hostPort "" -}}
                {{- if and $nodeName $host -}}
                {{- $_ := set $autoIPs $nodeName $host -}}
                {{- end -}}
                {{- end -}}
                {{- if empty $autoIPs -}}
                {{- fail "FAR: autoNodeIPsFromBMH=true but no BMC IPs were detected from BareMetalHost objects in openshift-machine-api. autoNodeIPsFromBMH is supported only when BareMetalHosts are present and spec.bmc.address is populated and readable. Set templates[].nodeIPs explicitly or set autoNodeIPsFromBMH=false." -}}
                {{- end -}}
                {{- toYaml $autoIPs | nindent 16 }}
              {{hub- else hub}}
              '--ip':
                {{hub $nodeIPs | toYaml | autoindent hub}}
              {{hub- end hub}}
              {{hub- if not (empty $nodePorts) hub}}
              '--ipport':
                {{hub $nodePorts | toYaml | autoindent hub}}
              {{hub- end hub}}
  {{hub- end hub}}
