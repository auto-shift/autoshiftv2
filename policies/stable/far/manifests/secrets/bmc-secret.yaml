object-templates-raw: |
  {{hub- $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml | default dict) hub}}
  {{hub- $far := (index $config "far" | default dict) hub}}
  {{hub- $secretsMode := (dig "secretsMode" "copy" $far) hub}}
  {{hub- if and (ne $secretsMode "copy") (ne $secretsMode "external") hub}}
    {{ fail (printf "far.secretsMode must be copy or external, got %q" $secretsMode) }}
  {{hub- end hub}}
  {{hub- $templates := (dig "templates" (list) $far) hub}}
  {{hub- if not $templates hub}}
    {{ fail "far.templates must contain at least one entry" }}
  {{hub- end hub}}
  {{hub- if eq $secretsMode "external" hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-workload-availability
  {{hub- else hub}}
  {{hub- $defaultSourceNs := (dig "sharedSecretNamespace" "" $far) hub}}
  {{hub- $defaultSourceSecret := (dig "sourceSecretName" "" $far) hub}}
  {{hub- $defaultTargetSecret := (dig "sharedSecretName" "" $far) hub}}
  {{hub- range $t := $templates hub}}
  {{hub- $tplName := (dig "name" "" $t) hub}}
  {{hub- $sourceNs := (dig "sharedSecretNamespace" $defaultSourceNs $t) hub}}
  {{hub- $sourceSecret := (dig "sourceSecretName" $defaultSourceSecret $t) hub}}
  {{hub- if empty $sourceSecret hub}}
    {{ fail "far.templates[].sourceSecretName is required and cannot be empty" }}
  {{hub- end hub}}
  {{hub- $targetSecret := (dig "sharedSecretName" $defaultTargetSecret $t) hub}}
  {{hub- if empty $targetSecret hub}}
    {{ fail "far.templates[].sharedSecretName is required and cannot be empty" }}
  {{hub- end hub}}
  {{hub- $nodeSecretNames := (dig "nodeSecretNames" (dict) $t) hub}}
  {{hub- $sourceNodeSecrets := (dig "sourceNodeSecrets" (dict) $t) hub}}
  {{hub- $userKey := "--username" hub}}
  {{hub- $passKey := "--password" hub}}
  {{hub- if empty $tplName hub}}
    {{ fail "far.templates[].name is required and cannot be empty" }}
  {{hub- end hub}}
  {{hub- if empty $sourceNs hub}}
    {{ fail (printf "far.templates[%s].sharedSecretNamespace is required" $tplName) }}
  {{hub- end hub}}
  {{ if or (eq (fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceSecret hub}}" "{{hub $userKey hub}}") "") (eq (fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceSecret hub}}" "{{hub $passKey hub}}") "") }}
    {{ fail (printf "FAR source Secret %s/%s must contain non-empty --username and --password keys before copy" "{{hub $sourceNs hub}}" "{{hub $sourceSecret hub}}") }}
  {{ end }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{hub $targetSecret hub}}'
        namespace: openshift-workload-availability
      type: Opaque
      data:
        '{{hub $userKey hub}}': '{{ fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceSecret hub}}" "{{hub $userKey hub}}" }}'
        '{{hub $passKey hub}}': '{{ fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceSecret hub}}" "{{hub $passKey hub}}" }}'
  {{hub- range $nodeName, $targetNodeSecret := $nodeSecretNames hub}}
  {{hub- $sourceNodeSecret := (dig $nodeName $targetNodeSecret $sourceNodeSecrets) hub}}
  {{hub- if and (not (empty $targetNodeSecret)) (not (eq $targetNodeSecret $targetSecret)) hub}}
  {{ if or (eq (fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceNodeSecret hub}}" "{{hub $userKey hub}}") "") (eq (fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceNodeSecret hub}}" "{{hub $passKey hub}}") "") }}
    {{ fail (printf "FAR source node Secret %s/%s must contain non-empty --username and --password keys before copy" "{{hub $sourceNs hub}}" "{{hub $sourceNodeSecret hub}}") }}
  {{ end }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{hub $targetNodeSecret hub}}'
        namespace: openshift-workload-availability
      type: Opaque
      data:
        '{{hub $userKey hub}}': '{{ fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceNodeSecret hub}}" "{{hub $userKey hub}}" }}'
        '{{hub $passKey hub}}': '{{ fromSecret "{{hub $sourceNs hub}}" "{{hub $sourceNodeSecret hub}}" "{{hub $passKey hub}}" }}'
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
