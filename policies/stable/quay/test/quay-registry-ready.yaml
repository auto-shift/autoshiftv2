# Readiness gate: the QuayRegistry must report Available with all components created and no blocked
# rollout before dependents proceed. Wrapped by PG into a musthave ConfigurationPolicy; its PG policy
# entry is remediationAction: inform (a status can only be observed, never enforced).
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: registry
  namespace: quay-enterprise
status:
  conditions:
    - status: 'True'
      type: Available
    - status: 'True'
      type: ComponentsCreated
    - status: 'False'
      type: RolloutBlocked
