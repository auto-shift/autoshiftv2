apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-quay-backup
  namespace: ${POLICY_NAMESPACE}
spec:
  # Scheduled CNPG backups to a NooBaa bucket — needs the CNPG databases AND ODF for the bucket.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/quay'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/quay-db-mode'
              operator: In
              values:
                - 'managed'
            - key: 'autoshift.io/quay-db-backups'
              operator: In
              values:
                - 'true'
            - key: 'autoshift.io/odf'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
