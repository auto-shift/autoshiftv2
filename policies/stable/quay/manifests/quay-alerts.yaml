# Alerts for the Day 2 signals the Quay Operator does not alert on. Its monitoring component ships only
# QuayPodFrequentlyRestarting. These read the quay_* metrics that component exposes, so they render only
# while it is managed. On by default; config.quay.alerts.enabled: false turns them off. Each threshold is
# a Prometheus duration in config.quay.alerts; the defaults catch a queue that never drains or a mirror
# that keeps failing, not a single slow run.
object-templates-raw: |
  {{hub- $quayCfg := (index (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) "quay" | default dict) hub}}
  {{hub- $alertCfg := (index $quayCfg "alerts" | default dict) hub}}
  {{hub- $alerts := true hub}}
  {{hub- if hasKey $alertCfg "enabled" hub}}{{hub- $alerts = index $alertCfg "enabled" hub}}{{hub- end hub}}
  {{hub- $severity := (index $alertCfg "severity" | default "warning") hub}}
  {{hub- $gcFor := (index $alertCfg "garbageCollectionStalledFor" | default "6h") hub}}
  {{hub- $mirrorFor := (index $alertCfg "mirrorFailingFor" | default "2h") hub}}
  {{hub- $scanFor := (index $alertCfg "scanBacklogFor" | default "24h") hub}}
  {{hub- $monitoring := true hub}}
  {{hub- $components := (index $quayCfg "components" | default dict) hub}}
  {{hub- if hasKey $components "monitoring" hub}}{{hub- $monitoring = index $components "monitoring" hub}}{{hub- end hub}}
  {{hub- $state := ternary "musthave" "mustnothave" (and $alerts $monitoring) hub}}
  - complianceType: {{hub $state hub}}
    objectDefinition:
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: autoshift-quay
        namespace: quay-enterprise
      spec:
        groups:
          - name: autoshift-quay
            rules:
              - alert: QuayGarbageCollectionStalled
                expr: sum by (queue_name) (quay_queue_items_available{namespace="quay-enterprise", queue_name=~"namespacegc|repositorygc"}) > 0
                for: '{{hub $gcFor hub}}'
                labels:
                  severity: '{{hub $severity hub}}'
                annotations:
                  summary: Red Hat Quay garbage collection has had queued work for {{hub $gcFor hub}}.
                  description: >-
                    The {{ "{{" }} $labels.queue_name {{ "}}" }} queue has not drained in {{hub $gcFor hub}}, so deleted
                    namespaces or repositories are not being reclaimed and storage keeps growing. Check
                    the quay-app pod logs for garbage collection errors and that Redis is running, because
                    garbage collection takes its lock there.
              - alert: QuayRepositoryMirrorFailing
                expr: sum(increase(quay_repository_mirror_sync_failures_total{namespace="quay-enterprise"}[1h])) > 0
                for: '{{hub $mirrorFor hub}}'
                labels:
                  severity: '{{hub $severity hub}}'
                annotations:
                  summary: Red Hat Quay repository mirrors have failed to sync for {{hub $mirrorFor hub}}.
                  description: >-
                    Mirrored repositories are falling behind their upstream. Check the mirror status of
                    the affected repositories, the robot account credentials, and that the quay-mirror
                    pods can reach the upstream registry.
              - alert: QuaySecurityScanBacklog
                expr: min_over_time(quay_security_scanning_unscanned_images_remaining_total{namespace="quay-enterprise"}[{{hub $scanFor hub}}]) > 0
                for: 1h
                labels:
                  severity: '{{hub $severity hub}}'
                annotations:
                  summary: Red Hat Quay has had unscanned images for {{hub $scanFor hub}}.
                  description: >-
                    Clair has not caught up with the images in the registry for {{hub $scanFor hub}}, so
                    vulnerability reports are missing. Check that the clair-app pods are Ready, have
                    the memory they need, and can reach their database.
