# NooBaa bucket that barman writes CNPG base backups + WAL into, plus the service-CA bundle the
# barman S3 client needs to trust the in-cluster NooBaa endpoint.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-service-ca
  namespace: quay-enterprise
  annotations:
    service.beta.openshift.io/inject-cabundle: 'true'
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: quay-db-backup
  namespace: quay-enterprise
spec:
  generateBucketName: quay-db-backup
  storageClassName: openshift-storage.noobaa.io
