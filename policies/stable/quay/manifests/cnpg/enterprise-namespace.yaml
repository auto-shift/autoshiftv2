# The databases live in quay-enterprise, which policy-quay-deploy-cnpg also creates. That policy
# waits on this one through policy-cnpg-quay-test, so without its own copy here a fresh managed-mode
# cluster deadlocks: the clusters wait for the namespace and the namespace waits for the clusters.
# Keep it identical to manifests/quay-deploy/enterprise-namespace.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: quay-enterprise
  labels:
    openshift.io/cluster-monitoring: 'true'
