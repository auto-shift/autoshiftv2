apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quay-db
  namespace: quay-enterprise
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: quay-db
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clair-db
  namespace: quay-enterprise
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: clair-db
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quay-db-allow
  namespace: quay-enterprise
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: quay-db
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: quay-enterprise
      ports:
        - port: 5432
          protocol: TCP
        - port: 9187
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-operators
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clair-db-allow
  namespace: quay-enterprise
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: clair-db
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: quay-enterprise
      ports:
        - port: 5432
          protocol: TCP
        - port: 9187
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-operators
      ports:
        - port: 8000
          protocol: TCP
