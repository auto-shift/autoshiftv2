apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: project-onboarding
# Per-deployment scalars (${...}) are substituted by the repo-server CMP (envsubst/sed) BEFORE
# `kustomize build` runs. They live here and in placement.yaml — never in manifests/ or test/, whose
# hub templates contain `$vars` that substitution would clobber.
#
# Sixteen Policies, see policies[] below: the eight enforcing shard Policies (manifests/) and their
# eight inform-only -test Policies (test/). See "Policies" in the README.
#
# placementBindingDefaults.name: one PlacementBinding binds all sixteen to the one Placement;
# PolicyGenerator needs its name set when a binding has more than one Policy. Same name as the
# single-Policy binding it once replaced.
placementBindingDefaults:
  name: binding-policy-project-onboarding
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  # ${REMEDIATION} = inform when autoshift.dryRun, else enforce. Every -test Policy overrides it with
  # inform.
  remediationAction: ${REMEDIATION}
  # The deployment REMEDIATION again, as a Policy annotation the hub template reads
  # (.PolicyMetadata.annotations): namespace deletion is rendered only when it is exactly enforce, so
  # a dry run never emits a Namespace mustnothave, even if a root Policy is set to enforce by hand.
  policyAnnotations:
    autoshift.io/remediation: ${REMEDIATION}
  severity: medium
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  # Default Placement (placement.yaml at the dir root); policies with a different predicate set
  # their own placement.placementPath. PG includes it and generates only the PlacementBinding.
  placement:
    placementPath: placement.yaml
policies:
  # Eight shard Policies, policy-project-onboarding-0 to -7, from ONE template: every shard renders
  # manifests/ and reads its shard from its own name (.PolicyMetadata.name), so it only emits the
  # projects whose name hashes to it (adler32sum of the name, mod 8). Each has an inform-only
  # policy-project-onboarding-<shard>-test that renders test/, the same template apart from $want.
  # Fixed at 8: the name list here, $shards in the template and
  # TestProjectOnboarding_ShardPoliciesInSync must agree.
  #
  # RHACM sets enforce/inform per ConfigurationPolicy, so the template renders in both Policies and
  # each renders only the projects whose effective mode matches ($want). The inform content is its
  # own Policy (developer guide, "Gating on cluster state"): a root remediationAction overrides its
  # children, so it can never share a Policy with the enforce content. Dry-run
  # (${REMEDIATION} = inform) makes the enforcing Policies inform too.
  #
  # The enforcing ConfigurationPolicy keeps its earlier name, policy-project-onboarding-<shard>-enforce
  # (consolidateManifests: false, so PolicyGenerator honors the manifest name), so the live one is
  # updated in place. The -test ConfigurationPolicy is named after its Policy.
  #
  # No dependency either way (README, "Policies"): a -test Policy is NonCompliant exactly while its
  # shard has something to report, so gating the shard on it would deadlock, and gating the -test
  # Policy on the shard would hide its report under dry run.
  - name: policy-project-onboarding-0
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-0-enforce
  - name: policy-project-onboarding-0-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
  - name: policy-project-onboarding-1
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-1-enforce
  - name: policy-project-onboarding-1-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
  - name: policy-project-onboarding-2
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-2-enforce
  - name: policy-project-onboarding-2-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
  - name: policy-project-onboarding-3
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-3-enforce
  - name: policy-project-onboarding-3-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
  - name: policy-project-onboarding-4
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-4-enforce
  - name: policy-project-onboarding-4-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
  - name: policy-project-onboarding-5
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-5-enforce
  - name: policy-project-onboarding-5-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
  - name: policy-project-onboarding-6
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-6-enforce
  - name: policy-project-onboarding-6-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
  - name: policy-project-onboarding-7
    consolidateManifests: false
    manifests:
      - path: manifests
        name: policy-project-onboarding-7-enforce
  - name: policy-project-onboarding-7-test
    remediationAction: inform
    manifests:
      - path: test/projects.yaml
