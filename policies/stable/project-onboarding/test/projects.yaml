  {{- /* project-onboarding size estimate: {{hub $sizeAll hub}} bytes, limit {{hub $sizeLimit hub}} */}}
  {{hub- if $adminANPs hub}}
  {{- if $anpCrd }}
  {{hub- range $i, $a := $adminANPs hub}}
  {{- $liveAdmin := lookup "policy.networking.k8s.io/v1alpha1" "AdminNetworkPolicy" "" {{hub printf "autoshift-admin-%s" $a.name | toJson hub}} }}
  {{- if and $liveAdmin (ne (printf "%v" (index (dig "metadata" "labels" dict $liveAdmin) "autoshift.io/managed-by" | default "")) "project-onboarding") }}
  {{- $_ := set $status "projectOnboarding.defaults.adminNetworkPolicies" (append (index $status "projectOnboarding.defaults.adminNetworkPolicies" | default list) (printf "the AdminNetworkPolicy %v already exists and is not managed by project onboarding (no label autoshift.io/managed-by: project-onboarding), so it is not changed; to hand it over, label it autoshift.io/managed-by=project-onboarding" (dig "metadata" "name" "" $liveAdmin))) }}
  {{- else }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: policy.networking.k8s.io/v1alpha1
      kind: AdminNetworkPolicy
      metadata:
        name: {{hub printf "autoshift-admin-%s" $a.name | toJson hub}}
        labels:
          autoshift.io/managed-by: project-onboarding
      spec:
        priority: {{hub add 10 $i hub}}
        subject: {{hub $a.subject | toJson hub}}
        {{hub $a.direction hub}}:
          {{hub- range $e := $a.rules hub}}
          - {{hub $e | toJson hub}}
          {{hub- end hub}}
  {{- end }}
  {{hub- end hub}}
  {{- end }}
  {{hub- end hub}}
  {{hub- range $a := $adminANPs hub}}{{hub- $_ := set $declared (printf "AdminNetworkPolicy||autoshift-admin-%s" $a.name) true hub}}{{hub- end hub}}
  {{hub- if and $rcm $cfg (not $cfgErr) hub}}
  {{- $nsOwners := {{hub $nsOwners | toJson | base64enc | quote hub}} | base64dec | fromJson }}
  {{- $projOwners := {{hub $projOwners | toJson | base64enc | quote hub}} | base64dec | fromJson }}
  {{- $malformed := {{hub $malformed | toJson | base64enc | quote hub}} | base64dec | fromJson }}
  {{- $shard := {{hub $shard hub}} }}
  {{- $otherNs := dict }}
  {{- range $n := splitList "," {{hub join "," $otherNs | toJson hub}} }}{{- $_ := set $otherNs $n true }}{{- end }}
  {{- $_ := unset $otherNs "" }}
  {{hub- if kindIs "map" $projVal hub}}
  {{- $declaredKeys := {{hub $declared | toJson | base64enc | quote hub}} | base64dec | fromJson }}
  {{- $heldBy := dict }}
  {{- range $ns := $labeledNs }}
  {{- $nsProject := printf "%v" (dig "metadata" "labels" "autoshift.io/project" "" $ns) }}
  {{- $nsName := printf "%v" (dig "metadata" "name" "" $ns) }}
  {{- if and $nsProject (or (hasKey $nsOwners $nsName) (hasKey $otherNs $nsName)) }}
  {{- $_ := set $heldBy $nsProject true }}
  {{- end }}
  {{- end }}
  {{- $projNs := dict }}
  {{- range $ns := $labeledNs }}
  {{- $nsProject := printf "%v" (dig "metadata" "labels" "autoshift.io/project" "" $ns) }}
  {{- if $nsProject }}{{- $_ := set $projNs $nsProject (append (index $projNs $nsProject | default list) (printf "%v" (dig "metadata" "name" "" $ns))) }}{{- end }}
  {{- end }}
  {{- range $ns := $labeledNs }}
  {{- $nsName := printf "%v" (dig "metadata" "name" "" $ns) }}
  {{- $nsProject := printf "%v" (dig "metadata" "labels" "autoshift.io/project" "" $ns) }}
  {{- $owner := index $projOwners $nsProject | default dict }}
  {{- if and $owner (not (hasKey $nsOwners $nsName)) (not (hasKey $otherNs $nsName)) (not (regexMatch {{hub $platformNs | toJson hub}} $nsName)) (eq (printf "%v" $owner.ok) "true") (hasKey $rendered (printf "%v" $owner.namespace)) (not (hasKey $ready (printf "%v" $owner.namespace))) }}
  {{- $_ := set $waiting $nsProject (printf "%v" $owner.namespace) }}
  {{- end }}
  {{- if and $owner (not (hasKey $nsOwners $nsName)) (not (hasKey $otherNs $nsName)) (not (regexMatch {{hub $platformNs | toJson hub}} $nsName)) (eq (printf "%v" $owner.ok) "true") (hasKey $ready (printf "%v" $owner.namespace)) }}
  {{- $target := ternary (printf "%v" $owner.mode) "inform" {{hub $pruneOn hub}} }}
  {{- if eq $target "{{hub $want hub}}" }}
  {{- $releasedLabels := dict }}
  {{- range $k, $v := (dig "metadata" "labels" dict $ns) }}{{- if not (has $k (list "autoshift.io/project" "autoshift.io/managed-by")) }}{{- $_ := set $releasedLabels $k $v }}{{- end }}{{- end }}
  - complianceType: musthave
    metadataComplianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ $nsName | toJson }}
        labels:
          {{- range $k, $v := $releasedLabels }}
          {{ $k | toJson }}: {{ $v | toJson }}
          {{- end }}
        annotations:
          {{- range $k, $v := (dig "metadata" "annotations" dict $ns) }}
          {{ $k | toJson }}: {{ $v | toJson }}
          {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{hub- end hub}}
  {{hub- if kindIs "map" $projVal hub}}
  {{- range $kind := list (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "RoleBinding") (dict "apiVersion" "v1" "kind" "ResourceQuota") (dict "apiVersion" "v1" "kind" "LimitRange") (dict "apiVersion" "networking.k8s.io/v1" "kind" "NetworkPolicy") (dict "apiVersion" "k8s.ovn.org/v1" "kind" "EgressFirewall") (dict "apiVersion" "policy.networking.k8s.io/v1alpha1" "kind" "AdminNetworkPolicy") (dict "apiVersion" "k8s.ovn.org/v1" "kind" "EgressIP") }}
  {{- $items := list }}
  {{- if not (or (and (eq $kind.kind "EgressFirewall") (not $efCrd)) (and (eq $kind.kind "AdminNetworkPolicy") (not $anpCrd)) (and (eq $kind.kind "EgressIP") (not $eipCrd))) }}
  {{- $items = (lookup $kind.apiVersion $kind.kind "" "" "autoshift.io/managed-by=project-onboarding").items | default list }}
  {{- end }}
  {{- range $obj := $items }}
  {{- $objNs := printf "%v" (dig "metadata" "namespace" "" $obj) }}
  {{- $objName := printf "%v" (dig "metadata" "name" "" $obj) }}
  {{- $objLabel := printf "%v" (dig "metadata" "labels" "autoshift.io/project" "" $obj) }}
  {{- $objProject := $objLabel }}
  {{- if and (eq $kind.kind "EgressIP") (hasPrefix "autoshift-" $objName) }}{{- $objProject = substr 10 (len $objName) $objName }}{{- end }}
  {{- if and (eq $kind.kind "AdminNetworkPolicy") (hasPrefix "autoshift-project-" $objName) }}{{- $objProject = substr 18 (len $objName) $objName }}{{- end }}
  {{- if and (eq $kind.kind "AdminNetworkPolicy") (hasPrefix "autoshift-admin-" $objName) }}{{- $objProject = "" }}{{- end }}
  {{- $objShard := 0 }}
  {{- if $objProject }}{{- $objShard = mod (atoi (adler32sum $objProject)) {{hub $shards hub}} }}{{- end }}
  {{- $owner := dict }}
  {{- if hasKey $nsOwners $objNs }}
  {{- $owner = index $nsOwners $objNs }}
  {{- $objShard = $shard }}
  {{- else if hasKey $otherNs $objNs }}
  {{- $objShard = -1 }}
  {{- else if hasKey $projOwners $objProject }}
  {{- $owner = index $projOwners $objProject }}
  {{- end }}
  {{- $eligible := eq $objShard $shard }}
  {{- $target := "enforce" }}
  {{- if not $eligible }}
  {{- else if $owner }}
  {{- $eligible = and (eq (printf "%v" $owner.ok) "true") (hasKey $rendered (printf "%v" $owner.namespace)) }}
  {{- if and $objNs (ne $objNs (printf "%v" $owner.namespace)) (not (hasKey $ready (printf "%v" $owner.namespace))) }}{{- $eligible = false }}{{- if and $objProject (hasKey $rendered (printf "%v" $owner.namespace)) }}{{- $_ := set $waiting $objProject (printf "%v" $owner.namespace) }}{{- end }}{{- end }}
  {{- if and (not $objNs) $objProject (not (hasKey $ready (printf "%v" $owner.namespace))) }}
  {{- range $pn := index $projNs $objProject | default list }}{{- if ne $pn (printf "%v" $owner.namespace) }}{{- $eligible = false }}{{- if hasKey $rendered (printf "%v" $owner.namespace) }}{{- $_ := set $waiting $objProject (printf "%v" $owner.namespace) }}{{- end }}{{- end }}{{- end }}
  {{- end }}
  {{- $target = printf "%v" $owner.mode }}
  {{- else if hasKey $heldBy $objProject }}
  {{- $eligible = false }}
  {{- end }}
  {{- if or (hasKey $malformed $objProject) (hasKey $malformed $objLabel) }}{{- $eligible = false }}{{- end }}
  {{- if not {{hub $pruneOn hub}} }}{{- $target = "inform" }}{{- end }}
  {{hub- if $adminErrs hub}}
  {{- if and (eq $kind.kind "AdminNetworkPolicy") (hasPrefix "autoshift-admin-" $objName) }}{{- $eligible = false }}{{- end }}
  {{hub- end hub}}
  {{- if and $eligible (eq $target "{{hub $want hub}}") (ne $kind.kind "Namespace") (not (hasKey $declaredKeys (printf "%s|%s|%s" $kind.kind $objNs $objName))) }}
  {{hub- if eq $want "enforce" hub}}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: '{{ $kind.apiVersion }}'
      kind: '{{ $kind.kind }}'
      metadata:
        name: {{ $objName | toJson }}
        {{- if $objNs }}
        namespace: {{ $objNs | toJson }}
        {{- end }}
  {{hub- else hub}}
  {{- $_ := set $stale (printf "stale.%s.%s.%s" $kind.kind $objNs $objName | trunc 253) (printf "%s %s is owned by project onboarding and no longer declared; it is only reported (pruning is off, or its project is in mode inform), not deleted" $kind.kind (ternary (printf "%s/%s" $objNs $objName) $objName (ne $objNs ""))) }}
  {{hub- end hub}}
  {{- end }}
  {{- end }}
  {{- end }}
  {{hub- end hub}}
  {{hub- end hub}}
  {{- range $wp, $wns := $waiting }}
  {{- $_ := set $status $wp (append (index $status $wp | default list) (printf "waiting for destination objects in %s: the old namespace keeps its objects and labels until %s carries autoshift.io/project=%s and every declared RoleBinding autoshift-<level> is live and matches" $wns $wns $wp)) }}
  {{- end }}
  {{- $statusLabel := "autoshift.io/project-onboarding-status" }}
  {{- $statusCM := lookup "v1" "ConfigMap" "open-cluster-management-agent-addon" "project-onboarding-status-{{hub $shard hub}}" }}
  {{- $foreignStatus := and $statusCM (ne (printf "%v" (index (dig "metadata" "labels" dict $statusCM) $statusLabel | default "")) "true") }}
  {{- if $foreignStatus }}
  {{- $_ := set $status "project-onboarding.status" (append (index $status "project-onboarding.status" | default list) "ConfigMap open-cluster-management-agent-addon/project-onboarding-status-{{hub $shard hub}} exists without the label autoshift.io/project-onboarding-status: true, so project onboarding neither writes nor deletes it and cannot report there; remove it by hand") }}
  {{- end }}
  {{hub- if eq $shard 0 hub}}
  {{- $legacyCM := lookup "v1" "ConfigMap" "open-cluster-management-agent-addon" "project-onboarding-status" }}
  {{- $foreignLegacy := and $legacyCM (ne (printf "%v" (index (dig "metadata" "labels" dict $legacyCM) $statusLabel | default "")) "true") }}
  {{- if $foreignLegacy }}
  {{- $_ := set $status "project-onboarding.status" (append (index $status "project-onboarding.status" | default list) "ConfigMap open-cluster-management-agent-addon/project-onboarding-status exists without the label autoshift.io/project-onboarding-status: true, so project onboarding does not delete it as the status of the earlier single policy; remove it by hand if it is not used") }}
  {{- end }}
  {{hub- end hub}}
  {{hub- if eq $want "enforce" hub}}
  {{- if $foreignStatus }}
  {{- else if $status }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: 'project-onboarding-status-{{hub $shard hub}}'
        namespace: open-cluster-management-agent-addon
        labels:
          autoshift.io/project-onboarding-status: "true"
      data:
        {{- range $project, $msgs := $status }}
        {{ $project | toJson }}: {{ join "; " $msgs | toJson }}
        {{- end }}
  {{- else }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: 'project-onboarding-status-{{hub $shard hub}}'
        namespace: open-cluster-management-agent-addon
  {{- end }}
  {{hub- if eq $shard 0 hub}}
  {{- if not $foreignLegacy }}
  - complianceType: mustnothave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: project-onboarding-status
        namespace: open-cluster-management-agent-addon
  {{- end }}
  {{hub- end hub}}
  {{hub- else hub}}
  {{- /* Always one satisfied assertion, so the -test ConfigurationPolicy is never empty: the agent namespace exists, and naming it changes nothing even if the Policy were set to enforce. */}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: open-cluster-management-agent-addon
  {{- if or $status $stale }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: 'project-onboarding-test-report-{{hub $shard hub}}'
        namespace: open-cluster-management-agent-addon
      data:
        {{- range $project, $msgs := $status }}
        {{ $project | toJson }}: {{ join "; " $msgs | toJson }}
        {{- end }}
        {{- range $k, $v := $stale }}
        {{ $k | toJson }}: {{ $v | toJson }}
        {{- end }}
        _unsatisfiable: "never created: this key is in both data and binaryData, which the API server refuses"
      binaryData:
        _unsatisfiable: ""
  {{- end }}
  {{hub- end hub}}
