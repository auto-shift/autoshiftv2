# Do the configured Namespaces and RoleBindings exist on the cluster, and are the absent ones gone?
#
# inform-only: reports a Namespace that is missing or lacks the labels policy-project-onboarding sets
# (musthave), and a RoleBinding that is missing or binds a different role, or subjects other than
# exactly the configured ones (mustonlyhave, as the enforcing policy).
# It changes nothing. A separate policy, because a root remediationAction overrides its children, so
# an assertion bundled inside the enforcing policy would enforce.
#
# An object with state: absent is looked up on the managed cluster. While it still exists, the policy
# asserts a ConfigMap that never exists, whose name and data say what is wrong, so it reports
# NonCompliant with a readable message. Once it is gone, the entry contributes nothing.
# This instead of a delete-type assertion: pressing Enforce on this policy in the console would then
# delete the object.
#
# The template counts the checks it emits and fails when there are none, for example when every
# project is absent and already gone, so the policy never reports Compliant with nothing checked.
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $projects := (dig "projectOnboarding" "projects" (dict) $cfg) hub}}
  {{hub- if not $projects hub}}
  {{hub- fail "project-onboarding: config.projectOnboarding.projects is missing or empty in the rendered-config ConfigMap" hub}}
  {{hub- end hub}}
  {{- $checks := 0 }}
  {{hub- range $name, $p := $projects hub}}
  {{hub- if eq ($p.state | default "present") "absent" hub}}
  {{- $ns := (lookup "v1" "Namespace" "" {{hub $name | toJson hub}} | default dict) }}
  {{- if $ns }}
  {{- $checks = add1 $checks }}
  {{- if eq (dig "metadata" "annotations" "autoshift.io/project-onboarding-created" "" $ns) "true" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{hub printf "project-onboarding-absent-namespace-%s-still-exists" $name | toJson hub}}
        namespace: {{hub $name | toJson hub}}
      data:
        problem: {{hub printf "Namespace %s has state absent but still exists. policy-project-onboarding deletes it when enforced; under dryRun or inform it only reports." $name | toJson hub}}
  {{- else }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{hub printf "project-onboarding-absent-namespace-%s-not-created-by-policy" $name | toJson hub}}
        namespace: {{hub $name | toJson hub}}
      data:
        problem: {{hub printf "Namespace %s has state absent, but it was not created by project-onboarding and will not be deleted. Delete it by hand, or remove the project from config." $name | toJson hub}}
  {{- end }}
  {{- end }}
  {{hub- else hub}}
  {{hub- $labels := merge (dict "autoshift.io/managed-by" "project-onboarding") ($p.labels | default dict) hub}}
  {{- $checks = add1 $checks }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{hub $name | toJson hub}}
        labels: {{hub $labels | toJson hub}}
  {{hub- range $binding, $rb := ($p.roleBindings | default dict) hub}}
  {{hub- if eq ($rb.state | default "present") "absent" hub}}
  {{- if (lookup "rbac.authorization.k8s.io/v1" "RoleBinding" {{hub $name | toJson hub}} {{hub printf "autoshift-%s" $binding | toJson hub}} | default dict) }}
  {{- $checks = add1 $checks }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{hub printf "project-onboarding-absent-rolebinding-autoshift-%s-still-exists" $binding | toJson hub}}
        namespace: {{hub $name | toJson hub}}
      data:
        problem: {{hub printf "RoleBinding %s/autoshift-%s has state absent but still exists. policy-project-onboarding deletes it when enforced; under dryRun or inform it only reports." $name $binding | toJson hub}}
  {{- end }}
  {{hub- else hub}}
  {{hub- $subjects := list hub}}
  {{hub- range $g := ($rb.groups | default list) hub}}
  {{hub- $subjects = append $subjects (dict "apiGroup" "rbac.authorization.k8s.io" "kind" "Group" "name" $g) hub}}
  {{hub- end hub}}
  {{hub- range $u := ($rb.users | default list) hub}}
  {{hub- $subjects = append $subjects (dict "apiGroup" "rbac.authorization.k8s.io" "kind" "User" "name" $u) hub}}
  {{hub- end hub}}
  {{hub- range $sa := ($rb.serviceAccounts | default list) hub}}
  {{hub- $subjects = append $subjects (dict "kind" "ServiceAccount" "name" $sa.name "namespace" ($sa.namespace | default $name)) hub}}
  {{hub- end hub}}
  {{hub- $roleRef := dict "apiGroup" "rbac.authorization.k8s.io" "kind" "ClusterRole" "name" $rb.clusterRole hub}}
  {{hub- if $rb.role hub}}
  {{hub- $roleRef = dict "apiGroup" "rbac.authorization.k8s.io" "kind" "Role" "name" $rb.role hub}}
  {{hub- end hub}}
  {{- $checks = add1 $checks }}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{hub printf "autoshift-%s" $binding | toJson hub}}
        namespace: {{hub $name | toJson hub}}
      roleRef: {{hub $roleRef | toJson hub}}
      subjects: {{hub $subjects | toJson hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{hub- end hub}}
  {{- if eq $checks 0 }}
  {{- fail "project-onboarding: every project in config has state absent and none still exists, so there is nothing left to check; remove those projects from config, or set project-onboarding to 'false'" }}
  {{- end }}
