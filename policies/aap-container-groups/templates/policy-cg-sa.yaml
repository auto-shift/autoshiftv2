apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-aap-sa
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: AutoShiftv2
    policy.open-cluster-management.io/controls: OpenShift Standard
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: aap-sa
          namespace: policies-autoshift
        spec:
          remediationAction: enforce # will be overridden by remediationAction in parent policy
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: aap-sa
                  namespace: {{ .Values.runner_ns }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: aap-sa-role
          namespace: policies-autoshift
        spec:
          remediationAction: enforce # will be overridden by remediationAction in parent policy
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                kind: Role
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: aap-sa-role
                  namespace: {{ .Values.runner_ns }}
                rules:
                  - apiGroups:
                      - ""
                    resources:
                      - pods/exec
                      - pods/attach
                      - pods/log
                      - pods
                      - secrets
                    verbs:
                      - get
                      - list
                      - watch
                      - create
                      - delete
                      - update
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: aap-sa-rolebinding
          namespace: policies-autoshift
        spec:
          remediationAction: enforce # will be overridden by remediationAction in parent policy
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                kind: RoleBinding
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: aap-sa-rolebinding
                  namespace: {{ .Values.runner_ns }}
                subjects:
                  - kind: ServiceAccount
                    name: aap-sa
                    namespace: {{ .Values.runner_ns }}
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: aap-sa-role
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: oc-runner-sa
          namespace: policies-autoshift
        spec:
          remediationAction: enforce # will be overridden by remediationAction in parent policy
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: oc-runner
                  namespace: {{ .Values.runner_ns }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: oc-runner-role
          namespace: policies-autoshift
        spec:
          remediationAction: enforce # will be overridden by remediationAction in parent policy
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                kind: Role
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: oc-runner-role
                  namespace: {{ .Values.runner_ns }}
                rules:
                  - apiGroups:
                      - ""
                    resources:
                      - serviceaccounts/token
                      - pods
                      - secrets
                    verbs:
                      - get
                      - list
                      - watch
                      - create
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: oc-runner-rolebinding
          namespace: policies-autoshift
        spec:
          remediationAction: enforce # will be overridden by remediationAction in parent policy
          severity: high
          object-templates-raw: |
            - complianceType: musthave
              objectDefinition:
                kind: RoleBinding
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: oc-runner-rolebinding
                  namespace: {{ .Values.runner_ns }}
                subjects:
                  - kind: ServiceAccount
                    name: oc-runner
                    namespace: {{ .Values.runner_ns }}
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: oc-runner-role

---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-aap-sa
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := .Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := .Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/aap-cg'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-aap-sa
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-aap-sa
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-aap-sa
    apiGroup: policy.open-cluster-management.io
    kind: Policy

##### The Token for this SA will have to be created manually, as tokens are requests and not CRDs in openshift.  A token can be created by running "oc create token aap-sa --duration=$((365*24))h"
