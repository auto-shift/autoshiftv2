{{- $policyNamespace := $.Values.policy_namespace -}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-servicenow-kva-informer-secret
  namespace: {{ $policyNamespace }}
spec:
{{- if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  hubTemplateOptions:
    serviceAccountName: secret-reader
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: kva-informer-secret
          namespace: {{ $policyNamespace }}
        spec:
          remediationAction: enforce
          object-templates-raw: |
            {{ "{{hub-" }} $kvaConfig := (index (fromConfigMap "{{ $policyNamespace }}" (print .ManagedClusterName ".rendered-config") "config" | fromYaml) "kva" | default dict) {{ "hub}}" }}
            {{ "{{hub-" }} $kvaNs := (index $kvaConfig "namespace" | default "{{ .Values.namespace }}") {{ "hub}}" }}
            {{ "{{hub-" }} $secret := (index $kvaConfig "secret-name" | default "k8s-informer-cred-{{ .Values.servicenow.instance.name }}") {{ "hub}}" }}
            {{ "{{hub-" }} $secretNs := (index $kvaConfig "secret-namespace" | default "{{ .Values.kvaHubSecretNamespace }}") {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: {{ "{{hub" }} $secret {{ "hub}}" }}
                  namespace: "{{ "{{hub" }} $kvaNs {{ "hub}}" }}"
                type: Opaque
                data:
                  .user: {{ "{{hub" }} fromSecret $secretNs $secret ".user" {{ "hub}}" }}
                  .password: {{ "{{hub" }} fromSecret $secretNs $secret ".password" {{ "hub}}" }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-kva-informer-secret
  namespace: {{ $policyNamespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := .Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := .Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/kva'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-kva-informer-secret
  namespace: {{ $policyNamespace }}
placementRef:
  name: placement-policy-kva-informer-secret
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-servicenow-kva-informer-secret
    apiGroup: policy.open-cluster-management.io
    kind: Policy
...
