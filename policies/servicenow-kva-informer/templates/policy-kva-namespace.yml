{{- $policyNamespace := $.Values.policy_namespace -}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-servicenow-kva-informer-namespace
  namespace: {{ $policyNamespace }}
spec:
{{- if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: kva-informer-namespace
          namespace: {{ $policyNamespace }}
        spec:
          remediationAction: enforce
          evaluationInterval:
            compliant: 5m
            noncompliant: 5m
          object-templates-raw: |
            {{ "{{hub-" }} $kvaConfig := (index (fromConfigMap "{{ $policyNamespace }}" (print .ManagedClusterName ".rendered-config") "config" | fromYaml) "kva" | default dict) {{ "hub}}" }}
            {{ "{{" }} $kvaNs := "{{ "{{hub-" }} (index $kvaConfig "namespace" | default "kva-informer") {{ "hub}}" }}" {{ "}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: project.openshift.io/v1
                kind: Project
                metadata:
                  name: "{{ "{{" }} $kvaNs {{ "}}" }}"
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-kva-informer-namespace
  namespace: {{ $policyNamespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := .Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := .Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/kva'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-kva-informer-namespace
  namespace: {{ $policyNamespace }}
placementRef:
  name: placement-policy-kva-informer-namespace
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-servicenow-kva-informer-namespace
    apiGroup: policy.open-cluster-management.io
    kind: Policy
...
