# Default values for trident.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
policy_namespace: open-cluster-policies
trident:
  namespace: trident
  channel: stable
  installPlanApproval: Automatic
  name: trident-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
vault:
  connectionAddress: https://vault.apps.dcce-cle-dev.va.gov # The URL of your Vault server
  audience: https://api.dcce-cle-vsh1243-test-1.va.gov:6443/openid/v1/jwks           # This will be the JWKS url for OIDC on the cluster
  role: default-role              # The role used by your chosen auth method
  mount:  rh-vso-test-kv           # The name of your secret engine
  path: netapp-admin              # The secret’s path inside that engine
  serviceAccount: default     # The Kubernetes service account to use
  authMountName: vapo-aitc-nprd-jwt-sbx     # The name of your Vault auth method
  secretName: backend-tbc-ontap-san-secret       # The name of the Kubernetes secret that will be created
  operatorNamespace: trident # The namespace you're creating the secret in
  vaultNamespace: trident    # The Vault namespace your resources are in
