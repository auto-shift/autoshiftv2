apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-gen-virt-sa-token
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: AutoShiftv2
    policy.open-cluster-management.io/controls: OpenShift Standard
spec:
  disabled: false
  hubTemplateOptions:
    serviceAccountName: secret-reader
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gen-virt-sa-token
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw : |
            {{ "{{hub" }} $cfg := fromConfigMap "{{ $.Values.policy_namespace }}" (print .ManagedClusterName ".rendered-config") "config" | default "{}" | fromYaml {{ "hub}}" }}
            {{ "{{hub-" }} $virtConfig := index $cfg `aap-ocp-virt` | default (dict) {{ "hub}}" }}
            {{ "{{hub-" }} $schedule := index $virtConfig `token-cron-schedule` | default "{{ .Values.virt_token_cron_schedule }}" {{ "hub}}" }}
            {{ "{{hub-" }} $expiryDays := index $virtConfig `token-expiry-days` | default {{ .Values.virt_token_expiry_days }} {{ "hub}}" }}
            {{ "{{hub-" }} $thresholdDays := index $virtConfig `token-renewal-threshold-days` | default {{ .Values.virt_token_renewal_threshold_days }} {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: batch/v1
                kind: Job
                metadata:
                 name: oc-token-init-job
                 namespace: {{ .Values.virt_ns }}
                spec:
                 template:
                   spec:
                     serviceAccountName: oc-runner-virt
                     containers:
                       - name: oc
                         image: {{ .Values.oc_cli_image }}
                         resources:
                           requests:
                             cpu: 100m
                             memory: 128Mi
                           limits:
                             cpu: 500m
                             memory: 256Mi
                         command: ["/bin/bash", "-c"]
                         args:
                           - |
                             if ! oc get secret aap-sa-virt-token -n {{ .Values.virt_ns }} &> /dev/null; then
                               echo "Secret does not exist, creating."
                               TOKEN=$(oc create token aap-virt-sa -n {{ .Values.virt_ns }} --duration=$(( {{ "{{hub" }} $expiryDays {{ "hub}}" }} * 24))h)
                               oc create secret generic aap-sa-virt-token -n {{ .Values.virt_ns }} --from-literal=token=$TOKEN
                               echo "Token created successfully."
                             else
                               echo "Secret already exists, no action needed."
                             fi
                     restartPolicy: Never
            - complianceType: musthave
              objectDefinition:
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                 name: oc-token-refresh-cronjob
                 namespace: {{ .Values.virt_ns }}
                spec:
                 schedule: "{{ "{{hub" }} $schedule {{ "hub}}" }}"
                 jobTemplate:
                   spec:
                     template:
                       spec:
                         serviceAccountName: oc-runner-virt
                         containers:
                           - name: oc
                             image: {{ .Values.oc_cli_image }}
                             resources:
                               requests:
                                 cpu: 100m
                                 memory: 128Mi
                               limits:
                                 cpu: 500m
                                 memory: 256Mi
                             command: ["/bin/bash", "-c"]
                             args:
                               - |
                                 if ! oc get secret aap-sa-virt-token -n {{ .Values.virt_ns }} &> /dev/null; then
                                   echo "Secret does not exist, creating."
                                   TOKEN=$(oc create token aap-virt-sa -n {{ .Values.virt_ns }} --duration=$(( {{ "{{hub" }} $expiryDays {{ "hub}}" }} * 24))h)
                                   oc create secret generic aap-sa-virt-token -n {{ .Values.virt_ns }} --from-literal=token=$TOKEN
                                   echo "Token created successfully."
                                   exit 0
                                 fi
                                 echo "Secret exists, checking expiry."
                                 TOKEN_VAL=$(oc get secret aap-sa-virt-token -n {{ .Values.virt_ns }} -o jsonpath='{.data.token}' | base64 -d)
                                 PAYLOAD=$(echo "$TOKEN_VAL" | cut -d'.' -f2)
                                 LEN=${#PAYLOAD}
                                 PAD=$((4 - LEN % 4))
                                 [ $PAD -ne 4 ] && PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
                                 EXP=$(echo "$PAYLOAD" | tr -- '-_' '+/' | base64 -d 2>/dev/null | grep -o '"exp":[0-9]*' | grep -o '[0-9]*$')
                                 NOW=$(date +%s)
                                 THRESHOLD=$((NOW + {{ "{{hub" }} $thresholdDays {{ "hub}}" }} * 24 * 3600))
                                 DAYS_REMAINING=$(( (EXP - NOW) / 86400 ))
                                 EXP_DATE=$(date -d "@$EXP" '+%Y-%m-%d %H:%M:%S UTC')
                                 echo "Token expires: $EXP_DATE ($DAYS_REMAINING days remaining)"
                                 if [ "$EXP" -le "$THRESHOLD" ]; then
                                   echo "Token expires within {{ "{{hub" }} $thresholdDays {{ "hub}}" }} days, renewing."
                                   oc delete secret aap-sa-virt-token -n {{ .Values.virt_ns }}
                                   TOKEN=$(oc create token aap-virt-sa -n {{ .Values.virt_ns }} --duration=$(( {{ "{{hub" }} $expiryDays {{ "hub}}" }} * 24))h)
                                   oc create secret generic aap-sa-virt-token -n {{ .Values.virt_ns }} --from-literal=token=$TOKEN
                                   echo "Token renewed successfully."
                                 else
                                   echo "Token is valid for more than {{ "{{hub" }} $thresholdDays {{ "hub}}" }} days, no action needed."
                                 fi
                         restartPolicy: Never
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-gen-virt-sa-token
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := .Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := .Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/aap-ocp-virt'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-gen-virt-sa-token
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-gen-virt-sa-token
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-gen-virt-sa-token
    apiGroup: policy.open-cluster-management.io
    kind: Policy
