apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-virtualization-cudns
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  dependencies: 
    - name: policy-virtualization-br-data
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-virtualization-cudns-with-nncp
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{ "{{hub" }} $configs := index (index (fromConfigMap "{{ $.Values.policy_namespace }}" (print .ManagedClusterName ".rendered-config") "config" | default "" | fromYaml) "networking" | default dict) "cudn" | default dict {{ "hub}}" }}
            {{ "{{hub" }} range $idx, $vlan := $configs.vlans {{ "hub}}" }}
            {{ "{{hub" }} $vlanKey := printf "vlan-%v" $vlan.id {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: k8s.ovn.org/v1
                kind: ClusterUserDefinedNetwork
                metadata:
                  name: "{{ "{{hub" }} printf "%s-%s-vm" $vlan.env $vlan.id {{ "hub}}" }}"
                spec:
                  namespaceSelector:
                    matchExpressions:
                      - key: "{{ "{{hub" }} $vlanKey {{ "hub}}" }}"
                        operator: Exists
                  network:
                    topology: Localnet
                    localnet:
                      role: Secondary
                      mtu: 9000
                      physicalNetworkName: "{{ "{{hub" }} printf "%s-%s-vm" $vlan.env $vlan.id {{ "hub}}" }}"
                      ipam:
                        mode: Disabled
                      vlan:
                        mode: Access
                        access:
                          id: {{ "{{hub" }} $vlan.id {{ "hub}}" }}
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: nmstate.io/v1
                kind: NodeNetworkConfigurationPolicy
                metadata:
                  name: "{{ "{{hub" }} printf "%s-%s-vm-general-%s" $vlan.env $vlan.id $vlan.subnet {{ "hub}}" }}"
                spec:
                  desiredState:
                    ovn:
                      bridge-mappings:
                        - bridge: br-data
                          localnet: "{{ "{{hub" }} printf "%s-%s-vm" $vlan.env $vlan.id {{ "hub}}" }}"
                          state: present
            {{ "{{hub" }} end {{ "hub}}" }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-virtualization-cudns
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := .Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/virt'
              operator: In
              values:
              - 'true'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-virtualization-cudns
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-virtualization-cudns
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-virtualization-cudns
    apiGroup: policy.open-cluster-management.io
    kind: Policy