apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-virtualization-hyperconverged
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  dependencies:
    - name: policy-virtualization-operator-install
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: virt-hyperconverged
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: hco.kubevirt.io/v1beta1
                kind: HyperConverged
                metadata:
                  annotations:
                    deployOVS: 'false'
                  name: kubevirt-hyperconverged
                  namespace: openshift-cnv
                  labels:
                    app: kubevirt-hyperconverged
                spec:
                  virtualMachineOptions:
                    disableFreePageReporting: false
                    disableSerialConsoleLog: true
                  higherWorkloadDensity:
                    memoryOvercommitPercentage: 100
                  liveMigrationConfig:
                    allowAutoConverge: false
                    allowPostCopy: false
                    completionTimeoutPerGiB: 150
                    parallelMigrationsPerCluster: 5
                    parallelOutboundMigrationsPerNode: 2
                    progressTimeout: 150
                  certConfig:
                    ca:
                      duration: 48h0m0s
                      renewBefore: 24h0m0s
                    server:
                      duration: 24h0m0s
                      renewBefore: 12h0m0s
                  infra: {}
                  evictionStrategy: LiveMigrate
                  featureGates:
                    enableCommonBootImageImport: true
                    downwardMetrics: false
                    disableMDevConfiguration: false
                    enableApplicationAwareQuota: false
                    deployKubeSecondaryDNS: false
                    alignCPUs: false
                    deployVmConsoleProxy: false
                    persistentReservation: false
                    autoResourceLimits: false
                  workloadUpdateStrategy:
                    batchEvictionInterval: 1m0s
                    batchEvictionSize: 10
                    workloadUpdateMethods:
                      - LiveMigrate
                  uninstallStrategy: BlockUninstallIfWorkloadsExist
                  dataImportCronTemplates:
                    - metadata:
                        annotations:
                          cdi.kubevirt.io/storage.bind.immediate.requested: 'true'
                        labels:
                          kubevirt.io/dynamic-credentials-support: 'true'
                        name: centos-stream10-image-cron
                      spec:
                        garbageCollect: Outdated
                        importsToKeep: 1
                        managedDataSource: centos-stream10
                        schedule: 49 1/12 * * *
                        template:
                          metadata: {}
                          spec:
                            source:
                              registry:
                                pullMethod: node
                                url: 'docker://quay.io/containerdisks/centos-stream:10'
                            storage:
                              resources:
                                requests:
                                  storage: 30Gi
                    - metadata:
                        annotations:
                          cdi.kubevirt.io/storage.bind.immediate.requested: 'true'
                        labels:
                          kubevirt.io/dynamic-credentials-support: 'true'
                        name: centos-stream9-image-cron
                      spec:
                        garbageCollect: Outdated
                        importsToKeep: 1
                        managedDataSource: centos-stream9
                        schedule: 49 1/12 * * *
                        template:
                          metadata: {}
                          spec:
                            source:
                              registry:
                                pullMethod: node
                                url: 'docker://quay.io/containerdisks/centos-stream:9'
                            storage:
                              resources:
                                requests:
                                  storage: 30Gi
                    - metadata:
                        annotations:
                          cdi.kubevirt.io/storage.bind.immediate.requested: 'true'
                        labels:
                          kubevirt.io/dynamic-credentials-support: 'true'
                        name: fedora-image-cron
                      spec:
                        garbageCollect: Outdated
                        importsToKeep: 1
                        managedDataSource: fedora
                        schedule: 49 1/12 * * *
                        template:
                          metadata: {}
                          spec:
                            source:
                              registry:
                                pullMethod: node
                                url: 'docker://quay.io/containerdisks/fedora:latest'
                            storage:
                              resources:
                                requests:
                                  storage: 30Gi
                    - metadata:
                        annotations:
                          cdi.kubevirt.io/storage.bind.immediate.requested: 'true'
                        labels:
                          kubevirt.io/dynamic-credentials-support: 'true'
                        name: rhel10-image-cron
                      spec:
                        garbageCollect: Outdated
                        importsToKeep: 1
                        managedDataSource: rhel10
                        schedule: 49 1/12 * * *
                        template:
                          metadata: {}
                          spec:
                            source:
                              registry:
                                imageStream: rhel10-guest
                                pullMethod: node
                            storage:
                              resources:
                                requests:
                                  storage: 30Gi
                    - metadata:
                        annotations:
                          cdi.kubevirt.io/storage.bind.immediate.requested: 'true'
                        name: rhel8-image-cron
                      spec:
                        garbageCollect: Outdated
                        importsToKeep: 1
                        managedDataSource: rhel8
                        schedule: 49 1/12 * * *
                        template:
                          metadata: {}
                          spec:
                            source:
                              registry:
                                imageStream: rhel8-guest
                                pullMethod: node
                            storage:
                              resources:
                                requests:
                                  storage: 30Gi
                    - metadata:
                        annotations:
                          cdi.kubevirt.io/storage.bind.immediate.requested: 'true'
                        labels:
                          kubevirt.io/dynamic-credentials-support: 'true'
                        name: rhel9-image-cron
                      spec:
                        garbageCollect: Outdated
                        importsToKeep: 1
                        managedDataSource: rhel9
                        schedule: 49 1/12 * * *
                        template:
                          metadata: {}
                          spec:
                            source:
                              registry:
                                imageStream: rhel9-guest
                                pullMethod: node
                            storage:
                              resources:
                                requests:
                                  storage: 30Gi
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-virtualization-hyperconverged
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := .Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := .Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/virt'
              operator: In
              values:
              - 'true'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-virtualization-hyperconverged
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-virtualization-hyperconverged
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-virtualization-hyperconverged
    apiGroup: policy.open-cluster-management.io
    kind: Policy
