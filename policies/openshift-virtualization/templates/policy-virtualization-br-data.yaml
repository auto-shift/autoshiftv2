apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-virtualization-br-data
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  dependencies: 
    - name: policy-nmstate
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-virtualization-data-br-nncp
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: nmstate.io/v1
                kind: NodeNetworkConfigurationPolicy
                metadata:
                  name: bond0-with-br-data
                spec:
                  desiredState:
                    interfaces:
                      - bridge:
                          allow-extra-patch-ports: true
                          options:
                            stp: false
                          port:
                            - name: bond0
                        description: A dedicated OVS bridge with bond0 as a port
                        name: br-data
                        state: up
                        type: ovs-bridge
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: policy-virtualization-br-data-test
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: nmstate.io/v1
                kind: NodeNetworkConfigurationPolicy
                metadata:
                  name: bond0-with-br-data
                status:
                  conditions:
                    - reason: SuccessfullyConfigured
                      status: 'True'
                      type: Available
                    - status: 'False'
                      type: Degraded
                    - status: 'False'
                      type: Progressing
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-virtualization-br-data
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := .Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/virt'
              operator: In
              values:
              - 'true'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-virtualization-br-data
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-virtualization-br-data
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-virtualization-br-data
    apiGroup: policy.open-cluster-management.io
    kind: Policy