apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-oauth
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
{{- if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{- end }}
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy 
      name: policy-oauth-ca-bundle
      namespace: {{ .Values.policy_namespace }}
      compliance: Compliant
  disabled: false
  hubTemplateOptions:
    serviceAccountName: secret-reader
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: oauth
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw : |
            {{ "{{hub" }} $cfg := fromConfigMap "{{ $.Values.policy_namespace }}" (print .ManagedClusterName ".rendered-config") "config" | default "{}" | fromYaml {{ "hub}}" }}
            {{ "{{hub-" }} $ldapConfig := index $cfg `ldap` | default (dict) {{ "hub}}" }}
            {{ "{{hub-" }} $authConfig := index $cfg `authentication` | default (dict) {{ "hub}}" }}
            {{ "{{hub-" }} $secret := index .ManagedClusterLabels "autoshift.io/ldap-groupsync-secret" | default "{{ .Values.ldap_groupsync_secret }}" {{ "hub}}" }}
            {{ "{{hub" }} $bindDN := fromSecret (index .ManagedClusterLabels `autoshift.io/auth-secrets-namespace`) $secret "bindDN" {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders:
                {{ "{{hub-" }} if not (empty $authConfig) {{ "hub}}" }}
                  - mappingMethod: add
                    name: VA-Entra-ID
                    openID:
                      claims:
                        groups:
                          - groups
                        name:
                          - name
                        preferredUsername:
                          - preferred_username
                      clientID: {{ "{{hub" }} $authConfig.entraidClientID {{ "hub}}" }}
                      clientSecret:
                        name: entraid-client-secret
                      extraScopes:
                        - profile
                      issuer: {{ "{{hub" }} $authConfig.entraidIssuerURL {{ "hub}}" }}
                    type: OpenID
                {{ "{{hub-" }} end {{ "hub}}" }}

                {{ "{{hub-" }} if not (empty $ldapConfig) {{ "hub}}" }}
                  - type: LDAP
                    mappingMethod: add
                    name: VA Active Directory
                    ldap:
                      attributes:
                        email: []
                        id:
                          - userPrincipalName
                        name:
                          - displayName
                        preferredUsername:
                          - userPrincipalName
                      bindDN: {{ "{{hub" }} $bindDN | base64dec | quote {{ "hub}}" }}
                      bindPassword:
                        name: ldap-bind-password
                      ca:
                        name: ldap-ca
                      insecure: false
                      url: '{{ "{{hub" }} index $ldapConfig `url` {{ "hub}}" }}/{{ "{{hub" }} index $ldapConfig `url-search` {{ "hub}}" }}'
                {{ "{{hub-" }} end {{ "hub}}" }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: oauth-test
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: ClusterOperator
                metadata:
                  name: authentication
                status:
                  conditions:
                    - message: All is well
                      reason: AsExpected
                      status: 'False'
                      type: Degraded
                    - message: 'AuthenticatorCertKeyProgressing: All is well'
                      reason: AsExpected
                      status: 'False'
                      type: Progressing
                    - message: All is well
                      reason: AsExpected
                      status: 'True'
                      type: Available
                    - message: All is well
                      reason: AsExpected
                      status: 'True'
                      type: Upgradeable
                    - reason: NoData
                      status: Unknown
                      type: EvaluationConditionsDetected
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-oauth
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/oauth'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-oauth
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-oauth
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-oauth
    apiGroup: policy.open-cluster-management.io
    kind: Policy
