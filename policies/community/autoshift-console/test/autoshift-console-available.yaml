# Does the console plugin have a running pod?
#
# The deploy policy is satisfied by the Deployment object alone, which a failed image pull still
# creates, and the enable policy stays quiet until pods are up. This asserts the Deployment's own
# Available condition, so it reports NonCompliant for as long as no replica is ready and Compliant
# once one is. Asserting the real status rather than emitting a stand-in object means there is always
# something to report, and nothing to create: an enforce override cannot satisfy a status field.
object-templates-raw: |
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: autoshift-console
        namespace: autoshift-console
      status:
        conditions:
          - type: Available
            status: 'True'
