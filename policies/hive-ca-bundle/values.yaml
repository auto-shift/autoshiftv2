# Default values for hive-ca-bundle.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
policy_namespace: open-cluster-policies
hive:
  caSecretName: user-ca-bundle
  caConfigMapName: user-ca-bundle
  caConfigMapNamespace: openshift-config
  caConfigMapKey: ca-bundle.crt
#
# This policy does two things:
# 1. Patches the cluster-scoped HiveConfig to reference additionalCertificateAuthoritiesSecretRef
# 2. Deploys the CA bundle Secret into each managed cluster's namespace on the hub
#
# The CA bundle is sourced from the hub cluster's openshift-config/user-ca-bundle ConfigMap.
#
# Examples:
# autoshift.io/hive-ca-bundle: 'true'
