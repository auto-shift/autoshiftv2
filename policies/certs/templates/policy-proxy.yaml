{{ $policyNamespace := $.Values.policy_namespace }}
---
##### CONFIGURE CLUSTER PROXY #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-proxy-ca
  namespace: {{ $policyNamespace }}
spec:
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: policy-ca-cert-bundle
      namespace: "{{ $policyNamespace }}"
      compliance: Compliant
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-proxy-ca
      spec:
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: config.openshift.io/v1
            kind: Proxy
            metadata:
              name: cluster
            spec:
              trustedCA:
                name: user-ca-bundle
        remediationAction: enforce
        severity: medium
---
##### CREATE USER CA BUNDLE FOR PROXY #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-ca-cert-bundle
  namespace: {{ $policyNamespace }}
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-ca-cert-bundle
      spec:
        object-templates-raw: |
          - complianceType: musthave
            objectDefinition: 
              apiVersion: v1
              kind: ConfigMap
              metadata: 
                name: user-ca-bundle
                namespace: openshift-config
              data: 
                ca-bundle.crt: |
                  {{- $.Values.caBundle | nindent 18 }}
---
##### CREATE API AND APPS TLS CERTS #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-api-ingress-tls
  namespace: {{ $policyNamespace }}
spec:
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy 
      name: policy-venafi-issuer
      namespace: "{{ $policyNamespace }}"
      compliance: Compliant
  remediationAction: enforce
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-api-ingress-tls
      spec:
        object-templates-raw: |

          {{ "{{-" }} $clusterName := "{{ "{{hub" }} .ManagedClusterName {{ "hub}}" }}" {{ "}}" }}
          {{ "{{-" }} $dnsNames := (dict) {{ "}}" }}
          {{ "{{-" }} $_ := set $dnsNames "api" (printf `api.%s.va.gov` $clusterName) {{ "}}" }}
          {{ "{{-" }} $_ := set $dnsNames "apps" (printf `*.apps.%s.va.gov` $clusterName) {{ "}}" }}
          {{ "{{-" }} $_ := set $dnsNames "clusterName" $clusterName {{ "}}" }}
          {{ "{{-" }} if eq $clusterName "local-cluster" {{ "}}" }}
            {{ "{{-" }} $infraName := (index (fromClusterClaim "infrastructure.openshift.io" | fromJson) "infraName") {{ "}}" }}
            {{ "{{-" }} $infraNameSuffix := (print $infraName | regexFind `-[A-z0-9]+$`) {{ "}}" }}
            {{ "{{-" }} $clusterNameDerived := (replace $infraNameSuffix "" $infraName) {{ "}}" }}
            {{ "{{-" }} $_ := set $dnsNames "api" (printf `api.%s.va.gov` $clusterNameDerived) {{ "}}" }}
            {{ "{{-" }} $_ := set $dnsNames "apps" (printf `*.apps.%s.va.gov` $clusterNameDerived) {{ "}}" }}
             {{ "{{-" }} $_ := set $dnsNames "clusterName" $clusterNameDerived {{ "}}" }}
          {{ "{{-" }} end {{ "}}" }}
          - complianceType: musthave
            objectDefinition:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: api-tls
                namespace: openshift-config
                labels: 
                  debug/cluster-name-derived: "{{ "{{" }} $dnsNames.clusterName {{ "}}" }}"
              spec:
                commonName: "{{ "{{" }} $dnsNames.api {{ "}}" }}"
                dnsNames:
                 - "{{ "{{" }} $dnsNames.api {{ "}}" }}"
                issuerRef:
                  kind: ClusterIssuer 
                  name: venafi
                secretName: api-tls
              status:
                conditions:
                  - type: Ready
                    status: 'True'
          - complianceType: musthave
            objectDefinition: 
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: wildcard-tls
                namespace: openshift-ingress
              spec:
                commonName: "{{ "{{" }} $dnsNames.apps {{ "}}" }}"
                dnsNames:
                 - "{{ "{{" }} $dnsNames.apps {{ "}}" }}"
                issuerRef:
                  kind: ClusterIssuer 
                  name: venafi
                secretName: wildcard-tls
              status:
                conditions:
                  - type: Ready
                    status: 'True'
            {{/*
            {{ "{{-" }} $clusterNameDerived := index (index (fromClusterClaim "infrastructure.openshift.io" | fromJson) "infraName" | regexSplit `-[A-z0-9]+$`) 0 {{ "}}" }}
            {{ "{{-" }} $clusterNameDerived := (index (fromClusterClaim "infrastructure.openshift.io" | fromJson) "infraName") {{ "}}" }}
            */}}
---
##### CONFIGURE INGRESS CONTROLLER TO USE APPS CERT #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-ingress-cert
  namespace: {{ $policyNamespace }}
spec:
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy 
      name: policy-api-ingress-tls
      namespace: "{{ $policyNamespace }}"
      compliance: Compliant
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-ingress-cert
      spec:
        object-templates-raw: |
          - complianceType: musthave
            objectDefinition:
              apiVersion: operator.openshift.io/v1
              kind: IngressController
              metadata: 
                name: default
                namespace: openshift-ingress-operator
              spec:
                defaultCertificate:
                  name: wildcard-tls
              status:
                conditions:
                  - type: Available
                    status: 'True'
                  - type: Degraded
                    status: 'False'
---
##### CONFIGURE APIServer TO USE API CERT #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-api-cert
  namespace: {{ $policyNamespace }}
spec:
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy 
      name: policy-api-ingress-tls
      namespace: "{{ $policyNamespace }}"
      compliance: Compliant
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-api-cert
      spec:
        object-templates-raw: |

          {{ "{{-" }} $clusterName := "{{ "{{hub" }} .ManagedClusterName {{ "hub}}" }}" {{ "}}" }}
          {{ "{{-" }} $dnsNames := (dict) {{ "}}" }}
          {{ "{{-" }} $_ := set $dnsNames "api" (printf `api.%s.va.gov` $clusterName) {{ "}}" }}
          {{ "{{-" }} $_ := set $dnsNames "clusterName" $clusterName {{ "}}" }}
          {{ "{{-" }} if eq $clusterName "local-cluster" {{ "}}" }}
            {{ "{{-" }} $infraName := (index (fromClusterClaim "infrastructure.openshift.io" | fromJson) "infraName") {{ "}}" }}
            {{ "{{-" }} $infraNameSuffix := (print $infraName | regexFind `-[A-z0-9]+$`) {{ "}}" }}
            {{ "{{-" }} $clusterNameDerived := (replace $infraNameSuffix "" $infraName) {{ "}}" }}
            {{ "{{-" }} $_ := set $dnsNames "api" (printf `api.%s.va.gov` $clusterNameDerived) {{ "}}" }}
             {{ "{{-" }} $_ := set $dnsNames "clusterName" $clusterNameDerived {{ "}}" }}
          {{ "{{-" }} end {{ "}}" }}
          - complianceType: musthave
            objectDefinition:
              apiVersion: config.openshift.io/v1
              kind: APIServer
              metadata: 
                name: cluster
              spec:
                servingCerts:
                  namedCertificates:
                    - names:
                      - "{{ "{{" }} $dnsNames.api {{ "}}" }}"
                      servingCertificate:
                        name: api-tls
---
##### INSTALL CERT MANAGER #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-cert-manager-install
  namespace: {{ $policyNamespace }}
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1beta1
      kind: OperatorPolicy
      metadata:
        name: policy-cert-manager-install
      spec:
        operatorGroup: # optional
          namespace: cert-manager-operator
          name: cert-manager-operator-grp
          targetNamespaces:
              - cert-manager-operator
        remediationAction: enforce
        severity: low
        complianceType: musthave
        upgradeApproval: Automatic
        subscription:
          channel: stable-v1
          name: openshift-cert-manager-operator
          namespace: cert-manager-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
          startingCSV: '{{ "{{hub" }} index .ManagedClusterLabels "autoshift.io/cert-manager-version" | default "" {{ "hub}}" }}'
---
##### CREATE CERT MANAGER #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-cert-manager-creation
  namespace: {{ $policyNamespace }}
spec:
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy 
      name: policy-cert-manager-install
      namespace: "{{ $policyNamespace }}"
      compliance: Compliant
  disabled: false
  remediationAction: enforce
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-cert-manager-creation
      spec:
        object-templates-raw: |
          - complianceType: musthave
            objectDefinition: 
              apiVersion: operator.openshift.io/v1alpha1
              kind: CertManager
              metadata:
                name: cluster
              spec:
                logLevel: Normal
                managementState: Managed
                observedConfig: null
                unsupportedConfigOverrides: null
                operatorLogLevel: Normal
---
##### CREATE CA BUNDLE AS SECRET #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-venafi-tpp-cabundle
  namespace: {{ $policyNamespace }}
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-venafi-tpp-cabundle
      spec:
        object-templates-raw: |
          - complianceType: musthave
            objectDefinition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: tpp-ca-bundle
                namespace: cert-manager
              data:
               cabundle: '{{ $.Values.venafiCABundle }}'
---
##### CREATE VENAFI CLUSTER ISSUER #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-venafi-issuer
  namespace: {{ $policyNamespace }}
spec:
  disabled: false
  remediationAction: enforce
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy 
      name: policy-venafi-tpp-secret
      namespace: "{{ $.Values.policy_namespace }}"
      compliance: Compliant
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy 
      name: policy-venafi-tpp-cabundle
      namespace: "{{ $.Values.policy_namespace }}"
      compliance: Compliant
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-venafi-issuer
      spec:
        object-templates-raw: |
          # indentation anchor
          {{ `{{hub-` }} $certConfig := index (index (fromConfigMap `{{ $policyNamespace }}` (print .ManagedClusterName `.rendered-config`) `config` | default `{}`) | fromYaml) `certs` | default dict {{ `hub}}` }}
          - complianceType: musthave
            recreateOption: IfRequired
            objectDefinition:
              apiVersion: cert-manager.io/v1
              kind: ClusterIssuer
              metadata:
                name: venafi
              spec:
                venafi:
                  tpp:
                    caBundleSecretRef:
                      key: 'cabundle'
                      name: 'tpp-ca-bundle'
                    credentialsRef:
                      name: tpp-secret
                    url: '{{ "{{hub" }} (($certConfig).venafi).url | default `{{ $.Values.venafiURL }}` {{ "hub}}" }}'
                  zone: '{{ "{{hub" }} (($certConfig).venafi).zone | default `{{ $.Values.venafiZone }}` {{ "hub}}" }}'
              status:
                conditions: 
                  - type: Ready
                    status: 'True'

---
##### COPY TPP SECRET FROM HUB #####
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: policy-venafi-tpp-secret
  namespace: {{ $policyNamespace }}
spec:
  disabled: false
  remediationAction: enforce
  hubTemplateOptions:
    serviceAccountName: secret-reader
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-tpp-secret
      spec:
        object-templates-raw: |
          {{ "{{hub-" }} $secret := index .ManagedClusterLabels "autoshift.io/tpp-secret" | default "tpp-secret" {{ "hub}}" }}
          - complianceType: musthave
            objectDefinition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "tpp-secret"
                namespace: cert-manager
              data:
                access-token: {{ "{{hub" }} fromSecret (index .ManagedClusterLabels "autoshift.io/certs-secret-namespace" | default "{{ $policyNamespace }}") $secret "access-token" {{ "hub}}" }}

##### POLICY SET FOR CERT MANAGER #####
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: cert-manager
  namespace: {{ $policyNamespace }}
spec:
  description: "Contains all policies for installing and creating cert-manager"
  policies:
    - policy-cert-manager-install
    - policy-cert-manager-creation
---
##### POLICY SET FOR CERT CONFIGURATION #####
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: cert-configuration
  namespace: {{ $policyNamespace }}
spec:
  description: "Contains all policies for creating and configuring default certs"
  policies:
    - policy-proxy-ca
    - policy-ca-cert-bundle
    - policy-api-ingress-tls
    - policy-ingress-cert
    - policy-api-cert
    - policy-venafi-issuer
    - policy-venafi-tpp-secret
    - policy-venafi-tpp-cabundle
---
#### PLACEMENT #####
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-cert-config
  namespace: {{ $policyNamespace }}
spec:
  clusterSets:
  {{- range $cluster, $clusterValue := $.Values.hubClusterSets }}
    - {{ $cluster }}
  {{- end }}
  {{- range $cluster, $clusterValue := $.Values.managedClusterSets }}
    - {{ $cluster }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/certs'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
### CERT MANAGER PLACEMENT #####
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-cert-manager
  namespace: {{ $policyNamespace }}
spec:
  clusterSets:
  {{- range $cluster, $clusterValue := $.Values.hubClusterSets }}
    - {{ $cluster }}
  {{- end }}
  {{- range $cluster, $clusterValue := $.Values.managedClusterSets }}
    - {{ $cluster }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/cert-manager'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
