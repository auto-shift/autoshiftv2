# This policy creates a loki stack using a noobaa bucket from OpenShift Data Foundation.
#
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-loki-s3-bucket
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management, CA Security Assessment and Authorization
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration, CA-7 Continuous Monitoring
spec:
  hubTemplateOptions:
    serviceAccountName: secret-reader
  dependencies:
    - name: policy-loki-operator-install
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: openshift-loki-bucket-secret-s3
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: | 
            {{ "{{hub" }} $cfg := fromConfigMap "{{ $.Values.policy_namespace }}" (print .ManagedClusterName ".rendered-config") "config" | default "{}" | fromYaml {{ "hub}}" }}
            {{ "{{hub-" }} $lokiConfig := index $cfg `loki` | default (dict) {{ "hub}}" }}
            {{ "{{hub-" }} $secret := index $lokiConfig `secretName` | default "" {{ "hub}}" }}
            {{ "{{hub-" }} $secretNamespace := index $lokiConfig `secretsNamespace` | default "" {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: logging-loki
                  namespace: {{ .Values.loki.lokistackNamespace }}
                type: Opaque
                data:
                  access_key_id: {{ "{{hub" }} fromSecret $secretNamespace $secret "access_key_id" {{ "hub}}" }}
                  access_key_secret: {{ "{{hub" }} fromSecret $secretNamespace $secret "access_key_secret" {{ "hub}}" }}
                  bucketnames: {{ "{{hub" }} fromSecret $secretNamespace $secret "bucketnames" {{ "hub}}" }}
                  endpoint: {{ "{{hub" }} fromSecret $secretNamespace $secret "endpoint" {{ "hub}}" }}
                  region: {{ "{{hub" }} fromSecret $secretNamespace $secret "region" {{ "hub}}" }}

---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-loki-s3-bucket
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/loki'
              operator: In
              values:
              - 'true'
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/loki-s3'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-loki-s3-bucket
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-loki-s3-bucket
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-loki-s3-bucket
    apiGroup: policy.open-cluster-management.io
    kind: Policy