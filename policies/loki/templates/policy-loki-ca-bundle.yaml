apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-loki-ca-bundle
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
{{- if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{- end }}
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: loki-ca-bundle
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw : |

            # Fetch cluster config file
            {{ "{{hub-" }} if index .ManagedClusterLabels "autoshift.io/user-ca-bundle" {{ "hub}}" }}
            {{ "{{hub" }} $configs := fromConfigMap "{{ $.Values.policy_namespace }}" (print .ManagedClusterName ".rendered-config") "config" | default "" | fromYaml {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: loki-ca-bundle
                  namespace: {{ .Values.loki.lokistackNamespace }}
                data:
                  ca.crt: |
                    {{ "{{hub" }} index $configs "user-ca-bundle" | autoindent {{ "hub}}" }}
            {{ "{{hub- end hub}}"}}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-loki-ca-bundle
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/loki'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-loki-ca-bundle
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-loki-ca-bundle
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-loki-ca-bundle
    apiGroup: policy.open-cluster-management.io
    kind: Policy