# This policy creates a loki stack using a noobaa bucket from OpenShift Data Foundation.
#
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-loki-stack-install
  namespace: {{ .Values.policy_namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management, CA Security Assessment and Authorization
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration, CA-7 Continuous Monitoring
spec:
  dependencies:
    - name: policy-loki-operator-install
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
    - name: policy-loki-secret-test
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
    - name: policy-loki-ca-bundle
      namespace: {{ .Values.policy_namespace }}
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
{{ if (($.Values.autoshift).dryRun) }}
  remediationAction: inform
{{ end }}
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: openshift-loki-stack
        spec:
          remediationAction: enforce # will be overridden by remediationAction in parent policy
          severity: high
          evaluationInterval:
            compliant: {{ ((($.Values.autoshift).evaluationInterval).compliant) | default "10m" }}
            noncompliant: {{ ((($.Values.autoshift).evaluationInterval).noncompliant) | default "30s" }}
          object-templates-raw: |
            {{ "{{hub" }} $cfg := fromConfigMap "{{ $.Values.policy_namespace }}" (print .ManagedClusterName ".rendered-config") "config" | default "{}" | fromYaml {{ "hub}}" }}
            {{ "{{hub-" }} $lokiConfig := index $cfg `loki` | default (dict) {{ "hub}}" }}
            {{ "{{hub-" }} $lokiStorageClass := index $lokiConfig `storageClass` | default "{{ .Values.loki.storageClass }}" {{ "hub}}" }}
            {{ "{{hub-" }} $lokiSize := index $lokiConfig `size` | default "{{ .Values.loki.size }}" {{ "hub}}" }}
            {{ "{{hub-" }} $lokiRetentionDays := index $lokiConfig `retentionDays` | default {{ .Values.loki.retentionDays }} {{ "hub}}" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: loki.grafana.com/v1
                kind: LokiStack
                metadata:
                  name: {{ .Values.loki.lokistackName }}
                  namespace: {{ .Values.loki.lokistackNamespace }}
                spec:
                  hashRing:
                    type: memberlist
                  limits:
                    global:
                      ingestion:
                        ingestionBurstSize: 200
                        perStreamRateLimit: 25
                        perStreamRateLimitBurst: 100
                      retention:
                        days: {{ "{{hub" }} $lokiRetentionDays {{ "hub}}" }}
                      queries:
                        queryTimeout: 3m
                  managementState: Managed
                  storageClassName: '{{ "{{hub" }} $lokiStorageClass {{ "hub}}" }}'
                  size: '{{ "{{hub" }} $lokiSize {{ "hub}}" }}'
                  storage:
                    schemas:
                      - effectiveDate: '2024-09-22'
                        version: v13
                    tls:
                      caName: loki-ca-bundle
                      caKey:  ca.crt
                    secret:
                      name: logging-loki
                      type: s3
                      credentialMode: static
                  tenants:
                    mode: {{ .Values.loki.lokistackNamespace }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-policy-loki-stack-install
  namespace: {{ .Values.policy_namespace }}
spec:
  clusterSets:
  {{- range $clusterSet, $value := $.Values.managedClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  {{- range $clusterSet, $value := $.Values.hubClusterSets }}
    - {{ $clusterSet }}
  {{- end }}
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/loki'
              operator: In
              values:
              - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: placement-policy-loki-stack-install
  namespace: {{ .Values.policy_namespace }}
placementRef:
  name: placement-policy-loki-stack-install
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-loki-stack-install
    apiGroup: policy.open-cluster-management.io
    kind: Policy
