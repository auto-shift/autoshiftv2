# Inform-only: Compliant once the whole GPU stack is up. ClusterPolicy carries
# a real Ready condition spanning driver, container toolkit, device plugin,
# DCGM and feature discovery, and names the component that is stuck when it is
# not - which polling a node for nvidia.com/gpu capacity cannot do.
#
# The reason must be Reconciled. The operator also sets Ready=True with reason
# NFDLabelsMissing when no node carries NFD labels, and NoGPUNodes when NFD finds
# no NVIDIA PCI device, and deploys no operands in either case. Matching the
# status alone would report a cluster with no working GPU as Compliant.
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
status:
  conditions:
    - type: Ready
      status: 'True'
      reason: Reconciled
