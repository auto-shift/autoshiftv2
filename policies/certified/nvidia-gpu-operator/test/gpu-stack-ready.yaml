# Inform-only: Compliant once the whole GPU stack is up. ClusterPolicy carries
# a real Ready condition spanning driver, container toolkit, device plugin,
# DCGM and feature discovery, and names the component that is stuck when it is
# not - which polling a node for nvidia.com/gpu capacity cannot do.
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
status:
  conditions:
    - type: Ready
      status: 'True'
