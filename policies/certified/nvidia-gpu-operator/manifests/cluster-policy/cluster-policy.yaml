# The GPU stack itself: driver, container toolkit, device plugin, DCGM and
# feature discovery. Without this the operator installs but no node ever
# advertises nvidia.com/gpu, and anything scheduling on GPUs stays Pending.
#
# use_ocp_driver_toolkit lets the driver build against the running RHCOS
# release rather than a pinned kernel, which is what makes it survive
# cluster upgrades.
#
# The spec is a base of the settings below with config.nvidia-gpu-operator.clusterPolicy
# from the cluster's rendered-config merged over it, so MIG strategy, driver upgrade
# policy, vGPU, GPUDirect and any other ClusterPolicy field can be set per clusterset or
# cluster. Maps merge key by key and config wins; lists replace the base whole. It is the
# same config.nvidia-gpu-operator key the version pin reads.
#
# complianceType is mustonlyhave, so this policy owns the whole spec: the live
# ClusterPolicy is made to match the rendered spec exactly. A changed list entry
# replaces the old one instead of being added beside it, and a field removed from
# config is removed from the cluster (or returns to its base value) instead of
# staying behind. musthave would merge into lists and leave removed fields in place
# while still reporting Compliant. The operator writes only status, so owning the
# spec does not fight it. Edit the ClusterPolicy through config, not by hand: a hand
# edit is reverted on the next evaluation.
#
# The base also states the values the ClusterPolicy CRD defaults under the objects
# it sets (cdi.default, operator.runtimeClass, toolkit.installDir), plus
# operator.defaultRuntime set to crio as OpenShift documents, so the rendered spec already matches what the API server stores. A config object
# that brings in a new sub-object with CRD defaults of its own (devicePlugin.mps, for
# example) should state those defaults too.
#
# fromConfigMap fails the policy when the rendered-config ConfigMap or its config key
# is missing, rather than enforcing the base alone and stripping a running cluster's
# configured settings.
#
# Every field here, and every field set through config, must exist in the
# ClusterPolicy CRD that the channel in manifests/operator-install/kustomization.yaml
# installs. The API server
# rejects the whole object on the first unknown field, with
# `strict decoding error: unknown field "spec.<x>"`, and the policy then
# reports the CR as "missing, and cannot be created" — which reads like a
# permissions or ordering problem rather than a schema mismatch.
#
# Not set because v25.3 does not define them: spec.cdi.nriPluginEnabled,
# spec.sandboxWorkloads.mode, spec.driver.licensingConfig.secretName,
# spec.mps, spec.kataSandboxDevicePlugin. All five were set to a default or
# sat under a disabled feature, so nothing changes behaviourally.
object-templates-raw: |
  {{hub- $raw := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config") hub}}
  {{hub- if (empty $raw) hub}}
  {{hub- fail (printf "ConfigMap %s.rendered-config in %s has no config key; the ClusterPolicy is not enforced without it" .ManagedClusterName .PolicyMetadata.namespace) hub}}
  {{hub- end hub}}
  {{hub- $cfg := ($raw | fromYaml | default dict) hub}}
  {{hub- $spec := (`
  operator:
    use_ocp_driver_toolkit: true
    # OpenShift runs CRI-O, as in the OpenShift documentation's ClusterPolicy
    # example. The operator detects the runtime from the nodes and uses this value
    # only as its fallback. Stated, with runtimeClass, so mustonlyhave owns it.
    defaultRuntime: crio
    runtimeClass: nvidia
  cdi:
    enabled: false
    default: false
  sandboxWorkloads:
    enabled: false
    defaultWorkload: container
  driver:
    enabled: true
    useNvidiaDriverCRD: false
    kernelModuleType: auto
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: false
        enable: false
        force: false
        timeoutSeconds: 300
      maxParallelUpgrades: 1
      maxUnavailable: 25%
      podDeletion:
        deleteEmptyDir: false
        force: false
        timeoutSeconds: 300
      waitForCompletion:
        timeoutSeconds: 0
    repoConfig:
      configMapName: ''
    certConfig:
      name: ''
    licensingConfig:
      nlsEnabled: true
    virtualTopology:
      config: ''
    kernelModuleConfig:
      name: ''
  dcgmExporter:
    enabled: true
    config:
      name: ''
    serviceMonitor:
      enabled: true
  dcgm:
    enabled: true
  daemonsets:
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: '1'
  devicePlugin:
    enabled: true
    config:
      name: ''
      default: ''
  gfd:
    enabled: true
  migManager:
    enabled: true
  nodeStatusExporter:
    enabled: true
  mig:
    strategy: single
  toolkit:
    enabled: true
    installDir: /usr/local/nvidia
  validator:
    plugin:
      env: []
  vgpuManager:
    enabled: false
  vgpuDeviceManager:
    enabled: true
  sandboxDevicePlugin:
    enabled: true
  vfioManager:
    enabled: true
  ccManager:
    enabled: true
  gds:
    enabled: false
  gdrcopy:
    enabled: false
  ` | fromYaml) hub}}
  {{hub- $spec = (mergeOverwrite $spec (dig "nvidia-gpu-operator" "clusterPolicy" (dict) $cfg)) hub}}
  - complianceType: mustonlyhave
    objectDefinition:
      apiVersion: nvidia.com/v1
      kind: ClusterPolicy
      metadata:
        name: gpu-cluster-policy
      spec:
        {{hub $spec | toYaml | autoindent hub}}
