apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: artifactory-db
  namespace: jfrog-system
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: artifactory-db
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifactory-db-allow
  namespace: jfrog-system
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: artifactory-db
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: jfrog-system
    ports:
    - port: 5432
      protocol: TCP
    - port: 9187
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-operators
    ports:
    - port: 8000
      protocol: TCP
