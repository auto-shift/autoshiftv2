# No imageName by default, so the Operator runs its built-in PostgreSQL image. config.jfrog.dbImage
# names another one. Removing the key later leaves that image in place (musthave never removes
# a field), and CloudNativePG rejects a lower major on a running Cluster.
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $dbImage := (index (index $cfg "jfrog" | default dict) "dbImage" | default "") hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: artifactory-db
        namespace: jfrog-system
      spec:
        instances: '{{hub index .ManagedClusterLabels "autoshift.io/jfrog-db-instances" | default "2" | toInt hub}}'
        {{hub- if $dbImage hub}}
        imageName: '{{hub $dbImage hub}}'
        {{hub- end hub}}
        postgresql:
          parameters:
            max_connections: '400'
            shared_buffers: 1GB
            effective_cache_size: 3GB
            work_mem: 16MB
        bootstrap:
          initdb:
            database: artifactory
            owner: artifactory
        storage:
          size: 50Gi
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '4'
            memory: 8Gi
        affinity:
          enablePodAntiAffinity: true
          topologyKey: kubernetes.io/hostname
