object-templates-raw: |
  {{- $ns := "gitlab-system" }}
  {{- $dbMode := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-db-mode" | default "managed" hub}}" }}
  {{- $redisMode := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-redis-mode" | default "managed" hub}}" }}
  {{- $objStoreMode := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-object-storage-mode" | default "managed" hub}}" }}
  {{ if ne $dbMode "bundled" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-db-app
        namespace: {{ $ns }}
  {{ end }}
  {{ if ne $redisMode "bundled" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-redis-password
        namespace: {{ $ns }}
  {{ end }}
  {{ if ne $objStoreMode "bundled" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gitlab-objectstorage
        namespace: {{ $ns }}
  {{ end }}
  # Without it GitLab runs with no application backups. policy-gitlab-object-storage writes it in
  # managed mode; with external object storage, create it (s3cmd config under key config).
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-backup-s3cfg
        namespace: {{ $ns }}
