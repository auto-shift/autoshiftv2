object-templates-raw: |
  {{- $ingressDomain := (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain }}
  {{- $ns := "gitlab-system" }}

  # Keycloak OIDC (omniauth) is wired while keycloak is enabled on this cluster; otherwise GitLab keeps
  # local-only login. The client secret is read on the cluster from keycloak-system/gitlab-realm-clients,
  # which policy-keycloak-realm-secrets generates there, so it never sits in the policy.
  {{hub- $gitlabOidcOn := eq (index .ManagedClusterLabels "autoshift.io/keycloak" | default "false") "true" hub}}

  # Service modes: managed (default) or external
  {{- $dbMode := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-db-mode" | default "managed" hub}}" }}
  {{- $redisMode := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-redis-mode" | default "managed" hub}}" }}
  {{- $objStoreMode := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-object-storage-mode" | default "managed" hub}}" }}
  {{- /* GitLab chart 10 (GitLab 19) removed the bundled PostgreSQL, Redis and MinIO, so a bundled
       mode would render an instance with no backend. */}}
  {{- if eq $dbMode "bundled" }}
  {{-   fail "gitlab-db-mode bundled is not supported: GitLab 19 removed the bundled PostgreSQL. Set it to managed or external" }}
  {{- end }}
  {{- if eq $redisMode "bundled" }}
  {{-   fail "gitlab-redis-mode bundled is not supported: GitLab 19 removed the bundled Redis. Set it to managed or external" }}
  {{- end }}
  {{- if eq $objStoreMode "bundled" }}
  {{-   fail "gitlab-object-storage-mode bundled is not supported: GitLab 19 removed the bundled MinIO. Set it to managed or external" }}
  {{- end }}

  # Gitaly HA (Praefect)
  {{- $gitalyHA := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-gitaly-ha" | default "false" hub}}" }}
  {{- $praefectReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-praefect-replicas" | default "3" | toInt hub}}" }}
  {{- $gitalyReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-gitaly-replicas" | default "3" | toInt hub}}" }}

  # Component replica counts
  {{- $webserviceMinReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-webservice-min-replicas" | default "2" | toInt hub}}" }}
  {{- $webserviceMaxReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-webservice-max-replicas" | default "4" | toInt hub}}" }}
  {{- $sidekiqMinReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-sidekiq-min-replicas" | default "2" | toInt hub}}" }}
  {{- $sidekiqMaxReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-sidekiq-max-replicas" | default "4" | toInt hub}}" }}
  {{- $shellMinReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-shell-min-replicas" | default "2" | toInt hub}}" }}
  {{- $shellMaxReplicas := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-shell-max-replicas" | default "4" | toInt hub}}" }}

  # Storage classes for persistent volumes (empty = use cluster default; set label to override)
  {{- $gitalyStorageClass := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-gitaly-storage-class" | default "" hub}}" }}
  {{- $disconnected := "{{hub index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false" hub}}" }}

  # SSH: the OpenShift router carries only HTTP and TLS, so GitLab Shell needs its own way in.
  #   internal (default) — reachable inside the cluster only
  #   loadbalancer       — a cloud LoadBalancer Service; clone URLs use gitlab-ssh-host, or the
  #                        load balancer's own address until you give it a DNS name
  #   disabled           — no GitLab Shell; Git over HTTPS only
  {{- $sshMode := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-ssh-mode" | default "internal" hub}}" }}
  {{- $sshHost := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-ssh-host" | default "" hub}}" }}
  {{- if not (has $sshMode (list "internal" "loadbalancer" "disabled")) }}
  {{-   fail (printf "gitlab-ssh-mode %s is not one of internal, loadbalancer or disabled" $sshMode) }}
  {{- end }}
  {{- if and (eq $sshMode "loadbalancer") (not $sshHost) }}
  {{-   $lbIngress := (dig "status" "loadBalancer" "ingress" (list) ((lookup "v1" "Service" $ns "gitlab-gitlab-shell") | default dict)) }}
  {{-   if $lbIngress }}
  {{-     $sshHost = (index (index $lbIngress 0) "hostname" | default (index (index $lbIngress 0) "ip" | default "")) }}
  {{-   end }}
  {{- end }}

  # Application backups (config.gitlab): gitlab-backup from the toolbox, into the GitLab bucket.
  {{hub- $rcm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) | default dict hub}}
  {{hub- $gitlabCfg := (index ((index ($rcm.data | default dict) "config" | default "" | fromYaml) | default dict) "gitlab" | default dict) hub}}
  {{- /* config.gitlab.tlsIssuer: the cert-manager ClusterIssuer for the GitLab route certificates.
       Empty means the Operator self-signs, which consumers such as RHDH, Tekton and Argo CD reject. */}}
  {{hub- $tlsIssuer := (index $gitlabCfg "tlsIssuer" | default "autoshift-ca") hub}}
  {{- $backupSchedule := "{{hub index $gitlabCfg "backupSchedule" | default "0 3 * * *" hub}}" }}
  {{- $backupMaximum := "{{hub index $gitlabCfg "backupMaximum" | default 7 hub}}" }}
  {{- $backupScratchSize := "{{hub index $gitlabCfg "backupScratchSize" | default "50Gi" hub}}" }}
  {{- /* config.gitlab.zoneSpread: soft anti-affinity across zones instead of nodes. Always written,
       because musthave never removes a field. */}}
  {{- $spreadKey := ternary "topology.kubernetes.io/zone" "kubernetes.io/hostname" (eq "{{hub index $gitlabCfg "zoneSpread" | default false hub}}" "true") }}
  {{- /* managed object storage: policy-gitlab-object-storage writes this Secret; external: you do. */}}
  {{- $backupCfgReady := not (empty ((lookup "v1" "Secret" $ns "gitlab-backup-s3cfg") | default dict)) }}

  # Check if non-bundled services are ready by looking for their connection secrets
  # For managed mode: CNPG/Redis/NooBaa policies create these secrets
  # For external mode: user creates these secrets manually
  {{- $dbReady := true }}
  {{- $dbHost := "" }}
  {{- $dbPort := "" }}
  {{- $dbUser := "" }}
  {{- $dbPass := "" }}
  {{- if ne $dbMode "bundled" }}
  {{- $dbSecret := (lookup "v1" "Secret" $ns "gitlab-db-app") | default dict }}
  {{- $dbData := ($dbSecret.data | default dict) }}
  {{- $dbHost = (printf "gitlab-db-pooler-rw.%s.svc" $ns) }}
  {{- $dbPort = (index $dbData "port" | default "" | base64dec) }}
  {{- $dbUser = (index $dbData "username" | default "" | base64dec) }}
  {{- $dbPass = (index $dbData "password" | default "" | base64dec) }}
  {{/* For external mode, user may provide a custom host via label */}}
  {{- if eq $dbMode "external" }}
  {{- $customHost := "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-db-host" | default "" hub}}" }}
  {{- if not (empty $customHost) }}{{- $dbHost = $customHost }}{{- end }}
  {{- end }}
  {{- if (empty $dbPass) }}{{- $dbReady = false }}{{- end }}
  {{- end }}

  {{- $redisReady := true }}
  {{- if ne $redisMode "bundled" }}
  {{- $redisSecret := (lookup "v1" "Secret" $ns "gitlab-redis-password") | default dict }}
  {{- $redisData := ($redisSecret.data | default dict) }}
  {{- if (empty (index $redisData "redis-password" | default "")) }}{{- $redisReady = false }}{{- end }}
  {{- end }}

  {{- $objStoreReady := true }}
  {{- $bucketName := "" }}
  {{- if ne $objStoreMode "bundled" }}
  {{- $obcCM := (lookup "v1" "ConfigMap" $ns "gitlab-objectstorage") | default dict }}
  {{- $bucketName = (index ($obcCM.data | default dict) "BUCKET_NAME" | default "") }}
  {{- if (empty $bucketName) }}{{- $objStoreReady = false }}{{- end }}
  {{- end }}

  {{- /* Name every missing input rather than render nothing: an empty ConfigurationPolicy reports
       Compliant, which hid a GitLab that was never created. */}}
  {{- $missing := list }}
  {{- if not $dbReady }}
  {{-   $missing = append $missing (ternary "Secret gitlab-system/gitlab-db-app, from CloudNativePG (policy-cnpg-gitlab; needs cloudnative-pg: 'true')" "Secret gitlab-system/gitlab-db-app, which you create for gitlab-db-mode external" (eq $dbMode "managed")) }}
  {{- end }}
  {{- if not $redisReady }}
  {{-   $missing = append $missing (ternary "Secret gitlab-system/gitlab-redis-password (policy-gitlab-redis)" "Secret gitlab-system/gitlab-redis-password, which you create for gitlab-redis-mode external" (eq $redisMode "managed")) }}
  {{- end }}
  {{- if not $objStoreReady }}
  {{-   $missing = append $missing (ternary "ConfigMap gitlab-system/gitlab-objectstorage, from the NooBaa bucket claim (policy-gitlab-object-storage; needs odf: 'true' and a Ready NooBaa)" "ConfigMap gitlab-system/gitlab-objectstorage, which you create for gitlab-object-storage-mode external" (eq $objStoreMode "managed")) }}
  {{- end }}
  {{hub- if $gitlabOidcOn hub}}
  {{- $gitlabRealmClients := ((lookup "v1" "Secret" "keycloak-system" "gitlab-realm-clients") | default dict).data | default dict }}
  {{- $gitlabOidcSecret := (index $gitlabRealmClients "gitlab" | default "" | base64dec) }}
  {{- if not $gitlabOidcSecret }}
  {{-   $missing = append $missing "Secret keycloak-system/gitlab-realm-clients key gitlab (policy-keycloak-realm-secrets; needs keycloak: 'true')" }}
  {{- end }}
  {{hub- end hub}}
  {{- if $missing }}
  {{-   fail (printf "GitLab is not created yet. Missing: %s" (join "; " $missing)) }}
  {{- end }}

  # Trusted cert for the GitLab routes (gitlab./registry./kas.). cert-manager issues it from the
  # ClusterIssuer in config.gitlab.tlsIssuer; the operator serves it via global.ingress.tls.secretName
  # below. Without this the operator self-signs, and RHDH/Tekton/ArgoCD reject the TLS as untrusted.
  {{hub- if ne $tlsIssuer "" hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: gitlab-provided-tls
        namespace: {{ $ns }}
      spec:
        secretName: gitlab-provided-tls
        dnsNames:
          - gitlab.{{ $ingressDomain }}
          - registry.{{ $ingressDomain }}
          - kas.{{ $ingressDomain }}
        # Short-lived serving cert, auto-rotated by cert-manager. FedRAMP High (SC-12/SC-13) mandates no
        # fixed cadence — 30d is a defensible, stronger-than-required cryptoperiod. rotationPolicy: Always
        # rotates the KEY each cycle; the signing CA is unchanged so no consumer's trust breaks.
        duration: 720h0m0s          # 30d validity
        renewBefore: 240h0m0s       # renew ~10d before expiry (rolls every ~20d)
        privateKey:
          algorithm: ECDSA
          size: 384                 # P-384: FIPS 140-approved, higher-assurance curve for High
          rotationPolicy: Always
        issuerRef:
          name: {{hub $tlsIssuer hub}}
          kind: ClusterIssuer
  {{hub- end hub}}
  {{- if ne $dbMode "bundled" }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-postgresql-password
        namespace: {{ $ns }}
      type: Opaque
      stringData:
        postgresql-password: {{ $dbPass }}
        postgresql-postgres-password: {{ $dbPass }}
  {{- end }}
  {{hub- if $gitlabOidcOn hub}}
  # OmniAuth OpenID Connect provider config consumed by global.appConfig.omniauth on the GitLab CR.
  # The client secret is read on the cluster from keycloak-system/gitlab-realm-clients.
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-omniauth-openid-connect
        namespace: {{ $ns }}
      type: Opaque
      stringData:
        provider: |
          name: openid_connect
          label: Keycloak
          args:
            name: openid_connect
            scope:
              - openid
              - profile
              - email
            response_type: code
            issuer: https://keycloak.{{ $ingressDomain }}/realms/tssc-iam
            discovery: true
            client_auth_method: query
            uid_field: preferred_username
            pkce: true
            send_scope_to_token_endpoint: true
            client_options:
              identifier: gitlab
              secret: {{ $gitlabOidcSecret }}
              redirect_uri: https://gitlab.{{ $ingressDomain }}/users/auth/openid_connect/callback
  {{hub- end hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: apps.gitlab.com/v1beta1
      kind: GitLab
      metadata:
        name: gitlab
        namespace: gitlab-system
      spec:
        chart:
          {{- $csvList := (lookup "operators.coreos.com/v1alpha1" "ClusterServiceVersion" "gitlab-system" "") | default dict }}
          {{- $chartVersion := "" }}
          {{- range $_, $c := ($csvList.items | default list) }}
          {{- if and (not $chartVersion) (hasPrefix "gitlab-operator-kubernetes" $c.metadata.name) }}
          {{- $ex := (index $c.metadata.annotations "alm-examples" | default "[]" | fromJson) }}
          {{- range $_, $e := $ex }}
          {{- if not $chartVersion }}{{- $chartVersion = (index $e "spec" "chart" "version" | default "") }}{{- end }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if $chartVersion }}
          version: '{{ $chartVersion }}'
          {{- end }}
          values:
            global:
              antiAffinity: soft
              affinity:
                podAntiAffinity:
                  topologyKey: {{ $spreadKey }}
              hosts:
                domain: {{ $ingressDomain }}
                # Always written: musthave never removes a field, so a host left over from
                # loadbalancer mode would otherwise stay after switching back.
                ssh: {{ $sshHost | default (printf "gitlab.%s" $ingressDomain) }}
              # Chart 10 (GitLab 19) defaults to Gateway API with a bundled Envoy Gateway, whose CRDs
              # OpenShift does not have, and turns Ingress off. OpenShift turns Ingress objects into
              # Routes, so keep Ingress and switch Gateway API off. installEnvoy too: configureEnvoy
              # defaults to it and would still render an EnvoyProxy.
              gatewayApi:
                enabled: false
                installEnvoy: false
              ingress:
                # enabled:true + class:none is the GitLab-on-OpenShift pattern: the operator turns the
                # chart's Ingress objects into edge-terminated OpenShift Routes (default wildcard cert).
                # Without enabled:true no Ingress is rendered, so the operator creates no Routes.
                enabled: true
                {{hub- if ne $tlsIssuer "" hub}}
                # Serve the cert-manager-issued (trusted) cert instead of the operator's self-signed one.
                tls:
                  enabled: true
                  secretName: gitlab-provided-tls
                {{hub- end hub}}
                annotations:
                  route.openshift.io/termination: edge
                class: none
              minio:
                enabled: {{ eq $objStoreMode "bundled" }}
          {{- if ne $objStoreMode "bundled" }}
              certificates:
                customCAs:
                  - configMap: gitlab-openshift-service-ca
          {{- end }}
          {{- if ne $dbMode "bundled" }}
              psql:
                host: {{ $dbHost }}
                port: {{ $dbPort }}
                username: {{ $dbUser }}
                database: gitlabhq_production
                password:
                  secret: gitlab-postgresql-password
                  key: postgresql-password
          {{- end }}
          {{- if eq $redisMode "managed" }}
              redis:
                host: gitlab-redis
                port: 6379
                sentinels:
                  - host: gitlab-redis-sentinel-0.gitlab-redis-sentinel-headless.{{ $ns }}.svc
                    port: 26379
                  - host: gitlab-redis-sentinel-1.gitlab-redis-sentinel-headless.{{ $ns }}.svc
                    port: 26379
                  - host: gitlab-redis-sentinel-2.gitlab-redis-sentinel-headless.{{ $ns }}.svc
                    port: 26379
                password:
                  enabled: true
                  secret: gitlab-redis-password
                  key: redis-password
          {{- else if eq $redisMode "external" }}
              redis:
                host: {{ "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-redis-host" | default "gitlab-redis" hub}}" }}
                port: {{ "{{hub index .ManagedClusterLabels "autoshift.io/gitlab-redis-port" | default "6379" hub}}" }}
                password:
                  enabled: true
                  secret: gitlab-redis-password
                  key: redis-password
          {{- end }}
          {{- if ne $objStoreMode "bundled" }}
              appConfig:
          {{hub- if $gitlabOidcOn hub}}
                # Keycloak SSO. autoLinkUser links an existing account by verified email; new SSO users are
                # auto-provisioned. quayadmin-style local login stays available as break-glass.
                omniauth:
                  enabled: true
                  allowSingleSignOn:
                    - openid_connect
                  autoLinkUser:
                    - openid_connect
                  blockAutoCreatedUsers: false
                  providers:
                    - secret: gitlab-omniauth-openid-connect
                      key: provider
          {{hub- end hub}}
                object_store:
                  enabled: true
                  proxy_download: true
                  connection:
                    secret: gitlab-object-storage-connection
                    key: connection
                lfs:
                  bucket: {{ $bucketName }}
                artifacts:
                  bucket: {{ $bucketName }}
                uploads:
                  bucket: {{ $bucketName }}
                packages:
                  bucket: {{ $bucketName }}
                backups:
                  bucket: {{ $bucketName }}
                  tmpBucket: {{ $bucketName }}
                terraformState:
                  bucket: {{ $bucketName }}
                ciSecureFiles:
                  bucket: {{ $bucketName }}
                dependencyProxy:
                  {{- if eq $disconnected "true" }}
                  enabled: false
                  {{- else }}
                  enabled: true
                  bucket: {{ $bucketName }}
                  object_store:
                    enabled: true
                    proxy_download: true
                    connection:
                      secret: gitlab-object-storage-connection
                      key: connection
                  {{- end }}
          {{- if eq $gitalyHA "true" }}
              praefect:
                enabled: true
                replaceInternalGitaly: true
                autoMigrate: true
                dbSecret:
                  secret: gitlab-db-app
                  key: password
                virtualStorages:
                  - name: default
                    gitalyReplicas: {{ $gitalyReplicas }}
                    maxUnavailable: 1
                psql:
                  host: gitlab-db-pooler-rw.{{ $ns }}.svc
                  port: "5432"
                  user: gitlab
                  dbName: praefect_production
                  sslMode: require    # PgBouncer offers TLS; disable sent Praefect's database traffic in plaintext
          {{- end }}
            registry:
              storage:
                secret: gitlab-registry-storage
                key: config
          {{- end }}
            postgresql:
              install: {{ eq $dbMode "bundled" }}
            redis:
              install: {{ eq $redisMode "bundled" }}
            minio:
              install: {{ eq $objStoreMode "bundled" }}
            nginx-ingress:
              enabled: false
            installCertmanager: false
            gitlab:
              gitlab-shell:
          {{- if eq $sshMode "disabled" }}
                enabled: false
          {{- else }}
                enabled: true
                minReplicas: {{ $shellMinReplicas }}
                maxReplicas: {{ $shellMaxReplicas }}
                service:
                  type: {{ ternary "LoadBalancer" "ClusterIP" (eq $sshMode "loadbalancer") }}
          {{- end }}
              webservice:
                minReplicas: {{ $webserviceMinReplicas }}
                maxReplicas: {{ $webserviceMaxReplicas }}
                resources:
                  requests:
                    cpu: 500m
                    memory: 1500M
              sidekiq:
                minReplicas: {{ $sidekiqMinReplicas }}
                maxReplicas: {{ $sidekiqMaxReplicas }}
                resources:
                  requests:
                    cpu: 500m
                    memory: 1000M
          {{- if not (empty $gitalyStorageClass) }}
              gitaly:
                persistence:
                  storageClass: {{ $gitalyStorageClass }}
                  accessMode: ReadWriteMany
          {{- end }}
          {{- if $backupCfgReady }}
              toolbox:
                backups:
                  cron:
                    enabled: true
                    schedule: '{{ $backupSchedule }}'
                    extraArgs: '--maximum-backups {{ $backupMaximum }}'
                    persistence:
                      enabled: true
                      useGenericEphemeralVolume: true
                      size: {{ $backupScratchSize }}
                  objectStorage:
                    config:
                      secret: gitlab-backup-s3cfg
                      key: config
          {{- end }}
          {{- if eq $gitalyHA "true" }}
              # The Praefect subchart reads gitlab.praefect.replicas; a top-level praefect key is ignored.
              praefect:
                replicas: {{ $praefectReplicas }}
          {{- end }}
