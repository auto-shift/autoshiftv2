# Seeds the Redis password once, and asserts it stays there. The seed is random: it is written only
# while the Secret has no password, so it does not change on later evaluations. Clusters seeded by
# the earlier gitlabRedis<cluster-name> value keep it until you rotate it (see README).
#
# ONE object template, always rendered, so the policy can never report Compliant having checked
# nothing. stringData is included only when the password is absent: musthave merges it, so an
# unconditional block would overwrite a password set elsewhere on every reconcile.
#
# Deliberately not two templates. Two musthave templates for the same object do not both apply —
# the first wins and the second is dead code — so a separate seeding template would never run.
object-templates-raw: |
  {{- $existingSecret := (lookup "v1" "Secret" "gitlab-system" "gitlab-redis-password") | default dict }}
  {{- $existingData := ($existingSecret.data | default dict) }}
  {{- $existingPass := (index $existingData "redis-password" | default "") }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-redis-password
        namespace: gitlab-system
      type: Opaque
      {{- if (empty $existingPass) }}
      stringData:
        redis-password: {{ randAlphaNum 32 }}
      {{- end }}
