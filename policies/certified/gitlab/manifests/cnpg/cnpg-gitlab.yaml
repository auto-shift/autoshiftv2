# No imageName by default, so the Operator runs its built-in PostgreSQL image. config.gitlab.dbImage
# names another one. Removing the key later leaves that image in place (musthave never removes
# a field), and CloudNativePG rejects a lower major on a running Cluster.
object-templates-raw: |
  {{hub- $cfg := (fromConfigMap .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName) "config" | fromYaml | default dict) hub}}
  {{hub- $dbImage := (index (index $cfg "gitlab" | default dict) "dbImage" | default "") hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: gitlab-db
        namespace: gitlab-system
      spec:
        instances: '{{hub index .ManagedClusterLabels "autoshift.io/gitlab-db-instances" | default "2" | toInt hub}}'
        {{hub- if $dbImage hub}}
        imageName: '{{hub $dbImage hub}}'
        {{hub- end hub}}
        postgresql:
          parameters:
            max_connections: '200'
            shared_buffers: 512MB
            effective_cache_size: 1536MB
            work_mem: 8MB
        bootstrap:
          initdb:
            database: gitlabhq_production
            owner: gitlab
        storage:
          size: 50Gi
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
        affinity:
          enablePodAntiAffinity: true
          topologyKey: kubernetes.io/hostname
